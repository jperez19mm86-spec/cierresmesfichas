<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi cuenta</title>
<link rel="icon" href="/logo.png">
<style>
/*
 * cuenta.html — LO QUE VE EL CLIENTE DE SU PROPIA CUENTA.
 *
 * Se mira desde el teléfono, casi siempre. Por eso una sola columna, números grandes y ningún
 * menú: entra, mira cuánto debe, y se va.
 *
 * ⚠️ NO PUEDE APARECER NADA INTERNO: ni en qué sistema se cargan sus fichas, ni quién se lo
 * vende, ni cómo se distribuye la ganancia entre los socios. El servidor ya se cuida de no
 * mandarlo; esta pantalla no lo pide y no lo muestra aunque llegara.
 *
 * El comentario está escrito A PROPÓSITO sin nombrar esas cosas: el test las busca en el archivo
 * ENTERO, sin filtrar comentarios. Un check sin preprocesado no se puede engañar — y el filtro
 * que había antes se comía medio archivo, con lo cual el check pasaba siempre sin mirar nada.
 */
:root{
  --bg:#faf5fb; --bg2:#fff; --bg3:#f6eef8; --txt:#241f27; --mut:#6b6470;
  --bor:#e7dfe9; --g:#c456ad; --rojo:#b3261e; --verde:#1e7a4b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161318; --bg2:#1e1a20; --bg3:#262029; --txt:#f2eef4; --mut:#a49bab;
    --bor:#352e38; --g:#d977c2; --rojo:#f2837a; --verde:#63c795; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--bg2);border:1px solid var(--bor);border-radius:12px;padding:16px;margin:12px 0}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bor);border-radius:8px;
  background:var(--bg3);color:var(--txt);outline:none}
input:focus{border-color:var(--g)}
button{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;
  background:var(--g);color:#fff;cursor:pointer;margin-top:12px}
button.link{background:none;color:var(--mut);font-weight:400;font-size:13px;text-decoration:underline;margin-top:8px}
.saldo{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.chico{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;
  padding:0 0 6px;border-bottom:1px solid var(--bor)}
td{padding:8px 0;border-bottom:1px solid var(--bor);vertical-align:top}
tr:last-child td{border-bottom:none}
.r{text-align:right;white-space:nowrap}
.err{background:rgba(179,38,30,.1);border:1px solid var(--rojo);color:var(--rojo);
  padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px}
.avi{background:var(--bg3);border-left:3px solid var(--g);padding:10px 12px;border-radius:0 8px 8px 0;
  font-size:13px;color:var(--mut);margin-top:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--bg3);
  font-size:11px;color:var(--mut)}
.oculto{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Mi cuenta</h1>
    <div class="mut">Entrá con el usuario y la contraseña que te pasamos.</div>
    <div class="card">
      <div><label>Usuario</label><input id="u" autocomplete="username" autocapitalize="off" autocorrect="off"></div>
      <div style="margin-top:12px"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"></div>
      <button onclick="entrar()">Entrar</button>
      <div id="loginErr" class="err oculto"></div>
    </div>
  </div>

  <div id="panel" class="oculto"></div>

</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? '' : x)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = (x, d = 2) => Number(x || 0).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fecha = (f) => { const [a,m,d] = String(f||'').slice(0,10).split('-'); return d ? `${d}/${m}` : ''; };

/* El token dura 7 días y sólo sirve para SU cuenta: firmado con otra familia que la del panel,
   así que jamás abre el OS.
   ⚠️ TODO ACCESO A localStorage VA ENVUELTO. Leerlo TIRA EXCEPCIÓN cuando el navegador tiene el
   almacenamiento bloqueado (incógnito con cookies restringidas, algunas políticas). Y como se leía
   en CADA llamada —incluida la del login— la excepción salía antes de mandar nada: el botón
   "Entrar" no hacía absolutamente nada, sin error y sin pedido. Si no se puede guardar, la sesión
   igual funciona: queda en memoria y se pierde al recargar, que es molesto pero anda. */
const TOKEN = 'cuenta_token';
let _mem = '';
const tok = () => { try { return localStorage.getItem(TOKEN) || _mem; } catch (e) { return _mem; } };
const guardarTok = (t) => { _mem = t || ''; try { localStorage.setItem(TOKEN, t || ''); } catch (e) {} };
const borrarTok = () => { _mem = ''; try { localStorage.removeItem(TOKEN); } catch (e) {} };

async function api(url, opts) {
  const r = await fetch(url, { ...opts, headers: { 'content-type': 'application/json',
    ...(tok() ? { authorization: 'Bearer ' + tok() } : {}), ...((opts||{}).headers||{}) } });
  return r.json().catch(() => ({ ok: false, error: 'no se pudo leer la respuesta' }));
}

async function entrar() {
  $('loginErr').classList.add('oculto');
  const r = await api('/api/cuenta/login', { method: 'POST',
    body: JSON.stringify({ usuario: $('u').value, clave: $('p').value }) });
  if (!r.ok) { $('loginErr').textContent = r.error || 'No se pudo entrar'; $('loginErr').classList.remove('oculto'); return; }
  guardarTok(r.token || '');
  cargar();
}

function salir() { borrarTok(); location.reload(); }

async function cargar() {
  if (!tok()) return;
  const r = await api('/api/cuenta/mio');
  // 401 = el token venció o se lo dieron de baja: vuelve al login sin cartel de error, que sería
  // alarmar por algo normal.
  if (!r.ok) { borrarTok(); return; }
  // Si el servidor mandó uno nuevo, se guarda: es lo que hace que no haya que volver a entrar.
  if (r.token) guardarTok(r.token);
  $('login').classList.add('oculto');
  $('panel').classList.remove('oculto');
  pintar(r);
}

function pintar(r) {
  const c = r.cuenta || {};
  const mon = c.moneda || 'USDT';
  const debe = Number(c.total || 0);
  // A favor es un caso real —pagó de más, o de adelantado— y decirlo "saldo -120" obliga a pensar.
  const titulo = debe > 0 ? 'Tu saldo pendiente es' : (debe < 0 ? 'Tenés a favor' : 'Estás al día');

  const movs = (r.movimientos || []).filter((m) => m.tipo !== 'correccion');
  const nombreTipo = { carga: 'Fichas', pago: 'Pago', ajuste: 'Ajuste',
    bonificacion: 'Bonificación', proveedor_extra: 'Proveedores' };

  /* ── UNA FILA, CUATRO DATOS: cuándo · qué fue · pesos · dólares ────────────────────────────
     Antes cada renglón traía también el %, el tipo de cambio y a qué usuario fue. El cliente ya
     sabe su % y el TC no le sirve: esas líneas tapaban los números que sí mira. */
  /* Si la caja tiene nombre para el cliente va el nombre, y el login SIEMPRE abajo: es lo único
     que no se confunde entre dos cajas que se llamen parecido. */
  const caja = (etq, usr) => (etq || usr)
    ? (etq ? `<b>${esc(etq)}</b><div class="mut" style="font-size:12px">${esc(usr || '')}</div>`
           : `<div class="mut" style="font-size:12px">${esc(usr || '')}</div>`) : '';
  // La moneda se dice UNA vez, en el encabezado de la columna: repetirla en cada renglón era la
  // mitad del ruido que había que leer.
  /* La columna decía ARS, y una carga en guaraníes no tiene cara en pesos: salía un guion, que se
     lee como un error. Cada renglón muestra lo que paga EN SU MONEDA y su equivalente en dólares. */
  const nro = (v, dec, baja, div) => (v == null || v === '')
    ? '<span class="mut">—</span>' : `<b>${baja ? '− ' : ''}${money(v, dec)}</b>${div ? ` <span class="mut">${esc(div)}</span>` : ''}`;
  const fila = (o) => `<tr>
    <td class="mut" style="white-space:nowrap">${esc(o.dia || '')}</td>
    <td>${o.que}</td>
    <td class="r" style="white-space:nowrap;color:${o.baja ? 'var(--verde)' : 'inherit'}">${nro(o.propio, o.propio_divisa === 'USDT' ? 2 : 0, o.baja, o.propio_divisa)}</td>
    <td class="r" style="white-space:nowrap;color:${o.baja ? 'var(--verde)' : 'inherit'}">${nro(o.usdt, 2, o.baja)}</td>
  </tr>`;
  const filaCarga = (x) => fila({ dia: fecha(x.fecha), propio: x.pagas_monto, propio_divisa: x.pagas_divisa, usdt: x.pagas_usdt,
    que: `<b>${money(x.monto, 0)}</b> <span class="mut">${esc(x.divisa || '')}</span>${caja(x.etiqueta, x.usuario)}` });
  const filaMov = (m) => {
    const baja = m.tipo === 'pago' || m.tipo === 'bonificacion';
    const que = m.tipo === 'carga' && m.cargado
      ? `<b>${money(m.cargado, 0)}</b> <span class="mut">${esc(m.divisa || '')}</span>${caja(m.etiqueta, m.usuario)}`
      : (m.tipo === 'ajuste' && m.notas ? esc(m.notas) : esc(nombreTipo[m.tipo] || m.tipo));
    // Un ajuste se explica por su nota, no por el día en que alguien lo cargó.
    const esAjuste = m.tipo === 'ajuste' && m.notas;
    return fila({ dia: esAjuste ? '' : fecha(m.fecha), que, propio: m.propio_monto, propio_divisa: m.propio_divisa, usdt: m.monto_usdt, baja });
  };
  /* EL MES DE CADA MOVIMIENTO NO ES SIEMPRE EL DE SU FECHA: la deuda de julio se cargó en
     septiembre y por fecha aparecía arriba, mezclada con lo de este mes. */
  const mesDe = (m) => m.mes || String(m.fecha || '').slice(0, 7);
  const filasMes = (r.cargas || []).map(filaCarga).join('')
    + movs.filter((m) => mesDe(m) === r.mes && m.tipo !== 'carga').map(filaMov).join('');
  /* ORDENADOS POR EL MES AL QUE PERTENECEN, no por el día en que se cargaron: la deuda de julio
     se cargó el 15 de septiembre y por fecha salía ARRIBA de las cargas de agosto. */
  const filasAntes = movs.filter((m) => mesDe(m) !== r.mes)
    .sort((a, b) => mesDe(b).localeCompare(mesDe(a)) || String(b.fecha || '').localeCompare(String(a.fecha || '')))
    .map(filaMov).join('');
  const bloque = (titulo, filas) => filas ? `<div class="card">
      <label>${titulo}</label>
      <table>
        <thead><tr><th></th><th>Fichas</th><th class="r">Pagás</th><th class="r">USDT</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>` : '';

  $('panel').innerHTML = `
    <h1>${esc((r.cliente||{}).nombre || '')}</h1>
    <div class="mut">${esc((r.cliente||{}).codigo || '')}${r.base_pct != null ? ' · trabajás al ' + esc(r.base_pct) + '%' : ''}</div>

    <div class="card">
      <label>${titulo}</label>
      <div class="saldo" style="color:${debe > 0 ? 'var(--rojo)' : (debe < 0 ? 'var(--verde)' : 'inherit')}">
        ${money(Math.abs(debe))} ${esc(mon)}</div>
      ${/* ⚠️ Sólo una cuenta llevada en pesos se paga en pesos; las demás se pagan en dólares. El
            monto en la otra moneda es una REFERENCIA de lo que costó cada carga, y hay que decirlo
            o se lee como «pagá esto en pesos». */''}
      ${c.otra_completa && c.total_otra != null && Number(c.total_otra) ? `
        <div style="font-size:21px;font-weight:700;opacity:.75">${money(Math.abs(c.total_otra))} ${esc(c.otra_moneda || '')}</div>
        <div class="chico">de referencia, cada movimiento al cambio de su día · se paga en ${esc(mon)}</div>` : ''}
      <div class="chico" style="margin-top:6px">
        Consumo ${money(c.fichas_pendientes)}
        ${Number(c.proveedores_pendientes) ? ' · Proveedores ' + money(c.proveedores_pendientes) : ''}
        · Pagado ${money(c.pagos)}
      </div>
      ${(r.pendientes||[]).length ? `<div class="avi"><b>⏳ Esperando aprobación</b>
        ${r.pendientes.map((p) => `<div>${fecha(p.fecha)} · ${money(p.monto)} ${esc(p.divisa||'')}</div>`).join('')}
        <div style="margin-top:4px">Todavía no está descontado del saldo de arriba.</div></div>` : ''}
      ${Number(c.esperandoTC||0) ? `<div class="avi">Hay ${c.esperandoTC} pago(s) en pesos que se están contando
        con el cambio promedio del mes. Al cerrar el mes el número se ajusta.</div>` : ''}
      ${Number(c.sinValuar||0) ? `<div class="avi" style="border-color:var(--rojo);color:var(--rojo)">
        ${c.sinValuar} pago(s) todavía sin convertir: no están descontados de este saldo.</div>` : ''}
    </div>

    ${bloque('Fichas de este mes', filasMes)}
    ${bloque('Meses anteriores', filasAntes)}

    <button class="link" onclick="salir()">Salir</button>
  `;
}

cargar();
</script>
</body>
</html>
