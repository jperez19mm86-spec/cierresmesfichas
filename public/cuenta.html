<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi cuenta</title>
<link rel="icon" href="/logo.png">
<style>
/*
 * cuenta.html — LO QUE VE EL CLIENTE DE SU PROPIA CUENTA.
 *
 * Se mira desde el teléfono, casi siempre. Por eso una sola columna, números grandes y ningún
 * menú: entra, mira cuánto debe, y se va.
 *
 * ⚠️ NO PUEDE APARECER NADA INTERNO: ni en qué sistema se cargan sus fichas, ni quién se lo
 * vende, ni cómo se distribuye la ganancia entre los socios. El servidor ya se cuida de no
 * mandarlo; esta pantalla no lo pide y no lo muestra aunque llegara.
 *
 * El comentario está escrito A PROPÓSITO sin nombrar esas cosas: el test las busca en el archivo
 * ENTERO, sin filtrar comentarios. Un check sin preprocesado no se puede engañar — y el filtro
 * que había antes se comía medio archivo, con lo cual el check pasaba siempre sin mirar nada.
 */
:root{
  --bg:#faf5fb; --bg2:#fff; --bg3:#f6eef8; --txt:#241f27; --mut:#6b6470;
  --bor:#e7dfe9; --g:#c456ad; --rojo:#b3261e; --verde:#1e7a4b; --azul:#2c5a8c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161318; --bg2:#1e1a20; --bg3:#262029; --txt:#f2eef4; --mut:#a49bab;
    --bor:#352e38; --g:#d977c2; --rojo:#f2837a; --verde:#63c795; --azul:#8db4dd; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--bg2);border:1px solid var(--bor);border-radius:12px;padding:16px;margin:12px 0}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bor);border-radius:8px;
  background:var(--bg3);color:var(--txt);outline:none}
input:focus{border-color:var(--g)}
button{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;
  background:var(--g);color:#fff;cursor:pointer;margin-top:12px}
button.link{background:none;color:var(--mut);font-weight:400;font-size:13px;text-decoration:underline;margin-top:8px}
.saldo{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.chico{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;
  padding:0 0 6px;border-bottom:1px solid var(--bor)}
td{padding:8px 0;border-bottom:1px solid var(--bor);vertical-align:top}
tr:last-child td{border-bottom:none}
.r{text-align:right;white-space:nowrap}
.err{background:rgba(179,38,30,.1);border:1px solid var(--rojo);color:var(--rojo);
  padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px}
.avi{background:var(--bg3);border-left:3px solid var(--g);padding:10px 12px;border-radius:0 8px 8px 0;
  font-size:13px;color:var(--mut);margin-top:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--bg3);
  font-size:11px;color:var(--mut)}
.oculto{display:none}
/* Los nombres de color que usa el listado compartido con pedir.html, apuntando a los de esta pantalla. */
.wrap{--gold:var(--g); --green:var(--verde); --red:var(--rojo); --muted:var(--mut); --border:var(--bor); --text:var(--txt)}
.wrap:has(#panel:not(.oculto)){max-width:760px}
.small{font-size:12px;color:var(--mut)}
/* El botón de esta pantalla ocupa todo el ancho; los filtros no. */
.cta-chip{width:auto;margin-top:0;padding:7px 12px;font-size:13.5px;font-weight:600}
.cta-chip:not(.sel){background:var(--bg3);color:var(--txt)}
  /* ── LA CUENTA (13-oct-2026) ─────────────────────────────────────────────────────────────────
     Saldo y tres números arriba; filtros por tipo; cada mes con lo que se cobró y lo que pagó, en
     dos columnas en pantalla ancha y una abajo de la otra en el celular. Cada carga en una línea
     con columnas fijas —monto, moneda, login— para que el cliente la coteje contra su panel. */
  .cta-saldo { font-size:32px; font-weight:800; margin:2px 0 10px; font-variant-numeric:tabular-nums; }
  .cta-tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cta-tile { background:var(--bg3); border-radius:9px; padding:9px 10px; min-width:0; }
  .cta-tile .v { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  /* Colores tranquilos (13-oct-2026, «parece un carnaval»): los PAGOS en azul; lo que no es carga
     ni pago —abonos, ajustes, proveedores— en gris, para que no se confunda con un pago; el login
     en negrita del color del texto; «Anulada» en gris. */
  .cta-tile.paga .v, .cta-baja { color:var(--azul); }
  .cta-fila.otro .ancho, .cta-fila.otro .r { color:var(--muted); }
  .cta-fila.otro .r b { font-weight:600; }
  .cta-chips { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px; }
  .cta-chip { background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:7px 12px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .cta-chip b { margin-left:4px; opacity:.65; }
  .cta-chip.sel { background:var(--gold); border-color:var(--gold); color:#fff; }
  .cta-chip:focus-visible, .cta-mes > summary:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  details.cta-mes { border-top:1px solid var(--border); }
  details.cta-mes > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:3px 12px; padding:12px 0; align-items:baseline; }
  details.cta-mes > summary::-webkit-details-marker { display:none; }
  .cta-mesn { font-weight:800; font-size:15px; }
  .cta-mesn::before { content:'▸'; display:inline-block; width:16px; color:var(--muted); transition:transform .15s; }
  details[open] .cta-mesn::before { transform:rotate(90deg); }
  .cta-mesr { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:3px 14px; font-size:12.5px; color:var(--muted); padding-left:16px; }
  .cta-cierre { text-align:right; font-size:12.5px; color:var(--muted); }
  .cta-cierre b { color:var(--text); font-size:14px; }
  .cta-cols { display:grid; grid-template-columns:1fr; gap:14px; padding:0 0 14px 16px; }
  @media (min-width:620px) { .cta-cols { grid-template-columns:1.35fr 1fr; } }
  .cta-col { min-width:0; }
  .cta-col h4 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; justify-content:space-between; }
  .cta-fila { display:grid; grid-template-columns:40px 92px 34px minmax(0,1fr) auto; column-gap:6px; padding:8px 0; border-bottom:1px solid var(--border); align-items:baseline; font-size:13.5px; }
  .cta-fila .d { color:var(--muted); font-size:12px; }
  .cta-fila .m { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .cta-fila .dv { color:var(--muted); font-size:12px; }
  .cta-fila .login .usr { color:var(--muted); font-weight:500; }
  .cta-fila .login { color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .cta-fila .ancho { grid-column:2 / 5; min-width:0; }
  .cta-fila .r { text-align:right; font-variant-numeric:tabular-nums; }
  .cta-fila .r b { white-space:nowrap; }
  .cta-fila .r .us, .cta-fila .r .ot { display:grid; grid-template-columns:auto 34px; justify-content:end; column-gap:4px; }
  .cta-fila .r .ot { color:var(--muted); font-size:11.5px; }
  .cta-fila .r .ot span:last-child, .cta-fila .r .us span:last-child { text-align:left; }
  .cta-fila.anulada .m, .cta-fila.anulada .dv, .cta-fila.anulada .r { text-decoration:line-through; opacity:.55; }
  .cta-fila.anulada .login { opacity:.7; }
  .cta-tag { display:inline-block; font-size:11px; font-weight:600; color:var(--muted); border:1px solid currentColor; border-radius:6px; padding:0 5px; margin-left:6px; }
  .cta-vacio { color:var(--muted); font-size:13px; padding:8px 0; }
  .cta-total { display:flex; justify-content:space-between; font-size:13px; padding-top:6px; font-weight:700; }
  .cta-chip.vista { margin-left:auto; background:transparent; }
  .cta-chip.vista[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
  .cta-mes-cab, details.cta-mes.compacto > summary { display:grid; grid-template-columns:minmax(0,1.3fr) 1fr 1fr 1.1fr; gap:6px; align-items:baseline; font-variant-numeric:tabular-nums; }
  .cta-mes-cab { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:10px 0 6px; border-bottom:1px solid var(--border); }
  .cta-mes-cab span:not(:first-child), details.cta-mes.compacto > summary > span:not(:first-child) { text-align:right; }
  details.cta-mes.compacto .cta-mesn { font-size:14px; }
  @media (max-width:480px) { .cta-mes-cab, details.cta-mes.compacto > summary { grid-template-columns:minmax(0,1.1fr) 1fr 1fr 1fr; font-size:12.5px; } .cta-mes-cab { font-size:10px; } }
  .cta-solo .cta-fila { grid-template-columns:48px 92px 34px minmax(0,1fr) auto; }
  /* ── LAS COLUMNAS DE FICHAS Y PAGOS ────────────────────────────────────────────────────────
     Un encabezado UNA vez arriba y los números debajo, alineados. Antes cada renglón repetía la
     moneda en prosa y no se podían comparar dos cargas de un vistazo. */
  .cta-cab, .cta-r { display:grid; grid-template-columns:46px minmax(0,1fr) 84px 76px; column-gap:10px; align-items:baseline; font-variant-numeric:tabular-nums; }
  .cta-cab { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 0 6px; border-bottom:1px solid var(--border); }
  .cta-cab span:not(:first-child), .cta-r span:not(.d):not(.izq):not(.cta-pie) { text-align:right; }
  .cta-cab .izq, .cta-r .izq { text-align:left; }
  .cta-r { padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .cta-r .d { font-size:12px; color:var(--muted); }
  .cta-r.anulada { opacity:.55; text-decoration:line-through; }
  .cta-r .cta-pie { grid-column:2 / -1; text-align:left; font-size:11.5px; color:var(--muted); padding-top:3px; }
  /* El grupo por login: el total a la derecha y el día por día adentro. */
  details.cta-g { border-bottom:1px solid var(--border); }
  details.cta-g > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) 84px 76px; column-gap:10px; row-gap:2px; align-items:baseline; padding:11px 0; font-variant-numeric:tabular-nums; }
  details.cta-g > summary::-webkit-details-marker { display:none; }
  details.cta-g > summary > span:not(.cta-gn):not(.cta-gc) { text-align:right; }
  .cta-gn { font-weight:700; font-size:14.5px; }
  .cta-gn::before { content:'▸'; display:inline-block; width:15px; color:var(--muted); transition:transform .15s; }
  details.cta-g[open] .cta-gn::before { transform:rotate(90deg); }
  .cta-gc { grid-column:1; font-size:12px; color:var(--muted); padding-left:15px; }
  details.cta-g .cta-cab, details.cta-g .cta-r { padding-left:15px; }
  details.cta-g > summary + .cta-cab { border-top:1px solid var(--border); }
  @media (max-width:480px) {
    .cta-cab, .cta-r { grid-template-columns:40px minmax(0,1fr) 68px 64px; column-gap:7px; font-size:12.5px; }
    details.cta-g > summary { grid-template-columns:minmax(0,1fr) 68px 64px; column-gap:7px; }
    .cta-cab { font-size:9.5px; letter-spacing:.03em; }
  }
  .cta-tile .v { white-space:nowrap; }
  /* En el celular el login no entra al lado del monto y se cortaba («F01Z…»): va en su propia línea,
     debajo, entero. Es el dato con el que el cliente coteja, no se puede perder. */
  @media (max-width:560px) {
    .cta-cols { padding-left:0; }
    .cta-fila, .cta-solo .cta-fila { grid-template-columns:38px 84px 32px minmax(0,1fr) auto; font-size:13px; }
    .cta-fila .login { grid-column:2 / 5; grid-row:2; white-space:normal; overflow:visible; font-size:12.5px; }
    .cta-fila .r { grid-column:5; grid-row:1 / span 2; }
    .cta-tile .v { font-size:14.5px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Mi cuenta</h1>
    <div class="mut">Entrá con el usuario y la contraseña que te pasamos.</div>
    <div class="card">
      <div><label>Usuario</label><input id="u" autocomplete="username" autocapitalize="off" autocorrect="off"></div>
      <div style="margin-top:12px"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"></div>
      <button onclick="entrar()">Entrar</button>
      <div id="loginErr" class="err oculto"></div>
    </div>
  </div>

  <div id="panel" class="oculto"></div>

</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? '' : x)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = (x, d = 2) => Number(x || 0).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fecha = (f) => { const [a,m,d] = String(f||'').slice(0,10).split('-'); return d ? `${d}/${m}` : ''; };

/* El token dura 7 días y sólo sirve para SU cuenta: firmado con otra familia que la del panel,
   así que jamás abre el OS.
   ⚠️ TODO ACCESO A localStorage VA ENVUELTO. Leerlo TIRA EXCEPCIÓN cuando el navegador tiene el
   almacenamiento bloqueado (incógnito con cookies restringidas, algunas políticas). Y como se leía
   en CADA llamada —incluida la del login— la excepción salía antes de mandar nada: el botón
   "Entrar" no hacía absolutamente nada, sin error y sin pedido. Si no se puede guardar, la sesión
   igual funciona: queda en memoria y se pierde al recargar, que es molesto pero anda. */
const TOKEN = 'cuenta_token';
let _mem = '';
const tok = () => { try { return localStorage.getItem(TOKEN) || _mem; } catch (e) { return _mem; } };
const guardarTok = (t) => { _mem = t || ''; try { localStorage.setItem(TOKEN, t || ''); } catch (e) {} };
const borrarTok = () => { _mem = ''; try { localStorage.removeItem(TOKEN); } catch (e) {} };

async function api(url, opts) {
  const r = await fetch(url, { ...opts, headers: { 'content-type': 'application/json',
    ...(tok() ? { authorization: 'Bearer ' + tok() } : {}), ...((opts||{}).headers||{}) } });
  return r.json().catch(() => ({ ok: false, error: 'no se pudo leer la respuesta' }));
}

async function entrar() {
  $('loginErr').classList.add('oculto');
  const r = await api('/api/cuenta/login', { method: 'POST',
    body: JSON.stringify({ usuario: $('u').value, clave: $('p').value }) });
  if (!r.ok) { $('loginErr').textContent = r.error || 'No se pudo entrar'; $('loginErr').classList.remove('oculto'); return; }
  guardarTok(r.token || '');
  cargar();
}

function salir() { borrarTok(); location.reload(); }

async function cargar() {
  if (!tok()) return;
  const r = await api('/api/cuenta/mio');
  // 401 = el token venció o se lo dieron de baja: vuelve al login sin cartel de error, que sería
  // alarmar por algo normal.
  if (!r.ok) { borrarTok(); return; }
  // Si el servidor mandó uno nuevo, se guarda: es lo que hace que no haya que volver a entrar.
  if (r.token) guardarTok(r.token);
  $('login').classList.add('oculto');
  $('panel').classList.remove('oculto');
  pintar(r);
}

let _r = null, _ctaFiltro = 'todo';
function ctaFiltrar(f) { _ctaFiltro = f; pintar(_r); }
/* Compactar por mes. NO se guarda en el navegador: el teléfono puede ser de otro (ver el token). */
let _ctaCompacto = false;
function ctaCompactar() { _ctaCompacto = !_ctaCompacto; _ctaFiltro = 'todo'; pintar(_r); }
  /* ── EL LISTADO DE LA CUENTA ─────────────────────────────────────────────────────────────────
   ⚠️ ES EL MISMO CÓDIGO EN pedir.html Y EN cuenta.html (las dos pantallas del cliente en el
   portal). Si cambia uno, cambia el otro: el suite (smoke.js) compara las dos. */
function ctaListaHTML(d, mon) {
  const money = (x, n) => Number(x || 0).toLocaleString('es-AR', { minimumFractionDigits: n, maximumFractionDigits: n });
  const dia = (f) => { const p = String(f || '').slice(0, 10).split('-'); return p[2] ? p[2] + '/' + p[1] : ''; };
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const nomMes = (m) => { const [a, b] = String(m).split('-'); const n = MESES[Number(b) - 1]; return n ? n[0].toUpperCase() + n.slice(1) + ' ' + a : m; };
  let h = '';
  /* LA CARGA Y SU ANULACIÓN, EN UN SOLO RENGLÓN: se suman cero entre las dos, y mostrarlas aparte
     parecía que se cobró algo y después se devolvió. La anulación se esconde y la carga queda
     tachada con «Anulada»: queda el registro de que se pidió, sin deuda. */
  const todos = d.movimientos || [];
  const ids = new Set(todos.map(m => m.id));
  const bajas = {}; todos.forEach(m => { if (m.tipo === 'correccion' && m.anula && ids.has(m.anula)) bajas[m.anula] = m; });
  const movs = todos.filter(m => !(m.tipo === 'correccion' && m.anula && ids.has(m.anula)))
    .map(m => bajas[m.id] ? Object.assign({}, m, { _anulada: true, _anuladaEl: bajas[m.id].fecha }) : m);
  const esPago = (m) => m.tipo === 'pago' || m.tipo === 'bonificacion';
  const grupo = (m) => m.tipo === 'carga' ? 'fichas' : (esPago(m) ? 'pagos' : 'otros');
  // Se suma la columna de la moneda de la CUENTA: en una cuenta en pesos, los pesos.
  const colCuenta = mon === 'ARS' ? 'monto_ars' : 'monto_usdt';
  const usd = (m) => m._anulada ? 0 : Number(m[colCuenta] || 0);
  const suma = (l) => l.reduce((a, m) => a + usd(m), 0);
  const cuenta = (m) => m.tipo === 'carga' && m.cargado != null;

  const fila = (m, conAnio) => {
    const baja = esPago(m);
    const signo = baja || Number(m.monto_usdt) < 0 ? '− ' : '';
    let medio;
    if (cuenta(m)) medio = '<span class="m">' + money(m.cargado, 0) + '</span><span class="dv">' + esc(m.divisa || '') + '</span>'
      /* Si la caja tiene nombre para el cliente va el nombre, y el login SIEMPRE al lado: es lo
         único que no se confunde entre dos cajas que se llamen parecido. */
      + '<span class="login">' + (m.etiqueta ? esc(m.etiqueta) + ' <span class="usr">' + esc(m.usuario || '') + '</span>' : esc(m.usuario || '—'))
      + (m._anulada ? '<span class="cta-tag">Anulada</span>' : '') + '</span>';
    else {
      const que = m.tipo === 'pago' ? 'Pago' + (m.medio ? ' <span class="small">· ' + esc(m.medio === 'cvu' ? 'transferencia' : String(m.medio).toUpperCase()) + '</span>' : '')
        : esc(m.notas || ({ proveedor_extra: 'Proveedores', correccion: 'Carga anulada', ajuste: 'Ajuste', bonificacion: 'A tu favor' }[m.tipo] || m.tipo));
      medio = '<span class="ancho">' + que + '</span>';
    }
    // El monto en la moneda de la carga va abajo y chico: lo que se suma es el de USDT.
    /* La cara en la otra moneda. Si el movimiento no la guardó —un pago hecho en USDT nunca
       guarda los pesos— se muestra la DERIVADA, marcada: el cliente lee en pesos y quedarse sin
       ese renglón era justamente lo que le hacía creer que debía de más. */
    const ot = (m.propio_divisa && m.propio_divisa !== mon && m.propio_monto != null)
      ? '<span class="ot"><span>' + money(Math.abs(m.propio_monto), m.propio_divisa === 'USDT' ? 2 : 0) + '</span><span>' + esc(m.propio_divisa) + '</span></span>'
      : (mon !== 'ARS' && m.ars_referencia
        ? '<span class="ot ref" title="Equivalente en pesos al cambio de ' + esc(m.ars_referencia_tc || '') + '. Es referencia: lo que se descuenta son los USDT.">'
          + '<span>≈ ' + money(Math.abs(m.ars_referencia), 0) + '</span><span>ARS</span></span>'
        : '');
    const esAj = (m.tipo === 'ajuste' || m.tipo === 'bonificacion') && m.notas;
    const fecha = esAj ? '' : dia(m.fecha) + (conAnio ? '<span style="display:block">' + esc(String(m.fecha).slice(0, 4)) + '</span>' : '');
    const valor = mon === 'ARS' ? m.monto_ars : m.monto_usdt;
    const tipoFila = cuenta(m) ? '' : (m.tipo === 'pago' ? ' cta-baja' : ' otro');
    return '<div class="cta-fila' + tipoFila + (m._anulada ? ' anulada' : '') + '"'
      + (m._anulada ? ' title="Se pidió el ' + dia(m.fecha) + ' y se anuló el ' + dia(m._anuladaEl) + ': no suma a la deuda"' : '') + '>'
      + '<span class="d">' + fecha + '</span>' + medio
      + '<span class="r"><span class="us"><b>' + signo + money(Math.abs(Number(valor || 0)), 2) + '</b><span class="dv">' + esc(mon) + '</span></span>' + ot + '</span></div>';
  };

  const n = { todo: movs.length, fichas: 0, pagos: 0, otros: 0 }; movs.forEach(m => n[grupo(m)]++);
  h += '<div class="cta-chips" role="tablist">' + [['todo', 'Todo'], ['fichas', 'Fichas'], ['pagos', 'Pagos'], ['otros', 'Ajustes']]
    .filter(([k]) => k === 'todo' || n[k]).map(([k, l]) => '<button type="button" class="cta-chip' + (_ctaFiltro === k ? ' sel' : '') + '" role="tab" aria-selected="' + (_ctaFiltro === k)
    + '" onclick="ctaFiltrar(\'' + k + '\')">' + l + '<b>' + n[k] + '</b></button>').join('')
    + '<button type="button" class="cta-chip vista" aria-pressed="' + _ctaCompacto + '" onclick="ctaCompactar()">' + (_ctaCompacto ? '☰ Ver detalle' : '▤ Compactar por mes') + '</button></div>';

  const orden = (a, b) => String(b.fecha).localeCompare(String(a.fecha));
  // Sólo el nombre del mes: «salda septiembre 112,75» se lee; con el año de atrás, no.
  const soloMes = (k) => { const n = MESES[Number(String(k).split('-')[1]) - 1]; return n || k; };
  const ars = (m) => (m.propio_divisa === 'ARS' && m.propio_monto != null) ? Math.abs(m.propio_monto)
    : (m.ars_referencia != null ? Math.abs(m.ars_referencia) : null);

  /* ── A QUÉ MES LE PEGA CADA PAGO ────────────────────────────────────────────────────────────
     El saldo YA era FIFO —se acumula desde el más viejo— pero no se veía: un mes pagado quedaba
     en rojo para siempre y el cliente creía que lo arrastraba. Acá se hace explícito: cada pago,
     en orden, va saldando los meses que tienen saldo, del más viejo al más nuevo. No cambia
     ningún número; dice cuál ya está cubierto. */
  const imputacion = (() => {
    const cron = movs.slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)) || (Number(a.ord) || 0) - (Number(b.ord) || 0));
    const pend = new Map(); const out = {};
    cron.forEach(m => {
      const k = m.mes || String(m.fecha || '').slice(0, 7);
      if (!esPago(m)) { pend.set(k, (pend.get(k) || 0) + usd(m)); return; }
      let resto = usd(m); const trozos = [];
      Array.from(pend.keys()).sort().forEach(mes => {
        if (resto <= 0.004) return;
        const q = pend.get(mes); if (q <= 0.004) return;
        const t = Math.min(q, resto); pend.set(mes, q - t); resto -= t;
        trozos.push({ mes: mes, monto: t });
      });
      out[m.id] = { trozos: trozos, sobra: resto > 0.004 ? resto : 0 };
    });
    return out;
  })();

  /* ── LAS FICHAS, AGRUPADAS POR DÓNDE FUERON ────────────────────────────────────────────────
     Eran 29 renglones iguales, uno abajo del otro. Agrupadas por login se ve en dos líneas a
     dónde fue la plata, y el día por día sigue estando para cotejar contra el panel. */
  const vistaFichas = (l) => {
    const g = new Map();
    l.forEach(m => {
      const k = (m.usuario || '—') + '|' + (m.etiqueta || '');
      if (!g.has(k)) g.set(k, { usuario: m.usuario || '—', etiqueta: m.etiqueta || '', items: [], usd: 0, ars: 0 });
      const x = g.get(k); x.items.push(m); x.usd += usd(m); const a = ars(m); if (a != null) x.ars += a;
    });
    const grupos = Array.from(g.values()).sort((a, b) => b.usd - a.usd);
    const cab = '<div class="cta-cab"><span></span><span>FICHAS</span><span>ARS</span><span>' + esc(mon) + '</span></div>';
    return grupos.map((x, i) => '<details class="cta-g"' + (i === 0 ? ' open' : '') + '><summary>'
      + '<span class="cta-gn">' + (x.etiqueta ? esc(x.etiqueta) + ' <span class="usr">' + esc(x.usuario) + '</span>' : esc(x.usuario)) + '</span>'
      /* Los dos números primero: así caen en la fila 1 con el nombre, y el contador baja solo a
         la segunda (tiene grid-column:1). Al revés, el auto-placement lo desarmaba. */
      + '<span>' + (x.ars ? money(x.ars, 0) : '—') + '</span><span><b>' + money(x.usd, 2) + '</b></span>'
      + '<span class="cta-gc">' + x.items.length + (x.items.length === 1 ? ' carga' : ' cargas') + '</span></summary>'
      + cab + x.items.sort(orden).map(m => {
        const a = ars(m);
        return '<div class="cta-r' + (m._anulada ? ' anulada' : '') + '"><span class="d">' + dia(m.fecha) + '</span>'
          + '<span>' + (m.cargado != null ? money(m.cargado, 0) : '—') + (m._anulada ? '<span class="cta-tag">Anulada</span>' : '') + '</span>'
          + '<span>' + (a != null ? money(a, 0) : '—') + '</span>'
          + '<span><b>' + money(usd(m), 2) + '</b></span></div>';
      }).join('') + '</details>').join('');
  };

  /* ── LOS PAGOS: lo que hizo el cliente primero, y en su plata ──────────────────────────────── */
  const vistaPagos = (l) => {
    const cab = '<div class="cta-cab pagos"><span></span><span class="izq">MEDIO</span><span>ARS</span><span>' + esc(mon) + '</span></div>';
    return cab + l.map(m => {
      const a = ars(m);
      const como = m.tipo === 'bonificacion' ? 'a tu favor'
        : (m.medio === 'cvu' ? 'transferencia' : (m.medio ? String(m.medio).toUpperCase() : 'pago'));
      const im = imputacion[m.id] || { trozos: [], sobra: 0 };
      const salda = im.trozos.length
        ? 'salda ' + im.trozos.map(t => '<b>' + esc(soloMes(t.mes)) + ' ' + money(t.monto, 2) + '</b>').join(' + ')
          + (im.sobra ? ' · ' + money(im.sobra, 2) + ' a favor' : '')
        : (im.sobra ? money(im.sobra, 2) + ' a favor' : '');
      const cambio = m.ars_referencia_tc ? 'cambio ' + money(m.ars_referencia_tc, 0)
        : (m.tc ? 'cambio ' + money(m.tc, 0) : '');
      const pie = [cambio, salda].filter(Boolean).join(' · ');
      return '<div class="cta-r pagos"><span class="d">' + dia(m.fecha) + '</span>'
        + '<span class="izq">' + esc(como) + '</span>'
        + '<span>' + (a != null ? money(a, 0) : '—') + '</span>'
        + '<span class="cta-baja"><b>−' + money(Math.abs(usd(m)), 2) + '</b></span>'
        + (pie ? '<span class="cta-pie">' + pie + '</span>' : '') + '</div>';
    }).join('');
  };

  if (_ctaFiltro !== 'todo') {
    const l = movs.filter(m => grupo(m) === _ctaFiltro).sort(orden);
    const tot = suma(l);
    const totArs = l.reduce((s, m) => { const a = ars(m); return a == null ? s : s + a; }, 0);
    const cuerpo = _ctaFiltro === 'fichas' ? vistaFichas(l)
      : (_ctaFiltro === 'pagos' ? vistaPagos(l) : l.map(m => fila(m, true)).join(''));
    h += '<div class="cta-solo" style="margin-top:8px">' + cuerpo
      + '<div class="cta-total"><span>' + l.length + (_ctaFiltro === 'pagos' ? (l.length === 1 ? ' pago' : ' pagos') : ' movimientos') + '</span>'
      + '<span class="muted">' + (totArs ? money(totArs, 0) + ' ARS' : '') + '</span>'
      + '<span class="' + (_ctaFiltro === 'pagos' ? 'cta-baja' : '') + '">'
      + (_ctaFiltro === 'pagos' ? '− ' : '') + money(Math.abs(tot), 2) + ' ' + esc(mon) + '</span></div></div>';
  } else {
    /* MES POR MES, por el mes al que pertenece cada movimiento (no el de su fecha), con lo que
       debía al cierre: se acumula desde el más viejo y contesta «¿cuánto debía a fin de agosto?». */
    const porMes = {}; movs.forEach(m => { const k = m.mes || String(m.fecha || '').slice(0, 7); (porMes[k] = porMes[k] || []).push(m); });
    const meses = Object.keys(porMes).sort();
    let acum = 0; const cierre = {};
    meses.forEach(k => { porMes[k].forEach(m => { acum += esPago(m) ? -usd(m) : usd(m); }); cierre[k] = acum; });
    if (_ctaCompacto) h += '<div class="cta-mes-cab"><span>Mes</span><span>Se cobró</span><span>Pagaste</span><span>Debías al cierre</span></div>';
    meses.slice().reverse().forEach((k, i) => {
      const cob = porMes[k].filter(m => !esPago(m)).sort(orden), pag = porMes[k].filter(esPago).sort(orden);
      const tc = suma(cob), tp = suma(pag);
      const detalle = '<div class="cta-cols"><div class="cta-col"><h4><span>Se te cobró</span><span>' + money(tc, 2) + '</span></h4>' + (cob.length ? cob.map(m => fila(m)).join('') : '<div class="cta-vacio">Nada este mes</div>') + '</div>'
        + '<div class="cta-col"><h4><span>Pagaste</span><span class="cta-baja">' + (pag.length ? '− ' + money(tp, 2) : '') + '</span></h4>' + (pag.length ? pag.map(m => fila(m)).join('') : '<div class="cta-vacio">Sin pagos este mes</div>') + '</div></div>';
      /* COMPACTAR POR MES: un renglón por mes —se cobró · pagaste · debías al cierre— y se abre el
         que se quiera ver. */
      if (_ctaCompacto) {
        h += '<details class="cta-mes compacto"><summary><span class="cta-mesn">' + esc(nomMes(k)) + '</span>'
          + '<span>' + money(tc, 2) + '</span><span class="cta-baja">' + (pag.length ? '− ' + money(tp, 2) : '—') + '</span>'
          + '<span><b>' + (cierre[k] < 0 ? 'a favor ' : '') + money(Math.abs(cierre[k]), 2) + '</b></span></summary>' + detalle + '</details>';
        return;
      }
      h += '<details class="cta-mes"' + (i < 2 ? ' open' : '') + '><summary><span class="cta-mesn">' + esc(nomMes(k)) + '</span>'
        + '<span class="cta-cierre">' + (cierre[k] >= 0 ? 'debías al cierre ' : 'a favor al cierre ') + '<b>' + money(Math.abs(cierre[k]), 2) + '</b></span>'
        + '<span class="cta-mesr"><span>Se cobró ' + money(tc, 2) + '</span>' + (pag.length ? '<span class="cta-baja">Pagaste − ' + money(tp, 2) + '</span>' : '<span>Sin pagos</span>') + '</span></summary>'
        + detalle + '</details>';
    });
  }
  return h;
}

function pintar(r) {
  _r = r;
  const c = r.cuenta || {};
  const mon = c.moneda || 'USDT';
  const debe = Number(c.total || 0);
  // A favor es un caso real —pagó de más, o de adelantado— y decirlo "saldo -120" obliga a pensar.
  const titulo = debe > 0 ? 'Tu saldo pendiente es' : (debe < 0 ? 'Tenés a favor' : 'Estás al día');

  $('panel').innerHTML = `
    <h1>${esc((r.cliente||{}).nombre || '')}</h1>
    <div class="mut">${esc((r.cliente||{}).codigo || '')}${r.base_pct != null ? ' · trabajás al ' + esc(r.base_pct) + '%' : ''}</div>

    <div class="card">
      <label>${titulo}</label>
      <div class="saldo" style="color:${debe > 0 ? 'var(--rojo)' : (debe < 0 ? 'var(--verde)' : 'inherit')}">
        ${money(Math.abs(debe))} ${esc(mon)}</div>
      ${/* ⚠️ Sólo una cuenta llevada en pesos se paga en pesos; las demás se pagan en dólares. El
            monto en la otra moneda es una REFERENCIA de lo que costó cada carga, y hay que decirlo
            o se lee como «pagá esto en pesos». */''}
      ${c.otra_completa && c.total_otra != null && Number(c.total_otra) ? `
        <div style="font-size:21px;font-weight:700;opacity:.75">${money(Math.abs(c.total_otra))} ${esc(c.otra_moneda || '')}</div>
        <div class="chico">de referencia, cada movimiento al cambio de su día · se paga en ${esc(mon)}</div>` : ''}
      <div class="chico" style="margin-top:6px">
        Consumo ${money(c.fichas_pendientes)}
        ${Number(c.proveedores_pendientes) ? ' · Proveedores ' + money(c.proveedores_pendientes) : ''}
        · Pagado ${money(c.pagos)}
      </div>
      ${(r.pendientes||[]).length ? `<div class="avi"><b>⏳ Esperando aprobación</b>
        ${r.pendientes.map((p) => `<div>${fecha(p.fecha)} · ${money(p.monto)} ${esc(p.divisa||'')}</div>`).join('')}
        <div style="margin-top:4px">Todavía no está descontado del saldo de arriba.</div></div>` : ''}
      ${Number(c.esperandoTC||0) ? `<div class="avi">Hay ${c.esperandoTC} pago(s) en pesos que se están contando
        con el cambio promedio del mes. Al cerrar el mes el número se ajusta.</div>` : ''}
      ${Number(c.sinValuar||0) ? `<div class="avi" style="border-color:var(--rojo);color:var(--rojo)">
        ${c.sinValuar} pago(s) todavía sin convertir: no están descontados de este saldo.</div>` : ''}
    </div>

    <div class="card">${ctaListaHTML(r, mon)}</div>

    <button class="link" onclick="salir()">Salir</button>
  `;
}

cargar();
</script>
</body>
</html>
