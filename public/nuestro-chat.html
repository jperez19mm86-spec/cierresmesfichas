<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latam Games · Nuestro chat</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<header>
  <h1><img src="/logo.png" alt="Latam Games" class="hd-logo"
    onerror="this.outerHTML='<span>Latam Games</span>'"> <small id="hd-sub">Nuestro chat — lo que se le cobra a cada cliente y lo que deja</small></h1>
  <div id="hd-nav" style="display:flex; gap:8px; flex:0 0 auto; flex-wrap:nowrap; align-items:center"></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<style>
  .nc-tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px }
  .nc-tile{ background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px 14px }
  .nc-tile .k{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em }
  .nc-tile .v{ font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px }
  .nc-tile .s{ font-size:12.5px; color:var(--muted); margin-top:2px }
  .nc-tile.rojo{ border-color:#e9b9c1; background:var(--rosa-bg) } .nc-tile.rojo .v{ color:var(--rosa) }
  .nc-tile.verde .v{ color:var(--verde2) }
  .señal.verde{ background:#e3f3ea; color:#2c6b4c } .señal.gris{ background:var(--bg3); color:var(--muted) }
  .nc-caja-h{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px }
  .nc-caja-h b{ font-size:14px } .nc-caja-h .muted{ font-size:12.5px }
  .nc-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px 12px; margin-top:8px }
  .nc-form label{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); text-transform:none; margin:0 }
  .nc-form input, .nc-form select{ font-size:14px }
  .nc-tabla{ width:100%; border-collapse:collapse; font-size:13.5px }
  .nc-tabla th{ text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border) }
  .nc-tabla td{ padding:8px; border-bottom:1px solid var(--border); vertical-align:top }
  .nc-tabla td.n, .nc-tabla th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
  .nc-hash{ font-family:var(--mono); font-size:12px; color:var(--muted); overflow-wrap:anywhere }
  .nc-estado{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 14px; border-radius:12px; margin-bottom:12px; background:var(--bg2); border:1px solid var(--border) }
  .nc-estado .t{ font-weight:700 } .nc-estado .acciones{ margin:0 0 0 auto }
  .nc-sel{ display:flex; gap:8px; align-items:center; margin:0 0 12px; flex-wrap:wrap }
  .nc-lineas{ display:flex; flex-direction:column; gap:5px }
  .nc-par{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-bottom:14px }
  .nc-par > div{ background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:12px 14px }
  .nc-par h3{ margin:0 0 6px; font-size:14px } .nc-par .grande{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums }
  .nc-cajas{ margin-top:10px } .nc-cajas .nc-tabla tfoot td{ border-top:1px solid var(--border); border-bottom:0 }
  .nc-notas{ display:flex; flex-direction:column; gap:4px; margin-top:6px; font-size:12.5px }
  .nc-buscar{ max-width:320px }
  .nc-chips{ display:flex; gap:6px; flex-wrap:wrap }
  .nc-chips button{ background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12.5px; font-weight:600 }
  .nc-chips button[aria-pressed="true"]{ background:var(--uva); border-color:var(--uva); color:#fff }
  .nc-resumen{ display:flex; gap:14px; flex-wrap:wrap; align-items:baseline; font-size:13.5px; margin:4px 0 2px }
  .nc-resumen b{ font-variant-numeric:tabular-nums }
  .nc-corte{ background:var(--rosa-bg); border:1px solid #e9b9c1; color:var(--rosa); border-radius:10px; padding:10px 12px; margin-top:10px; font-size:13px }
  @media (max-width:640px){ .nc-tabla .opc{ display:none } main{ padding:12px } }
</style>

<script>
/* ── /nuestro-chat — SU PROPIO ARCHIVO ─────────────────────────────────────────────────────────
   Lo que se le cobra a cada cliente por NUESTRO chat (decidido por Alexa el 22-oct-2026):
   · entrada de USD 200 al darse de alta una caja (ese mes no paga mantenimiento);
   · USD 150 por caja y por mes, POR ADELANTADO (el 1 de noviembre paga noviembre);
   · un % de la ganancia de la caja en Imperia del mes que cerró (2 %; 1 a 4 por caja). Mes con pérdida → 0;
   · vence el día 5; desde el 6 el encargado ve «regularizá tu pago» en los extras del panel del chat
     (nunca se tocan los jugadores, las cargas ni los retiros);
   · todo entra a las wallets del chat y la «Cuenta del chat» muestra ingresos, gastos y la parte de cada uno.
   No es Chat Externo (el chat de otro, con proveedor): otra cuenta, otro archivo. Los números y los textos de
   cada renglón los arma el servidor: esta página solo los muestra. Los ayudantes se copian a propósito (ver /tbs). */

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n,d=2){ const x=Number(n||0); return x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function usdt(n){ return money(n,2) + ' USDT'; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
async function api(path, opts={}){
  let r;
  try { r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts)); }
  catch(e){ const msg='se cortó la conexión con el servidor. Lo que ya se había guardado quedó guardado: volvé a intentar.'; toast('⚠ '+msg); return { ok:false, error:msg }; }
  if(r.status===401){ location.href='/login'; return {ok:false}; }
  let b={}; try{ b=await r.json(); }catch(e){ if(!r.ok){ const msg='el servidor cortó la llamada ('+r.status+').'; toast('⚠ '+msg); return { ok:false, error:msg }; } }
  if(!b.ok && b.error && !opts.silencioso) toast('⚠ '+b.error);
  return b;
}
const post = (path, body) => api(path, { method:'POST', body: JSON.stringify(body||{}) });
function logout(){ fetch('/api/logout',{method:'POST'}).finally(()=>location.href='/login'); }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nomMes = (m) => { const [y,mm] = String(m||'').split('-'); return (MESES[Number(mm)-1]||m) + ' ' + y; };
const fecha = (t) => /^\d{4}-\d{2}-\d{2}$/.test(String(t || '')) ? dia(t) : t ? new Date(t).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const dia = (t) => { if (!t) return ''; const f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t); if (f) return Number(f[3]) + '/' + Number(f[2]);   // una fecha sola (el alta) no tiene hora: no se corre de día
  return new Date(t).toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'numeric',month:'numeric'}); };
const hoyISO = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});

/* Lo plegado sobrevive al repintado. */
const _ab = new Set();
function plegable(id, titulo, resumen, señales, cuerpo){
  return `<details class="plegable"${_ab.has(id)?' open':''} data-pleg="${esc(id)}">
    <summary class="fila"><span class="chev" aria-hidden="true"></span><span class="nom">${titulo}</span>
      ${señales||''}${resumen?`<span class="cifra">${resumen}</span>`:''}</summary>
    <div class="cuerpo">${cuerpo}</div></details>`;
}
document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.pleg) { if (d.open) _ab.add(d.dataset.pleg); else _ab.delete(d.dataset.pleg); } }, true);
const señal = (clase, txt, title) => `<span class="señal ${clase}"${title?` title="${esc(title)}"`:''}>${esc(txt)}</span>`;

/* ── EL DETALLE DE UNA CAJA: los renglones vienen armados del servidor ─────────────────────── */
function datosCaja(c){ return tablaCajas([c]); }
/* Una fila por caja: un cliente con cinco cajas se lee de un vistazo. Cómo se calculó cada % va
   plegado abajo; lo que falta (sin datos, sin cambio) se ve en la fila, no escondido. */
function tablaCajas(cajas){
  const suma = (c, cat) => (c.lineas||[]).filter(l => l.cat === cat).reduce((a, l) => a + Number(l.v || 0), 0);   // el servidor manda la plata como texto exacto
  const falta = (c) => (c.lineas||[]).find(l => l.falta);
  const pctDe = (c) => { const l = (c.lineas||[]).find(x => /%/.test(x.k)); const m = l && /^([\d.,]+) %/.exec(l.k); return m ? m[1] + ' %' : ''; };
  const cols = [['entrada','Conexión'], ['mant','Mantenimiento'], ['variable','% ganancia']].filter(([k]) => cajas.some(c => suma(c, k) || (k === 'variable' && (falta(c) || pctDe(c)))));
  const fila = (c) => `<tr><td><b>${esc(c.caja)}</b>${c.sitio ? `<div class="muted" style="font-size:12px">${esc(c.sitio)}</div>` : ''}</td>
    ${cols.map(([k]) => `<td class="n">${k === 'variable' && falta(c) ? `<span class="tc falta" style="font-size:12px">${esc(falta(c).falta)}</span>` : money(suma(c, k))}${k === 'variable' && pctDe(c) && !falta(c) ? `<div class="muted" style="font-size:11.5px">${esc(pctDe(c))}</div>` : ''}</td>`).join('')}
    <td class="n"><b>${c.total == null ? '—' : money(c.total)}</b></td></tr>`;
  const notas = cajas.flatMap(c => (c.lineas||[]).filter(l => l.nota).map(l => `<div><b>${esc(c.caja)}</b> · ${esc(l.k)}: ${esc(l.nota)}</div>`));
  const avisos = cajas.flatMap(c => (c.avisos||[]).map(a => a.texto)).filter((x, i, A) => A.indexOf(x) === i);
  const tot = cajas.some(c => c.total == null) ? null : cajas.reduce((a, c) => a + Number(c.total), 0);
  return `<div class="nc-cajas"><table class="nc-tabla"><thead><tr><th>${cajas.length === 1 ? 'Caja' : cajas.length + ' cajas'}</th>${cols.map(([, t]) => `<th class="n">${t}</th>`).join('')}<th class="n">USDT</th></tr></thead>
    <tbody>${cajas.map(fila).join('')}</tbody>
    ${cajas.length > 1 ? `<tfoot><tr><td><b>Total</b></td>${cols.map(([k]) => `<td class="n">${money(cajas.reduce((a, c) => a + suma(c, k), 0))}</td>`).join('')}<td class="n"><b>${tot == null ? '—' : money(tot)}</b></td></tr></tfoot>` : ''}</table>
    ${notas.length ? `<details class="cajas"><summary class="abrir"><span class="chev" aria-hidden="true"></span>Cómo se calculó el %</summary><div class="muted nc-notas">${notas.join('')}</div></details>` : ''}
    ${avisos.map(t => `<div class="nota-suave">${esc(t)}</div>`).join('')}</div>`;
}

/* Buscar y filtrar: con cincuenta clientes, encontrar al que debe no puede ser bajar mirando. */
const _bus = { cobros:'', curso:'', clientes:'' }; let _filtro = 'todos', _ver = 20;
const coincide = (cl, q) => !q || (cl.nombre + ' ' + (cl.codigo||'') + ' ' + (cl.cajas || (cl.docs||[]).flatMap(d => d.cajas)).map(c => c.caja + ' ' + (c.sitio||'')).join(' ')).toLowerCase().includes(q.toLowerCase());
const buscador = (vista, ph) => `<input type="search" class="nc-buscar" data-buscar="${vista}" value="${esc(_bus[vista])}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">`;
const verMas = (total) => total > _ver ? `<div class="acciones" style="justify-content:center"><button class="outline small" data-ver-mas>Ver ${Math.min(20, total - _ver)} más (${total - _ver} sin mostrar)</button></div>` : '';

const VIEWS = {};
const TABS = [['curso','📈 Este mes'], ['cobros','🧾 Cobros'], ['pagos','💸 Pagos'], ['cuenta','📒 Cuenta del chat'], '|', ['clientes','👥 Clientes y cajas'], ['config','⚙ Config']];
let _tab = 'curso';

/* ── 📈 ESTE MES: lo que sale el día 1 si el mes terminara hoy ───────────────────────────── */
VIEWS.curso = async () => {
  const m = document.getElementById('main'); m.innerHTML = '<div class="card muted">Calculando…</div>';
  const r = await api('/api/os/nuestro-chat/tablero'); if (!r.ok) { m.innerHTML = '<div class="card">No se pudo leer.</div>'; return; }
  const T = r.totales, E = r.entradas || {};
  m.innerHTML = `
    <div class="totalote"><div class="k">El cobro del ${esc(dia(r.proximo))} · si ${esc(MESES[Number(r.mes.slice(5))-1])} terminara hoy</div><div class="v">${usdt(T.total)}</div>
      <dl><div><dt>Mantenimiento de ${esc(MESES[Number(r.proximo.slice(5,7))-1])}, por adelantado (${T.cajas} cajas)</dt><dd>${usdt(T.mant)}</dd></div>
        <div><dt>% de la ganancia de ${esc(MESES[Number(r.mes.slice(5))-1])}</dt><dd>${usdt(T.variable)}</dd></div>
        ${Number(T.con) ? `<div><dt>Conexiones que van con este cobro (empezaron a fin de mes)</dt><dd>${usdt(T.con)}</dd></div>` : ''}</dl>
      <div class="cuantos">${T.clientes} clientes${T.sinCalcular ? ` (${T.sinCalcular} todavía no se ${T.sinCalcular === 1 ? 'puede' : 'pueden'} calcular: no suman)` : ''} · la ganancia de Imperia llega hasta ayer (${dia(r.datosHasta)}).
        ${E.n ? ` Este mes además se cobraron ${E.n} ${E.n===1?'conexión':'conexiones'} aparte: ${usdt(E.total)}.` : ''}</div></div>
    <div class="nc-sel">${buscador('curso', 'Buscar cliente o caja')}</div>
    ${(() => { const L = r.clientes.filter(cl => coincide(cl, _bus.curso)); return L.slice(0, _ver).map((cl) => plegable('cu.'+cl.id, esc(cl.nombre) + ` <small class="muted" style="font-weight:400">${cl.cajas.length} ${cl.cajas.length===1?'caja':'cajas'}</small>`,
        cl.total == null ? '<b>—</b>' : `<b>${money(cl.total)}</b><span class="u">USDT</span>`,
        (cl.avisos||[]).map(a => señal(a.tipo==='sin-datos'?'rosa':'durazno', a.corto, a.texto)).join(''),
        tablaCajas(cl.cajas))).join('') + verMas(L.length) || '<div class="card muted">Ningún cliente coincide.</div>'; })()}`;
};

/* ── 🧾 COBROS: lo que salió en el mes (el del día 1 y las entradas), quién pagó y a quién le sale el cartel ── */
let _mesCobro = null;
VIEWS.cobros = async () => {
  const m = document.getElementById('main'); m.innerHTML = '<div class="card muted">Cargando…</div>';
  const r = await api('/api/os/nuestro-chat/cobros' + (_mesCobro ? '?mes=' + _mesCobro : '')); if (!r.ok) { m.innerHTML = '<div class="card">No se pudo leer.</div>'; return; }
  _mesCobro = r.mes; const E = r.estado || {}, T = r.totales || {};
  const estado = E.enviado ? `<span class="t">✅ El cobro del día 1 se mandó el ${fecha(E.enviado)}</span><span class="muted">Vence el día ${r.venceDia}. Recordatorios solos los días ${(r.recordatorios||[]).join(' y ')}; desde el ${r.venceDia+1}, al que no pagó le aparece el cartel en el panel.</span>`
    : E.frenado ? `<span class="t">⏸ No sale solo</span><span class="muted">Lo frenaste: sale cuando toques «Mandar todos».</span>
        <div class="acciones"><button data-acc="mandar">Mandar todos</button><button class="outline small" data-acc="soltar">Que salga solo</button></div>`
    : E.armado ? `<span class="t">🕙 Armado el ${fecha(E.armado)} · sale solo el ${fecha(E.saleSolo)}</span><span class="muted">Revisalo; si está bien, mandalo ya.</span>
        <div class="acciones"><button data-acc="mandar">Mandar todos</button><button class="outline small" data-acc="frenar">No mandar solo</button></div>`
    : `<span class="t">Todavía no se armó</span><span class="muted">Se arma solo el día 1.</span><div class="acciones"><button class="outline small" data-armar>Armarlo ahora</button></div>`;
  const lab = { pagado:['verde','✓ Pagó'], pendiente:['gris','Esperando el pago'], vencido:['rosa','Vencido'], 'no-sale':['rosa','No sale'], 'sin-enviar':['gris','Sin mandar'] };
  const doc = (d) => `<div class="subcaja" style="margin-bottom:8px"><div class="nc-caja-h"><b>${esc(d.titulo)}</b><span class="muted">vence ${dia(d.vence)}</span>${d.deAntes ? señal('durazno','de un mes anterior') : ''}
      ${d.estado === 'pagado' ? señal('verde','✓ pagado') : d.estado === 'vencido' ? señal('rosa','vencido') : señal('gris','esperando')}</div>
    <div class="nc-resumen"><span>A pagar <b>${usdt(d.exacto)}</b></span>${Number(d.pagado) ? `<span style="color:var(--verde2)">Pagó <b>${usdt(d.pagado)}</b></span>` : ''}${Number(d.debe) > 0.01 && Number(d.pagado) ? `<span style="color:var(--rosa)">Le falta <b>${usdt(d.debe)}</b></span>` : ''}</div>
    ${(d.pagos||[]).map(p => `<div class="muted" style="font-size:12px">${fecha(p.t)} · ${esc(p.red)} · ${esc(p.como)} · <span class="nc-hash">${esc(p.hash.slice(0,10))}…</span></div>`).join('')}
    ${tablaCajas(d.cajas)}
    ${d.estado !== 'pagado' ? `<details class="cajas"><summary class="abrir"><span class="chev" aria-hidden="true"></span>Registrar un pago a mano</summary>
      <div class="nc-form" data-pago-de="${esc(d.id)}"><label>USDT<input data-p="monto" inputmode="decimal" value="${esc(d.debe)}"></label>
        <label>Red<select data-p="red"><option>TRC20</option><option>BEP20</option></select></label>
        <label>Código de la transferencia (opcional)<input data-p="hash" placeholder="0x… o el de Tron"></label>
        <label>Día<input type="date" data-p="fecha" value="${hoyISO()}"></label></div>
      <div class="acciones"><button class="small" data-registrar="${esc(d.id)}">Registrar pago</button></div></details>` : ''}</div>`;
  const F = { todos:['Todos', () => true], deben:['Deben', c => c.estado === 'pendiente' || c.estado === 'vencido'], vencidos:['Vencidos', c => c.estado === 'vencido'], cartel:['Con cartel', c => c.cartel && c.cartel.activo], pagaron:['Pagaron', c => c.estado === 'pagado'] };
  const lista = r.clientes.filter(F[_filtro][1]).filter(cl => coincide(cl, _bus.cobros));
  m.innerHTML = `
    <div class="nc-sel"><label style="text-transform:none;margin:0">Mes <select data-mes>${(r.meses||[r.mes]).map(x => `<option value="${x}"${x===r.mes?' selected':''}>${esc(nomMes(x))}</option>`).join('')}</select></label></div>
    <div class="nc-estado">${estado}</div>
    <div class="nc-tiles">
      <div class="nc-tile"><div class="k">Se cobra</div><div class="v">${money(T.total)}</div><div class="s">USDT · ${T.clientes} clientes</div></div>
      <div class="nc-tile verde"><div class="k">Ya pagaron</div><div class="v">${money(T.cobrado)}</div><div class="s">${T.nPagaron} de ${T.clientes}</div></div>
      <div class="nc-tile"><div class="k">Falta</div><div class="v">${money(T.pendiente)}</div><div class="s">USDT</div></div>
      ${T.vencido ? `<div class="nc-tile rojo"><div class="k">Vencido</div><div class="v">${money(T.vencido)}</div><div class="s">${T.nVencidos} ${T.nVencidos===1?'cliente':'clientes'} · ${T.nCartel} con el cartel</div></div>` : ''}
    </div>
    ${(r.problemas||[]).length ? `<div class="nota-suave rosa" style="margin:0 0 12px"><b>${r.problemas.length === 1 ? 'Un cliente no sale' : r.problemas.length + ' clientes no salen'} hasta que lo arregles:</b>
      ${r.problemas.map(p => `<div style="margin-top:6px">${esc(p.cliente)} (${esc(p.texto)})${/sin datos/.test(p.texto) ? ` <button class="outline small" data-sin-mov="${esc(p.clienteId)}" title="Si de verdad no tuvo movimiento ese mes: sale con el % en cero">Armar sin movimiento</button>` : ''}</div>`).join('')}</div>` : ''}
    <div class="nc-sel"><div class="nc-chips">${Object.entries(F).map(([k, [t, f]]) => `<button data-filtro="${k}" aria-pressed="${k===_filtro}">${t} · ${r.clientes.filter(f).length}</button>`).join('')}</div>${buscador('cobros', 'Buscar cliente o caja')}</div>
    ${lista.length ? '' : '<div class="card muted">Ningún cliente en esta lista.</div>'}
    ${lista.slice(0, _ver).map((cl) => {
      const [c, t] = lab[cl.estado] || ['gris', cl.estado];
      const extra = cl.estado === 'vencido' ? ` hace ${cl.diasVencido} ${cl.diasVencido===1?'día':'días'}` : '';
      const K = cl.cartel || {};
      const cartel = K.activo ? `<div class="nc-corte">🔒 <b>Le aparece el cartel de pago en el panel del chat desde el ${dia(K.desde)}.</b> Publicidad, Bonos, Métricas y Referidos le muestran «${esc(r.cartelTexto.replace(/\.$/, ''))}». Los chats, las cargas y los retiros andan normal. Se va solo cuando entra el pago.
            <div class="acciones" style="margin-top:8px"><label style="text-transform:none;margin:0;font-size:12.5px;color:var(--muted)">Darle hasta el <input type="date" data-prorroga-f="${esc(cl.id)}" min="${hoyISO()}"></label><button class="outline small" data-prorroga="${esc(cl.id)}">Darle más días</button></div></div>`

       <table class="nc-tabla"><thead><tr><th>Caja</th><th>Estado</th><th class="n opc">Conexión</th><th class="n">Por mes</th><th class="n">% ganancia</th><th></th></tr></thead>

       <div class="acciones"><button class="outline small" data-nueva="${esc(cl.id)}">+ Agregar caja</button><button class="outline small" data-guardar-tg="${esc(cl.id)}">Guardar el grupo y los pesos</button><a href="${esc(cl.ver||cl.link)}" target="_blank" rel="noopener"><button class="outline small">Ver lo que ve el cliente ↗</button></a></div>`)).join('')}
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Sumar un cliente</h2></div>
      <div class="nc-form"><label>Cliente del OS<select id="nc-nuevo">${opc('', [['','Elegí…']].concat((r.disponibles||[]).map(x => [x.id, esc(x.nombre)])))}</select></label></div>
      <div class="acciones"><button data-sumar>Sumar</button></div></div>`;
};

/* ── ⚙ CONFIG ─────────────────────────────────────────────────────────────────────────────── */
VIEWS.config = async () => {
  const m = document.getElementById('main'); m.innerHTML = '<div class="card muted">Cargando…</div>';
  const r = await api('/api/os/nuestro-chat/config'); if (!r.ok) { m.innerHTML = '<div class="card">No se pudo leer.</div>'; return; }
  const c = r.config;
  m.innerHTML = `
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Las wallets del chat</h2></div>
      <div class="muted" style="font-size:13px;margin-top:4px">Solo la dirección pública: el sistema las lee para ver qué entró, nunca tiene sus claves. Son solo para el chat: si entra otra plata, no cuadra.</div>
      <div class="nc-form"><label>TRC20 (Tron)<input id="cf-trc" value="${esc(c.trc20||'')}" placeholder="T…"></label><label>BEP20 (BNB Chain)<input id="cf-bep" value="${esc(c.bep20||'')}" placeholder="0x…"></label></div></div>
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Pagos en pesos ${c.pesosOn ? señal('verde','prendido') : señal('gris','apagado')}</h2></div>
      <div class="muted" style="font-size:13px;margin-top:4px">Por ahora el chat se cobra solo en USDT. Esto queda listo para cuando lo quieras usar: a los clientes que tengan «puede pagar en pesos», el link les muestra cuántos pesos son al dólar de ese momento (Binance) más la comisión, que vale ese día; después lo aprobás vos con la captura.</div>
      <div class="nc-form"><label>Pagos en pesos<select id="cf-pesos-on"><option value="0"${c.pesosOn?'':' selected'}>Apagado: solo USDT</option><option value="1"${c.pesosOn?' selected':''}>Prendido</option></select></label>
        <label>Comisión por pagar en pesos (%)<input id="cf-pesos-com" type="number" min="0" max="20" step="0.5" value="${esc(c.pesosComision)}"></label>
        <label>Alias o CVU<input id="cf-alias" value="${esc(c.alias||'')}" placeholder="lgchat.pagos"></label><label>Titular<input id="cf-titular" value="${esc(c.titular||'')}"></label></div></div>
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Para cajas nuevas</h2></div>
      <div class="nc-form"><label>Conexión (USD, una vez)<input id="cf-entrada" type="number" value="${esc(c.entrada)}"></label>
        <label>Si empieza en los últimos … días del mes, la conexión va con el cobro del 1<input id="cf-juntar" type="number" min="0" max="15" value="${esc(c.juntarDias)}"></label><label>Mantenimiento (USD por mes)<input id="cf-mant" type="number" value="${esc(c.mant)}"></label>
        <label>% de la ganancia<input id="cf-pct" type="number" step="0.5" min="1" max="4" value="${esc(c.pct)}"></label></div></div>
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Cuándo y si no paga</h2></div>
      <div class="nc-form"><label>Se arma el día<input type="number" value="1" disabled></label><label>Sale solo (horas después)<input id="cf-espera" type="number" min="0" value="${esc(c.esperaHoras)}"></label>
        <label>Vence el día<input id="cf-vence" type="number" min="1" max="28" value="${esc(c.venceDia)}"></label><label>Recordatorios (días del mes)<input id="cf-rec" value="${esc((c.recordatorios||[]).join(', '))}"></label>
        <label style="grid-column:1/-1">Lo que dice el cartel en el panel<input id="cf-cartel" maxlength="140" value="${esc(c.cartelTexto)}"></label></div>
      <div class="muted" style="font-size:12.5px;margin-top:6px">El cartel aparece al día siguiente del vencimiento y solo en Publicidad, Bonos, Métricas y Referidos, con un aviso que salta cada 30 minutos. Los chats, las cargas y los retiros no se tocan nunca.</div></div>
    <div class="card"><div class="tapa"><h2 style="font-size:15px">El cambio</h2></div>
      <div class="muted" style="font-size:13px;margin-top:4px">La ganancia de una caja en pesos, guaraníes u otra moneda se pasa a dólares con el <b>promedio del mes</b> de esa moneda (el mismo de Tipos de cambio, que sale de Binance). Si falta, ese cobro no sale hasta que lo cargues.</div></div>
    <div class="card"><div class="tapa"><h2 style="font-size:15px">Reparto</h2></div>
      <div class="nc-form"><label>Nombre de tu programador<input id="cf-prog" value="${esc(c.programador)}"></label><label>Su parte (%)<input id="cf-reparto" type="number" min="0" max="100" value="${esc(c.repartoProg)}"></label>
        <label>Se reparte<select id="cf-rbase"><option value="neto"${c.repartoBase==='neto'?' selected':''}>lo que queda después de los gastos</option><option value="bruto"${c.repartoBase==='bruto'?' selected':''}>todo lo que entró (cada uno se queda con los gastos que pagó)</option></select></label></div></div>
    <div class="acciones"><button data-guardar-cfg>Guardar</button></div>`;
};

/* ── LAS ACCIONES (todo por data-*: ningún dato adentro de un onclick) ─────────────────────── */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button,[data-sel]'); if (!b) return;
  if (b.dataset.sel !== undefined) { b.select(); return; }
  if (b.dataset.copiar) { try { await navigator.clipboard.writeText(b.dataset.copiar); toast('Link copiado'); } catch (_) { toast(b.dataset.copiar); } return; }
  const acc = b.dataset.acc;
  if (acc) { const r = await post('/api/os/nuestro-chat/cobros/' + acc, { mes:_mesCobro }); if (r.ok) { toast(acc === 'mandar' ? 'Mandado a ' + (r.mandados||0) + ' clientes' : acc === 'frenar' ? 'No sale solo: lo mandás vos' : 'Sale solo'); VIEWS.cobros(); } return; }
  if (b.dataset.recordar) { const r = await post('/api/os/nuestro-chat/cobros/recordar', { mes:_mesCobro, cliente:b.dataset.recordar }); if (r.ok) toast('Recordatorio mandado'); return; }
  if (b.dataset.prorroga) { const f = document.querySelector('[data-prorroga-f="' + CSS.escape(b.dataset.prorroga) + '"]').value; if (!f) { toast('Elegí hasta qué día'); return; }
    const r = await post('/api/os/nuestro-chat/cobros/prorroga', { cliente:b.dataset.prorroga, hasta:f }); if (r.ok) { toast('Sin cartel hasta el ' + dia(f)); VIEWS.cobros(); } return; }
  if (b.dataset.prorrogaQuitar) { const r = await post('/api/os/nuestro-chat/cobros/prorroga', { cliente:b.dataset.prorrogaQuitar, hasta:null }); if (r.ok) { toast('Prórroga sacada'); VIEWS.cobros(); } return; }
  if (b.dataset.pesosOk || b.dataset.pesosNo) { const id = b.dataset.pesosOk || b.dataset.pesosNo, si = !!b.dataset.pesosOk;
    const r = await post('/api/os/nuestro-chat/pesos/' + encodeURIComponent(id) + '/' + (si ? 'aprobar' : 'rechazar'), {}); if (r.ok) { toast(si ? 'Aprobado: se le avisa al cliente' : 'Rechazado: se le avisa al cliente'); VIEWS.pagos(); } return; }
  if (b.dataset.asignar) {   // en el mismo renglón: la lista de los que deben, y Asignar
    const r0 = await api('/api/os/nuestro-chat/cobros/abiertos'); const td = b.closest('td');
    td.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap"><select data-asig-sel>${(r0.abiertos||[]).map(x => `<option value="${esc(x.doc)}">${esc(x.nombre)} · ${esc(x.titulo)} · debe ${money(x.debe)}</option>`).join('')}</select>
      <button class="small" data-asig-ok="${esc(b.dataset.asignar)}">Asignar</button></div>`;
    return; }
  if (b.dataset.asigOk) { const doc = b.closest('td').querySelector('[data-asig-sel]').value;
    const r = await post('/api/os/nuestro-chat/pagos/' + encodeURIComponent(b.dataset.asigOk) + '/asignar', { doc }); if (r.ok) { toast('Asignada'); VIEWS.pagos(); } return; }
  if (b.dataset.gasto !== undefined) {
    const v = (id) => document.getElementById(id).value.trim();
    const monto = Number(v('g-monto').replace(',', '.'));
    if (!v('g-concepto')) { toast('Escribí qué es el gasto'); return; }
    if (!(monto > 0)) { toast('Poné cuánto fue, en dólares'); return; }
    const r = await post('/api/os/nuestro-chat/cuenta/gasto', { fecha:v('g-fecha'), concepto:v('g-concepto'), cat:v('g-cat'), cliente:v('g-cli') || null, pago:v('g-pago'), monto, cada: document.getElementById('g-cada').checked });
    if (r.ok) { toast('Gasto anotado'); VIEWS.cuenta(); } return; }
  if (b.dataset.borrarGasto) { if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Borrar?'; setTimeout(() => { b.dataset.seguro = ''; b.textContent = '✕'; }, 3000); return; }
    const r = await post('/api/os/nuestro-chat/cuenta/gasto/' + encodeURIComponent(b.dataset.borrarGasto) + '/borrar', {}); if (r.ok) { toast('Gasto borrado (queda anotado quién lo borró)'); VIEWS.cuenta(); } return; }
  if (b.dataset.pagoProg !== undefined) {
    const monto = Number(document.getElementById('p-monto').value.replace(',', '.')); if (!(monto > 0)) { toast('Poné cuánto le pagaste'); return; }
    const r = await post('/api/os/nuestro-chat/cuenta/pago-prog', { fecha: document.getElementById('p-fecha').value, monto, nota: document.getElementById('p-nota').value.trim() });
    if (r.ok) { toast('Pago anotado'); VIEWS.cuenta(); } return; }
  if (b.dataset.guardar !== undefined) {
    const box = b.closest('[data-caja]'); const d = { id: box.dataset.caja || undefined, cliente: box.dataset.cliente };
    box.querySelectorAll('[data-k]').forEach(i => { d[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; });
    if (!(Number(d.pct) >= 1 && Number(d.pct) <= 4)) { toast('El % va entre 1 y 4'); return; }
    if (!/^\d{3,15}$/.test(String(d.sala||''))) { toast('Poné el número de la caja en Imperia (solo números)'); return; }
    if (!d.conexion) { toast('Elegí si es Europa o Casino'); return; }
    const r = await post('/api/os/nuestro-chat/cajas', d); if (r.ok) { toast(d.id ? 'Guardado' : 'Caja agregada: poné su fecha de inicio cuando empiece'); _nueva = null; VIEWS.clientes(); } return; }
  if (b.dataset.cancelarNueva !== undefined) { _nueva = null; VIEWS.clientes(); return; }
  if (b.dataset.baja !== undefined) { const box = b.closest('[data-caja]');
    if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? Tocá de nuevo'; setTimeout(() => { b.dataset.seguro = ''; b.textContent = 'Dar de baja'; }, 3000); return; }
    const r = await post('/api/os/nuestro-chat/cajas/' + encodeURIComponent(box.dataset.caja) + '/baja', {}); if (r.ok) { toast('Dada de baja: el mes ya pagado no se devuelve'); VIEWS.clientes(); } return; }
  if (b.dataset.editar) { const tr = document.querySelector('[data-form-de="' + CSS.escape(b.dataset.editar) + '"]'); tr.hidden = !tr.hidden;
    if (tr.hidden) _ab.delete('ed.' + b.dataset.editar); else _ab.add('ed.' + b.dataset.editar); return; }
  if (b.dataset.armar !== undefined) { const r = await post('/api/os/nuestro-chat/cobros/armar', { mes:_mesCobro }); if (r.ok) { toast(`Armados ${r.creados}${r.problemas.length ? ' · ' + r.problemas.length + ' no salen' : ''}`); VIEWS.cobros(); } return; }
  if (b.dataset.sinMov) { if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro? El % sale en cero'; setTimeout(() => { b.dataset.seguro = ''; b.textContent = 'Armar sin movimiento'; }, 3000); return; }
    const r = await post('/api/os/nuestro-chat/cobros/armar', { mes:_mesCobro, cliente:b.dataset.sinMov, sinDatosEsCero:true }); if (r.ok) { toast('Armado con el % en cero'); VIEWS.cobros(); } return; }
  if (b.dataset.registrar) { const f = document.querySelector('[data-pago-de="' + CSS.escape(b.dataset.registrar) + '"]'), v = (k) => f.querySelector('[data-p="' + k + '"]').value.trim();
    const r = await post('/api/os/nuestro-chat/pagos', { doc:b.dataset.registrar, monto:v('monto').replace(',', '.'), red:v('red'), hash:v('hash'), fecha:v('fecha') }); if (r.ok) { toast('Pago registrado'); VIEWS.cobros(); } return; }
  if (b.dataset.avisoOk || b.dataset.avisoNo) { const id = b.dataset.avisoOk || b.dataset.avisoNo, si = !!b.dataset.avisoOk;
    const r = await post('/api/os/nuestro-chat/avisos/' + encodeURIComponent(id) + '/' + (si ? 'aprobar' : 'rechazar'), {}); if (r.ok) { toast(si ? 'Aprobado: quedó pagado' : 'Rechazado'); VIEWS.pagos(); } return; }
  if (b.dataset.filtro) { _filtro = b.dataset.filtro; _ver = 20; VIEWS.cobros(); return; }
  if (b.dataset.verMas !== undefined) { _ver += 20; VIEWS[_tab](); return; }
  if (b.dataset.empezo !== undefined) { const box = b.closest('[data-caja]'), f = box.querySelector('[data-inicio-f]').value; if (!f) { toast('Elegí el día que empieza'); return; }
    const r = await post('/api/os/nuestro-chat/cajas/' + encodeURIComponent(box.dataset.caja) + '/empezo', { cliente: box.dataset.cliente, fecha: f });
    if (r.ok) { toast(r.texto || 'Inicio guardado'); VIEWS.clientes(); } return; }
  if (b.dataset.nueva) { _nueva = b.dataset.nueva; _ab.add('cl.' + b.dataset.nueva); VIEWS.clientes(); return; }
  if (b.dataset.guardarTg) { const i = document.querySelector('[data-tg="' + CSS.escape(b.dataset.guardarTg) + '"]'); const pz = document.querySelector('[data-pesos="' + CSS.escape(b.dataset.guardarTg) + '"]'); const r = await post('/api/os/nuestro-chat/clientes/' + encodeURIComponent(b.dataset.guardarTg), { tg: i.value.trim(), pesos: pz.value === '1' }); if (r.ok) { toast('Grupo guardado'); VIEWS.clientes(); } return; }
  if (b.dataset.sumar !== undefined) { const v = document.getElementById('nc-nuevo').value; if (!v) { toast('Elegí el cliente'); return; } const r = await post('/api/os/nuestro-chat/clientes', { cliente: v }); if (r.ok) { _ab.add('cl.' + v); VIEWS.clientes(); } return; }
  if (b.dataset.guardarCfg !== undefined) {
    const v = (id) => document.getElementById(id).value.trim();
    if (!(Number(v('cf-pct')) >= 1 && Number(v('cf-pct')) <= 4)) { toast('El % va entre 1 y 4'); return; }
    const r = await post('/api/os/nuestro-chat/config', { trc20: v('cf-trc'), bep20: v('cf-bep'), entrada: v('cf-entrada'), juntarDias: v('cf-juntar'), mant: v('cf-mant'), pct: v('cf-pct'), esperaHoras: v('cf-espera'), venceDia: v('cf-vence'), recordatorios: v('cf-rec'), cartelTexto: v('cf-cartel'), alias: v('cf-alias'), titular: v('cf-titular'), pesosOn: v('cf-pesos-on') === '1', pesosComision: v('cf-pesos-com'), programador: v('cf-prog'), repartoProg: v('cf-reparto'), repartoBase: v('cf-rbase') });
    if (r.ok) toast('Guardado'); return; }
});
/* El buscador filtra al escribir, sin perder el foco ni el cursor. */
let _tBus = null;
document.addEventListener('input', (e) => { const v = e.target.dataset && e.target.dataset.buscar; if (!v) return; _bus[v] = e.target.value; _ver = 20;
  clearTimeout(_tBus); _tBus = setTimeout(async () => { const pos = e.target.selectionStart; await VIEWS[v](); const i = document.querySelector('[data-buscar="' + v + '"]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (_) {} } }, 250); });
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.mes !== undefined) { _mesCobro = e.target.value; VIEWS.cobros(); }
  if (e.target.dataset && e.target.dataset.mesCuenta !== undefined) { _mesCuenta = e.target.value; VIEWS.cuenta(); }
});

function renderNav(){
  const otros = [['/','🎰 Fichas'], ['/os','📊 Panel'], ['/tbs','🔌 TBS'], ['/chat-externo','💬 Chat externo']];
  document.getElementById('hd-nav').innerHTML = otros.map(([h,l])=>`<a href="${h}" style="text-decoration:none"><button class="outline small" style="white-space:nowrap">${l}</button></a>`).join('')
    + '<button class="outline small" onclick="logout()" style="white-space:nowrap">🚪 Salir</button>';
  document.getElementById('nav').innerHTML = TABS.map(t => t==='|' ? '<span class="navsep"></span>'
    : `<button class="navbtn ${t[0]===_tab?'active':''}" data-ir="${t[0]}">${t[1]}</button>`).join('');
}
document.getElementById('nav').addEventListener('click', (e) => { const b = e.target.closest('[data-ir]'); if (b) go(b.dataset.ir); });
function go(t){ _tab = t; _ver = 20; renderNav(); VIEWS[t](); }
renderNav(); go(location.hash && VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'curso');
</script>
