  abrirHoja(`<h3 id="hojaTit">${que}</h3>
    <div class="sub">Esto vive en el sistema de cuentas, no en el panel.</div>
    <div class="nota neutra">Esto se maneja desde el sistema de cuentas, no desde acá. Están
    separados a propósito: un cambio o una caída de un lado no toca al otro.</div>
    <div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Entendido</button></div>`);
}

/* ══════ pintado por sección ══════ */
function pintar(){
  if (SEC === 'users')     return pintarUsuarios();
  if (SEC === 'dashboard') return pintarTablero();
  if (SEC === 'balance')   return pintarMovs();
  if (SEC === 'reports')   return pintarEstadisticas();
  if (SEC === 'sub')       return pintarSub();
  if (SEC === 'intersections') return pintarCruces();
  /* Seguridad = cruces de IP. El historial de cambios se retiró (28-ago): mucho ruido
     técnico para lo poco que aportaba, y con una sola opción el menú de en medio sobra.
     `changes` se manda acá también, por si quedó guardado en algún estado viejo. */
  if (SEC === 'seguridad' || SEC === 'changes') return pintarCruces();
  $('cuerpo').innerHTML = `<div class="vacio">La sección <b>${NOMBRE_SEC[SEC]}</b> todavía no está
    mapeada del motor.<br><br>Cuando se mapee, aparece acá sola: el menú se arma con lo que
    devuelve <span class="mono">area=buttons</span>.</div>`;
}

function pintarUsuarios(){
  const h = hijos();
  const conFichas = h.filter(x => x.balance > 0).length;
  const salas = viendoSalas();
  const b = bolsillo();
  const migas = DENTRO ? `
    <button class="icobtn" style="margin-bottom:12px" onclick="volverARaiz()">‹ Mis cajeros</button>` : '';
  $('cuerpo').innerHTML = `
    ${migas}
    ${yo().hide_hall_balance ? '' : `
    <div class="saldo">
      ${DENTRO ? `<div class="dequien">
        <b class="mono">${b.login}</b>
        <span>ID ${b.id} · ${h.length} ${h.length === 1 ? 'jugador' : 'jugadores'}</span>
      </div>` : ''}
      <div class="saldo-cab">
        <svg class="saldo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19M6.5 15h3.5"/></svg>
        <div>
          <div class="monto num"><small>${yo().currency}</small>${fmt(b.balance)}</div>
          <div class="saldo-que">${DENTRO ? 'Su saldo' : 'Tu saldo'}</div>
        </div>
      </div>
      ${DENTRO ? totalesDeCaja(DENTRO) : ''}
    </div>`}
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="filtro" placeholder="${salas?'Buscar cajero o jugador…':'Buscar jugador…'}" oninput="LISTA_VISIBLES=PASO_LISTA; pintarFilas()">
    </div>
    <div class="tit"><h2>${salas ? 'Mis cajeros' : DENTRO ? 'Jugadores del cajero' : 'Mis jugadores'}</h2><em id="cuenta"></em></div>
    <div class="lista" id="lista"></div>
    ${!salas ? enlaceBorrados(DENTRO || (yo().caja || yo().id)) : ''}`;
  pintarFilas();
}
/* Los mismos cuatro números de la hoja del cajero, también cuando se entra a sus jugadores:
   es la misma información y no tiene por qué verse distinta según de dónde vengas. */
function totalesDeCaja(id){
  const t = (TOTALES_CAJA[id] || {})[CAJA_PER];
  if (!t) return '';
  return `
    ${tiraPeriodos(CAJA_PER, 'perCajaLista', { conCustom: false })}
    ${resumen([['Depósitos', fmt(t.in)], ['Retiros', fmt(t.out)],
                ['Ganancia', fmt(t.profit), 'ok'], ['% de retorno', t.rtp, 'g']], { estilo:'grilla' })}`;
}
function perCajaLista(p){ CAJA_PER = p; pintarUsuarios(); }

/* Un enlace chico, no una sección: se mira de vez en cuando. Pero si hay fichas
   congeladas ahí adentro, lo dice — es plata que no está viendo nadie. */
function enlaceBorrados(cajaId){
  const bs = BORRADOS.filter(b => b.sala === cajaId);
  if (!bs.length) return '';
  const conFichas = bs.filter(b => b.balance > 0);
  const total = conFichas.reduce((a, b) => a + b.balance, 0);
  return `<button class="verborrados ${conFichas.length ? 'hayfichas' : ''}" onclick="verBorrados('${cajaId}')">
    ${bs.length} ${bs.length === 1 ? 'eliminado' : 'eliminados'}${
      conFichas.length ? ` · <b>saldo ${yo().currency} ${fmt(total)}</b>` : ''} ›
  </button>`;
}
function verBorrados(cajaId){
  const bs = BORRADOS.filter(b => b.sala === cajaId);
  abrirHoja(`
    <h3 id="hojaTit">Jugadores eliminados</h3>
    <div class="sub">Siguen existiendo con sus fichas, pero nadie los ve.</div>
    <div class="lista">
      ${bs.map(b => `<div class="fila-b" style="align-items:flex-start; cursor:default">
        <span class="id"><b class="mono">${b.login}</b>
          ${/* El motor no siempre da la fecha de baja. Cuando no la da, la línea salía como
                «eliminado el /» — un renglón que no dice nada y encima se ve roto. Sin fecha,
                no va la línea. */''
          }${b.borrado ? `<span>eliminado el ${b.borrado.slice(8)}/${b.borrado.slice(5, 7)}</span>` : ''}
          ${b.balance > 0 ? `<span class="permisos"><span class="permiso alerta">Saldo ${yo().currency} ${fmt(b.balance)}</span></span>` : ''}
        </span>
        <button class="icobtn" onclick="restaurar('${b.id}')">Restaurar</button>
      </div>`).join('')}
    </div>
    <div class="nota neutra">Al restaurarlo vuelve con sus fichas intactas. El login nunca se
    liberó, así que sigue siendo suyo.</div>
    <div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cerrar</button></div>`);
}
function restaurar(id){
  const i = BORRADOS.findIndex(b => b.id === id);
  if (i < 0) return;
  const b = BORRADOS.splice(i, 1)[0];
  TERMINALES.unshift({ ...b, online:false, jugando:false, ultimo:'nunca' });
  cerrarHoja(); pintarUsuarios();
}

/* 🔴🔴 LA LISTA NO ES «LOS JUGADORES»: es los que pasan filtros que nadie ve.
   Medido el 26-ago: una caja con 1.851 jugadores devuelve 39 por defecto, porque `area=users`
   arranca con el rango en HOY y con `inactive_users='active'`. El cliente busca a alguien que no
   jugó hoy, no lo encuentra, y concluye que le borraron la cuenta.
   Acá se pide SIEMPRE la lista completa, y si se esconde algo se dice con todas las letras.
   La búsqueda va al motor (`search=`), no filtra lo ya bajado: con 1.851 cuentas, filtrar en el
   navegador obliga a descargarlas todas primero. ⚠️ Al buscar, `pageCount` NO se actualiza. */
let VER_DORMIDOS = true, LISTA_VISIBLES = 50;
const PASO_LISTA = 50;

function verDormidos(v){ VER_DORMIDOS = v; LISTA_VISIBLES = PASO_LISTA; pintarFilas(); }
function masLista(){ LISTA_VISIBLES += PASO_LISTA; pintarFilas(); }

function pintarFilas(){
  const q = ($('filtro').value || '').trim().toLowerCase();
  const todos = hijos();
  const dormidos = todos.filter(x => x.inactivo).length;
  const conFiltro = VER_DORMIDOS ? todos : todos.filter(x => !x.inactivo);
  /* `search` del motor: por login o por id, sin distinguir mayúsculas. */
  const hallados = conFiltro.filter(x => !q || x.login.toLowerCase().includes(q)
    || (x.name || '').toLowerCase().includes(q) || x.id.includes(q));
  const vis = hallados.slice(0, LISTA_VISIBLES);

  $('cuenta').textContent = q ? `${hallados.length} ${hallados.length === 1 ? 'resultado' : 'resultados'}`
    : hallados.length === todos.length ? `${todos.length} en total`
    : `${hallados.length} de ${todos.length}`;

  const aviso = (!q && dormidos && !viendoSalas()) ? `
    <div class="filtrillo">
      <span>${VER_DORMIDOS
        ? `Se ven <b>todos</b>, incluidos ${dormidos} sin movimiento`
        : `<b>${dormidos} jugadores ocultos</b> por no tener movimiento`}</span>
      <button onclick="verDormidos(${!VER_DORMIDOS})">${VER_DORMIDOS ? 'Ver sólo activos' : 'Ver todos'}</button>
    </div>` : '';

  $('lista').innerHTML = aviso + (vis.length ? vis.map(x => {
    const sub = viendoSalas()
      /* Íconos en vez de «6 jugadores · 0 conectados»: la fila se lee de un vistazo y
         entran los dos datos sin que el renglón se corte en teléfonos angostos. El
         título de cada uno lo dice en palabras para quien use lector de pantalla. */
      ? `${x.name ? x.name + ' ' : ''}<span class="meta" title="${x.terminals} jugadores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16.5 11a3 3 0 100-6M18.5 19c0-2.2-.8-3.9-2.1-4.8"/></svg>${x.terminals}</span><span class="meta" title="${x.terminals_online} conectados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12.5a9.5 9.5 0 0114 0"/><path d="M8 15.8a5.4 5.4 0 018 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg>${x.terminals_online}</span>`
      /* 🔴 El motor NO da el último ingreso acá: `last` viene vacío en los 200 jugadores
         medidos, igual que `ips`. Lo único real es `online`.
         Antes, sin dato, iba el ID. Se sacó: al cajero no le dice nada —él busca por nombre— y
         ocupaba el renglón todo el tiempo para no informar nada. Cuando no hay estado que
         mostrar, la fila queda con el login solo, que se lee mejor. El ID sigue estando en la
         ficha de la cuenta, para cuando hace falta. */
      /* «conectado», no «conectada»: es un jugador. El femenino venía de cuando esto se
         llamaba «terminal», que es justo el vocabulario que se sacó. */
      : (x.jugando ? 'jugando ahora' : x.online ? 'conectado' : '');
    const punto = viendoSalas() ? (x.terminals_game ? 'jugando' : x.online ? 'on' : '')
                             : (x.jugando ? 'jugando' : x.online ? 'on' : '');
    return `<div class="fila-b" role="button" tabindex="0" onclick="abrirNodo('${x.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirNodo('${x.id}')}">
      <span class="punto ${punto}" aria-hidden="true"></span>
      <span class="id"><b class="mono">${x.login}</b><span>${sub}</span></span>
      <button class="bal" onclick="event.stopPropagation(); moverDe('${x.id}')"
        aria-label="Cargar o retirar fichas de ${x.login}">
        <span class="cifras"><small>${yo().currency}</small><b class="num">${fmt(x.balance)}</b></span>
        ${/* Dibujado, no el carácter «±»: cada tipografía lo dibuja distinto —en algunas la
              barra es más angosta que la cruz, en otras queda descentrado— y encima cambia de
              tamaño con la fuente. Un SVG se ve igual en todos lados. */''
        }<span class="pm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4.5v7M8.5 8h7M6.5 19h11"/></svg></span>
      </button>
    </div>`; }).join('') : `<div class="vacio">${
      q ? `Nada coincide con “${q}”.${!VER_DORMIDOS && dormidos
            ? '<br><br>Puede estar entre los que no tienen movimiento.' : ''}`
        : (DENTRO || !esAgente())
          ? 'Todavía no hay jugadores acá.<br>Creá el primero con el botón de abajo.'
          : 'Todavía no tenés cajeros.<br>Creá el primero con el botón de abajo.'}</div>`)
    + (hallados.length > vis.length ? `<button class="masmenos" onclick="masLista()">
        Ver ${Math.min(hallados.length - vis.length, PASO_LISTA)} más ·
        quedan ${hallados.length - vis.length}</button>` : '');
}

/* El motor acepta day · week · month · year · custom_range. Los nombres son suyos;
   los rótulos son los mismos que usa el resto del panel, para no tener dos vocabularios. */
/* «Mes anterior» va acá también: el 1 de cada mes «Este mes» es un solo día y el Resumen
   queda en blanco, sin nada para comparar. La clave `mesant` NO es del motor — no le llega:
   el servidor siempre pide `custom_range` con fechas explícitas (ver la ruta /resumen), así
   que agregar un período nuevo es sólo calcular su rango acá. */
const PERIODOS_TAB = [['day','Hoy'],['week','Esta semana'],['month','Este mes'],
                      ['mesant','Mes anterior'],['year','Este año'],['custom_range','Otro rango…']];
function rangoTab(){
  if (PERIODO === 'custom_range') return { ...CUSTOMS.tab };
  const h = new Date(HOY);
  if (PERIODO === 'day')  return { from: iso(h), to: iso(h) };
  if (PERIODO === 'week') return rango('semana');
  if (PERIODO === 'month')return rango('mes');
  if (PERIODO === 'mesant') return rango('mesant');
  return { from: `${h.getFullYear()}-01-01`, to: iso(h) };
}

function pintarTablero(){
  const caja = DENTRO ? SALAS.find(s => s.id === DENTRO) : null;
  const t = caja ? (TABLERO_CAJA[DENTRO] || TABLERO) : TABLERO;
  const r = rangoTab();
  /* Los cuatro números salen del mismo panel que el gráfico: numbers.<key>.total. */
  const nn = t.combined.numbers;
  /* 🔴 Los cuatro números salen del MISMO tablero, estés en tu nivel o adentro de una caja.
     Antes, en el nivel propio, se leían de `TOTALES_MIOS` —datos de ejemplo de la maqueta— aunque
     el tablero real ya estuviera cargado al lado. Una sola fuente para los dos casos. */
  const m = { in:nn.deposit.total, out:nn.withdraw.total, profit:nn.profit.total,
              ggr:nn.bet_win.total, cargas:t.summary_stats.daily_deposits_count };
  /* ⭐ Se dibuja lo que el motor dice en `graphic.datasets`, con SUS nombres. Nada elegido acá.
     Las series conviven con escalas muy distintas (depósito 20M contra ganancia 9M), así que se
     normaliza al máximo de las visibles; tocar la leyenda apaga y prende cada una. */
  /* Cada serie con el color de su significado. Lo que no conocemos cae en el acento, que es
     neutro dentro de la marca — mejor eso que un color nuevo por cada serie que aparezca. */
  const COLOR_SERIE = {
    profit: 'var(--g)', deposit: 'var(--ok)', withdraw: 'var(--no)',
    ggr: 'var(--dato)', bet_win: 'var(--dato)',
    active_players: 'var(--g)', active_halls: 'var(--dato)',
  };
  const colorSerie = (clave) => COLOR_SERIE[clave] || 'var(--g)';

  const grafico = (panel, id_) => {
    const g = panel.graphic, num = panel.numbers;
    const series = g.datasets.filter(d => !OCULTAS.has(id_ + ':' + d.key));
    const todas = g.datasets;
    const largo = Math.max(...todas.map(d => (num[d.key]?.period || []).length));
    const et = (k) => PERIODO === 'day'
      ? `${dosD(Math.round((k + 1) * 24 / largo) - 1)}:00`
      : diaCorto(iso(sumarDias(new Date(r.to + 'T12:00:00'), -(largo - 1 - k))));
    const max = Math.max(1, ...series.flatMap(d => num[d.key]?.period || [0]));
    const linea = (d, i_) => {
      const s = num[d.key]?.period || [];
      const pts = s.map((v, k) => `${(k / Math.max(1, s.length - 1) * 100).toFixed(1)},${
        (100 - v / max * 92).toFixed(1)}`).join(' ');
      /* 🔴 EL COLOR SALE DE LA CLAVE, NO DEL ORDEN. Antes era `--s${i}`: cuatro colores
         sueltos repartidos por posición, así que «Cargas» podía ser naranja en un gráfico y
         violeta en otro, y ninguno coincidía con el verde y el rojo que usa el resto del panel
         para lo mismo. Ahora cargas es verde, retiros es rojo y ganancia es el magenta de la
         marca — en el gráfico y en la lista. Un color, un significado, en todas las pantallas. */
      return `<polyline points="${pts}" fill="none" stroke="${colorSerie(d.key, i_)}"
        stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`; };
    return `
      <div class="leyenda">${todas.map((d, i_) => {
        const apagada = OCULTAS.has(id_ + ':' + d.key);
        return `<button class="${apagada ? 'off' : ''}" onclick="tocarSerie('${id_}:${d.key}')">
          <i style="background:${colorSerie(d.key, i_)}"></i>${d.label}</button>`; }).join('')}</div>
      <svg class="gráf" viewBox="0 0 100 100" preserveAspectRatio="none" role="img"
        aria-label="${g.yAxisTitle}">${series.map((d, i_) =>
          linea(d, todas.findIndex(x => x.key === d.key))).join('')}</svg>
      ${/* 🔴 EL PIE DICE EL RANGO QUE PEDISTE, NO UNO DEDUCIDO DE LOS PUNTOS.
            Antes calculaba la fecha inicial contando `largo - 1` días hacia atrás desde el
            final. El problema: el motor NO manda un punto por día. Medido el 1-sep-2026,
            pidiendo del 1 al 31 de agosto —31 días— devolvió 30 puntos en las cuatro series.
            Con esa cuenta el pie decía «2 ago a 31 ago» mientras el encabezado decía
            «1 – 31 Ago»: dos fechas distintas para el mismo gráfico, y ninguna forma de saber
            cuál de los 31 días se cayó.
            Por hora sí se puede: el día tiene 24 y el motor manda 24. */''
      }<div class="piepie">${g.yAxisTitle} · ${
        /* Cada punto es una HORA, y el último rótulo nombra el comienzo de la última: decir
           «00:00 a 23:00» deja afuera los últimos 59 minutos del día. El día entero se dice
           entero. Verificado el 1-sep-2026: el motor manda 24 puntos para un día. */
        PERIODO === 'day' ? `${et(0)} a 23:59` : rotuloRango(r)}</div>`;
  };
  const nombrePer = (PERIODOS_TAB.find(([k]) => k === PERIODO) || [,''])[1].toLowerCase();
  /* Un gráfico de 29 barras no contesta «¿voy mejor o peor?». Un número al lado, sí. */
  const previo = caja ? (TOTALES_ANTES_CAJA[DENTRO] || {})[PERIODO] : TOTALES_ANTES[PERIODO];
  const variacion = (campo, alRevesEsBueno) => {
    if (!previo || !previo[campo]) return '';
    const hoy = m[campo], antes = previo[campo];
    const pct = Math.round((hoy - antes) / Math.abs(antes) * 100);
    if (!pct) return `<span class="var">igual que ${NOMBRE_ANTES[PERIODO]}</span>`;
    const bueno = alRevesEsBueno ? pct < 0 : pct > 0;
    return `<span class="var ${bueno ? 'sube' : 'baja'}">${pct > 0 ? '▲' : '▼'} ${
      Math.abs(pct)}% <small>vs ${NOMBRE_ANTES[PERIODO]}</small></span>`;
  };
  $('cuerpo').innerHTML = `
    ${caja ? `<button class="icobtn" style="margin-bottom:12px" onclick="volverARaiz()">‹ Mis cajeros</button>
      <div class="rango" style="margin-bottom:10px"><b class="mono">${caja.login}</b>
        <span>${caja.terminals} jugadores</span></div>` : ''}
    <div class="periodos">
      ${PERIODOS_TAB.map(([k, n]) => `<button aria-pressed="${k === PERIODO}" onclick="setPeriodo('${k}')">${
        k === 'custom_range' && PERIODO === 'custom_range' ? rotuloRango(CUSTOMS.tab) + ' ✎' : n}</button>`).join('')}
    </div>
    <div class="rango"><b>${rotuloRango(r)}</b><span>${yo().currency} ${
      fmt(caja ? caja.balance : yo().balance)} de saldo</span></div>
    <div class="tarjetas">
      <div class="tj"><svg class="tj-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M4.5 12a7.5 7.5 0 0115 0" opacity=".55"/><path d="M2 12a10 10 0 0120 0" opacity=".3"/></svg><div class="et">Jugando ahora</div><div class="vl num">${t.summary_stats.online_players}</div></div>
      <div class="tj"><svg class="tj-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 11.2a3 3 0 100-6M18 20c0-2.4-.9-4.2-2.3-5.2"/></svg><div class="et">Jugadores en total</div><div class="vl num">${t.summary_stats.total_players}</div></div>
      <div class="tj ancha">
        ${/* «Movimientos» y no «Cargas y retiros»: el gráfico dibuja CUATRO series —ganancia,
              GGR, cargas y retiros— y el título nombraba dos. El que mira busca la ganancia en
              un gráfico que, según el título, no la tiene. */''
        }<div class="et">Movimientos ${PERIODO === 'custom_range' ? 'del rango' : nombrePer}</div>
        <div class="cuatro">
          <div><span>Cargas</span><b class="num">${fmt(m.in)}</b>${variacion('in')}</div>
          <div><span>Retiros</span><b class="num menos">${fmt(m.out)}</b>${variacion('out', true)}</div>
          <div><span>Ganancia</span><b class="num ${m.profit < 0 ? 'menos' : 'mas'}">${
            m.profit < 0 ? '−' : ''}${fmt(Math.abs(m.profit))}</b>${variacion('profit')}</div>
          <div><span>Cuántas cargas</span><b class="num">${fmt(m.cargas)}</b>${variacion('cargas')}</div>
        </div>
        ${grafico(t.combined, 'fin')}
        ${m.profit < 0 ? `<div class="piepie t-no">Ganancia en rojo: se retiró
          más de lo que se cargó en este período.</div>` : ''}
      </div>
      <div class="tj"><svg class="tj-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3.5L21 5"/><path d="M15 5h6v6" opacity=".55"/></svg><div class="et">Jugaron en el período</div><div class="vl num">${totalPanel(t.active_players)}</div>${grafico(t.active_players, 'jug')}</div>
      ${caja ? '' : `<div class="tj"><div class="et">Cajeros que movieron fichas</div><div class="vl num">${totalPanel(t.active_halls)}</div>${grafico(t.active_halls, 'caj')}</div>`}
    </div>

  const filas = todas.filter(m => { const d = m.datetime.slice(0, 10); return d >= r.from && d <= r.to; });
  const suma = filas.reduce((a, m) => { a[m.operation] += m.cash; return a; }, { in:0, out:0 });

    </div>

    <div class="rango"><b>${rotuloRango(r)}</b>
      <span>${filas.length} ${filas.length === 1 ? 'movimiento' : 'movimientos'}</span></div>
    <div class="nota neutra" style="margin:0 0 12px">${explica[TIPO_MOV]}</div>
    ${resumen([['Cargas', fmt(suma.in), 'ok'], ['Retiros', fmt(suma.out), 'no'],
                ['Ganancia', fmt(suma.in - suma.out)]])}
    ${/* 🔴 `sum` del motor suma SÓLO las filas devueltas, y el tope por página es 1000
          —pedir más cae en silencio a 50—. Con más de una página el subtotal es parcial y
          hay que decirlo: un total que no es total es peor que no mostrar ninguno. */
      filas.length >= TOPE_PAGINA ? `${notaInfo('subtotal',
      `Estos números son de los <b>${filas.length} movimientos que ves</b>, no de todo el período.`,
      'Para el total del período, mirá el <b>Resumen</b>: ahí están todas las cargas y retiros, '
      + 'no sólo los que entran en esta lista.')}` : ''}
    ${!filas.length ? `<div class="vacio">Sin movimientos ${
        ({hoy:'hoy', ayer:'ayer', semana:'esta semana', mes:'este mes', mesant:'el mes pasado', custom:'en esas fechas'})[PER_MOV]
      }.<br><br>Probá con un período más largo.</div>` : ''}
    ${(() => {
      /* Medido el 26-ago sobre una semana real: ~2.000 movimientos, 285 por día, y UN sub-cajero
         hizo 989 de 1.000. De ahí las tres decisiones de esta lista:
           · se pagina — 285 filas seguidas no se leen ni se descargan gratis
           · la fecha va en un encabezado por día, no repetida en cada fila
           · el iniciador se nombra SÓLO cuando no es el habitual: con el 99% igual, decirlo
             siempre es ruido que tapa justo la excepción que hay que ver */
      const visibles = filas.slice(0, MOV_VISIBLES);
      const habitual = quienMasMueve(filas);
      let dia = null;
      const html = visibles.map(m => {
        const d = m.datetime.slice(0, 10);
        const cabeza = d !== dia ? (dia = d, `<div class="diahead">${diaLargo(d)}</div>`) : '';
        const raro = habitual && m.initiator && m.initiator !== habitual;
        return cabeza + `
        <div class="mov" role="button" tabindex="0"
          onclick="this.classList.toggle('abierta')"

          <span class="qu"><b class="mono">${m.user || (caja ? caja.login : yo().login)}</b>
            ${raro ? `<span>${quienLoHizo(m.initiator)}</span>` : ''}</span>
          <span class="mn num ${m.operation==='out'?'menos':'mas'}">${
            m.operation==='out'?'−':'+'}${fmt(m.cash)}</span>
          <span class="antes">antes ${fmt(m.cash_before)} → quedó <b>${fmt(
            m.operation==='out' ? m.cash_before - m.cash : m.cash_before + m.cash)}</b></span>

      const faltan = filas.length - visibles.length;

      `Casi todos los movimientos los hizo <b class="mono">${quienMasMueve(filas)}</b>.`,
      'Por eso sólo se aclara quién fue <b>cuando lo hizo otro</b>: si en cada línea dijera el '
      + 'mismo nombre, lo distinto dejaría de saltar a la vista, que es justo lo que hay que mirar.')}` : ''}

/* 🔴 El motor NO da «último ingreso»: el campo `last` de area=users viene vacío en el 100% de los
   jugadores medidos, igual que `ips` y `game`. Lo único real ahí es `online`.
   Pero SÍ se puede saber la última vez que MOVIÓ FICHAS, que para un cajero dice más: sale de sus
   propios movimientos, que la ficha ya consulta. Verificado el 27-ago: de una sola llamada de
   1.000 movimientos salieron 229 jugadores con fecha.
   Va en la ficha, no en la lista: en la lista habría que traer miles de filas para pintar una
   fecha que además sólo tendría el 14% de las cuentas. */
function ultimoMovimientoDe(jugadorId){
  const jug = TERMINALES.find(t => t.id === jugadorId);
  if (!jug) return null;
  const suyos = (MOVS.cajero['usual:players'] || []).filter(m => m.user === jug.login);
  if (!suyos.length) return null;
  const m = suyos.reduce((a, b) => a.datetime > b.datetime ? a : b);
  return { cuando: m.datetime, tipo: m.operation, monto: m.cash };
}

/* Con volumen real, un solo sub-cajero hace el 99% de los movimientos: nombrarlo en cada fila
   es ruido. Se considera «habitual» al que hizo más del 70%. */
function quienMasMueve(filas){
  if (filas.length < 8) return null;
  const cuenta = {};
  filas.forEach(m => { if (m.initiator) cuenta[m.initiator] = (cuenta[m.initiator] || 0) + 1; });
  const top = Object.entries(cuenta).sort((a, b) => b[1] - a[1])[0];
  return top && top[1] / filas.length > 0.7 ? top[0] : null;
}
function masMovs(){ MOV_VISIBLES += PASO_MOV; pintarMovs(); }

/* El motor sólo dice el login del que lo hizo. Un sub-cajero comparte las fichas con su caja,
   así que su movimiento se ve idéntico al del cajero: `initiator` es lo único que los separa. */
function quienLoHizo(initiator){
  if (!initiator) return 'sin registrar';
  if (initiator === yo().login) return 'lo hiciste vos';
  if (SALAS.some(s => s.login === initiator) && DENTRO)
    return `lo hizo el cajero <b class="mono">${initiator}</b>`;
  if (SUBCAJEROS.some(s => s.login === initiator)) return `lo hizo tu sub-cajero <b class="mono">${initiator}</b>`;
  if (SUBAGENTES.some(s => s.login === initiator)) return `lo hizo tu sub-agente <b class="mono">${initiator}</b>`;
  if (SALAS.some(s => s.login === initiator)) return `lo hizo el cajero <b class="mono">${initiator}</b>`;
  return `lo hizo <b class="mono">${initiator}</b>`;
}

function pintarEstadisticas(){
  if (!gruposDisponibles().includes(EST_GRUPO)) EST_GRUPO = 'general';

  const base = ESTADISTICAS[clave];

  const cols = EST_AVANZADO ? [...base.cols, ...COLS_AVANZADAS] : base.cols;
  const r = rango(EST_PER, 'est');
  const sum = (c) => filas.reduce((a, x) => a + (Number(x[c]) || 0), 0);
  /* El RTP va en el resumen, como en el panel: es el número que se mira primero. */
  const suma = EST_TIPO === 'on_money'
    ? [['Cargas', fmt(sum('in'))], ['Retiros', fmt(sum('out'))], ['Ganancia', fmt(sum('profit')), 'ok'], ['% de retorno', rtp, 'rtp']]
    : [['Apostado', fmt(sum('bet'))], ['Ganado', fmt(sum('win'))], ['Resultado', fmt(sum('profit')), 'ok'], ['% de retorno', rtp, 'rtp']];
  /* Por ganancia y de mayor a menor: es la pregunta que trae a alguien a esta pantalla. */
  const ordenadas = [...filas].sort((a, b) => {
    const A = a[EST_ORDEN], B = b[EST_ORDEN];
    const n = (typeof A === 'number' || !isNaN(Number(String(A).replace(/[^\d.-]/g, ''))));
    const va = n ? Number(String(A).replace(/[^\d.-]/g, '')) : String(A);
    const vb = n ? Number(String(B).replace(/[^\d.-]/g, '')) : String(B);
    return (va < vb ? -1 : va > vb ? 1 : 0) * (EST_ASC ? 1 : -1);
  });
  const visibles = ordenadas.slice(0, EST_TOPE);
  /* 🔴 El 11% de los jugadores deja PÉRDIDA —medido: 42 de 384, y uno solo explicaba la mitad—.
     Pintar la ganancia siempre en verde esconde justo la fila que hay que mirar.
     Y el RTP pasa de 100 cuando el jugador se llevó más de lo que puso: llegó a 666%. */
  const num = (v) => Number(String(v).replace(/[^\d.-]/g, '')) || 0;

    : `<td class="num">${fmt(x[c])}</td>`;
  const perdedores = filas.filter(x => num(x.profit) < 0);

  $('cuerpo').innerHTML = `
    ${(() => {
      /* La vuelta es a Movimientos, que es de donde se entra... salvo para quien no la tiene:
         al sub-agente el motor le niega esa sección y entra por la hoja de su cuenta. Mandarlo
         igual sería dejarlo en una pantalla que no puede ver. */
      const vuelve = seccionesDe(ROL, SUBAGENTE).includes('balance')
        ? { sec: 'balance', txt: 'Movimientos' } : { sec: 'users', txt: nombreSec('users') };
      return `<button class="icobtn" style="margin-bottom:12px" onclick="irSec('${vuelve.sec}')">‹ ${vuelve.txt}</button>`;
    })()}
    <div class="tabs" role="tablist">
      ${Object.entries(EST_TIPOS).map(([k, n]) =>
        `<button role="tab" aria-selected="${k===EST_TIPO}" onclick="setEst('tipo','${k}')">${n}</button>`).join('')}
    </div>
    <div class="periodos">
      ${gruposDisponibles().map(k =>
        `<button aria-pressed="${k===EST_GRUPO}" onclick="setEst('grupo','${k}')">${EST_GRUPOS[k]}</button>`).join('')}
    </div>
    ${tiraPeriodos(EST_PER, 'setPerEst', { rangoCustom: CUSTOMS.est })}

    <div class="filtros-dice">Estás viendo <b>${EST_TIPOS[EST_TIPO].toLowerCase()}</b>,
      <b>${EST_GRUPOS[EST_GRUPO].toLowerCase()}</b>, en <b>${yo().currency}</b> ·
      <b>${rotuloRango(r)}</b><br>${EXPLICA_GRUPO[EST_GRUPO]}
      ${filas.length > 1 ? `<br>Ordenado por <b>${(cols.find(([c]) => c === EST_ORDEN) || [,EST_ORDEN])[1].toLowerCase()}</b>,
        de ${EST_ASC ? 'menor a mayor' : 'mayor a menor'} — tocá cualquier título para cambiarlo.` : ''}</div>

    ${resumen(suma.map(([n, v, t]) => [n, v, t === 'rtp' ? 'g' : t]))}
    ${perdedores.length ? `<div class="filtrillo">
      <span><b>${perdedores.length} ${perdedores.length === 1 ? 'jugador dejó' : 'jugadores dejaron'} pérdida</b>
        · ${yo().currency} ${fmt(Math.abs(perdedores.reduce((a, x) => a + num(x.profit), 0)))}</span>
      <button onclick="verPerdedores()">Ver quiénes</button></div>` : ''}
    <button class="masmenos" onclick="EST_AVANZADO=!EST_AVANZADO; pintarEstadisticas()">
      ${EST_AVANZADO ? '− Ocultar cargas y promedios' : '+ Ver cuántas cargas y de cuánto'}
    </button>
    ${EST_AVANZADO ? '<div class="deslizar">Deslizá la tabla para ver el resto →</div>' : ''}
    <div class="tabla-marco">
      <table class="tabla">
        <thead><tr>${cols.map(([c, n]) => `<th${c === EST_ORDEN ? ' class="ord"' : ''}>
          <button onclick="ordenarEst('${c}')">${n}${c === EST_ORDEN ? (EST_ASC ? ' ↑' : ' ↓') : ''}</button>
        </th>`).join('')}</tr></thead>

    ${EST_AVANZADO ? `${notaInfo('cuentapromedio',
      'La cuenta y el promedio dicen lo que el total esconde.',

      + '<b>dos jugadores distintos</b>.')}` : ''}
    <div class="nota motor">Los dos ejes salen del motor: <b>statistic_type</b>
    (<span class="mono">on_money</span> / <span class="mono">on_bets</span>) y <b>userGroup</b>
    (<span class="mono">child_users</span> / <span class="mono">terminal</span>). Hay 20 campos
    disponibles; sin usar todavía quedan <span class="mono">balance</span>,
    <span class="mono">open_games</span>, <span class="mono">phone</span> y siete más.<br><br>
    Dos cosas que resuelve el sistema y el cliente no ve: las fechas se mandan siempre con hora
    (<span class="mono">00:00:00</span> a <span class="mono">23:59:59</span>), porque sin hora el
    motor las ignora y devuelve el día de hoy; y la consulta va <b>sin plantilla</b>, porque una
    plantilla seleccionada pisa la agrupación que se pida. Acá no hay plantillas.</div>
`;
}

/* ¿El «nombre» es en realidad el mismo login escrito distinto? El motor copia el login ahí
   cuando no le ponés otro, y a veces con espacios: «SubAgentePrueba» y «Sub Agente Prueba» son
   lo mismo para quien lo lee. Se comparan sin espacios y sin distinguir mayúsculas, así la fila
   no repite dos veces la misma palabra. */

/* ── UNA NOTA CON «MÁS INFO» ────────────────────────────────────────────────────
   Una línea que explique QUÉ es la cosa, y el resto —las reglas, los detalles, lo que
   pasa si tocás tal cosa— detrás de una (i). El texto largo arriba de cada pantalla se
   lee una vez y después estorba todos los días; escondido sigue disponible para el que
   recién empieza, sin ocupar lugar para el que ya sabe.
   Es reusable a propósito: la idea es que todas las notas largas del panel pasen por acá. */
/* 🔴 LA (i) ABRE Y CIERRA SOLA, SIN REPINTAR. Antes guardaba cuál estaba abierta y llamaba a
   `pintar()`, que redibuja la SECCIÓN — así que una nota metida en una hoja emergente no se
   actualizaba nunca y la (i) parecía rota. Tocando el elemento directamente funciona en los dos
   lados, y de paso una explicación no hace una vuelta entera de dibujo. */
/* Se muestra sólo cuando algo salió mal: en una pantalla que anduvo bien, el número sobra. */
function pieCaso(r){
  const c = r && r.caso;
  if (!c) return '';
  return `<div class="caso">Si lo reportás, pasá este número:
    <b onclick="copiarCaso('${c}')" title="Tocá para copiar">E-${c}</b></div>`;
}
function copiarCaso(c){
  /* El aviso lo da el botón mismo: no hay barra de mensajes en esta app, y agregar una por esto
     sería construir de más para algo que se usa una semana. */
  const b = document.querySelector('.caso b');
  const decir = (t) => { if (!b) return; b.textContent = t; setTimeout(() => { b.textContent = 'E-' + c; }, 1400); };
  try { navigator.clipboard.writeText('E-' + c).then(() => decir('¡copiado!'), () => decir('E-' + c)); }
  catch (e) { decir('E-' + c); }
}

function notaInfo(clave, corto, detalle){
  return `<div class="nota neutra coninfo" data-info="${clave}">
    <div class="linea"><span>${corto}</span>
      <button class="masinfo" aria-expanded="false" aria-label="Más información"
        onclick="verInfo('${clave}')">i</button></div>
    <div class="detalle-info" hidden>${detalle}</div>
  </div>`;
}
function verInfo(clave){
  const caja = document.querySelector(`[data-info="${clave}"]`);
  if (!caja) return;
  const detalle = caja.querySelector('.detalle-info');
  const boton = caja.querySelector('.masinfo');
  const abrir = detalle.hidden;
  detalle.hidden = !abrir;

}

      ${SUBAGENTES.map(s => {

          onclick="abrirSubAgente('${s.id}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirSubAgente('${s.id}')}">
        <span class="id">
          <b class="mono">${s.login}</b>
          ${/* El nombre sólo si es DISTINTO del login: el motor copia el login ahí cuando no se
                le pone otro, y entonces la fila repetía lo mismo dos veces. El ID no va: al
                cajero no le dice nada, igual que en la lista de jugadores. */''
          }${mismoNombre(s.name, s.login) ? '' : `<span>${s.name}</span>`}
          ${/* Sin cartel de cajas: el dato no viene en esta lista y pedirlo por cada uno rompía
                la pantalla. Se ve entrando al sub-agente, que es donde además se cambia. */''}
        </span>
        <span class="fl" style="color:var(--mut)">›</span>
      </div>`; }).join('')}
    </div>
    <div class="nota motor">Sale de <span class="mono">useredit&tab=editable_users</span>: una
    casilla por caja, con el campo <span class="mono">editable_users/&lt;id&gt;</span>.</div>`;
}

/* Qué cajas ve este sub-agente. Es la única configuración que importa de él. */
function abrirSubAgente(id){
  const s = SUBAGENTES.find(x => x.id === id);
  const ve = Object.values(s.cajas).filter(Boolean).length;
  abrirHoja(`
    <h3 id="hojaTit" class="mono">${s.login}</h3>
    <div class="sub">Sub-agente</div>
    ${!ve ? `<div class="nota">⚠️ <b>No ve ninguna caja.</b> Así como está, entra al panel y no
      encuentra nada — ni las cajas ni sus jugadores.</div>` : ''}
    <div class="rot" style="margin:14px 0 2px">Cajas que puede ver</div>
    ${SALAS.map(c => `
      <div class="switch">
        <span class="tx"><b class="mono">${c.login}</b><span>${c.name} · ${c.terminals} jugadores</span></span>
        <button class="palanca" role="switch" aria-checked="${!!s.cajas[c.id]}"
          aria-label="Ver ${c.login}" onclick="tocarCaja('${s.id}','${c.id}')"></button>
      </div>`).join('')}
    <div class="acciones">
      <button class="btn sec" onclick="todasLasCajas('${s.id}')">Darle todas</button>
      <button class="btn" onclick="cerrarHoja()">Listo</button>

}
function tocarCaja(subId, cajaId){
  const s = SUBAGENTES.find(x => x.id === subId);
  s.cajas[cajaId] = !s.cajas[cajaId];
  abrirSubAgente(subId); pintarSub();
}
function todasLasCajas(subId){
  const s = SUBAGENTES.find(x => x.id === subId);
  SALAS.forEach(c => { s.cajas[c.id] = true; });
  abrirSubAgente(subId); pintarSub();
}

/* Los sub-cajeros de UNA caja: se llega desde el menú de esa caja, no desde la sección. */
function abrirSubDeCaja(cajaId){
  const caja = SALAS.find(c => c.id === cajaId);
  const suyos = SUBCAJEROS.filter(s => s.sala === cajaId);
  /* 🔑 Sólo se listan las restricciones ACTIVAS. Antes se dibujaban las dos siempre —una con ✓ y
     otra con ○— y había que leer el símbolo para saber cuál regía: dos chips casi iguales
     diciendo cosas opuestas. Lo que no está puesto, no se dibuja; y si no hay ninguna, se dice
     con todas las letras. */
  const restricciones = (s) => {
    const puestas = [];
    if (s.hide_hall_balance) puestas.push('no ve el saldo');
    if (s.disable_statistic) puestas.push('sin estadísticas');
    return puestas.length
      ? puestas.map(t => `<span class="permiso si">${t}</span>`).join('')
      : '<span class="permiso todo">ve todo</span>';
  };
  abrirHoja(`
    <h3 id="hojaTit">Sub-cajeros</h3>
    <div class="sub"><span class="mono">${caja.login}</span> · otro acceso a la misma caja</div>
    ${suyos.length ? `<div class="lista">${suyos.map(s => `
      <div class="fila-b" role="button" tabindex="0" style="align-items:flex-start"
        onclick="abrirSub('${s.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirSub('${s.id}')}">
        <span class="id"><b class="mono">${s.login}</b><span>${s.name} · ID ${s.id}</span>
          <span class="permisos">${restricciones(s)}</span>
        </span><span class="fl" style="color:var(--mut)">›</span>
      </div>`).join('')}</div>`
      : '<div class="vacio">Esta caja no tiene sub-cajeros.</div>'}
    ${notaInfo('subdecaja',
      'Sirve para que alguien cargue y retire <b>sin ver el negocio</b>.',
      'Ni cuánto tiene la caja ni cómo viene la ganancia. Es para un empleado de mostrador, '
      + 'no para un socio.')}
    <div class="acciones">
      <button class="btn sec" onclick="abrirNodo('${cajaId}')">Volver</button>
      <button class="btn" onclick="altaSubCajero('${cajaId}')">+ Nuevo sub-cajero</button>
    </div>`);
}

/* La sección Seguridad de la barra: las mismas dos herramientas. */
function pintarCruces(){
  const r = rango(IP_PER, 'ip');
  /* El recorte al período vive en caja-logica.js (`crucesEnRango`), con la explicación de
     por qué se miran TODAS las visitas y no la primera. Lo cubren los tests. */
  const enRango = crucesEnRango(CRUCES, r);
  const orden = enRango.sort((a, b) => b.cuentas.length - a.cuentas.length);
  /* Con un solo día la fecha sobra: van los logins limpios y la hora al acercarse.
     Con varios, la fecha es el dato — dos entradas del mismo día no son lo mismo que de días distintos. */
  const unSoloDia = r.from === r.to;
  $('cuerpo').innerHTML = `
    ${tiraPeriodos(IP_PER, 'setPerIp', { rangoCustom: CUSTOMS.ip })}
    <div class="rango"><b>${rotuloRango(r)}</b>
      <span>${orden.length} ${orden.length === 1 ? 'IP compartida' : 'IPs compartidas'}</span></div>`;
  $('cuerpo').innerHTML += `
    <button class="icobtn" style="margin-bottom:12px" onclick="irSec('users')">‹ Volver</button>
    ${(() => {
      const muchas = orden.filter(c => c.cuentas.length >= MUCHAS_CUENTAS);
      const dePares = orden.length - muchas.length;
      if (!dePares) return '';
      return `<div class="filtrillo"><span>${IP_TODAS
        ? `Se ven <b>las ${orden.length}</b>, incluidas ${dePares} de dos cuentas`
        : `<b>${dePares} ${dePares === 1 ? 'IP' : 'IPs'} de dos cuentas</b> ${
            dePares === 1 ? 'quedó' : 'quedaron'} fuera — dos juntas es lo corriente`}</span>
        <button onclick="verTodasIPs(${!IP_TODAS})">${IP_TODAS ? 'Sólo las de 3 o más' : 'Ver todas'}</button></div>`;
    })()}
    ${/* Esconder las IP de dos cuentas tiene sentido cuando hay muchas: dos juntas es lo
         corriente y ensucia. Pero si al esconderlas NO QUEDA NADA, el operador ve una pantalla
         vacía con un aviso arriba diciendo que hay algo — y lo único que hay es justo lo que se
         escondió. En ese caso se muestran igual. Esconder algo es útil; esconder todo, no. */''
    }${(IP_TODAS || !orden.some(c => c.cuentas.length >= MUCHAS_CUENTAS)
        ? orden : orden.filter(c => c.cuentas.length >= MUCHAS_CUENTAS)).map(c => {
      const mirar = c.cuentas.length >= MUCHAS_CUENTAS;
      return `<div class="cruce ${mirar ? 'mirar' : ''}">
        <div class="cabeza">
          <b class="mono">${c.ip}</b>
          <span class="${mirar ? 'destacado' : 'cuantas'}">${c.cuentas.length} cuentas</span>
        </div>
        <div class="quienes">${c.cuentas.map(u => {
          const clave = c.ip + '|' + u.login;
          const abierta = IP_ABIERTA === clave;
          const veces = (u.horas || [u.hora]).length;
          return `<button class="pastilla ${abierta ? 'abierta' : ''}" onclick="verHoras('${clave}')"
            title="${u.hora}"><b class="mono">${u.login}</b>${
            unSoloDia ? '' : ' ' + diaCorto(u.hora)}${veces > 1 ? ` ·&nbsp;${veces}` : ''}</button>`; }).join('')}</div>
        ${(() => {
          const abierta = c.cuentas.find(u => IP_ABIERTA === c.ip + '|' + u.login);
          if (!abierta) return '';
          const horas = (abierta.horas || [abierta.hora]).filter(t => { const d = t.slice(0,10); return d >= r.from && d <= r.to; });
          return `<div class="horarios">
            <div class="rot" style="margin-bottom:6px"><span class="mono">${abierta.login}</span> desde esta IP</div>
            ${horas.map(t => `<div class="unahora"><b class="mono">${t.slice(11)}</b><span>${diaCorto(t)}</span></div>`).join('')}
          </div>`; })()}
      </div>`; }).join('')}
    ${!orden.length ? `<div class="vacio">Ninguna IP con más de una cuenta en este período.${proponerOtroPeriodo(IP_PER)}</div>`
      : ''}
    ${notaInfo('cruces',
      'Estas cuentas entran desde la <b>misma dirección IP</b>. Compartirla no prueba nada.',
      'Puede ser un cyber, el wifi de un barrio o una familia en la misma casa. Y ojo con vos '
      + 'mismo: <b>si cargás fichas desde la misma red que tus jugadores, vas a aparecer acá '
      + 'con ellos</b>.')}`;
}

/* Sin cierre, la sesión sigue abierta: está jugando. Con cierre, cuánto duró. */
function horarioSesion(s){
  const hh = (t) => t ? t.slice(11, 16) : '';
  if (!s.datetime_close) return `abrió ${hh(s.datetime_open)} · sin cerrar`;
  const mins = Math.max(1, Math.round((new Date(s.datetime_close) - new Date(s.datetime_open)) / 60000));
  return `${hh(s.datetime_open)} – ${hh(s.datetime_close)} · ${mins} min`;
}

/* Nivel 1: las sesiones del jugador. Se llega desde el jugador, que es como lo pide el motor. */
let HIST_PER = 'hoy', HIST_ID = null;
function perHist(p){
  if (p === 'custom') { HIST_ID_PEND = HIST_ID; return elegirRango('hist'); }
  HIST_PER = p; abrirHistoria(HIST_ID);
}
let HIST_ID_PEND = null;

/* 🔴 El motor devuelve SÓLO EL DÍA si no se le manda rango —medido el 26-ago—, así que el
   filtro de fechas no es un lujo: sin él, el historial parece vacío.
   Y el total lo da el motor en `total.<moneda>`, del período completo: sumarlo acá daría el
   total de la página, que es el error que tiene `sum` en los movimientos. */
function abrirHistoria(id){
  HIST_ID = id;
  const j = TERMINALES.find(t => t.id === id) || ACTUAL;
  const r = rango(HIST_PER, 'hist');
  const todas = SESIONES[id] || [];
  const ses = todas.filter(s => { const d = s.datetime_open.slice(0, 10); return d >= r.from && d <= r.to; });
  const tot = ses.reduce((a, s) => ({ bet:a.bet+s.bet, win:a.win+s.win, profit:a.profit+s.profit }), { bet:0, win:0, profit:0 });
  const abiertas = ses.filter(s => !s.datetime_close).length;
  abrirHoja(`
    <h3 id="hojaTit" class="mono">${j.login}</h3>
    <div class="sub">Historial de jugadas</div>
    ${tiraPeriodos(HIST_PER, 'perHist', { rangoCustom: CUSTOMS.hist })}
    <div class="rango"><b>${rotuloRango(r)}</b>
      <span>${ses.length} ${ses.length === 1 ? 'sesión' : 'sesiones'}${
        abiertas ? ` · ${abiertas} abierta${abiertas > 1 ? 's' : ''}` : ''}</span></div>
    ${ses.length ? `
      ${resumen([['Apostado', fmt(tot.bet)], ['Ganado', fmt(tot.win)],
                  ['Resultado', (tot.profit>=0?'+':'') + fmt(tot.profit), tot.profit>=0?'ok':'no']])}
      <div class="lista">${ses.map(s => `
        <div class="fila-b" role="button" tabindex="0" style="align-items:flex-start"
          onclick="abrirSesion('${id}','${s.session}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirSesion('${id}','${s.session}')}">
          <span class="id">
            <b>${s.game}</b>
            <span>${s.labeltitle} · ${horarioSesion(s)}</span>
            ${!s.datetime_close ? '<span class="permisos"><span class="permiso jugando">● jugando ahora</span></span>' : ''}
          </span>
          <span class="bal" style="background:none;border:none;padding:0;display:block;text-align:right">
            <b class="num ${s.profit>=0?'t-ok':'t-no'}">${s.profit>=0?'+':''}${fmt(s.profit)}</b>
            <small style="display:block;font-size:11px;color:var(--mut)">${fmt(s.bet)} apostado</small></span>
        </div>`).join('')}</div>`
      : `<div class="vacio">No jugó nada ${
          ({hoy:'hoy', ayer:'ayer', semana:'esta semana', mes:'este mes', mesant:'el mes pasado',
            custom:'en esas fechas'})[HIST_PER]}.<br><br>Probá con un período más largo.</div>`}
    <div class="nota motor">El motor devuelve <b>sesiones</b>, no jugadas sueltas — tocá una para
    ver las de adentro. El total sale de <span class="mono">total.ARS</span> y es del período
    entero. <b>Sin rango devuelve sólo el día</b>, por eso el filtro de arriba.</div>
    <div class="acciones"><button class="btn sec" onclick="abrirNodo('${id}')">Volver</button></div>`);
}

/* Nivel 2: las jugadas de una sesión. */
function abrirSesion(jugadorId, sesionId){
  const s = (SESIONES[jugadorId] || []).find(x => x.session === sesionId);
  const crudas = JUGADAS[sesionId] || [];
  const js = agruparJugadas(crudas);
  const partidas = crudas.length > js.length;
  abrirHoja(`
    <h3 id="hojaTit">${s.game}</h3>
    <div class="sub">${s.labeltitle} · ${s.providertitle} · sesión ${s.session}</div>
    ${!s.datetime_close
      ? `<div class="nota">● <b>La sesión sigue abierta</b> — está jugando ahora. Abrió a las
         ${s.datetime_open.slice(11,16)}, última jugada ${s.datetime_last.slice(11,16)}.</div>`
      : `<div class="nota neutra">Abrió ${s.datetime_open.slice(5,16)} · cerró
         ${s.datetime_close.slice(11,16)} · última jugada ${s.datetime_last.slice(11,16)}.</div>`}
    ${resumen([['Jugadas', js.length], ['Saldo al empezar', fmt(s.balance_before)],
                ['Resultado', (s.profit>=0?'+':'') + fmt(s.profit), s.profit>=0?'ok':'no']])}
    ${js.map(x => {
      const neto = x.win - x.bet;
      /* Misma forma que las otras dos listas: la hora a la izquierda como columna y el saldo de
         antes guardado hasta que se toca. Acá el «neto» sí se queda a la vista: es el resultado
         de la jugada, o sea lo que se viene a mirar. */
      return `<div class="mov" role="button" tabindex="0"
        onclick="this.classList.toggle('abierta')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('abierta')}">
      <span class="hora">${x.dateTime.slice(11, 16)}</span>
      <span class="sig ${neto >= 0 ? '' : 'menos'}">${neto >= 0 ? '↑' : '↓'}</span>
      <span class="qu">
        <b>Apostó <span class="num">${fmt(x.bet)}</span>${
          x.win ? ` · ganó <span class="num t-ok">${fmt(x.win)}</span>` : ' · sin premio'}</b></span>
      <span class="mn num ${neto >= 0 ? 'mas' : 'menos'}">${neto >= 0 ? '+' : '−'}${fmt(Math.abs(neto))}</span>
      <span class="antes">saldo antes <b>${fmt(x.before)}</b> · el neto de la jugada es lo que
        muestra la fila</span>
    </div>`; }).join('')}
    ${partidas ? `<div class="nota neutra">Este proveedor manda <b>${crudas.length} líneas</b>
      para <b>${js.length} jugadas</b>: parte cada una en dos. Se juntan por
      <span class="mono">round_id</span>, si no se verían apuestas en cero.</div>` : ''}
    <div class="nota motor">El detalle <b>cambia según el proveedor</b>: algunos traen la grilla del
    slot y las líneas ganadoras, otros parten cada jugada en dos registros.</div>
    <div class="acciones"><button class="btn sec" onclick="abrirHistoria('${jugadorId}')">Volver</button></div>`);
}


/* Los medios propios del agente: los heredan todas sus cajas que no tengan los suyos. */
function misContactos(){
  /* 🔴 ACÁ DECÍA `USA_PROPIOS[cajaId]`, Y `cajaId` NO EXISTE en esta función: quedó de copiar
     `abrirContactos(cajaId)`, que sí lo recibe. Al evaluar la plantilla tiraba ReferenceError y
     la hoja no se dibujaba — desde la ficha del agente, «Medios de comunicación» no hacía nada.
     Acá no hay caja: son los contactos DEL AGENTE. Que los tenga o no es simplemente si la lista
     tiene algo, y eso ya lo dice `lista.length`. */
  const lista = CONTACTOS[yo().id] || (CONTACTOS[yo().id] = []);
  const conPropios = SALAS.filter(s => USA_PROPIOS[s.id]);
  const heredan = SALAS.length - conPropios.length;
  abrirHoja(`
    <h3 id="hojaTit">Medios de comunicación</h3>
    <div class="sub">Tu línea de soporte general</div>
    ${notaInfo('miscontactos',
      SALAS.length
        ? `Los usan <b>${heredan} de ${SALAS.length} cajas</b>${conPropios.length
            ? `, y ${conPropios.length} tiene${conPropios.length > 1 ? 'n' : ''} los suyos` : ''}.`
        : 'Los ven <b>todos tus jugadores</b>.',
      'Los ve <b>todo jugador tuyo</b>, salvo los de las cajas que hayan cargado un contacto '
      + 'propio: ésos ven el de su caja y no el tuyo.')}
    ${lista.length > 0 && lista.length ? `<div class="lista">${lista.map((c, i) => `
      <div class="fila-b" role="button" tabindex="0" style="align-items:flex-start"
        onclick="editarContacto('${yo().id}',${i})"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editarContacto('${yo().id}',${i})}">
        <span class="id"><b>${c.title || CANALES[c.type]}</b>

          <span class="permisos"><span class="permiso si">${CANALES[c.type]}</span></span>
        </span><span class="fl" style="color:var(--mut)">›</span>
      </div>`).join('')}</div>`
      : '<div class="vacio">Sin línea de soporte general.<br>Las cajas sin contacto propio no tienen a dónde derivar.</div>'}
    ${conPropios.length ? `<div class="rot" style="margin:16px 0 6px">Cajas con contacto propio</div>
      <div class="lista">${conPropios.map(s => `
        <div class="fila-b" style="cursor:default; opacity:.7">
          <span class="id"><b class="mono">${s.login}</b><span>${
            (CONTACTOS[s.id] || []).length ? 'usa los suyos, no los tuyos'
              : '⚠️ usa los suyos y no tiene ninguno'}</span></span>
        </div>`).join('')}</div>` : ''}
    <div class="acciones">
      <button class="btn sec" onclick="miCuenta()">Volver</button>
      <button class="btn" onclick="editarContacto('${yo().id}',-1)">+ Agregar</button>
    </div>`);
}

function miCuenta(){

     `usersettings` y contesta `error: "No rights"`, y Cruces de IP necesita un api_token que las
     cajas no tienen. Medido el 1-sep-2026 con un cajero de prueba. Antes se ofrecían igual y el
     único resultado era un error: mejor no ofrecer lo que no se puede hacer. */
  const conAjustes = ROL === 'agente' && !SUBAGENTE;
  /* 🔴 A Estadísticas se llega desde Movimientos (decisión del dueño, 27-ago: no ponerla en la

     le niega Movimientos, así que sin esto se queda sin ningún camino a una pantalla que sí

  const sinMovs = !seccionesDe(ROL, SUBAGENTE).includes('balance');
  abrirHoja(`

        <span class="tx">Estadísticas<small>El detalle del período, cuenta por cuenta</small></span>
        <span class="fl">›</span>

      ${conAjustes ? `<button onclick="misContactos()">
  <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12.2c0 3.9-3.8 7-8.5 7-1 0-2-.14-2.9-.4L4 20.5l1.5-3.7A6.6 6.6 0 013.5 12.2c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/></svg></span>
  <span class="tx">Medios de comunicación<small>La línea de soporte que ven todos tus jugadores</small></span>
  <span class="fl">›</span>
</button>` : ''}
      <button onclick="cambiarMiClave()">
        <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H21M18 12v3M15 12v2.2"/></svg></span>
        <span class="tx">Cambiar mi contraseña<small>Vas a necesitar la actual</small></span>
        <span class="fl">›</span>
      </button>
      ${conAjustes ? `<button onclick="cerrarHoja(); irSec('intersections')">
  <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l7.3 3.2v5.3c0 4.2-2.9 7.5-7.3 8.8-4.4-1.3-7.3-4.6-7.3-8.8V6.4z"/></svg></span>
  <span class="tx">Cruces de IP<small>Cuentas que entran desde la misma conexión</small></span>
  <span class="fl">›</span>
</button>` : ''}
      <button class="rojo" onclick="salir()">

function revisarClave(){

function cambiarCanal(cajaId, i, tipo){
  const lista = CONTACTOS[cajaId];
  const actual = i >= 0 ? lista[i] : null;
  /* Los campos de título y descripción ya no existen en el formulario: se conserva lo que
     tuviera la ficha, sin pedirlo ni borrarlo. */
  const datos = { type:tipo, title:actual ? actual.title : '',
    contact:$('cContacto') ? $('cContacto').value : (actual ? actual.contact : ''),
    description:actual ? actual.description : '' };
  if (i >= 0) lista[i] = { ...lista[i], ...datos }; else CONTACTOS.__nuevo = datos;
  editarContacto(cajaId, i);

function verLink(tipo){
  const el = $('cContacto');
  const limpio = limpiarContacto(tipo, el.value);
  if (el.value !== limpio) el.value = limpio;
  const v = limpio.trim();
  const err = revisarContacto(tipo, v);
  $('linkPrevio').classList.toggle('mal', !!v && !!err);
  $('linkPrevio').innerHTML = err
    ? `<span>${v ? '<b>' + err + '</b>' : err}</span>`
    : `<span>Tus jugadores entran a</span><b class="mono" style="font-size:11.5px">${linkDe(tipo, v)}</b>`;
}
function volverContactos(cajaId){ cajaId === yo().id ? misContactos() : abrirContactos(cajaId); }
function volverAConfig(id){ ACTUAL = SALAS.find(s => s.id === id) || ACTUAL; editarCaja(id); }
function guardarContacto(cajaId, i, tipo){
  /* 🔴 Estos dos campos ya NO están en el formulario: leerlos directo tiraba
     «Cannot read properties of null» y el botón Guardar no hacía nada. Se conserva lo que la
     ficha ya tenía. */
  const antes = i >= 0 ? (CONTACTOS[cajaId] || [])[i] : null;
  const datos = { type:tipo, title:(antes && antes.title) || '',
    contact:$('cContacto').value.trim(),
    description:(antes && antes.description) || '' };
  if (revisarContacto(tipo, datos.contact)) { verLink(tipo); return; }
  const lista = CONTACTOS[cajaId];
  if (i >= 0) lista[i] = { ...lista[i], ...datos };
  else lista.push({ id:String(200 + lista.length), ...datos });
  volverContactos(cajaId);
}
function borrarContacto(cajaId, i){
  CONTACTOS[cajaId].splice(i, 1);
  volverContactos(cajaId);
}

/* 🔴 El dominio NO se edita desde acá (dueño, 27-ago): vive en `useredit`, que guarda campo por

   tarea de soporte, que verifica contra los dominios habilitados de esa caja. */

/* Los permisos se cambian acá mismo: verlos sin poder tocarlos obliga a volver al panel viejo. */
function abrirSub(id){
  const s = SUBCAJEROS.find(x => x.id === id);
  const palanca = (campo, titulo, detalle) => `
    <div class="switch">
      <span class="tx"><b>${titulo}</b><span>${detalle}</span></span>
      <button class="palanca" role="switch" aria-checked="${s[campo]}"

    </div>`;
  abrirHoja(`
    <h3 id="hojaTit" class="mono">${s.login}</h3>
    <div class="sub">${s.name} · ID ${s.id} · sub-cajero</div>
    ${palanca('hide_hall_balance', 'Ocultar el saldo de la caja',
      'No ve cuántas fichas tiene la caja. Igual puede cargar y retirar.')}
    ${palanca('disable_statistic', 'Deshabilitar estadística',
      'No ve las estadísticas ni cómo le va al negocio.')}
    <div class="nota neutra">Los cambios se guardan al instante. La próxima vez que entre, ya las
    va a tener puestas.</div>
    <div class="acciones"><button class="btn" onclick="cerrarHoja()">Listo</button></div>`);
}
function tocarPermiso(id, campo){
  const s = SUBCAJEROS.find(x => x.id === id);
  s[campo] = !s[campo];
  abrirSub(id);       // se redibuja con el valor nuevo
  pintarSub();        // y la lista de atrás se actualiza sola
}

/* ══════ hoja ══════ */
function abrirHoja(html){ $('hojaCuerpo').innerHTML = html; $('hoja').classList.add('abierta'); $('fondo').classList.add('abierto'); }
function cerrarHoja(){
  ALTA_PREVIA = null;   /* la contraseña tipeada no sobrevive a cerrar la hoja */ $('hoja').classList.remove('abierta'); $('fondo').classList.remove('abierto'); }

/* El menú de acciones NO lo decide el skin: lo devuelve area=buttons&id=<nodo>. */
function abrirNodo(id){
  ACTUAL = hijos().find(x => x.id === id);
  const esSala = viendoSalas();
  /* La lista que se dibuja y la que se ejecuta tienen que ser LA MISMA: si se filtra
     una y no la otra, los índices se corren y tocar una acción ejecuta otra. */
  ACCIONES_ACTUALES = esSala ? ACCIONES_SALA : ACCIONES_TERMINAL;
  const acciones = ACCIONES_ACTUALES;
  /* 🔴 «SIN CONEXIÓN» NO. Quería decir que el jugador no está adentro del casino en este momento,
     pero se lee como que se cortó internet — y en una pantalla que sí depende de la red, eso
     asusta al pedo. El motor sólo sabe tres cosas de un jugador: si está jugando, si está adentro
     sin jugar, o ninguna de las dos. La tercera se dice sin dramatismo.
     Y «conectada» estaba en femenino, de cuando esto se llamaba «terminal». */
  /* 🔴 EL ESTADO SE DICE SÓLO CUANDO ES NOTICIA. «No está conectado» es el caso de casi todos
     los jugadores casi todo el tiempo: ocupaba el renglón para no informar nada, y encima se
     leía como un problema de red. Que esté jugando o adentro SÍ es noticia —querés saberlo
     antes de tocarle el saldo— y va con un punto verde, que se ve antes de leerse.
     El ID tampoco va: al operador no le dice nada. El saldo sí, que es a lo que vino. */
  const estado = esSala ? '' : ACTUAL.jugando ? 'jugando ahora' : ACTUAL.online ? 'conectado' : '';
  const t = esSala ? (TOTALES_CAJA[ACTUAL.id] || {})[CAJA_PER] : null;
  abrirHoja(`
    <h3 id="hojaTit" class="mono">${ACTUAL.login}</h3>
    <div class="sub">${esSala
      ? `${ACTUAL.terminals} ${ACTUAL.terminals === 1 ? 'jugador' : 'jugadores'}`
      : `${estado ? `<span class="punto ${ACTUAL.jugando ? 'jugando' : 'on'}"></span>${estado} · ` : ''}${
          yo().currency} ${fmt(ACTUAL.balance)}`}</div>
    ${(() => {
      if (esSala) return '';
      /* 🔴 SI NO ESTÁ EL DATO, NO VA EL RENGLÓN. Y NO SE PIDE.
         `ultimoMovimientoDe` lee de la copia local de movimientos, que sólo se llena si pasaste
         por la pestaña Movimientos de ese cajero. Llegando por el buscador está vacía, y esto
         afirmaba «Sin cargas ni retiros en este período» — falso: no es que no haya, es que no
         los cargamos. Encima sugería «probá con Esta semana» en una hoja que NO tiene selector
         de período: mandaba a hacer algo imposible.
         Se podría pedirlos, pero no se hace a propósito: a esta hoja se entra para cargar fichas
         rápido. Una llamada más por cada jugador que abrís, para un dato que casi nadie mira,
         paga el precio en lo único que importa acá, que es la velocidad. Si está a mano se
         muestra; si no, la hoja arranca antes. */
      const u = ultimoMovimientoDe(ACTUAL.id);
      if (!u) return '';
      return `<div class="ultimo">${u.tipo === 'in' ? 'Última carga' : 'Último retiro'}
        <b>${diaCorto(u.cuando)} ${u.cuando.slice(11,16)}</b>
        <span>${yo().currency} ${fmt(u.monto)}</span></div>`;
    })()}
    ${esSala ? `
      <div class="saldo unalinea" style="margin:12px 0">
        <div class="rot">Fichas</div>
        <div class="monto num"><small>${yo().currency}</small>${fmt(ACTUAL.balance)}</div>
      </div>
      ${tiraPeriodos(CAJA_PER, 'perCaja', { conCustom: false })}
      ${t ? resumen([['Cargas', fmt(t.in)], ['Retiros', fmt(t.out)],
                      ['Ganancia', fmt(t.profit), 'ok'], ['% de retorno', t.rtp, 'g'],
                      ['Jugando ahora', (TABLERO_CAJA[ACTUAL.id] || {}).summary_stats?.online_players ?? '—'],
                      ['Jugaron', totalPanel((TABLERO_CAJA[ACTUAL.id] || {}).active_players)]]) : ''}

function resumenDeCaja(id){ DENTRO = id; cerrarHoja(); irSec('dashboard'); }

function accion(i){
  const a = ACCIONES_ACTUALES[i];
  if (a.name === 'users')      return entrarEn(ACTUAL.id);
  if (a.name === 'sub')        return abrirSubDeCaja(ACTUAL.id);
  if (a.name === 'useredit' && viendoSalas()) return editarCaja(ACTUAL.id);
  if (a.contactos) return abrirContactos(ACTUAL.id);
  if (a.name === 'seguridad') { cerrarHoja(); return irSec('intersections'); }
  if (a.name === 'usersettings' && a.title.includes('autorización')) return claveDeOtro(ACTUAL.id);
  if (a.name === 'createuser' && a.grupo === '5') { const c = ACTUAL.id; entrarEn(c); return altaFormulario('5'); }
  if (a.name === 'createuser' && a.grupo === '8') return altaSubCajero(ACTUAL.id);
  if (a.name === 'balance' && a.mueve) return abrirMover();
  if (a.name === 'balance' && a.link) {

/* Dibuja una fila con el dato y su botón de copiar. */
/* `exacto` = hay que poder leerlo carácter por carácter: es una credencial o un link que alguien
   va a tipear o dictar por teléfono. Ahí la monoespaciada no es decoración. */
function filaCred(rotulo, valor, exacto){
  const id = 'cp' + Math.random().toString(36).slice(2, 8);
  window.__cred = window.__cred || {};
  window.__cred[id] = valor;
  return `<div class="cred">
    <span class="dt"><span>${rotulo}</span><b class="${exacto ? 'exacto' : ''}">${valor.replace(/</g,'&lt;')}</b></span>
    <button class="cp" id="${id}" onclick="copiarDe('${id}')">Copiar</button>
  </div>`;
}
/* Copia y lo dice en el mismo botón: nadie tiene que adivinar si funcionó. */
function copiarDe(id){
  const b = document.getElementById(id), texto = (window.__cred || {})[id] || '';
  if (navigator.clipboard) navigator.clipboard.writeText(texto).catch(() => {});
  if (!b) return;
  const antes = b.textContent;
  b.textContent = 'Copiado ✓'; b.classList.add('ok');
  setTimeout(() => { b.textContent = antes; b.classList.remove('ok'); }, 1800);
}

function copiar(texto, mensaje){
  if (navigator.clipboard) navigator.clipboard.writeText(texto).catch(() => {});
  const acceso = `Login:${ACTUAL.login} Contraseña:${ACTUAL.password}`;
  const link = `${TICKET_URL}?u=${ACTUAL.login}&p=${ACTUAL.password}`;
  abrirHoja(`<div class="resultado"><div class="sello">✓</div><h3>${mensaje}</h3>
      <div class="sub">Ya está en el portapapeles. Las dos cosas, por si querés la otra:</div></div>

    <div class="acciones">
      <button class="btn sec" onclick="abrirNodo('${ACTUAL.id}')">Volver</button>
      <button class="btn" onclick="compartirTexto(\`${acceso}\n${link}\`)">Compartir</button></div>`);
}
/* navigator.share: en el celular abre el compartir nativo — WhatsApp y listo. */
function compartirTexto(texto){
  if (navigator.share) { navigator.share({ title:'User data', text:texto }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(texto).catch(() => {});
  abrirHoja(`<div class="resultado"><div class="sello">✓</div><h3>Acceso copiado</h3>
    <div class="sub">Este navegador no tiene compartir nativo, así que lo dejé en el portapapeles.</div></div>
    <div class="acciones"><button class="btn" onclick="cerrarHoja()">Listo</button></div>`);
}

/* Las transacciones de UN jugador. No es la misma pantalla que la de la caja:
   sus tipos son otros y cada fila trae la IP desde la que se hizo. */
function transaccionesDe(id){
  JUG_RANGO = id;
  const j = TERMINALES.find(t => t.id === id) || ACTUAL;
  const r = rango(MJ_PER, 'jug');
  const todas = (MOVS_JUGADOR[id] || []).filter(m => {
    const d = m.datetime.slice(0, 10);
    return d >= r.from && d <= r.to && (MJ_BONOS ? !!m.bono : !m.bono);
  });
  const suma = todas.reduce((a, m) => { a[m.operation] += m.cash; return a; }, { in:0, out:0 });
  abrirHoja(`
    <h3 id="hojaTit" class="mono">${j.login}</h3>
    <div class="sub">Últimas transacciones · saldo ${yo().currency} ${fmt(j.balance)}</div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${!MJ_BONOS}" onclick="verMovJug('${id}',false)">Fichas</button>
      <button role="tab" aria-selected="${MJ_BONOS}" onclick="verMovJug('${id}',true)">Jackpots</button>
    </div>
    ${tiraPeriodos(MJ_PER, 'perMovJug', { rangoCustom: CUSTOMS.jug })}
    <div class="rango"><b>${rotuloRango(r)}</b>
      <span>${todas.length} ${todas.length === 1 ? 'movimiento' : 'movimientos'}</span></div>
    ${!MJ_BONOS ? resumen([['Depósitos', fmt(suma.in), 'ok'], ['Retiros', fmt(suma.out), 'no'],
                            ['Ganancia', fmt(suma.in - suma.out)]]) : ''}
    ${todas.length ? (() => {
      /* Misma lógica que la lista de Movimientos, para que las dos se lean igual: la fecha va
         UNA vez por día en un encabezado, la hora es una columna, y el saldo de antes se guarda
         hasta que tocás la fila. Acá el detalle ya existía —quién lo hizo y desde qué IP— así
         que el «antes» se suma ahí en vez de abrir otro mecanismo aparte. */
      let dia = null;
      return todas.map((m, i) => {
        const d = m.datetime.slice(0, 10);
        const cabeza = d !== dia ? (dia = d, `<div class="diahead">${diaLargo(d)}</div>`) : '';
        const quedo = m.operation === 'out' ? m.cash_before - m.cash : m.cash_before + m.cash;
        return cabeza + `
      <div class="mov mov-toca ${MJ_ABIERTA === i ? 'abierta' : ''}" role="button" tabindex="0"
        onclick="abrirMovJug('${id}',${i})"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirMovJug('${id}',${i})}">
        <span class="hora">${m.datetime.slice(11,16)}</span>
        <span class="sig ${m.operation==='out'?'menos':''}">${m.operation==='out'?'−':'+'}</span>
        <span class="qu">${m.bono ? `<b>${m.bono}</b>` : ''}</span>
        <span class="mn num ${m.operation==='out'?'menos':'mas'}">${m.operation==='out'?'−':'+'}${fmt(m.cash)}</span>
        ${MJ_ABIERTA === i ? `<span class="antes">antes ${fmt(m.cash_before)} → quedó <b>${fmt(quedo)}</b>
          · ${m.initiator === 'sistema' ? 'automático, sin persona detrás' : quienLoHizo(m.initiator)}${
          m.ip ? ` · desde <span class="mono">${m.ip}</span>` : ''}</span>` : ''}
      </div>`; }).join('');
    })()
      : `<div class="vacio">Sin ${MJ_BONOS ? 'jackpots' : 'movimientos'} en este período.${proponerOtroPeriodo(PER_MOV)}</div>`}
    <div class="acciones">
      <button class="btn sec" onclick="abrirNodo('${id}')">Volver</button>
      <button class="btn" onclick="abrirMoverDe('${id}')">Cargar o retirar</button>
    </div>`);
}

/* Sólo molesta cuando la caja NO deja retirar de a partes. Si está bien configurada,
   no hay nada que decir. */
let OCULTAR_AVISO_TOTAL = false;
function cajaDe(nodo){
  if (SALAS.some(s => s.id === nodo.id)) return nodo;
  const t = TERMINALES.find(x => x.id === nodo.id);
  return SALAS.find(s => s.id === (t ? t.sala : DENTRO)) || null;
}
/* El aviso anterior culpaba a `cashout_all`, y medimos que no es eso: el retiro total
   lo provoca `all=true`, que manda la interfaz. El skin no lo manda nunca, así que no hay
   nada que avisarle al usuario. */
function avisoRetiroTotal(){ return ''; }

function cambiarOp(op){ OP = op; abrirHoja(vistaMover()); }
/* Medido el 26-ago: `all=false` mueve el monto exacto; `all=true` mueve TODO e ignora el monto.
   "Todo" usa all=true a propósito — si el jugador está jugando, el saldo cambia entre que se lee
   y se confirma, y así se lleva lo que haya en ese instante en vez de dejar un resto.
   Cualquier monto escrito a mano va SIEMPRE con all=false. */
let TODO_EL_SALDO = false;
function ponerMonto(v, esTodo){
  TODO_EL_SALDO = !!esTodo;
  $('monto').value = v ? fmt(v) : '';
  revisarMonto();
}
/* 🔴 EL PUNTO Y LA COMA NO SE BORRAN. Acá estaba el peor error de todo el panel.
   Era `replace(/[^\d]/g,'')`: sacaba TODO lo que no fuera dígito, incluida la coma decimal.
   El botón «Todo» escribe el saldo formateado —7.028,6— y esto lo leía como 70286: DIEZ VECES
   MÁS. Con dos decimales, cien veces. Y no avisaba nada: el campo mostraba 70.286 y el operador
   veía un número que no había escrito.
   Encontrado el 1-sep-2026 con una caja de 7.028,6 que ofrecía cargar 70.286.
   El formato es el de acá: «.» separa miles y «,» decimales. Se sacan los puntos y la coma pasa
   a punto, que es lo único que Number() entiende. */
/* `aNumero` y `mismoNombre` viven en caja-logica.js, donde los cubren los tests. */
function leerMonto(){ return aNumero($('monto').value); }
/* El teclado del teléfono igual deja pegar texto: por las dudas, se limpia al confirmar. */
/* Lo que no es dígito no entra. Antes se aceptaba "s8788" y por dentro se leía 8788:
   el campo mostraba una cosa y el sistema entendía otra. */
function limpiarCampoNumero(id){
  const el = $(id);
  if (!el) return 0;
  const n = aNumero(el.value);
  /* Mientras escribe, una coma al final o un «,5» a medio tipear no se pueden re-formatear sin
     comerle lo que está tecleando. En ese caso se deja el texto como está y sólo se devuelve el
     número; se acomoda solo cuando termina de escribir el decimal. */
  const tecleandoDecimal = /[.,]\d?$/.test(String(el.value));
  const bonito = String(el.value).trim() === '' ? '' : fmt(n);
  if (!tecleandoDecimal && el.value !== bonito) {
    const alFinal = el.selectionStart === el.value.length;
    el.value = bonito;
    if (alFinal) { try { el.setSelectionRange(bonito.length, bonito.length); } catch {} }
  }
  return n;
}

function revisarMonto(){
  const antes = $('monto').value;
  const v = limpiarCampoNumero('monto');
  if (TODO_EL_SALDO && antes !== fmt(OP === 'in' ? bolsillo().balance : ACTUAL.balance)) TODO_EL_SALDO = false;
  const tope = OP === 'in' ? (yo().hide_hall_balance ? Infinity : bolsillo().balance) : ACTUAL.balance;
  const pasado = v > tope;
  $('monto').classList.toggle('mal', pasado);
  $('tope').classList.toggle('mal', pasado);
  $('tope').innerHTML = pasado
    ? `<span>Te faltan ${yo().currency} ${fmt(v - tope)}</span><b class="num">tenés ${fmt(tope)}</b>`
    : `<span>${OP === 'in' ? (DENTRO ? 'Fichas del cajero' : 'Tus fichas') : 'Fichas ahí adentro'}</span><b class="num">${
        tope === Infinity ? '—' : yo().currency + ' ' + fmt(tope)}</b>`;
  $('seguir').disabled = !(v > 0 && !pasado);
}
function confirmarMov(){
  const v = leerMonto(), carga = OP === 'in';
  abrirHoja(`

    <div class="sub">Revisá los números antes de mover las fichas.</div>
    <div class="confirmar">
      <div class="fila"><span>${viendoSalas()?'Cajero':'Jugador'}</span><b class="mono">${ACTUAL.login}</b></div>
      <div class="fila"><span>${TODO_EL_SALDO ? 'Todo el saldo' : 'Monto exacto'}</span>
        <b class="num ${carga?'mas':'menos'}">${carga?'+':'−'} ${fmt(v)}</b></div>
      ${TODO_EL_SALDO && !carga ? `<div class="fila"><span>Ojo</span>
        <b style="font-weight:600;color:var(--mut2);font-size:12.5px;text-align:right">${viendoSalas()
          /* 🔴 EL AVISO TIENE QUE HABLARLE A QUIEN ES. «Aunque esté jugando» es para un jugador;
             un cajero no juega, y decírselo hace dudar de todo el resto del cartel. El riesgo con
             una caja es otro y también vale avisarlo: puede estar moviendo fichas en ese momento.
             Reportado el 2-sep-2026 mirando la pantalla. */
          ? 'se lleva lo que haya al confirmar; si está cargando fichas ahora, el número puede cambiar'

/* 🔴 EL LOGIN SE LIMPIA MIENTRAS SE ESCRIBE. El motor acepta crear cuentas con espacios y con
   signos, y después esas cuentas fallan: no se puede entrar con ellas y el link de acceso sale
   roto. Es una trampa del motor, no algo que el operador tenga que saber.
   Antes se podía tipear «l176286 e» y el formulario lo daba por bueno. Ahora lo que no sirve no
   entra: sólo letras y números. Se filtra al escribir —no al apretar Crear— así el operador ve
   en el momento qué se puede poner y qué no, en vez de recibir un error después.
   Se avisa SÓLO si se sacó algo: si escribís bien, no aparece ningún mensaje. */
function limpiarLogin(id){
  const el = $(id || 'nlogin');
  if (!el) return { valor: '', saco: false };
  const crudo = el.value;
  const limpio = limpiarTextoLogin(crudo);
  if (crudo !== limpio) {
    const alFinal = el.selectionStart === crudo.length;
    el.value = limpio;
    if (alFinal) { try { el.setSelectionRange(limpio.length, limpio.length); } catch (e) {} }
  }
  return { valor: limpio, saco: crudo !== limpio };
}

function revisarAlta(){
  const { valor: login, saco } = limpiarLogin('nlogin');
  const avisoL = $('avisoNlogin');
  if (avisoL) {
    avisoL.className = saco ? 'tope mal' : 'tope';
    avisoL.innerHTML = saco
      ? '<span>Sin espacios ni signos: sólo letras y números</span>'
      : (login && login.length < 3 ? '<span>Por lo menos 3 letras o números</span>' : '');
  }
  const l = login, c = $('nclave').value;
  const esJugador = $('ngrupo').value === '5';
  const claveOk = avisarClave('avisoNclave', c, esJugador);
  const bal = $('nbal') ? limpiarCampoNumero('nbal') : 0;

      : `<span>Lo que tiene ${DENTRO ? 'el cajero' : 'tu cuenta'} ahora</span><b class="num">${yo().currency} ${fmt(maxAlta())}</b>`;
  }
  $('crear').disabled = !(l.length >= 3 && claveOk && !pasado);
}
