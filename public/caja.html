<style>
/* ─────────────────────────────────────────────────────────────────────────
   Mi Caja — GANAMOS × Latam. Prototipo con la estructura REAL del motor.
   Todo lo que se ve acá sale de algo medido en admin.ganamos-lat.com:
   los menús vienen de area=buttons, el dashboard de dashboardinfo, los
   movimientos de area=balance. Los números son de ejemplo; la forma no.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#faf7fd; --bg2:#ffffff; --bg3:#f3ecfa; --bg4:#eae0f5;
  --bor:#e5dcf0; --bor2:#d3c4e4;
  --txt:#241b2e; --mut:#7d7189; --mut2:#615670;
  --g:var(--m1); --g-soft:#f1e8fc; --g-ink:#4c1d95;
  /* Texto sobre un fondo de acento. En claro el acento es oscuro → texto blanco;
     en oscuro el acento es claro → texto oscuro. Sin esto hay que parchear cada botón. */
  --sobre-g:#ffffff; --sobre-no:#ffffff;
  /* ══════ LA PALETA, DECIDIDA UNA VEZ ══════
     Cuatro acentos y nada más, cada uno con un trabajo fijo:
       ok    verde menta  → a favor: ganancia, cargas, conectado
       no    rosa coral   → en contra: retiros, pérdidas, eliminar
       warn  ámbar        → mirá esto: fichas congeladas, cuentas cruzadas
       dato  turquesa     → un número que no es bueno ni malo: RTP, promedios
     Cada uno tiene su versión `-m` para cuando el fondo es el morado de la marca: los mismos
     colores subidos de luminosidad, porque un verde oscuro sobre morado oscuro no se lee.
     Las series de los gráficos salen de la misma familia — nada de un color por serie. */
  --ok-m:#6ee7b7; --no-m:#fda4af; --warn-m:#fcd34d; --dato-m:#67e8f9;
  --dato:#0e7490; --dato-soft:#e2f5fa;
  --s0:#7c3aed; --s1:#0e7490; --s2:#b45309; --s3:#be123c;
  /* El morado de la casa. Lo llevan los tres protagonistas —la puerta, la barra y las fichas—
   para que el login y el panel se lean como un mismo producto. El resto queda neutro: adentro
   se trabaja horas y el morado a pantalla completa cansa. */
  /* UN solo par de moradas para toda la marca. Lo único que cambia entre superficies es el
     ángulo: vertical en las tarjetas, horizontal en la barra y el botón. Tres degradados con
     colores distintos se leen como tres marcas. */
  --m1:#5b21b6; --m2:#2a0b4d;
  --lg-a:var(--m1); --lg-b:var(--m2); --lg-halo:rgba(214,178,255,.42);
  --marca-grad:linear-gradient(168deg, var(--m1) 0%, var(--m2) 100%);
  --marca-barra:linear-gradient(96deg, var(--m1) 0%, var(--m2) 100%);
  --marca-accion:linear-gradient(100deg, var(--m1) 0%, var(--m2) 100%);
  --lg-tx:#ffffff; --lg-tx2:rgba(255,255,255,.66); --lg-campo:rgba(255,255,255,.11);
  --lg-borde:rgba(255,255,255,.19); --lg-ink:#3b1173;
  --oro:#9c7719; --oro-soft:#f8f0d9;
  --ok:#0f8b57; --ok-soft:#e0f5ec;
  --no:#c62348; --no-soft:#fdeaee;
  --warn:#a16207; --warn-soft:#fdf3dd;
  --info:#1c5a86; --info-soft:#e8f1f8;
  --demo:#a3216b; --demo-soft:#ffe6f2;   /* SOLO PROTOTIPO — no va en producción */
  --sombra:0 1px 2px rgba(36,27,46,.05), 0 8px 24px -14px rgba(36,27,46,.24);
  --sheet:0 -8px 40px -12px rgba(36,27,46,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141019; --bg2:#1d1725; --bg3:#26202f; --bg4:#312a3b;
    --bor:#342c3f; --bor2:#463c53;
    --txt:#f1ecf7; --mut:#a397b0; --mut2:#bcb1c6;
    --g:#c78ef0; --g-soft:#33204a; --g-ink:#ddb8f7;
    --sobre-g:#170f1f; --sobre-no:#2b0f0c;
    --ok-m:#6ee7b7; --no-m:#fda4af; --warn-m:#fcd34d; --dato-m:#67e8f9;
    --dato:#22d3ee; --dato-soft:#123842;
    --s0:#a78bfa; --s1:#22d3ee; --s2:#fbbf24; --s3:#fb7185;
    --m1:#4c1d95; --m2:#170628;
    --lg-a:var(--m1); --lg-b:var(--m2); --lg-halo:rgba(186,160,255,.34);
    --marca-grad:linear-gradient(168deg, var(--m1) 0%, var(--m2) 100%);
    --marca-barra:linear-gradient(96deg, var(--m1) 0%, var(--m2) 100%);
    --marca-accion:linear-gradient(100deg, var(--m1) 0%, var(--m2) 100%);
    --lg-tx:#f4eeff; --lg-tx2:rgba(244,238,255,.6); --lg-campo:rgba(255,255,255,.08);
    --lg-borde:rgba(255,255,255,.14); --lg-ink:#2a0b4d;
    --lg-a:#341070; --lg-b:#150522; --lg-halo:rgba(186,160,255,.34);
    --lg-tx:#f4eeff; --lg-tx2:rgba(244,238,255,.6); --lg-campo:rgba(255,255,255,.08);
    --lg-borde:rgba(255,255,255,.14); --lg-ink:#2a0b4d;
    --ok-m:#6ee7b7; --no-m:#fda4af; --warn-m:#fcd34d; --dato-m:#67e8f9;
    --dato:#22d3ee; --dato-soft:#123842;
    --s0:#a78bfa; --s1:#22d3ee; --s2:#fbbf24; --s3:#fb7185;
    --oro:#e3bd6a; --oro-soft:#332a14;
    --ok:#4ade80; --ok-soft:#123023;
    --no:#fb7185; --no-soft:#3a1620;
    --warn:#fbbf24; --warn-soft:#32250f;
    --info:#8cc4e6; --info-soft:#13242f;
    --demo:#f2a3ca; --demo-soft:#341a28;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 24px -14px rgba(0,0,0,.75);
    --sheet:0 -8px 40px -12px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#141019; --bg2:#1d1725; --bg3:#26202f; --bg4:#312a3b;
  --bor:#342c3f; --bor2:#463c53;
  --txt:#f1ecf7; --mut:#a397b0; --mut2:#bcb1c6;
  --g:#c78ef0; --g-soft:#33204a; --g-ink:#ddb8f7;
  --sobre-g:#170f1f; --sobre-no:#2b0f0c;
  --oro:#e3bd6a; --oro-soft:#332a14;
  --ok:#63c795; --ok-soft:#17301f;
  --no:#f2837a; --no-soft:#3a1c1a;
  --warn:#e0b063; --warn-soft:#332612;
  --info:#8cc4e6; --info-soft:#13242f;
  --demo:#f2a3ca; --demo-soft:#341a28;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 24px -14px rgba(0,0,0,.75);
  --sheet:0 -8px 40px -12px rgba(0,0,0,.8);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   LA PIEL MAGENTA · Mi Caja se ve como el panel de agentes de Ganamos.
   Aprobado en maqueta el 1-sep-2026.

   ⚠️ SE APARTA DE UNA DECISIÓN QUE ESTÁ ESCRITA MÁS ARRIBA: «el resto queda neutro,
      adentro se trabaja horas y el morado a pantalla completa cansa». Sigue siendo
      cierto, y por eso acá los textos NO son el violeta apagado del panel original
      —que da 3:1— sino blanco y lavanda claro: 14:1 el principal, 8:1 el secundario.
      El aspecto es el mismo; lo que cambia es que se puede leer un turno entero.

   POR QUÉ `:root:root` Y NO `:root`: arriba hay tres bloques que definen la paleta
   —el claro, el de `prefers-color-scheme: dark` y el de `[data-theme="dark"]`— y los
   dos últimos pesan 0,2,0. Un `:root` pelado pesa 0,1,0 y perdería contra ellos en
   oscuro. `:root:root` empata en peso y, al venir después, gana. Así la piel es la
   misma tenga el sistema el tema que tenga.

   Sólo se tocan superficies, tinta y acento. El login y sus degradados (`--lg-*`,
   `--marca-grad`) quedan como estaban a propósito: esa pantalla ya está bien.
   ═══════════════════════════════════════════════════════════════════════════════ */
:root:root{
  --bg:#1d0c29; --bg2:#37194a; --bg3:#452259; --bg4:#532a68;
  --bor:#3f1d52; --bor2:#552a6b;
  --txt:#ffffff; --mut:#a97cc0; --mut2:#dcb8ef;

  /* ── EL MAGENTA, EN DOS TONOS Y NO EN UNO ──────────────────────────────────────
     Con un solo valor no se podía: `#d616d6` daba 4,3:1 como texto —por debajo del
     mínimo, y se usa como texto en 23 lugares— y subirlo empeoraba el blanco de los
     botones que van encima. Son dos trabajos distintos y necesitan dos tonos:
       --g       para TEXTO y bordes → 5,8:1 sobre el fondo, 4,7:1 sobre la tarjeta
       --g-fill  para RELLENOS con blanco encima → es el tono del panel de agentes,
                 y ahí el texto es grande y en negrita, donde 3:1 alcanza
     El ojo los lee como el mismo magenta; la diferencia sólo aparece al medirla. */
  --g:#e64ee6; --g-fill:#d616d6; --g-soft:#3a1147; --g-ink:#f472f4;
  --sobre-g:#ffffff; --sobre-no:#ffffff;

  /* La barra de arriba y los botones de acción. */
  --marca-barra:linear-gradient(96deg,#2d1240 0%,#1d0c29 100%);
  --marca-accion:linear-gradient(135deg,#a819b8 0%,#d616d6 100%);

  /* Los cuatro semánticos, subidos para que se lean sobre el magenta oscuro. Sus
     fondos llevan el mismo sesgo violeta: un gris neutro acá se ve sucio. */
  /* ⚠️ LOS FONDOS LLEVAN VIOLETA ADENTRO, Y NO ES UN CAPRICHO.
     El primer intento usó los fondos de siempre —verde oscuro, oliva, teal— y sobre
     el magenta se veían SUCIOS: son familias de color que no se hablan, y el oliva
     era el peor (la cinta de «en pruebas» y el cartel del sub-agente parecían una
     mancha pegada). Ahora cada fondo es su color mezclado con el violeta del panel:
     se siguen leyendo como verde, ámbar o rojo, pero pertenecen a la misma pantalla.
     La señal la dan el texto y el borde, que sí van saturados. */
  --ok:#3ddc97;   --ok-soft:#1c3a38;
  --no:#fb7185;   --no-soft:#3d1c33;
  --warn:#fcd34d; --warn-soft:#3b2a33;
  --dato:#67e8f9; --dato-soft:#1b3348;
  --info:var(--dato); --info-soft:var(--dato-soft);
  /* 🔴 «ORO» YA NO ES UN COLOR APARTE. Marcaba «jugando ahora» en naranja, y era la novena
     familia de tono del panel: violeta, magenta, verde, rojo, cyan, ámbar, naranja, azul, gris.
     Nueve colores no se leen como un sistema, se leen como ruido — que fue justo lo que se vio.
     «Jugando ahora» no es ni bueno ni malo, es un estado: le va el mismo cyan que el % de
     retorno y los promedios, que ya significa eso. Se deja el nombre para no tocar los dos
     lugares que lo usan. */
  --oro:#67e8f9;  --oro-soft:#1b3348;
  --demo:#c9a5e0; --demo-soft:#31163f;

  --sombra:0 6px 22px rgba(0,0,0,.42);
  --sheet:#31163f;
}

/* ── LA CINTA DE «EN PRUEBAS» ──────────────────────────────────────────────────
   Iba con `--warn-soft`, que es oliva. Sobre magenta se ve sucia: son dos familias
   de color que no se hablan. El fondo pasa al violeta de la barra —así la cinta
   parece parte del panel y no una mancha pegada arriba— y el texto sube a ámbar
   claro, que sobre ese violeta da 9,5:1. Sigue leyéndose como aviso; deja de
   ensuciar. */
:root:root .aviso{
  background:linear-gradient(180deg,#2d1240,#241036);
  color:#fcd34d;
  border-bottom:1px solid rgba(252,211,77,.22);
}

/* ── LA TARJETA DEL SALDO ──────────────────────────────────────────────────────
   Quedaba plana porque toma `--marca-grad`, que no se tocó. Le va el degradado de
   la maqueta: un halo claro arriba a la derecha sobre una base violeta profunda.
   Son DOS capas —el radial encima del lineal— y ahí está la diferencia: un degradado
   solo se ve chato, el halo le da volumen y hace que el número flote.
   No se toca `--marca-grad` en sí porque de ahí también sale la tarjeta del login,
   que ya está bien. */
/* ── LA PUERTA ─────────────────────────────────────────────────────────────────
   El login se había quedado con el violeta viejo: entrabas por una puerta de un
   color y caías en un panel de otro, que se lee como dos productos distintos.
   Ahora lleva el mismo magenta, y la misma receta de dos capas que el saldo: el
   halo detrás del perro sale del degradado, no de un resplandor aparte.
   El campo autocompletado por Chrome también se pinta acá — si no, Chrome le mete
   su fondo blanco y el «Ver» desaparece. */
:root:root .tarjeta{
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(240,150,255,.34), transparent 58%),
    linear-gradient(168deg,#8e2aa5 0%,#33124a 74%);
  box-shadow:0 18px 46px -20px rgba(0,0,0,.8);
}
:root:root .tarjeta .btn{
  background:linear-gradient(135deg,#f472f4,#d616d6);
  color:#fff; box-shadow:0 6px 20px rgba(214,22,214,.45);
}
:root:root .tarjeta .btn:hover{filter:brightness(1.1); background:linear-gradient(135deg,#f472f4,#d616d6)}
:root:root .tarjeta .ojo{background:#3f0f52; border-color:transparent; color:#fff}
:root:root .tarjeta .ojo:hover{background:#fff; color:#3f0f52}
:root:root .tarjeta .entrada:-webkit-autofill,
:root:root .tarjeta .entrada:-webkit-autofill:hover,
:root:root .tarjeta .entrada:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 100px #4b1a63 inset; box-shadow:0 0 0 100px #4b1a63 inset;
  -webkit-text-fill-color:#fff; caret-color:#fff;
}
/* El halo del perro, en la familia del magenta. */
:root:root{--lg-halo:rgba(240,150,255,.40)}

/* ── EL SALDO, COMO EN LA MAQUETA ──────────────────────────────────────────────
   Ícono a la izquierda, el número grande y debajo qué es. Antes el rótulo iba
   arriba a la izquierda y la cifra suelta a la derecha, y a esa distancia dejaban
   de leerse como una sola cosa. Juntos, el número manda y la palabra lo explica.

   La tipografía de los números y los títulos pasa a Outfit: es más redonda y más
   angosta que Instrument Sans, así que la cifra entra más grande sin apretar. El
   texto corrido se queda en Instrument Sans — cambiarlo entero no aportaba nada y
   costaba otra fuente para bajar. */
/* ── EL LOGO DE GANAMOS EN LA PUERTA ───────────────────────────────────────────
   Es el archivo de la marca, recortado y con el blanco vuelto transparente: tal cual
   venía, sobre la tarjeta violeta era un rectángulo blanco.
   El texto sigue adentro del <h1> pero oculto, así el lector de pantalla y la pestaña
   siguen diciendo GANAMOS aunque la imagen no cargue. */
/* ── LAS TARJETAS DEL RESUMEN, COMO EN EL PANEL DE AGENTES ─────────────────────
   Ícono a la izquierda, el número arriba y la etiqueta debajo. Antes iban centradas,
   con la etiqueta arriba y el número abajo: se leían como un título con un dato, y
   lo que importa es el dato.

   Va en grilla y no en flex porque el marcado trae la etiqueta ANTES que el número
   —así estaba, y no vale la pena tocarlo en cada tarjeta del archivo— así que hay
   que ponerlos en su fila a mano. Las tarjetas anchas además traen un gráfico de
   tercer hijo: esa última regla lo manda abajo, cruzando las dos columnas. */
/* ── LAS DOS PUERTAS DEL HUB ───────────────────────────────────────────────────
   Son sólo dos, así que ocupan lo que necesitan y no hay que apretarlas: más altas,
   con el mismo degradado horizontal que la tarjeta del saldo. Antes una era magenta
   y la otra gris, lo que sugería que una valía más; las dos son cosas que hacés todos
   los días.

   El ícono va suelto —sin el cuadradito de fondo que tenía— y de un solo trazo. El
   glow sale de `drop-shadow`, que sigue la forma del dibujo; un `box-shadow` habría
   iluminado el cuadrado, no el ícono. */
/* ── LA FILA DE UN CAJERO ──────────────────────────────────────────────────────
   Los dos datos —cuántos jugadores tiene y cuántos están conectados— van con ícono
   y número, no en palabras. Antes decía «· 6 jugadores · 0 conectados», que en un
   teléfono angosto partía el renglón y hacía la lista más alta de lo necesario. */
/* ── LOS ÍCONOS Y LA JERARQUÍA DE LAS HOJAS ────────────────────────────────────
   Los tres de «Fichas y pagos» eran símbolos de texto (◉ ▭ ▤) dentro de un cuadrito
   gris: se veían como un glifo suelto, no como un ícono, y no se parecían en nada a
   los del resto. Ahora son de un trazo, sin caja, con el mismo glow tenue que el hub.

   Y los tamaños: antes el título y la bajada pesaban casi igual y las tres opciones
   se leían como un párrafo. El título sube y toma Outfit, la bajada baja y se apaga.
   Los emojis que quedan (🔑 💬 🛡 🔗) se dejan a propósito: ésos SÍ se leen como
   íconos y cambiarlos era tocar seis pantallas más sin que nadie lo pidiera. */
/* 🔴 EL TAMAÑO VA EN `.mk`, NO SÓLO DENTRO DE `.acc`. Cuando los emojis pasaron a SVG, el
   tamaño se puso sólo para los de las hojas de acciones. Los `.mk` que viven en otras pantallas
   —la Configuración de una caja, por ejemplo— quedaron sin límite, y un SVG sin ancho se estira
   hasta llenar lo que tenga: el ícono del link ocupaba media pantalla.
   Regla general primero; las hojas después le ajustan lo suyo. */
/* ── LA NOTA CON «MÁS INFO» ────────────────────────────────────────────────────
   La (i) es un botón redondo, chico y del color del acento: se ve que se puede tocar
   sin competirle a la acción principal de la pantalla. El detalle aparece debajo,
   separado por una línea, para que se entienda que es lo mismo ampliado y no otra cosa. */
/* ── QUÉ ES CADA CAJA DE TEXTO ─────────────────────────────────────────────────
   Había tres cosas distintas con la misma forma —te explico, te aviso, te falló— y sólo
   las separaba el color. Una caja con texto se lee como alerta aunque no lo sea, y el
   operador termina ignorándolas todas.
   Ahora la EXPLICACIÓN lleva su ícono de información a la izquierda: se reconoce antes
   de leerla. Los avisos y los errores no lo llevan, así que la diferencia salta sola.
   Va en CSS y no en el marcado, para que las alcance a todas de una. */
/* La nota explica la pantalla; la lista es la pantalla. Sin aire en el medio se leen como
   una sola cosa y la primera fila parece parte del texto. */
:root:root .nota + .lista, :root:root .nota.coninfo + .lista{margin-top:16px}
:root:root .nota{margin-bottom:0}

/* El punto verde dentro del subtítulo: se ve antes de leer la palabra. */
:root:root .sub .punto{display:inline-block; vertical-align:middle; margin-right:6px}

:root:root .nota.neutra{
  /* 🔴 NO se usa flex acá. El primer intento puso `display:flex` para acomodar el ícono, y eso
     convirtió en COLUMNAS todo lo que la nota tuviera en línea: un texto con un <b> en el medio
     —«Las fichas salen de GanamosxLatamCaja, no de tu cuenta»— se partía en tres bloques uno al
     lado del otro. El texto de una nota tiene que fluir como texto.
     El ícono va absoluto sobre un espacio reservado con padding: no toca el flujo. */
  position:relative;
  padding-left:40px;
}
:root:root .nota.neutra::before{
  content:''; position:absolute; left:14px; top:13px; width:19px; height:19px; margin-top:1px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23c6b0ea'%20stroke-width='1.8'%20stroke-linecap='round'%3E%3Ccircle%20cx='12'%20cy='12'%20r='9'/%3E%3Cpath%20d='M12%2011v5.5'/%3E%3Cpath%20d='M12%207.6v.1'/%3E%3C/svg%3E") center/contain no-repeat;
  opacity:.85;
}
/* La que trae «más info» apila la línea y el detalle, así que el ícono se mueve adentro
   de la línea — pero lo lleva igual: sigue siendo una explicación. */
:root:root .nota.coninfo{flex-direction:column; gap:0; padding-left:14px}
:root:root .nota.coninfo::before{display:none}
:root:root .nota.coninfo .linea{display:flex; align-items:flex-start; gap:11px}
:root:root .nota.coninfo .linea::before{
  content:''; flex:none; width:19px; height:19px; margin-top:1px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23c6b0ea'%20stroke-width='1.8'%20stroke-linecap='round'%3E%3Ccircle%20cx='12'%20cy='12'%20r='9'/%3E%3Cpath%20d='M12%2011v5.5'/%3E%3Cpath%20d='M12%207.6v.1'/%3E%3C/svg%3E") center/contain no-repeat;
  opacity:.85;
}
:root:root .nota.coninfo .linea > span{flex:1; min-width:0}
:root:root .masinfo{
  flex:none; width:23px; height:23px; border-radius:99px; cursor:pointer;
  border:1.5px solid var(--g); background:none; color:var(--g);
  font-family:'Outfit',sans-serif; font-size:13px; font-weight:700; font-style:italic;
  line-height:1; display:grid; place-items:center; padding:0;
  transition:background .13s, color .13s;
}
:root:root .masinfo:hover,
:root:root .masinfo[aria-expanded="true"]{background:var(--g-fill); border-color:var(--g-fill); color:#fff}
:root:root .detalle-info{
  margin-top:10px; padding-top:10px; border-top:1px solid var(--bor2);
  font-size:13px; color:var(--mut2);
}

:root:root .mk{display:inline-grid; place-items:center; flex:none}
:root:root .mk > svg{width:22px; height:22px}

:root:root .acc .mk{
  width:26px; height:26px; border-radius:0; background:none; color:var(--tinta2);
  display:grid; place-items:center;
}
:root:root .acc .mk svg{width:23px; height:23px}
:root:root .acc button.destaca .mk, :root:root .acc button:hover .mk{
  background:none; color:#fff;
  filter:drop-shadow(0 0 7px rgba(240,150,255,.55));
}
/* «Cerrar sesión» también sin caja: el cuadradito rojo pesaba más que la acción y
   era lo primero que veías al abrir la hoja. El color y el glow ya alcanzan. */
:root:root .acc button.rojo .mk{background:none; color:var(--no)}
:root:root .acc button.rojo:hover .mk{filter:drop-shadow(0 0 7px rgba(251,113,133,.6))}
:root:root .acc button.rojo:hover{background:var(--no-soft)}
/* Al pasar por encima, la fila se tiñe hacia el magenta en vez de aclararse a gris:
   el mismo degradado que el resto, sólo que muy tenue. */
:root:root .acc button:hover{
  background:linear-gradient(90deg,rgba(145,70,168,.42),rgba(67,32,79,.18) 82%);
}
:root:root .acc button{gap:14px; padding-top:13px; padding-bottom:13px; border-radius:14px}
:root:root .acc .tx{font-family:'Outfit',sans-serif; font-size:17px; font-weight:600;
  letter-spacing:-.2px}
:root:root .acc .tx small{display:block; font-family:'Public Sans','Instrument Sans',sans-serif;
  font-size:13px; font-weight:400; color:var(--mut); letter-spacing:0; margin-top:1px}

/* ── EL BOTÓN DE VOLVER ────────────────────────────────────────────────────────
   Era un contorno finito sobre un fondo casi del mismo color: se perdía. Ahora tiene
   superficie propia y borde claro, así se ve que es un botón sin competirle al de la
   acción principal, que sigue siendo el único magenta. */
/* ── ELIMINAR ──────────────────────────────────────────────────────────────────
   Era el rosa relleno con texto blanco: 2,7:1, por debajo del mínimo hasta para texto
   grande. Se veía pastel y descolorido, y encima competía en peso con «Guardar», que es
   la acción que la gente viene a hacer.
   Ahora va en contorno: rosa sobre el fondo da 5,6:1 y se lee como «cuidado» sin gritar
   más fuerte que la acción principal. Al pasar por encima sí se rellena —ahí ya estás
   apuntando— y el texto pasa a oscuro, que sobre ese rosa da 6,7:1. */
:root:root .btn.peligro{
  background:none; color:var(--no); border:1.5px solid var(--no); box-shadow:none;
}
:root:root .btn.peligro:hover{background:var(--no); color:#2a0b1a; border-color:var(--no)}

:root:root .btn.sec{
  background:var(--bg3); border:1.5px solid rgba(255,255,255,.22); color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.3);
}
:root:root .btn.sec:hover{background:var(--bg4); border-color:rgba(255,255,255,.38); color:#fff}

/* ── EL SALDO DE CADA FILA ─────────────────────────────────────────────────────
   La moneda va ADELANTE y chica, el número atrás y grande, los dos en la misma
   línea. Antes iban uno encima del otro: el «ARS» debajo pesaba tanto como la cifra
   y en una lista de veinte filas eso es veinte veces leyendo lo mismo. Adelante se
   lee como se dice —«ARS 2.427»— y el ojo baja por la columna de números sin tropezar. */
:root:root .fila-b .bal .cifras{
  display:flex; align-items:baseline; gap:6px; text-align:right; flex:1;
  justify-content:flex-end;
}
:root:root .fila-b .bal .cifras small{
  display:inline; font-size:11.5px; color:var(--mut); letter-spacing:.06em; font-weight:500;
}
:root:root .fila-b .bal .cifras b{
  display:inline; font-family:'Outfit',sans-serif; font-size:21px; font-weight:600;
  letter-spacing:-.4px; line-height:1.1;
}
/* Sin ID, la mayoría de las filas no tiene bajada: que el login quede centrado y no
   colgado arriba de un hueco. */
:root:root .fila-b .id span:empty{display:none}

/* ── EL DÍA DE CADA MOVIMIENTO ─────────────────────────────────────────────────
   Ya se agrupaba por día y el encabezado ya era pegajoso, pero con `top:0` — y arriba
   hay DOS cosas pegajosas más: la barra (49px) y las pestañas (~38px). Así que el día
   se pegaba DEBAJO de ellas, tapado, y con cincuenta movimientos en pantalla no había
   forma de saber de qué día era lo que estabas mirando.

   Ahora se pega justo abajo de las pestañas y se lee: blanco en vez de gris, y una
   línea magenta a la izquierda que lo separa de las filas. */
/* ── UNA FILA DE MOVIMIENTO ────────────────────────────────────────────────────
   La hora pasa a ser una COLUMNA a la izquierda, alineada, para poder barrer la lista
   de arriba abajo y ubicarse. Antes iba escondida abajo del login, en gris chico.

   Y el «antes» se guarda hasta que tocás la fila. Es un dato de auditoría —sirve
   cuando dudás de un movimiento— y estaba en las cincuenta filas a la vez, compitiendo
   con el monto, que es lo que se viene a mirar. Al abrirla se muestra el antes Y el
   saldo que quedó, que es lo que en realidad querés saber y antes no estaba.
   No cuesta una llamada más: los dos números ya venían en la misma respuesta. */
:root:root .mov{
  display:grid; grid-template-columns:auto auto 1fr auto;
  align-items:center; gap:11px; padding:11px 10px; cursor:pointer;
  border-radius:12px; transition:background .12s;
}
:root:root .mov:hover{background:var(--bg3)}
:root:root .mov:focus-visible{outline:2px solid var(--g); outline-offset:-2px}
:root:root .mov .hora{
  font-family:'Outfit',sans-serif; font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:600; color:var(--mut2); letter-spacing:-.2px;
}
:root:root .mov .qu b{font-size:14.5px}
:root:root .mov .mn{
  font-family:'Outfit',sans-serif; font-variant-numeric:tabular-nums;
  font-size:18px; font-weight:600; letter-spacing:-.3px;
}
:root:root .mov .antes{
  display:none; grid-column:1 / -1; font-size:12.5px; color:var(--mut2);
  background:var(--bg3); border-radius:9px; padding:7px 10px; margin-top:3px;
}
:root:root .mov .antes b{color:var(--txt); font-weight:600}
:root:root .mov.abierta .antes{display:block}
:root:root .mov.abierta{background:var(--bg3)}

:root:root .diahead{
  top:87px; z-index:3;
  color:#fff; font-size:12px; letter-spacing:.07em;
  background:linear-gradient(90deg, rgba(145,70,168,.30), rgba(29,12,41,.96) 60%);
  border-bottom:1px solid var(--bor2);
  border-left:3px solid var(--acento, #d616d6);
  padding:9px 10px 8px; margin:14px 0 4px; border-radius:0 8px 8px 0;
  backdrop-filter:blur(6px);
}

:root:root .fila-b .meta{
  display:inline-flex; align-items:center; gap:4px; margin-right:11px;
  font-size:12.5px; color:var(--mut2); font-variant-numeric:tabular-nums;
}
:root:root .fila-b .meta svg{width:13px; height:13px; opacity:.75}
:root:root .fila-b .id b{font-size:15.5px; font-family:'Outfit',sans-serif; font-weight:600}

/* El saldo y el ± : el número manda, la moneda se corre abajo chiquita y el ±
   queda como pastilla magenta, que es lo que se aprieta. */
/* 🔴 ANCHO FIJO, NO MÍNIMO. Con `min-width` el número largo empujaba igual y los recuadros
   seguían saliendo de distinto tamaño: «28.136,6» estiraba el suyo y los de «0» quedaban más
   chicos. Con los ± escalonados, la columna de montos no se lee de arriba abajo.
   La fila pasa a grilla con la última columna FIJA: los tres recuadros miden lo mismo pase lo
   que pase. El número entra alineado a la derecha y bajé un punto su tamaño para que quepan
   cifras largas sin que el recuadro tenga que crecer.
   Se aplica sólo a las filas que TIENEN monto: las otras listas que usan `.fila-b` —los
   sub-agentes, las eliminadas— siguen en flex, que es lo que les corresponde. */
:root:root .fila-b:has(.bal){
  display:grid; grid-template-columns:auto 1fr 190px; align-items:center;
}
:root:root .fila-b .bal{
  background:var(--bg3); border:1px solid var(--bor); border-radius:14px;
  padding:8px 10px 8px 12px; gap:9px;
  width:100%; justify-content:flex-end;
  /* 🔴 `min-width:0` NO SOBRA. Un elemento de grilla no baja de su ancho mínimo por defecto, así
     que el recuadro con la cifra más larga DESBORDABA su columna y quedaba más grande que los
     otros — que es exactamente lo que se quería evitar. Con esto respeta la columna. */
  min-width:0;
}
/* Y adentro, lo mismo: el bloque de la cifra tiene que poder achicarse. */
:root:root .fila-b .bal .cifras{min-width:0}
:root:root .fila-b .bal .cifras b{font-size:19px}
:root:root .fila-b .bal b{
  font-family:'Outfit',sans-serif; font-size:18px; font-weight:600; letter-spacing:-.3px;
}
:root:root .fila-b .bal small{font-size:10.5px; color:var(--mut); letter-spacing:.06em}
/* El botón de cargar/retirar: cuadrado redondeado y no un círculo, para que se lea como
   parte del recuadro del monto y no como una pastilla suelta pegada al costado. */
:root:root .fila-b .bal .pm{
  width:30px; height:30px; border-radius:10px; flex:none;
  display:grid; place-items:center;
  background:var(--g-fill); color:#fff;
  box-shadow:0 2px 8px rgba(214,22,214,.35);
  transition:filter .12s;
}
:root:root .fila-b .bal .pm svg{width:17px; height:17px}
:root:root .fila-b .bal:hover .pm{filter:brightness(1.14)}
:root:root .fila-b .bal:hover{border-color:var(--g); background:var(--g-soft)}
:root:root .fila-b .bal:hover .pm{filter:brightness(1.12)}

:root:root .op{
  background:linear-gradient(90deg,#9146a8 0%,#43204f 82%);
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px; padding:24px 22px; gap:18px;
  color:#fff; box-shadow:0 8px 26px rgba(0,0,0,.38);
  transition:filter .14s, border-color .14s;
}
:root:root .op:hover{filter:brightness(1.09); border-color:rgba(255,255,255,.24)}
:root:root .op .ic{
  width:38px; height:38px; border-radius:0; background:none;
  color:#fff; flex:none;
  filter:drop-shadow(0 0 9px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(240,150,255,.45));
}
:root:root .op .tx b{font-family:'Outfit',sans-serif; font-size:20px; font-weight:600;
  letter-spacing:-.3px}
:root:root .op .tx span{color:rgba(255,255,255,.82); font-size:13.5px; margin-top:2px}
:root:root .op .fl{color:rgba(255,255,255,.6); font-size:22px}
:root:root .opciones{gap:13px}

:root:root .tj{
  background:linear-gradient(90deg,#9146a8 0%,#43204f 82%);
  border:1px solid rgba(255,255,255,.08);
  display:grid; grid-template-columns:auto 1fr; column-gap:13px;
  align-items:center; text-align:left; padding:14px 16px;
}
:root:root .tj .tj-ico{
  grid-column:1; grid-row:1 / span 2;
  width:30px; height:30px; color:#fff; opacity:.92; stroke-width:1.8;
}
:root:root .tj .vl{grid-column:2; grid-row:1; font-family:'Outfit',sans-serif;
  font-weight:600; font-size:26px; letter-spacing:-.6px; margin-top:0}
:root:root .tj .et{grid-column:2; grid-row:2; color:rgba(255,255,255,.85);
  text-transform:none; letter-spacing:0; font-size:13.5px; font-weight:400}
:root:root .tj > *:not(.tj-ico):not(.et):not(.vl){grid-column:1 / -1; margin-top:10px}

:root:root .marca-ganamos{
  width:min(230px,66%); height:52px; margin:0 auto;
  background:url("/img/ganamos.png?v=1") center/contain no-repeat;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));
}
:root:root .marca-ganamos span{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* El ícono queda a la izquierda y la cifra se va a la DERECHA, que es donde el ojo
   la busca —como en cualquier resumen de cuenta— y de paso la tarjeta deja de tener
   la mitad derecha vacía. */
:root:root .saldo-cab{display:flex; align-items:center; gap:15px}
:root:root .saldo-cab > div{margin-left:auto; text-align:right}
:root:root .saldo-ico{width:38px; height:38px; flex:none; color:#fff; opacity:.95; stroke-width:1.7}
:root:root .saldo .monto{margin-top:0; font-family:'Outfit',sans-serif; font-size:34px;
  font-weight:600; letter-spacing:-1px}
:root:root .saldo .monto small{font-family:'Outfit',sans-serif; font-weight:500; font-size:16px;
  vertical-align:1px; margin-right:6px}
:root:root .saldo-que{font-size:14.5px; color:var(--lg-tx2); margin-top:1px}
:root:root .monto,
:root:root h1, :root:root h2, :root:root .tit h2,
:root:root .btn{font-family:'Outfit','Instrument Sans',sans-serif}

/* El degradado va HORIZONTAL y arranca más claro, como en la maqueta y como en el
   panel de agentes: la versión vertical y oscura se veía apagada al lado. El halo
   se queda, que es lo que le da volumen. */
:root:root .saldo{
  background:
    radial-gradient(110% 170% at 88% -30%, rgba(240,170,255,.34), transparent 60%),
    linear-gradient(90deg,#9146a8 0%,#43204f 82%);
  border:1px solid rgba(240,170,255,.20);
  box-shadow:0 9px 28px rgba(0,0,0,.40);
}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 🔴 El atributo `hidden` se aplica con una regla del NAVEGADOR, que pierde contra cualquier
   `display` que escribamos nosotros. `.top{display:flex}` alcanzaba para que la barra del panel
   se viera en la pantalla de login —con el nombre de la cuenta y el botón Salir— sin haber
   entrado. Esto lo cierra para todos los elementos que se ocultan con `hidden`. */
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--txt);
  font-family:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45}
.num{font-variant-numeric:tabular-nums}
/* Los nombres se leen, no se tipean: van en la fuente de la casa, que es más amable en una lista
   larga. El `letter-spacing` mínimo y los números tabulares conservan lo bueno de la monoespaciada
   —que las cosas se alineen— sin su dureza. */
.mono{letter-spacing:.005em; font-variant-numeric:tabular-nums}
/* 🔑 La monoespaciada QUEDA donde hay que leer carácter por carácter para tipear o dictar: una
   contraseña, un link, un token. Ahí `l` y `1` tienen que verse distinto, y vale la dureza. */
.exacto{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:0; font-variant-numeric:normal}
button{font-family:inherit}

.marco{max-width:440px; margin:0 auto; min-height:100vh; background:var(--bg);
  border-left:1px solid var(--bor); border-right:1px solid var(--bor);
  display:flex; flex-direction:column; position:relative; overflow:hidden}
@media (max-width:480px){ .marco{border:none} }

.aviso{background:var(--warn-soft); color:var(--warn); font-size:11.5px; text-align:center;
  padding:7px 12px; border-bottom:1px solid var(--bor)}
.aviso b{font-weight:700}

.ficha{width:28px; height:28px; flex:none; background:url("/img/perro.png?v=1") center/contain no-repeat}

.top{display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--marca-barra);
  border-bottom:1px solid rgba(255,255,255,.08); position:sticky; top:0; z-index:20;
  color:var(--lg-tx)}
.top .marca b{color:var(--lg-tx)}
.top .marca span{color:var(--lg-tx2)}
.top .marca:hover{background:rgba(255,255,255,.1)}
.top .icobtn{background:rgba(255,255,255,.13); border-color:transparent; color:var(--lg-tx)}
.top .icobtn:hover{background:rgba(255,255,255,.22); color:var(--lg-tx)}
.top .ficha{filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.marca{flex:1; min-width:0; background:none; border:none; padding:4px 2px; text-align:left;
  cursor:pointer; color:inherit; font:inherit; border-radius:10px}
.marca:hover{background:var(--bg3)}
.marca:focus-visible{outline:2px solid var(--g); outline-offset:2px}
.marca b{font-size:14px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.marca span{display:block; font-size:11px; color:var(--mut); line-height:1.25}
.icobtn{background:var(--bg3); border:1px solid var(--bor2); color:var(--mut2); border-radius:10px;
  padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; flex:none}
.icobtn:hover{border-color:var(--bor2); color:var(--txt)}

/* barra de secciones — sale de area=buttons */
.secs{display:flex; gap:3px; overflow-x:auto; background:var(--bg2); border-bottom:1px solid var(--bor);
  padding:0 10px; position:sticky; top:49px; z-index:19; scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.secs button{background:none; border:none; border-bottom:2px solid transparent; color:var(--mut);
  padding:11px 9px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap}
.secs button[aria-current="true"]{color:var(--g); border-bottom-color:var(--g)}

.scroll{flex:1; overflow-y:auto; padding:14px 14px 96px}

.saldo{background:var(--marca-grad); border:none; border-radius:20px; padding:17px;
  box-shadow:0 12px 30px -18px rgba(42,11,77,.72); margin-bottom:14px; color:var(--lg-tx)}
.saldo .rot{color:var(--lg-tx2)}
.saldo .monto{color:var(--lg-tx)}
.saldo .monto small{color:var(--lg-tx2)}
.saldo .dequien{border-bottom-color:rgba(255,255,255,.16)}
.saldo .dequien b{color:var(--lg-tx)}
.saldo .dequien span{color:var(--lg-tx2)}
.saldo .periodos.dentro{border-top-color:rgba(255,255,255,.16)}
.saldo .periodos button{background:rgba(255,255,255,.12); border-color:transparent; color:var(--lg-tx)}
.saldo .periodos button[aria-pressed="true"]{background:var(--lg-tx); color:var(--lg-ink)}
/* De quién son estas fichas: primero el login, después los números. */
.dequien{padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--bor)}
.dequien b{display:block; font-size:16.5px; font-weight:700; letter-spacing:-.01em; line-height:1.25}
.dequien span{display:block; font-size:11.5px; color:var(--mut); margin-top:3px}

/* Rótulo a un costado y monto al otro: un solo dato no necesita dos renglones,
   y en el teléfono el alto es lo que escasea. */
.unalinea{display:flex; align-items:center; justify-content:space-between; gap:14px}
.unalinea .rot{margin:0}
.unalinea .monto{margin:0; font-size:27px}
.saldo.unalinea{padding:14px 16px}

/* Los cuatro números, con separadores finos en vez de otra caja apilada. */
.periodos.dentro{margin:14px 0 0; padding-top:14px; border-top:1px solid var(--bor)}
.cuadro{display:grid; grid-template-columns:1fr 1fr; margin-top:12px}
.cuadro div{padding:10px 4px; text-align:center}
.cuadro div:nth-child(odd){border-right:1px solid var(--bor)}
.cuadro div:nth-child(-n+2){border-bottom:1px solid var(--bor)}
.cuadro span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--mut); font-weight:600; margin-bottom:3px}
.cuadro b{font-size:17px; font-weight:700}

.rot{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--mut); font-weight:600}
.monto{font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1.1; margin-top:6px}
.monto small{font-size:11.5px; font-weight:700; color:var(--mut); margin-right:6px;
  letter-spacing:.03em; vertical-align:2px}
.pie{font-size:11.5px; color:var(--mut); margin-top:9px}

.busca{position:relative; margin-bottom:10px}
.busca input{width:100%; background:var(--bg2); border:1px solid var(--bor); border-radius:10px;
  padding:11px 12px 11px 34px; font:inherit; font-size:15px; color:var(--txt); outline:none}
.busca input:focus{border-color:var(--g); box-shadow:0 0 0 3px var(--g-soft)}
.busca svg{position:absolute; left:11px; top:12px; opacity:.45}
.tit{display:flex; align-items:baseline; justify-content:space-between; margin:16px 2px 8px}
.tit h2{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0; font-weight:600}
.tit em{font-style:normal; font-size:12px; color:var(--mut)}
.lista{display:flex; flex-direction:column; gap:7px}
.fila-b{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--bg2); border:1px solid var(--bor); border-radius:14px; padding:10px 11px;
  cursor:pointer; font:inherit; color:var(--txt); transition:border-color .12s, transform .08s}
.fila-b:hover{border-color:var(--bor2)}
.fila-b:active{transform:scale(.994)}
.fila-b:focus-visible{outline:2px solid var(--g); outline-offset:2px}
.punto{width:8px; height:8px; border-radius:50%; background:var(--bor2); flex:none}
.punto.on{background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft)}
.punto.jugando{background:var(--oro); box-shadow:0 0 0 3px var(--oro-soft)}
.fila-b .id{flex:1; min-width:0}
.fila-b .id b{display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila-b .id span{font-size:11.5px; color:var(--mut)}
/* El saldo es un botón aparte: tocarlo va derecho a cargar o retirar. */
/* Ancho fijo: un saldo de 0 y uno de 12.400 tienen que ocupar lo mismo,
   si no la lista queda con los recuadros bailando. */
.fila-b .bal{text-align:right; flex:none; background:var(--bg3); border:1px solid var(--bor);
  border-radius:10px; padding:6px 10px; cursor:pointer; font:inherit; color:var(--txt);
  display:flex; align-items:center; gap:8px; min-width:118px;
  transition:border-color .12s, background .12s}
.fila-b .bal:hover{border-color:var(--g); background:var(--g-soft)}
.fila-b .bal:focus-visible{outline:2px solid var(--g); outline-offset:2px}
.fila-b .bal .cifras{text-align:right; flex:1}
.fila-b .bal b{display:block; font-size:14.5px; font-weight:600; line-height:1.2}
.fila-b .bal small{display:block; font-size:11px; color:var(--mut)}
.fila-b .bal .pm{font-size:15px; font-weight:700; color:var(--g); line-height:1}
.vacio{text-align:center; color:var(--mut); font-size:13.5px; padding:26px 10px}

.fab{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:440px;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 62%, transparent); z-index:15}
.btn{width:100%; background:var(--marca-accion); color:#fff; border:none; border-radius:14px;
  padding:14px; font:inherit; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:0 10px 24px -16px rgba(42,11,77,.72)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.38; cursor:not-allowed}
.btn.sec{background:var(--bg3); color:var(--txt); border:1.5px solid var(--bor2)}
.btn.sec:hover{border-color:var(--g); color:var(--g)}
.btn.peligro{background:var(--no); color:var(--sobre-no)}

/* HUB */
.hub{flex:1; overflow-y:auto; padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.hub .saludo{margin:2px 0 18px}
.hub .saludo h1{font-size:22px; font-weight:700; letter-spacing:-.025em; margin:0 0 3px; text-wrap:balance}
.hub .saludo p{margin:0; color:var(--mut); font-size:13.5px}
.opciones{display:flex; flex-direction:column; gap:9px}
.op{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  background:var(--bg2); border:1px solid var(--bor); border-radius:14px; padding:15px 14px;
  color:var(--txt); font:inherit; box-shadow:var(--sombra); transition:border-color .12s}
.op:hover{border-color:var(--g)}
.op:focus-visible{outline:2px solid var(--g); outline-offset:2px}
.op .ic{width:38px; height:38px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--g-soft); color:var(--g-ink)}
.op .tx{flex:1; min-width:0}
.op .tx b{display:block; font-size:15.5px; font-weight:700}
.op .tx span{display:block; font-size:12.5px; color:var(--mut); line-height:1.35}
.op .fl{color:var(--mut); flex:none}
.op{border-radius:20px}
.op.principal{background:var(--marca-accion); border-color:transparent; color:var(--lg-tx);
  box-shadow:0 12px 30px -18px rgba(42,11,77,.72)}
.op.principal .ic{background:rgba(255,255,255,.15); color:var(--lg-tx)}
.op.principal .tx span{color:var(--lg-tx2)}
.op.principal .fl{color:var(--lg-tx2)}
.op.principal:hover{border-color:transparent; filter:brightness(1.08)}
.grupo{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--mut);
  font-weight:600; margin:20px 2px 9px}

/* DASHBOARD */
.tarjetas{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px}
/* Un número suelto se mira de a uno: centrado. Las tablas siguen alineadas,
   porque ahí el ojo baja comparando columnas. */
.tj{background:var(--bg2); border:1px solid var(--bor); border-radius:14px; padding:14px 12px;
  box-shadow:var(--sombra); text-align:center}
.tj.ancha{grid-column:1 / -1}
.tj .et{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); font-weight:600}
.tj .vl{font-size:23px; font-weight:700; letter-spacing:-.02em; margin-top:3px}
.tj .vl.chico{font-size:18px}
.cuatro{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; margin-top:12px}
.cuatro div{text-align:center}
.cuatro div span{display:block; font-size:11px; color:var(--mut); margin-bottom:2px}
.cuatro div b{font-size:17px; font-weight:700}
.cuatro b.mas{color:var(--ok)} .cuatro b.menos{color:var(--no)}
.spark{display:flex; align-items:flex-end; gap:3px; height:44px; margin-top:11px}
.spark i{flex:1; background:var(--g-soft); border-radius:2px 2px 0 0; min-height:3px}
.spark i.alto{background:var(--g-fill)}
.periodos{display:flex; gap:5px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none}
.periodos::-webkit-scrollbar{display:none}
.periodos button{background:var(--bg2); border:1px solid var(--bor); color:var(--mut2); border-radius:999px;
  padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap}
.periodos button[aria-pressed="true"]{background:var(--g-fill); border-color:var(--g); color:var(--sobre-g)}
:root[data-theme="dark"] .periodos button[aria-pressed="true"]{color:#170f1f}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .periodos button[aria-pressed="true"]{color:#170f1f}
  :root:not([data-theme="light"]) .cruce .destacado{color:#170f1f} }

/* tabla de visitantes */
/* Tabla ancha: mejor que se recorra a que se apelmace.
   La primera columna queda fija al desplazar — si no, uno scrollea y ya no sabe de quién es la fila. */
.tabla{border-collapse:separate; border-spacing:0; font-size:13.5px; margin-top:4px; white-space:nowrap}
.tabla th, .tabla td{padding:10px 14px; border-bottom:1px solid var(--bor); text-align:right}
.tabla th{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut);
  font-weight:600; vertical-align:bottom; line-height:1.35; padding-bottom:7px}
.tabla tbody tr:last-child td{border-bottom:none}
.tabla th:first-child, .tabla td:first-child{
  text-align:left; position:sticky; left:0; z-index:1;
  background:var(--bg); padding-left:2px; padding-right:16px}
/* el borde marca dónde termina la columna fija cuando hay scroll */
.tabla th:first-child::after, .tabla td:first-child::after{
  content:''; position:absolute; top:0; right:0; bottom:0; width:1px; background:var(--bor)}
.tabla td:first-child{font-weight:600}
.tabla-marco{overflow-x:auto; margin:0 -2px; padding-bottom:2px}

/* movimientos */
.mov{display:flex; align-items:center; gap:10px; padding:11px 0}
.mov + .mov{border-top:1px solid var(--bor)}
.mov-toca{cursor:pointer; border-radius:10px; margin:0 -8px; padding-left:8px; padding-right:8px}
.mov-toca:hover{background:var(--bg3)}
.mov-toca:focus-visible{outline:2px solid var(--g); outline-offset:-2px}
.mov .qu .detalle{display:block; font-size:11.5px; color:var(--g-ink); background:var(--g-soft);
  border-radius:10px; padding:6px 9px; margin-top:6px}
.mov .sig{width:28px; height:28px; border-radius:10px; flex:none; display:grid; place-items:center;
  font-size:15px; font-weight:700; background:var(--ok-soft); color:var(--ok)}
.mov .sig.menos{background:var(--no-soft); color:var(--no)}
.mov .qu{flex:1; min-width:0}
.mov .qu b{display:block; font-weight:600; font-size:13.5px}
.mov .qu span{font-size:11.5px; color:var(--mut)}
.mov .mn{font-weight:700; text-align:right; flex:none}
.mov .mn.menos{color:var(--no)} .mov .mn.mas{color:var(--ok)}
.mov .mn small{display:block; font-size:10.5px; color:var(--mut); font-weight:500}
.deslizar{font-size:11px; color:var(--mut); text-align:right; margin:-4px 2px 6px}

.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0}
.switch + .switch{border-top:1px solid var(--bor)}
.switch .tx b{display:block; font-size:14.5px; font-weight:600}
.switch .tx span{font-size:12px; color:var(--mut); line-height:1.4}
.palanca{width:48px; height:28px; border-radius:999px; background:var(--bor2); border:none;
  position:relative; cursor:pointer; flex:none; transition:background .16s}
.palanca::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px;
  border-radius:50%; background:var(--bg2); transition:transform .16s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.palanca[aria-checked="true"]{background:var(--g-fill)}
.palanca[aria-checked="true"]::after{transform:translateX(20px)}
.palanca:focus-visible{outline:2px solid var(--g); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ .palanca, .palanca::after{transition:none} }

.permisos{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.permiso{font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px;
  background:var(--bg3); color:var(--mut); border:1px solid var(--bor)}
/* Una restricción no es un logro: va en ámbar, el tono de «mirá esto» de la casa. En morado
   parecía una etiqueta de categoría más. */
.permiso.si{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.cruce{background:var(--bg2); border:1px solid var(--bor); border-radius:14px;
  padding:12px 13px; margin-bottom:9px}
.cruce.mirar{border-color:var(--g); background:var(--g-soft)}
.cruce .cabeza{display:flex; align-items:center; justify-content:space-between; gap:10px}
.cruce .cabeza b{font-size:14px; font-weight:700}
.cruce .cuantas{font-size:11.5px; color:var(--mut); font-weight:600}
/* Cada cuenta en su propia píldora: pegados se leen como un solo login larguísimo. */
.cruce .quienes{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
.cruce .quienes .pastilla{display:inline-flex; align-items:baseline; gap:6px; cursor:pointer;
  background:var(--bg2); border:1px solid var(--bor); border-radius:999px;
  padding:5px 11px; font:inherit; font-size:11.5px; color:var(--mut)}
.cruce .quienes .pastilla b{font-size:12px; font-weight:400; color:var(--txt)}
.cruce.mirar .quienes .pastilla b{color:var(--g-ink)}
.cruce .quienes .pastilla:hover{border-color:var(--g)}
.cruce .quienes .pastilla:focus-visible{outline:2px solid var(--g); outline-offset:2px}
.cruce .quienes .pastilla.abierta{background:var(--g-fill); border-color:var(--g); color:var(--sobre-g); opacity:.92}
.cruce .quienes .pastilla.abierta b{color:var(--sobre-g); font-weight:600}
.horarios{margin-top:11px; background:var(--bg2); border:1px solid var(--bor);
  border-radius:10px; padding:11px 12px}
.unahora{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:13px}
.unahora + .unahora{border-top:1px solid var(--bor)}
.unahora span{color:var(--mut); font-size:12px}
.cruce.mirar .quienes span{color:var(--g-ink)}
.cruce.mirar .cabeza b{color:var(--g-ink)}
.cruce .destacado{font-size:11.5px; font-weight:700; color:var(--sobre-g); background:var(--g-fill);
  padding:3px 9px; border-radius:999px}

.permiso.jugando{background:var(--oro-soft); color:var(--oro); border-color:transparent}
.permiso.alerta{background:var(--warn-soft); color:var(--warn); border-color:transparent}

/* Ver lo que se escribe: en el teléfono, escribir a ciegas una clave con mayúsculas
   y números es la forma más rápida de equivocarse dos veces seguidas. */
.campo-clave{position:relative}
.campo-clave input{padding-right:74px}
.ojo{position:absolute; right:7px; top:50%; transform:translateY(-50%); background:var(--bg2);
  border:1px solid var(--bor); color:var(--mut2); cursor:pointer; font:inherit; font-size:12px;
  font-weight:600; padding:7px 11px; border-radius:10px}
.ojo:hover{color:var(--g); border-color:var(--g)}
.ojo:focus-visible{outline:2px solid var(--g); outline-offset:2px}

/* El principal ancho, el de crear al costado: dos accesos sin sumar una fila al menú. */
.parbotones{display:flex; gap:8px; margin-bottom:12px}
.parbotones .btn{flex:1}
.parbotones .btn.sec{flex:none; width:auto; padding-left:18px; padding-right:18px}

.verborrados{display:block; width:100%; margin-top:10px; background:none; border:none;
  color:var(--mut); font:inherit; font-size:12.5px; cursor:pointer; padding:8px; text-align:center;
  border-radius:10px}
.verborrados:hover{background:var(--bg3); color:var(--txt)}
/* ⚠️ El modificador NO puede llamarse `ojo`: esa clase ya es el botón «Ver» de las contraseñas,
   que es position:absolute — el cartel terminaba flotando en medio de la lista. */
.verborrados.hayfichas{color:var(--warn)}
.verborrados b{font-weight:700}

.masmenos{width:100%; background:var(--bg3); border:1px dashed var(--bor2); color:var(--mut2);
  border-radius:10px; padding:10px; font:inherit; font-size:13px; font-weight:600;
  cursor:pointer; margin-bottom:10px}
.masmenos:hover{border-color:var(--g); color:var(--g)}

.filtros-dice{background:var(--bg3); border-radius:10px; padding:10px 12px; margin-bottom:12px;
  font-size:12.5px; color:var(--mut2); line-height:1.5}
.filtros-dice b{color:var(--txt); font-weight:700}

.rango{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin:0 2px 10px; font-size:12.5px}
.rango b{font-size:14px; font-weight:700; text-transform:capitalize}
.rango span{color:var(--mut); font-size:11.5px}

.resumen{display:flex; gap:12px; background:var(--bg3); border-radius:14px; padding:13px; margin-bottom:12px}
.resumen div{flex:1; text-align:center}
.resumen.cuatro-col{flex-wrap:wrap; gap:11px 12px}
.resumen.cuatro-col div{flex:1 1 calc(50% - 6px); min-width:calc(50% - 6px)}
.filtrillo{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--bg3); border-radius:10px; padding:9px 12px; margin-bottom:10px;
  font-size:12px; color:var(--mut2); line-height:1.4}
.filtrillo b{color:var(--tx); font-weight:600}
.filtrillo button{flex:none; background:var(--bg2); border:1px solid var(--bor); color:var(--g);
  font:inherit; font-weight:600; border-radius:10px; padding:5px 10px; cursor:pointer}
.tabla th button{background:none; border:0; padding:0; margin:0; font:inherit; color:inherit;
  cursor:pointer; white-space:nowrap}
.tabla th.ord{color:var(--g)}
.permiso.todo{background:var(--bg3); color:var(--mut); font-weight:500}
.diahead{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--mut); padding:14px 2px 6px; position:sticky; top:0; background:var(--bg);
  z-index:2; border-bottom:1px solid var(--bor); margin-bottom:2px}
.var{display:block; font-size:10.5px; font-weight:600; margin-top:3px; letter-spacing:0}
.var small{font-weight:500; color:var(--mut); font-size:10px}
.var.sube{color:var(--ok)} .var.baja{color:var(--no)}
.gráf{width:100%; height:76px; display:block; margin:8px 0 2px; overflow:visible}
.leyenda{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.leyenda button{display:inline-flex; align-items:center; gap:5px; background:var(--bg3);
  border:1px solid var(--bor); border-radius:999px; padding:4px 9px; font:inherit; font-size:11px;
  font-weight:600; color:var(--tx); cursor:pointer}
.leyenda button.off{opacity:.42}
.leyenda button.off i{background:var(--mut) !important}
.leyenda i{width:9px; height:9px; border-radius:3px; flex:none}
.piepie{font-size:10.5px; color:var(--mut); margin-top:6px; line-height:1.4}
.piepie b{color:var(--mut2); font-weight:600}
.resumen span{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--mut); font-weight:600; margin-bottom:3px}
.resumen b{font-size:17px; font-weight:700}
/* Los cuatro tonos de la casa, y su versión sobre el morado de la marca. */
.t-ok{color:var(--ok)} .t-no{color:var(--no)} .t-warn{color:var(--warn)} .t-dato{color:var(--dato)}
.saldo .t-ok, .tarjeta .t-ok{color:var(--ok-m)}
.saldo .t-no, .tarjeta .t-no{color:var(--no-m)}
.saldo .t-warn, .tarjeta .t-warn{color:var(--warn-m)}
.saldo .t-dato, .tarjeta .t-dato{color:var(--dato-m)}

/* hoja */
/* 🔴 `absolute` las ancla al MARCO, y el marco crece con la lista: con 245 jugadores la hoja
   aparecía a miles de píxeles de la pantalla. `fixed` las ancla a la ventana, que es lo que ve
   el usuario. El ancho se limita al del marco para que no se despeguen en escritorio. */
.fondo{position:fixed; inset:0; background:rgba(20,14,26,.5); backdrop-filter:blur(2px);
  z-index:30; opacity:0; pointer-events:none; transition:opacity .18s}
.fondo.abierto{opacity:1; pointer-events:auto}
.hoja{position:fixed; left:50%; bottom:0; width:100%; max-width:440px; z-index:31;
  background:var(--bg2);
  border-top:1px solid var(--bor2); border-radius:20px 20px 0 0; box-shadow:var(--sheet);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(102%); transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:88vh; max-height:88dvh; overflow-y:auto}
.hoja.abierta{transform:translateX(-50%) translateY(0)}
/* En claro la sombra separa la hoja del fondo y las tarjetas de la hoja. En oscuro la
   sombra no se ve, así que la separación tiene que hacerla el tono y el borde. */
/* La tarjeta de fichas lleva el morado también adentro de la hoja: si acá se pinta gris,
   el texto —que es blanco— queda ilegible. Las otras dos sí son superficies neutras. */
.hoja .cred, .hoja .horarios{background:var(--bg3)}
.hoja .resumen{background:var(--bg4)}
.tirador{width:38px; height:4px; border-radius:999px; background:var(--bor2); margin:6px auto 12px}
.hoja h3{margin:0 0 2px; font-size:18px; font-weight:700; letter-spacing:-.015em; text-wrap:balance}
.hoja .sub{color:var(--mut); font-size:12.5px; margin-bottom:14px}

.tabs{display:flex; gap:4px; background:var(--bg3); padding:4px; border-radius:10px; margin-bottom:14px}
.tabs button{flex:1; background:none; border:none; border-radius:10px; padding:9px 4px; font:inherit;
  font-size:13px; font-weight:600; color:var(--mut2); cursor:pointer}
/* En claro la sombra separa la pestaña activa. En oscuro la sombra no se ve, así que
   la separa un borde en el color de marca. */
.tabs button[aria-selected="true"]{background:var(--bg2); color:var(--txt);
  box-shadow:var(--sombra); outline:1px solid var(--bor2); outline-offset:-1px}
.tabs button[aria-selected="true"].out{color:var(--no)}
.tabs button[aria-selected="true"].in{color:var(--ok)}

/* menú de acciones — lo dibuja area=buttons */
.acc{display:flex; flex-direction:column; gap:2px; margin:0 -4px}
.acc button{display:flex; align-items:center; gap:11px; background:none; border:none; width:100%;
  text-align:left; padding:11px 8px; border-radius:10px; cursor:pointer; color:var(--txt); font:inherit; font-size:14.5px}
.acc button:hover{background:var(--bg3)}
.acc button:focus-visible{outline:2px solid var(--g); outline-offset:-2px}
.acc .mk{width:30px; height:30px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--bg3); color:var(--mut2); font-size:14px}
.acc button.destaca .mk{background:var(--g-soft); color:var(--g-ink)}
.acc button.rojo{color:var(--no)}
.acc button.rojo .mk{background:var(--no-soft); color:var(--no)}
.acc .tx{flex:1}
.acc .tx small{display:block; font-size:11.5px; color:var(--mut); font-weight:400}
.acc .fl{color:var(--mut); font-size:15px}

label.campo{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--mut); font-weight:600; margin:0 0 6px}
.entrada{width:100%; background:var(--bg3); border:1px solid var(--bor); border-radius:10px;
  padding:13px 14px; font:inherit; font-size:17px; color:var(--txt); outline:none}
.entrada:focus{border-color:var(--g); box-shadow:0 0 0 3px var(--g-soft)}
.entrada.grande{font-size:26px; font-weight:700; letter-spacing:-.02em}
.entrada.mal{border-color:var(--no); box-shadow:0 0 0 3px var(--no-soft)}
.rapidos{display:flex; gap:6px; margin:9px 0 4px; flex-wrap:wrap}
.rapidos button{flex:1; min-width:62px; background:var(--bg3); border:1px solid var(--bor);
  border-radius:10px; padding:8px 4px; font:inherit; font-size:12.5px; font-weight:600; color:var(--mut2); cursor:pointer}
.rapidos button:hover{border-color:var(--bor2); color:var(--txt)}
.tope{font-size:12px; color:var(--mut); margin-top:8px; display:flex; justify-content:space-between; gap:8px}
.tope.mal{color:var(--no); font-weight:600}
.acciones{display:flex; gap:8px; margin-top:16px}

/* Los campos viven sobre el morado, así que no usan los tokens de superficie del panel. */
.tarjeta .entrada{background:var(--lg-campo); border-color:var(--lg-borde); color:var(--lg-tx)}
.tarjeta .entrada::placeholder{color:rgba(255,255,255,.4)}
.tarjeta .entrada:focus{border-color:rgba(255,255,255,.55); box-shadow:0 0 0 3px rgba(255,255,255,.11)}
/* ── EL BOTÓN «VER», Y EL AUTOCOMPLETADO DE CHROME ────────────────────────────────────────
   Antes era blanco translúcido sobre la tarjeta violeta: se leía bien… hasta que Chrome
   autocompletaba. Chrome le pinta al campo un fondo blanco propio, y ahí quedaba botón blanco
   sobre blanco con letra clara — el operador no lo encontraba y creía que había desaparecido.

   Se arregla por los dos lados: el botón pasa a ser SÓLIDO (violeta oscuro con letra blanca), que
   se lee sobre cualquiera de los dos fondos; y se le devuelve al campo su color aunque Chrome lo
   autocomplete. El fondo del autocompletado no se puede pisar con `background`: la única forma es
   una sombra interior enorme, y `-webkit-text-fill-color` para la letra. */
.tarjeta .ojo{background:var(--lg-ink); border-color:transparent; color:#fff; font-weight:700}
.tarjeta .ojo:hover{background:#fff; color:var(--lg-ink)}
.tarjeta .entrada:-webkit-autofill,
.tarjeta .entrada:-webkit-autofill:hover,
.tarjeta .entrada:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 100px #4a1a8c inset;
  box-shadow:0 0 0 100px #4a1a8c inset;
  -webkit-text-fill-color:var(--lg-tx);
  caret-color:var(--lg-tx);
  border:1px solid var(--lg-borde);
}
.tarjeta .btn{background:var(--lg-tx); color:var(--lg-ink); border:none; font-weight:700}
.tarjeta .btn:hover{background:#fff}
.tarjeta .btn:focus-visible{outline:2px solid var(--lg-tx); outline-offset:3px}

</style>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Lo que devolvería el motor. Todo esto sale de llamadas reales medidas el
   25-ago-2026 contra admin.ganamos-lat.com. Los números son de ejemplo.
   ══════════════════════════════════════════════════════════════════════════ */

/* area=info → main */
const CUENTAS = {
  agente: { id:'7357552', login:'GanamosxLatam',     group:3, balance:100000, currency:'ARS', nivel:'Agente' },
  cajero: { id:'7357557', login:'GanamosxLatamCaja', group:4, balance:50000,  currency:'ARS', nivel:'Cajero' },
  /* Comparte la caja 7357557 y sus fichas. Con el saldo oculto no ve cuánto hay. */
  subcajero: { id:'7357786', login:'SubCaja1', group:8, balance:50000, currency:'ARS', nivel:'Sub-cajero',
               caja:'7357557', hide_hall_balance:true, disable_statistic:true },
};

/* La tabla del menú por nivel vive en caja-logica.js (`MENU_POR_NIVEL`), junto con la
   explicación de por qué no se puede sacar del motor. Acá sólo se usa. */

/* area=buttons&id=<nodo> → acciones sobre un nodo, con el título que da el motor */
const ACCIONES_SALA = [
  /* Igual que en el jugador: cargar, retirar y ver qué pasó, en una sola puerta. */
  { name:'balance',      title:'Balance', mueve:true, sinNota:true },
  { name:'sub',          title:'Sub-cajeros' },
  /* Todo lo que se configura de la caja vive junto, en una sola pantalla. */
  { name:'useredit',     title:'Configuración' },
  /* Las dos son para mirar cuando algo no cierra: van juntas. */
  { name:'seguridad',    title:'Seguridad' },
  { name:'delete',       title:'Eliminar', peligro:true },
];
/* 🔑 area=buttons depende del NODO **y de quién pregunta** (dueño, 25-ago): entregar el acceso
   de un jugador es tarea de su cajero, no del agente. El agente ve la misma terminal sin esas
   cuatro acciones. */
const ACCIONES_TERMINAL = [
  /* Cargar, retirar y ver qué pasó son la misma conversación: una sola puerta. */
  { name:'balance',      title:'Balance', mueve:true, sinNota:true },
  { name:'history',      title:'Historial de jugadas' },
  /* Una sola entrada: adentro están el ticket y el usuario+contraseña, cada uno
     con su botón de copiar. Tres accesos al mismo lugar era repetir por repetir. */
  { name:'share_auth',   title:'Credenciales del jugador' },
  { name:'delete',       title:'Eliminar', peligro:true },
];
/* Íconos de un trazo, no glifos: los símbolos de texto (☰ ✎ ⚯ ⁙) se ven como un
   carácter suelto, cambian de forma según la fuente que tenga el teléfono, y al lado
   de un emoji a color quedaban de dos épocas distintas. */
const T = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONO = {
  users:        T('<circle cx="9" cy="8" r="3.1"/><path d="M3.4 19.5c0-3 2.5-5.2 5.6-5.2s5.6 2.2 5.6 5.2"/><path d="M16.6 11a3 3 0 100-6M18.6 19.5c0-2.2-.8-3.9-2.1-4.9"/>'),
  useredit:     T('<path d="M4 20h4l10-10a2.1 2.1 0 00-3-3L5 17z"/><path d="M14.5 6.5l3 3"/>'),
  balance:      T('<path d="M12 3v18M7.5 7h7a2.75 2.75 0 010 5.5H9.5a2.75 2.75 0 000 5.5h8"/>'),
  createuser:   T('<circle cx="10" cy="8" r="3.2"/><path d="M3.5 19.5c0-3 2.9-5.3 6.5-5.3 1 0 1.9.2 2.7.5"/><path d="M17.5 14v6M14.5 17h6"/>'),
  sub:          T('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7.5 14.5h3.5"/>'),
  reports:      T('<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>'),
  dashboard:    T('<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.5h17M9.5 20.5v-11"/>'),
  usersettings: T('<circle cx="12" cy="12" r="3.1"/><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M18 6l-1.7 1.7M7.7 16.3L6 18M18 18l-1.7-1.7M7.7 7.7L6 6"/>'),
  intersections:T('<circle cx="6.6" cy="6.6" r="3"/><circle cx="17.4" cy="17.4" r="3"/><path d="M9.6 6.6h4.9a3 3 0 013 3v4.9"/>'),
  seguridad:    T('<path d="M12 3.2l7.3 3.2v5.3c0 4.2-2.9 7.5-7.3 8.8-4.4-1.3-7.3-4.6-7.3-8.8V6.4z"/>'),
  delete:       T('<path d="M4.5 7h15M9.5 7V5.2A1.2 1.2 0 0110.7 4h2.6a1.2 1.2 0 011.2 1.2V7"/><path d="M6.5 7l.9 12.1a1.5 1.5 0 001.5 1.4h6.2a1.5 1.5 0 001.5-1.4L17.5 7"/>'),
  history:      T('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.4 2"/>'),
  copy_ticket:  T('<rect x="8.5" y="8.5" width="12" height="12" rx="2.4"/><path d="M15.5 5.5H5.9A2.4 2.4 0 003.5 7.9v9.6"/>'),
  copy_auth:    T('<rect x="8.5" y="8.5" width="12" height="12" rx="2.4"/><path d="M15.5 5.5H5.9A2.4 2.4 0 003.5 7.9v9.6"/>'),
  share_auth:   T('<path d="M12 16V4M8 7.5L12 3.5l4 4"/><path d="M4.5 14v5A1.5 1.5 0 006 20.5h12a1.5 1.5 0 001.5-1.5v-5"/>'),
  printticket:  T('<path d="M7 8.5V4h10v4.5"/><rect x="4" y="8.5" width="16" height="7.5" rx="2"/><path d="M7 14h10v6H7z"/>'),
};

/* ticket_url de la ficha de la sala — el link se arma con este dominio */
const TICKET_URL = 'https://ganamos-lat.com';
/* Los que devuelve module=domains. NO se muestran: la lista trae variantes técnicas
   (www., ag., api.) que el motor necesita para funcionar pero que para el cliente son
   el mismo dominio. Se usa sólo para VALIDAR lo que escribe. */
/* module=siteAdditional: los canales que ven los jugadores. Sólo telegram y whatsapp. */
const CANALES = { telegram:'Telegram', whatsapp:'WhatsApp' };
/* 🔴 El motor NO valida el número: medido el 26-ago, guardó un WhatsApp como +626283974'2
   —con un apóstrofe en el medio— y armó el link igual, roto. La limpieza la hace el skin. */
const linkDe = (tipo, contacto) => tipo === 'telegram'
  ? 'https://t.me/' + String(contacto).trim().replace(/^@/, '').replace(/[^\w]/g, '')
  : 'https://wa.me/' + String(contacto).replace(/[^\d]/g, '');
/* Avisa cuando lo escrito no sirve, antes de guardarlo. */
function revisarContacto(tipo, valor){
  const v = String(valor || '').trim();
  if (!v) return 'Escribí el usuario o número';
  if (tipo === 'whatsapp') {
    const d = v.replace(/[^\d]/g, '');
    if (d.length < 8) return 'Un número de WhatsApp tiene al menos 8 dígitos';
  } else if (/[^\w@]/.test(v)) {
    return 'Sólo letras, números y guión bajo';
  }
  return null;
}
/* Lo que no sirve no entra: en WhatsApp sólo + (y sólo al principio) y dígitos.
   Medido el 26-ago: el motor guarda cualquier cosa y arma el link roto igual. */
function limpiarContacto(tipo, valor){
  const v = String(valor || '');

   con el 99% de las operaciones, y montos de 290 a 2.540.000. Con tres filas de ejemplo la

  const dias = 7, base = new Date('2026-08-25T12:00:00');

     Math.random— para que la demo se vea siempre igual. */

  /* 🔴 Los jugadores primero: los movimientos tienen que referirse a ELLOS. Medido: una caja con 1.851 jugadores muestra 39 por defecto, porque el
     motor filtra por fecha de HOY y por `inactive_users='active'`. Acá se generan 240 con la
     misma proporción —pocos activos, muchos dormidos— para que el problema se vea. */
  const nombres = ['miguel','gabriela','jesica','lucas','romina','tomas','sofia','martin','carla',
                   'diego','valen','nico','flor','agus','juli','pablo','marian','ale','vero','fede'];
  const jug = [];
  for (let k = 0; k < 240; k++) {
    const activo = k < 24;                       // 1 de cada 10, como en producción
    jug.push({
      id: String(7360000 + k * 7),
      login: nombres[k % nombres.length] + String(100000 + sig(899999)),
      password: 'x', balance: activo ? sig(80000) : sig(400),
      online: activo && sig(3) === 0, jugando: activo && sig(6) === 0,
      sala: '7357557', ultimo: activo ? 'hoy' : `hace ${2 + sig(40)} días`,
      inactivo: !activo,
    });
  }
  TERMINALES = TERMINALES.concat(jug);

  /* Los movimientos apuntan a los jugadores recién creados: si usan otros logins, la ficha no
     encuentra su última carga y el dato se ve vacío para todos. */
  const jugadores = jug.slice(0, 40).map(u => u.login);
  const montos = [290, 1000, 2000, 3000, 5000, 5000, 5000, 8000, 10000, 15000, 20000, 50000, 2540000];
  const filas = [];
  for (let d = 0; d < dias; d++) {
    const fecha = new Date(base); fecha.setDate(fecha.getDate() - d);
    const cuantos = 22 + sig(14);                       // ~28 por día
    for (let k = 0; k < cuantos; k++) {
      /* Un casino no reparte parejo: la tarde y la noche mueven; la madrugada casi nada. */
      const franja = sig(100);
      const hora = franja < 18 ? 6 + sig(8)          // mañana, 18%
                 : franja < 62 ? 14 + sig(8)         // tarde, 44%
                 : franja < 92 ? 22 + sig(2)         // noche temprana, 30%
                 : sig(6);                           // madrugada, 8%
      const min = sig(60);
      const saleRetiro = sig(10) === 0;                 // 1 de cada 10, como en producción
      const raro = (k * 7 + d * 3) % 23 === 0;          // ~4%: el resto lo hace siempre el mismo
      filas.push({
        operation: saleRetiro ? 'out' : 'in',
        cash: montos[sig(montos.length)],
        cash_before: sig(80000),
        initiator: raro ? (sig(2) ? 'GanamosxLatamCaja' : 'SubCaja2') : 'SubCaja1',
        system: 'admin', ip: '38.166.9.' + (10 + sig(200)),
        user: jugadores[sig(jugadores.length)],
        datetime: `${iso(fecha)} ${dosD(hora)}:${dosD(min)}:00`,
      });
    }
  }
  filas.sort((a, b) => b.datetime.localeCompare(a.datetime));
  MOVS.cajero['usual:players'] = filas;


  /* 🔴 Cruces de IP con volumen. Medido el 26-ago sobre 1.851 jugadores: 44 IPs compartidas,
     de las cuales 37 son de exactamente DOS cuentas y sólo 7 tienen tres o más. La mayor, 5.
     Semana y mes dan casi lo mismo (43 vs 44): los cruces son estables, ampliar el rango no
     descubre nada. Por eso la pantalla muestra primero las de 3+ y guarda las de 2. */
  const pares = [];
  for (let k = 0; k < 37; k++) {
    const a = jug[sig(jug.length)], b = jug[sig(jug.length)];
    if (!a || !b || a.login === b.login) continue;
    const dia = iso(sumarDias(new Date(base), -sig(7)));
    pares.push({ ip: `190.${sig(255)}.${sig(255)}.${sig(255)}`, cuentas: [a, b].map(u => ({
      login: u.login, hora: `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
      horas: [`${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`] })) });
  }
  for (let k = 0; k < 5; k++) {
    const cuantas = 3 + sig(3);
    const dia = iso(sumarDias(new Date(base), -sig(7)));
    const elegidos = [];
    for (let j = 0; j < cuantas; j++) { const u = jug[sig(jug.length)];
      if (u && !elegidos.some(e => e.login === u.login)) elegidos.push(u); }
    if (elegidos.length < 3) continue;
    pares.push({ ip: `181.${sig(255)}.${sig(255)}.${sig(255)}`, cuentas: elegidos.map(u => ({
      login: u.login, hora: `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
      horas: [`${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
              `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`] })) });
  }
  CRUCES.push(...pares);

  /* 🔴 Y las estadísticas por jugador: 339 filas, como la caja real. El motor las manda
     ascendentes por cargas —los que más ganancia dejaron llegan últimos—, así que acá se guardan
     en ese mismo orden a propósito: si la pantalla no reordena, se nota. */
  const est = jug.slice(0, 200).map((u, k) => {
    const cargas = 200 + sig(60) * (300 + sig(4000));

    const retiros = Math.round(cargas * (pierde ? 1.1 + sig(60) / 100 : 0.3 + sig(60) / 100));
    const cin = 1 + sig(30);
    return { login:u.login, in:cargas, out:retiros, profit:cargas - retiros,
             rtp:(cargas ? Math.round(retiros / cargas * 100) : 0) + ',' + sig(10) + '%',
             count_in:cin, avg_in:Math.round(cargas / cin),
             count_out:1 + sig(10), avg_out:Math.round(retiros / (1 + sig(10))) };
  }).sort((a, b) => a.in - b.in);
  ESTADISTICAS['on_money|terminal'].filas = est;

  /* Que los conteos de la caja cuadren con lo que hay adentro. */
  const caja = SALAS.find(s => s.id === '7357557');
  if (caja) {
    const suyos = TERMINALES.filter(t => t.sala === caja.id);

        suyos.filter(t => !t.inactivo).length;
    }
  }
}

      inactivo: !activo,
    });

  const montos = [290, 1000, 2000, 3000, 5000, 5000, 5000, 8000, 10000, 15000, 20000, 50000, 2540000];

  for (let d = 0; d < dias; d++) {
    const fecha = new Date(base); fecha.setDate(fecha.getDate() - d);
    const cuantos = 22 + sig(14);                       // ~28 por día
    for (let k = 0; k < cuantos; k++) {
      /* Un casino no reparte parejo: la tarde y la noche mueven; la madrugada casi nada. */
      const franja = sig(100);
      const hora = franja < 18 ? 6 + sig(8)          // mañana, 18%
                 : franja < 62 ? 14 + sig(8)         // tarde, 44%
                 : franja < 92 ? 22 + sig(2)         // noche temprana, 30%
                 : sig(6);                           // madrugada, 8%
      const min = sig(60);
      const saleRetiro = sig(10) === 0;                 // 1 de cada 10, como en producción

        cash: montos[sig(montos.length)],
        cash_before: sig(80000),
        initiator: raro ? (sig(2) ? 'GanamosxLatamCaja' : 'SubCaja2') : 'SubCaja1',
        system: 'admin', ip: '38.166.9.' + (10 + sig(200)),
        user: jugadores[sig(jugadores.length)],
        datetime: `${iso(fecha)} ${dosD(hora)}:${dosD(min)}:00`,
      });
    }
  }
  filas.sort((a, b) => b.datetime.localeCompare(a.datetime));
  MOVS.cajero['usual:players'] = filas;


  /* 🔴 Cruces de IP con volumen. Medido el 26-ago sobre 1.851 jugadores: 44 IPs compartidas,
     de las cuales 37 son de exactamente DOS cuentas y sólo 7 tienen tres o más. La mayor, 5.
     Semana y mes dan casi lo mismo (43 vs 44): los cruces son estables, ampliar el rango no
     descubre nada. Por eso la pantalla muestra primero las de 3+ y guarda las de 2. */
  const pares = [];
  for (let k = 0; k < 37; k++) {
    const a = jug[sig(jug.length)], b = jug[sig(jug.length)];
    if (!a || !b || a.login === b.login) continue;
    const dia = iso(sumarDias(new Date(base), -sig(7)));
    pares.push({ ip: `190.${sig(255)}.${sig(255)}.${sig(255)}`, cuentas: [a, b].map(u => ({
      login: u.login, hora: `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
      horas: [`${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`] })) });
  }
  for (let k = 0; k < 5; k++) {
    const cuantas = 3 + sig(3);
    const dia = iso(sumarDias(new Date(base), -sig(7)));
    const elegidos = [];
    for (let j = 0; j < cuantas; j++) { const u = jug[sig(jug.length)];
      if (u && !elegidos.some(e => e.login === u.login)) elegidos.push(u); }
    if (elegidos.length < 3) continue;
    pares.push({ ip: `181.${sig(255)}.${sig(255)}.${sig(255)}`, cuentas: elegidos.map(u => ({
      login: u.login, hora: `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
      horas: [`${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`,
              `${dia} ${dosD(9 + sig(12))}:${dosD(sig(60))}`] })) });
  }
  CRUCES.push(...pares);

  /* 🔴 Y las estadísticas por jugador: 339 filas, como la caja real. El motor las manda
     ascendentes por cargas —los que más ganancia dejaron llegan últimos—, así que acá se guardan
     en ese mismo orden a propósito: si la pantalla no reordena, se nota. */
  const est = jug.slice(0, 200).map((u, k) => {
    const cargas = 200 + sig(60) * (300 + sig(4000));
    /* 11% termina con el jugador arriba, como en la caja real. */

    const retiros = Math.round(cargas * (pierde ? 1.1 + sig(60) / 100 : 0.3 + sig(60) / 100));
    const cin = 1 + sig(30);
    return { login:u.login, in:cargas, out:retiros, profit:cargas - retiros,
             rtp:(cargas ? Math.round(retiros / cargas * 100) : 0) + ',' + sig(10) + '%',
             count_in:cin, avg_in:Math.round(cargas / cin),
             count_out:1 + sig(10), avg_out:Math.round(retiros / (1 + sig(10))) };
  }).sort((a, b) => a.in - b.in);

  /* Que los conteos de la caja cuadren con lo que hay adentro. */
  const caja = SALAS.find(s => s.id === '7357557');
  if (caja) {
    const suyos = TERMINALES.filter(t => t.sala === caja.id);
    caja.terminals = suyos.length;
    caja.terminals_online = suyos.filter(t => t.online).length;

/* Un proveedor manda una línea por jugada; otro la parte en dos y las une con round_id.
   Se agrupa siempre: mostrar las líneas crudas hace ver "apostó 0, ganó 0" sin sentido. */
function agruparJugadas(filas){
  const orden = [], porRonda = {};
  filas.forEach(f => {
    const k = f.round_id || f.dateTime + '|' + f.before;
    if (!porRonda[k]) { porRonda[k] = { ...f, bet:0, win:0, lineas:0 }; orden.push(k); }
    const r = porRonda[k];
    r.bet += f.bet; r.win += f.win; r.lineas++;
    if (f.dateTime < r.dateTime) r.dateTime = f.dateTime;   // la hora de la primera línea
    r.before = Math.max(r.before, f.before);
  });
  return orden.map(k => porRonda[k]);
}

   tarde o temprano una queda vieja.
   · jugadores: cualquier cosa
   · el resto (agente, cajero, sub-*): 8+, con mayúscula, minúscula y número
   · nadie: espacios — el motor los rechaza */
function validarClave(clave, esJugador){
  const c = String(clave || '');
  if (!c) return 'Escribí una contraseña';
  if (/\s/.test(c)) return 'Sin espacios: el casino los rechaza';
  if (esJugador) return null;
  if (c.length < 8) return `Faltan ${8 - c.length} caracteres (mínimo 8)`;
  if (!/[A-Z]/.test(c)) return 'Le falta una mayúscula';
  if (!/[a-z]/.test(c)) return 'Le falta una minúscula';
  if (!/\d/.test(c)) return 'Le falta un número';
  return null;
}

  if (!el) return !err;
  el.classList.toggle('mal', !!clave && !!err);
  el.innerHTML = !clave
    ? (esJugador ? '<span>Cualquier contraseña sirve, menos con espacios</span>'
                 : '<span>8 caracteres, con mayúscula, minúscula y número</span>')
    : err ? `<span><b>${err}</b></span>` : '<span>✓ Contraseña válida</span>';
  return !err;
}

  if (clave === 'ayer')  { const a = sumarDias(h, -1); return { from: iso(a), to: iso(a) }; }
  if (clave === 'semana'){ const dow = (h.getDay() + 6) % 7;  // lunes = 0
                           return { from: iso(sumarDias(h, -dow)), to: iso(h) }; }

function resumen(items, { estilo = 'caja' } = {}){

  const clase = (t) => t ? ' t-' + (t === 'g' ? 'dato' : t) : '';

    `<div><span>${rotulo}</span><b class="num${clase(tono)}">${valor}</b></div>`).join('');
