<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b1152">
<title>GANAMOS CHAT</title>
<!--
  ganamos.html — EL PORTAL DEL CLIENTE DEL CHAT.

  Entra con el usuario que YA CONOCE —el de su caja, "Ale65"— y no con una cuenta nueva: una
  contraseña más para recordar es la forma más segura de que no entre nunca.

  Es la puerta del CHAT y nada más: acá no se ven fichas, ni pedidos, ni la cuenta corriente del
  otro negocio. Por eso tiene su propia cara y su propio nombre.
-->
<style>
  :root{
    --uva:#3b1152; --uva2:#5a1d7d; --uva3:#7b2ea6;
    --lila:#eadff5; --lila2:#f7f1fb;
    --tinta:#241033; --tinta2:#6b5a78;
    --linea:#e4d7ee; --blanco:#fff;
    --verde:#2e7d5b; --rojo:#c0392b; --oro:#c98a2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--uva); color:var(--tinta);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .oculto{display:none !important}

  /* ── LA PORTADA: morada al abrir ── */
  #portada{
    min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    align-items:center; padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%, var(--uva3) 0%, var(--uva2) 42%, var(--uva) 100%);
    color:#fff; text-align:center; gap:6px;
  }
  #perro{width:104px;height:104px;margin-bottom:4px}
  #portada h1{font-size:29px;line-height:1.1;margin:0;letter-spacing:-.015em;font-weight:800}
  #portada h1 .x{font-weight:400;opacity:.72;margin:0 3px}
  #portada .bajada{margin:2px 0 26px;opacity:.78;font-size:15px}
  .caja{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
  #portada label{font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;opacity:.75;text-align:left}
  #portada input{
    width:100%;padding:15px 16px;font:inherit;font-size:17px;border:0;border-radius:13px;
    background:rgba(255,255,255,.13);color:#fff;text-align:center;
    outline:2px solid rgba(255,255,255,.18);
  }
  #portada input::placeholder{color:rgba(255,255,255,.45)}
  #portada input:focus{outline:2px solid #fff}
  .btn{
    padding:15px 18px;font:inherit;font-size:16px;font-weight:800;border:0;border-radius:13px;
    background:#fff;color:var(--uva);cursor:pointer;
  }
  .btn:disabled{opacity:.55;cursor:default}
  .btn.suave{background:rgba(255,255,255,.14);color:#fff}
  #err{min-height:20px;font-size:14px;color:#ffd7d7}
  #portada .pie{margin-top:24px;font-size:12px;opacity:.55;max-width:300px}

  /* ── ADENTRO ── */
  #panel{background:var(--lila2);min-height:100dvh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .cab{
    background:var(--uva);color:#fff;padding:20px 20px 26px;
    display:flex;align-items:center;gap:12px;
  }
  .cab svg{width:34px;height:34px;flex:0 0 auto}
  .cab .quien{font-weight:800;font-size:18px;line-height:1.15}
  .cab .marca{font-size:11.5px;opacity:.7;letter-spacing:.1em;text-transform:uppercase}
  .cab .salir{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.7);
    font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}
  .env{max-width:560px;margin:0 auto;padding:0 16px}
  .saldo{
    margin-top:-14px;background:#fff;border-radius:16px;padding:18px 20px;
    box-shadow:0 8px 24px -16px rgba(59,17,82,.5);border:1px solid var(--linea);
  }
  .saldo .rot{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2)}
  .saldo .num{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .saldo .num.debe{color:var(--rojo)} .saldo .num.ok{color:var(--verde)}
  .saldo .sub{font-size:13.5px;color:var(--tinta2);margin-top:4px}

  .menu{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .op{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--linea);border-radius:14px;padding:15px 16px;
    font:inherit;cursor:pointer;color:inherit;
  }
  .op:hover{border-color:var(--uva3)}
  .op .ico{font-size:21px;width:26px;text-align:center;flex:0 0 auto}
  .op .tit{font-weight:700}
  .op .des{font-size:13px;color:var(--tinta2)}
  .op .fl{margin-left:auto;color:var(--tinta2)}

  .hoja{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:18px 18px 20px;margin-top:16px}
  .hoja h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);margin:0 0 12px;font-weight:700}
  .volver{background:none;border:0;color:var(--uva2);font:inherit;font-size:14px;cursor:pointer;
    padding:10px 0;text-decoration:underline}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 0;border-bottom:1px solid var(--lila);font-size:14.5px;vertical-align:top}
  tr:last-child td{border-bottom:0}
  .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tenue{color:var(--tinta2);font-size:12.5px}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .chip.esp{background:#fdf3e0;color:var(--oro)}
  .chip.ok{background:#e7f4ed;color:var(--verde)}
  .chip.no{background:#fbeceb;color:var(--rojo)}
  .paga{background:var(--lila2);border:1px solid var(--linea);border-radius:12px;padding:13px 15px;font-size:14.5px}
  .paga .rot{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--uva2);
    font-weight:700;margin-bottom:6px}
  .paga .red{font-size:13px;color:var(--tinta2);margin-bottom:7px}
  .paga + .paga{margin-top:11px}
  .paga .dir{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:14px;background:#fff;border:1px solid var(--linea);border-radius:9px;padding:11px 12px}
  .paga .notap{margin-top:9px;font-size:13px;color:var(--tinta2)}
  .copiar{margin-top:10px;padding:11px 16px;font:inherit;font-size:14px;font-weight:700;border:0;
    border-radius:10px;background:var(--uva2);color:#fff;cursor:pointer;width:100%}
  .copiar.ok{background:var(--verde)}
    /* Elegir de qué cajas es el pago. Un cliente con cuatro no paga cuatro veces. */
    .cajitas { display:flex; flex-direction:column; gap:7px; margin-top:7px }
    .cajita { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:400;
      cursor:pointer; text-transform:none; letter-spacing:0 }
    .cajita input { width:auto; margin:0; flex:0 0 auto }

  label.campo{display:block;font-size:12.5px;color:var(--tinta2);margin-bottom:12px}
  label.campo input,label.campo textarea,label.campo select{
    width:100%;margin-top:5px;padding:12px 13px;font:inherit;border:1px solid var(--linea);
    border-radius:11px;background:#fff;color:inherit;
  }
  label.campo textarea{min-height:74px;resize:vertical}
  label.campo input:focus-visible,label.campo textarea:focus-visible{outline:2px solid var(--uva3);outline-offset:1px}
  .btn.uva{background:var(--uva2);color:#fff;width:100%}
  .msg{margin:10px 0 0;font-size:14px}
  .msg.bien{color:var(--verde)} .msg.mal{color:var(--rojo)}
  .vacio{color:var(--tinta2);font-size:14.5px}
  .caja-b{border:1px solid var(--linea);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .caja-b:last-of-type{margin-bottom:0}
  .caja-n{font-size:15.5px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .lk{display:inline-block;padding:8px 13px;border-radius:20px;background:var(--lila2);
    border:1px solid var(--linea);color:var(--uva2);text-decoration:none;font-size:13.5px;font-weight:700}
  .lk:hover{border-color:var(--uva3)}
  .pie2{text-align:center;font-size:12px;color:var(--tinta2);margin:26px 0 0}
  @media (prefers-reduced-motion:no-preference){
    .op,.btn{transition:border-color .15s ease, opacity .15s ease}
  }
</style>
</head>
<body>

<!-- ─────────── LA PORTADA ─────────── -->
<div id="portada">
  <svg id="perro" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <!-- perrito: orejas caídas, hocico y collar. Dibujado a mano para que sea el mismo en todos
         los teléfonos: un emoji cambia de cara según el aparato. -->
    <path d="M22 30c-6 2-9 12-8 24 1 10 4 15 9 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 30c6 2 9 12 8 24-1 10-4 15-9 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 20c-15 0-27 10-27 26 0 17 12 32 27 32s27-15 27-32c0-16-12-26-27-26z"
          stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="39" cy="45" r="4" fill="#fff"/>
    <circle cx="61" cy="45" r="4" fill="#fff"/>
    <path d="M50 56c-4 0-7 2-7 5s3 5 7 5 7-2 7-5-3-5-7-5z" fill="#fff"/>
    <path d="M50 66v5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M43 74c4 3 10 3 14 0" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1>GANAMOS CHAT</h1>
  <p class="bajada">Tu chat, tu cuenta.</p>

  <form class="caja" onsubmit="return entrar(event)">
    <label for="u">Tu usuario</label>
    <input id="u" name="usuario" autocomplete="username" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Ale65" required>
    <button class="btn" id="bEntrar" type="submit">Entrar</button>
    <p id="err" role="status"></p>
  </form>

  <p class="pie">Es el mismo código que ya usás. Si no te reconoce, escribinos y lo vemos.</p>
</div>

<!-- ─────────── ADENTRO ─────────── -->
<div id="panel" class="oculto">
  <div class="cab">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M22 30c-6 2-9 12-8 24 1 10 4 15 9 16" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M78 30c6 2 9 12 8 24-1 10-4 15-9 16" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 20c-15 0-27 10-27 26 0 17 12 32 27 32s27-15 27-32c0-16-12-26-27-26z"
            stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="39" cy="45" r="4.5" fill="#fff"/><circle cx="61" cy="45" r="4.5" fill="#fff"/>
      <path d="M50 56c-4 0-7 2-7 5s3 5 7 5 7-2 7-5-3-5-7-5z" fill="#fff"/>
    </svg>
    <div>
      <div class="marca">GANAMOS CHAT</div>
      <div class="quien" id="quien"></div>
    </div>
    <button class="salir" onclick="salir()">Salir</button>
  </div>

  <div class="env">
    <div class="saldo">
      <div class="rot" id="rotSaldo">Tenés que pagar</div>
      <div class="num" id="numSaldo">—</div>
      <div class="sub" id="subSaldo"></div>
    </div>

    <div class="menu" id="menu">
      <button class="op" onclick="ver('pendiente')">
        <span class="ico">💳</span>
        <span><span class="tit">Ver mi monto pendiente</span><br><span class="des">el detalle de lo que se te cobró y lo que pagaste</span></span>
        <span class="fl">›</span></button>
      <button class="op" onclick="ver('cajas')">
        <span class="ico">🎰</span>
        <span><span class="tit">Ver mis cajas</span><br><span class="des">tus links y tus accesos</span></span>
        <span class="fl">›</span></button>
      <button class="op" onclick="ver('pagar')">
        <span class="ico">✅</span>
        <span><span class="tit">Avisar que pagué</span><br><span class="des">subí el comprobante</span></span>
        <span class="fl">›</span></button>
      <button class="op" onclick="ver('nuevo')">
        <span class="ico">➕</span>
        <span><span class="tit">Pedir un chat nuevo</span><br><span class="des">para otra caja tuya</span></span>
        <span class="fl">›</span></button>
    </div>

    <div id="vista"></div>
    <p class="pie2">GANAMOS CHAT</p>
  </div>
</div>

<script>
var USUARIO = '';
var DATOS = null;
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
var num = function (x, d) { return Number(x || 0).toLocaleString('es-AR',
  { minimumFractionDigits: d, maximumFractionDigits: d }); };

async function pedir(ruta, cuerpo) {
  var r = await fetch(ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo) });
  try { return await r.json(); } catch (e) { return { ok: false, error: 'No se pudo conectar' }; }
}

async function entrar(e) {
  e.preventDefault();
  var b = $('bEntrar'), err = $('err');
  var u = $('u').value.trim();
  if (!u) return false;
  b.disabled = true; err.textContent = '';
  var r = await pedir('/chat/entrar', { usuario: u });
  b.disabled = false;
  if (!r.ok) { err.textContent = r.error || 'No encontramos ese usuario.'; return false; }
  USUARIO = u; DATOS = r.portal;
  pintar();
  return false;
}

function salir() {
  USUARIO = ''; DATOS = null;
  $('vista').innerHTML = ''; $('menu').classList.remove('oculto');
  $('panel').classList.add('oculto'); $('portada').classList.remove('oculto');
  $('u').value = ''; $('err').textContent = '';
  window.scrollTo(0, 0);
}

function pintar() {
  $('portada').classList.add('oculto');
  $('panel').classList.remove('oculto');
  $('quien').textContent = DATOS.cliente;
  var debe = Number(DATOS.saldo.debe || 0);
  $('rotSaldo').textContent = debe > 0 ? 'Tenés que pagar' : (debe < 0 ? 'Tenés a favor' : 'Estás al día');
  $('numSaldo').textContent = num(Math.abs(debe), 2) + ' USDT';
  $('numSaldo').className = 'num ' + (debe > 0 ? 'debe' : 'ok');
  var esp = (DATOS.avisos || []).filter(function (a) { return a.estado === 'pendiente'; });
  $('subSaldo').innerHTML = esp.length
    ? 'Nos avisaste ' + esp.length + ' pago' + (esp.length > 1 ? 's' : '') + '. Lo estamos revisando.'
    : deDondeSale();
}

/* De qué está hecho ese número. Un total solo obliga a preguntar, y la pregunta llega por privado:
   son dos cobros distintos, con fechas distintas y a wallets distintas. */
function deDondeSale() {
  var c = DATOS.conceptos;
  if (!c) return 'Se te cobró ' + num(DATOS.saldo.cobrado, 2) + ' · pagaste ' + num(DATOS.saldo.pagado, 2) + '.';
  var m = Number(c.saldo.mantenimiento.debe || 0), g = Number(c.saldo.ganancia.debe || 0);
  if (m <= 0 && g <= 0) return 'Estás al día con las dos cosas.';
  var partes = [];
  if (m > 0) partes.push('Mantenimiento ' + num(m, 2));
  if (g > 0) partes.push('servicio del mes ' + num(g, 2));
  // Si el mes todavía no se generó se dice, en vez de dejarlo afuera sin explicación.
  else if (!c.saldo.ganancia.generado && !c.saldo.ganancia.corrida) partes.push('el servicio del mes todavía no está');
  return partes.join(' · ') + '.';
  $('vista').innerHTML = ''; $('menu').classList.remove('oculto');
  window.scrollTo(0, 0);
}

/* La RED va aparte de la dirección: mandar USDT por la red equivocada es perder la plata, y el que
   copia una línea entera se lleva la red adentro de la dirección. */
function unaWallet(w, rotulo, id) {
  return '<div class="paga">'
    + (rotulo ? '<div class="rot">' + esc(rotulo) + '</div>' : '')
    + '<div class="red">Red <b>' + esc(w.red) + '</b>'
    + (w.alias && w.alias !== w.red ? ' · ' + esc(w.alias) : '') + '</div>'
    + '<div class="dir" id="' + id + '">' + esc(w.direccion) + '</div>'
    + '<button type="button" class="copiar" onclick="copiar(this,\'' + id + '\')">Copiar la dirección</button>'
    + '</div>';
}

/* Los avisos viejos no dicen de qué eran: la columna es nueva. Sin nombre devuelve vacío. */
function nombreConcepto(c) {
  return c === 'mantenimiento' ? 'Mantenimiento' : (c === 'ganancia' ? 'Servicio del mes' : '');
}

/* Al cambiar de concepto cambia lo que debe, así que cambia lo que el campo sugiere. Es el mismo
   gesto que ya hace la pantalla de ella cuando elige a qué imputar un pago al proveedor. */
function sugerirMonto() {
  var conc = DATOS.conceptos; if (!conc) return;
  var sel = document.querySelector('select[name=concepto]'); var inp = $('mMonto');
  if (!sel || !inp) return;
  var esMant = sel.value === 'mantenimiento';
  var caja = $('cajasMant');
  // Las cajas sólo tienen sentido con el mantenimiento: en el % del mes no hay cuáles elegir.
  if (caja) caja.style.display = esMant ? '' : 'none';
  var acl = $('aclaraMes');
  if (acl) acl.style.display = esMant ? 'none' : '';
  var marcadas = [].slice.call(document.querySelectorAll('input[name=caja]:checked'));
  if (esMant && marcadas.length) {
    // Lo que suman las que marcó. Es el número que va a transferir.
    var t = 0; marcadas.forEach(function (x) { t += Number(x.dataset.debe || 0); });
    inp.placeholder = num(t, 2);
    return;
  }
  var o = conc.opciones.filter(function (x) { return x.valor === sel.value; })[0];
  inp.placeholder = num(Math.max(0, Number((o && o.debe) || 0)), 2);
}

/* Puede haber una wallet para el servicio del mes y otra para el mantenimiento, y no la misma para
   todos los clientes. Si las dos son la misma va un bloque solo: repetir la misma dirección invita
   a mirar cuál es cuál.

   Y cada cosa puede tener VARIAS: el mantenimiento se cobra por TRC20 y por BEP20, y la red la
   elige el cliente. Esta función es gemela de bloquePago() en src/chat-doc.js — si se toca una
   sola, el cliente ve una cosa en el portal y otra en la hoja que le llega. */
var _dirN = 0;
function bloqueDe(lista, rotulo) {
  var h = '';
  for (var i = 0; i < lista.length; i++) {
    /* ⚠️ El id sale de un contador. copiar() busca por getElementById: con dos ids iguales el
       segundo botón copia la PRIMERA dirección, o sea la red equivocada, y esa plata no vuelve. */
    _dirN += 1;
    h += unaWallet(lista[i], i === 0 ? rotulo : '', 'dir' + _dirN);
  }
  return h;
}

/* Si no se dice, dos direcciones para lo mismo se leen como dos cuentas distintas. */
function variasRedes(lista) {
  return lista.length > 1
    ? '<p class="tenue" style="margin:2px 0 10px">Mandá por la red que uses. Las dos llegan al mismo lugar.</p>' : '';
}

function bloquePago() {
  var p = DATOS.pago || {};
  // Un array vacío es truthy: acá se mira el largo, o sale "Cómo pagar" sin ninguna dirección.
  var ggr = p.ggr || []; var mens = p.mens || [];
  if (!ggr.length && !mens.length) return '';
  var nota = p.nota ? '<div class="notap">' + esc(p.nota) + '</div>' : '';
  var h = '<h2 style="margin-top:20px">Cómo pagar</h2>';
  _dirN = 0;
  if (p.misma || !mens.length) {
    var l = ggr.length ? ggr : mens;
    return h + bloqueDe(l, '') + variasRedes(l) + nota;
  }
  if (!ggr.length) return h + bloqueDe(mens, 'El mantenimiento') + variasRedes(mens) + nota;
  /* Rotular los dos bloques no alcanza: se leen como "dos formas de pagar lo mismo" y el cliente
     manda todo junto a la primera dirección que ve. Esa plata entra, pero en la cuenta equivocada,
     y el mes queda medio pago de un lado y de más del otro. Se dice con todas las letras. */
  return h + '<p class="tenue" style="margin:2px 0 10px"><b>Son dos cuentas distintas.</b> '
    + 'El % sobre las ganancias se deposita en una, y el mantenimiento en la otra. '
    + 'Fijate cuál antes de mandar.</p>'
    + bloqueDe(ggr, 'El % sobre las ganancias') + variasRedes(ggr)
    + bloqueDe(mens, 'El mantenimiento') + variasRedes(mens) + nota;
}

/* `navigator.clipboard` sólo existe en https (o localhost) y el cliente abre esto desde cualquier
   lado: sin el plan B el botón no hace nada y no se entiende por qué. */
function copiar(b, id) {
  var t = document.getElementById(id).textContent.trim();
  function ok() {
    b.textContent = 'Copiada'; b.className = 'copiar ok';
    setTimeout(function () { b.textContent = 'Copiar la dirección'; b.className = 'copiar'; }, 1800);
  }
  function planB() {
    var a = document.createElement('textarea');
    a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); ok(); } catch (e) { b.textContent = 'Copiala a mano'; }
    document.body.removeChild(a);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, planB);
  else planB();
}

function volver() { $('vista').innerHTML = ''; $('menu').classList.remove('oculto'); window.scrollTo(0, 0); }

function ver(cual) {
  $('menu').classList.add('oculto');
  var h = '';
  if (cual === 'pendiente') {
    var movs = (DATOS.movs || []).slice().reverse();
    h = '<div class="hoja"><h2>Tu cuenta del chat</h2>'
      + (movs.length ? '<table><tbody>' + movs.map(function (m) {
        /* La mensualidad ya trae la caja y el período adentro de la nota ("Mantenimiento Ariel-A1 ·
           15 ago – 14 sep"): repetir "Mensualidad" adelante no agrega nada. */
        var nom = m.tipo === 'pago' ? 'Pago tuyo'
          : (m.tipo === 'mensualidad' ? (m.nota || 'Mantenimiento') : 'Servicio del mes');
        var extra = m.tipo === 'mensualidad' ? '' : (m.nota ? ' · ' + esc(m.nota) : '');
        return '<tr><td>' + esc(m.fecha) + '<div class="tenue">' + esc(nom) + extra + '</div></td>'
          + '<td class="r">' + (m.tipo === 'pago' ? '− ' : '') + num(m.monto, 2)
          + ' <span class="tenue">' + esc(m.moneda) + '</span></td></tr>';
      }).join('') + '</tbody></table>'
        : '<p class="vacio">Todavía no hay movimientos.</p>')
      + bloquePago()
      + '<button class="volver" onclick="volver()">‹ Volver</button></div>';
  } else if (cual === 'cajas') {
    h = '<div class="hoja"><h2>Tus cajas con el chat</h2>'
      + ((DATOS.cajas || []).length ? DATOS.cajas.map(function (c) {
        return '<div class="caja-b">'
          + '<div class="caja-n"><b>' + esc(c.caja) + '</b>'
          + (c.dia_cobro ? '<span class="tenue"> · mensualidad el ' + esc(c.dia_cobro) + '</span>' : '') + '</div>'
          + (c.usuario_admin ? '<div class="tenue">usuario del panel: <b>' + esc(c.usuario_admin) + '</b></div>' : '')
          + (c.tiene_clave ? '<div class="tenue" id="acc-' + esc(c.caja) + '"></div>' : '')
          + (c.link_jugadores || c.link_panel ? '<div class="links">'
            + (c.link_jugadores ? '<a class="lk" href="' + esc(c.link_jugadores) + '" target="_blank" rel="noopener">🎲 Para jugadores</a>' : '')
            + (c.link_panel ? '<a class="lk" href="' + esc(c.link_panel) + '" target="_blank" rel="noopener">🛠 Panel</a>' : '')
            + '</div>' : '<div class="tenue">Todavía no cargamos los links de esta caja.</div>')
          + '</div>';
      }).join('')
        : '<p class="vacio">No tenés ninguna caja con el chat.</p>')
      /* La contraseña del panel no está en esta página hasta que escriba la clave: al portal se
         entra con el nombre de una caja y nada más. */
      + ((DATOS.cajas || []).some(function (c) { return c.tiene_clave; })
        ? (DATOS.pide_clave
          ? '<div id="zAcc" style="margin-top:14px"><form onsubmit="return verAccesos(event)">'
            + '<label class="campo">Para ver las contraseñas, poné tu clave'
            + '<input name="clave" type="password" autocomplete="off" required></label>'
            + '<button class="btn uva" type="submit" id="bAcc">Ver mis accesos</button>'
            + '<p class="msg" id="mAcc" role="status"></p></form></div>'
          : '<p class="vacio" style="margin-top:12px">Para ver las contraseñas de tus paneles hace '
            + 'falta una clave. Escribinos y te la damos.</p>')
        : '')
      + '<button class="volver" onclick="volver()">‹ Volver</button></div>';
  } else if (cual === 'pagar') {
    /* Las opciones vienen ARMADAS del servidor (opcionesDeConcepto en chat-externo.store): la hoja
       que le llega por mail dibuja este mismo formulario, y dos textos escritos por separado
       terminan diciendo dos cosas distintas. */
    var conc = DATOS.conceptos || null;
    var sug = conc ? (conc.opciones.filter(function (o) { return o.sugerida; })[0] || conc.opciones[0]) : null;
    h = '<div class="hoja"><h2>Avisar que pagué</h2>'
      + '<form onsubmit="return avisar(event)">'
      + (conc ? '<label class="campo">' + esc(conc.titulo)
        + '<select name="concepto" onchange="sugerirMonto()">'
        + conc.opciones.map(function (o) {
          return '<option value="' + esc(o.valor) + '"' + (o.sugerida ? ' selected' : '') + '>'
            + esc(o.rotulo) + '</option>';
        }).join('') + '</select></label>' : '')
      /* Las cajas. Uno con cuatro no paga cuatro veces: paga una y dice cuáles cubre. Sólo se
         ofrece cuando hay más de una debiendo — con una sola, preguntar es hacer trabajar de más. */
      + ((conc && conc.cajasMant && conc.cajasMant.length > 1)
        ? '<div id="cajasMant" class="campo"' + (sug && sug.valor === 'mantenimiento' ? '' : ' style="display:none"') + '>'
          + esc(conc.tituloCajas)
          + '<div class="cajitas">' + conc.cajasMant.map(function (c) {
            return '<label class="cajita"><input type="checkbox" name="caja" value="' + esc(c.panel)
              + '" data-debe="' + esc(c.debe) + '" onchange="sugerirMonto()"> ' + esc(c.texto) + '</label>';
          }).join('') + '</div>'
          + '<p class="tenue" style="margin:6px 0 0">Si no marcás ninguna, lo aplicamos a las más viejas.</p></div>'
        : '')
      + '<label class="campo">Cuánto pagaste'
      + '<input name="monto" id="mMonto" inputmode="decimal" placeholder="'
      + num(Math.max(0, Number((sug ? sug.debe : DATOS.saldo.debe) || 0)), 2) + '" required></label>'
      /* La aclaración es del SERVICIO DEL MES: aparece sólo con esa opción elegida. Mostrarla
         mientras paga el mantenimiento le dice que algo "todavía no está" de lo que sí está. */
      + (conc && conc.aclaracion
        ? '<p class="tenue" id="aclaraMes" style="margin:-4px 0 12px;line-height:1.5'
          + (sug && sug.valor === 'ganancia' ? '' : ';display:none') + '">' + esc(conc.aclaracion) + '</p>'
        : '')
      + '<label class="campo">Referencia <span class="tenue">(opcional)</span>'
      + '<input name="referencia" placeholder="hash, alias, últimos dígitos"></label>'
      + '<label class="campo">Comprobante <span class="tenue">(opcional)</span>'
      + '<input type="file" name="archivo" accept="image/*"></label>'
      + '<button class="btn uva" type="submit" id="bAviso">Enviar</button>'
      + '<p class="msg" id="mAviso" role="status"></p></form>'
      + ((DATOS.avisos || []).length ? '<h2 style="margin-top:20px">Tus avisos</h2><table><tbody>'
        + DATOS.avisos.map(function (a) {
          var c = a.estado === 'aprobado' ? 'ok' : (a.estado === 'pendiente' ? 'esp' : 'no');
          var t = a.estado === 'aprobado' ? 'confirmado' : (a.estado === 'pendiente' ? 'lo estamos viendo' : 'no lo pudimos confirmar');
          /* Los avisos VIEJOS no dicen de qué eran: la columna es nueva. Queda vacía y no con un
             guión — un guión invita a preguntar qué significa. */
          return '<tr><td>' + esc(a.fecha) + '</td><td class="tenue">' + esc(nombreConcepto(a.concepto))
            + '</td><td class="r">' + num(a.monto, 2) + ' ' + esc(a.moneda)
            + '</td><td class="r"><span class="chip ' + c + '">' + t + '</span></td></tr>';
        }).join('') + '</tbody></table>' : '')
      + '<button class="volver" onclick="volver()">‹ Volver</button></div>';
  } else if (cual === 'nuevo') {
    h = '<div class="hoja"><h2>Pedir un chat nuevo</h2>'
      + '<p class="vacio" style="margin-top:-4px">Decinos para qué caja lo querés y te avisamos cuando esté.</p>'
      + '<form onsubmit="return pedirNuevo(event)">'
      /* La caja puede ser una que ya tiene o una nueva: si es nueva, el login lo elige él, que es
         el que después se lo va a dar a su gente. */
      + '<label class="campo">Para qué caja'
      + '<select name="cual" onchange="cambioCaja(this)">'
      + (DATOS.cajas || []).map(function (c) {
        return '<option value="' + esc(c.caja) + '">' + esc(c.caja) + '</option>';
      }).join('')
      + '<option value="">— una caja nueva —</option></select></label>'
      + '<label class="campo" id="lblNueva" style="display:' + ((DATOS.cajas || []).length ? 'none' : 'block') + '">'
      + 'Cómo se va a llamar<input name="caja" placeholder="el login que quieras"></label>'
      + '<label class="campo">Página que vas a usar'
      + '<input name="pagina" placeholder="Zeus, Ganamos, TioRico, Bet30…" required></label>'
      + '<label class="campo">Dominio que vas a usar <span class="tenue">(opcional)</span>'
      + '<input name="dominio" placeholder="micasino.com" autocapitalize="off" spellcheck="false"></label>'
      + '<label class="campo">Divisa <span class="tenue">(opcional)</span>'
      + '<input name="divisa" placeholder="ARS, USD…" autocapitalize="characters" style="text-transform:uppercase"></label>'
      + '<label class="campo">Algo que quieras aclarar <span class="tenue">(opcional)</span>'
      + '<textarea name="nota" placeholder="cuándo lo necesitás, para qué…"></textarea></label>'
      + '<button class="btn uva" type="submit" id="bNuevo">Enviar el pedido</button>'
      + '<p class="msg" id="mNuevo" role="status"></p></form>'
      + ((DATOS.solicitudes || []).length ? '<h2 style="margin-top:20px">Tus pedidos</h2><table><tbody>'
        + DATOS.solicitudes.map(function (s) {
          var c = s.estado === 'listo' ? 'ok' : (s.estado === 'pendiente' ? 'esp' : 'no');
          var t = s.estado === 'listo' ? 'listo' : (s.estado === 'pendiente' ? 'lo estamos viendo' : 'no se pudo');
          return '<tr><td>' + esc(String(s.creado_at).slice(0, 10))
            + '<div class="tenue">' + esc(s.caja)
            + (s.pagina ? ' · ' + esc(s.pagina) : '') + '</div></td>'
            + '<td class="r"><span class="chip ' + c + '">' + t + '</span></td></tr>';
        }).join('') + '</tbody></table>' : '')
      + '<button class="volver" onclick="volver()">‹ Volver</button></div>';
  }
  $('vista').innerHTML = h;
  window.scrollTo(0, 0);
}

async function refrescar() {
  var r = await pedir('/chat/entrar', { usuario: USUARIO });
  if (r.ok) { DATOS = r.portal; }
}

async function avisar(e) {
  e.preventDefault();
  var f = e.target, b = $('bAviso'), m = $('mAviso');
  var arch = f.archivo.files[0] || null;
  b.disabled = true; m.textContent = 'Enviando…'; m.className = 'msg';
  var datos = { usuario: USUARIO, monto: f.monto.value, referencia: f.referencia.value };
  if (f.concepto) datos.concepto = f.concepto.value;
  if (datos.concepto === 'mantenimiento') {
    datos.cajas = [].slice.call(document.querySelectorAll('input[name=caja]:checked'))
      .map(function (x) { return x.value; });
  }
  if (arch) {
    if (arch.size > 6 * 1024 * 1024) {
      m.textContent = 'La imagen es muy grande (máximo 6 MB).'; m.className = 'msg mal';
      b.disabled = false; return false;
    }
    datos.archivo = await new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () { res({ nombre: arch.name, tipo: arch.type, base64: String(fr.result) }); };
      fr.readAsDataURL(arch);
    });
  }
  var r = await pedir('/chat/aviso', datos);
  if (r.ok) {
    m.textContent = 'Listo, nos llegó. Lo revisamos y actualizamos tu saldo.'; m.className = 'msg bien';
    f.reset(); await refrescar(); pintar();
  } else { m.textContent = r.error || 'No se pudo enviar.'; m.className = 'msg mal'; b.disabled = false; }
  return false;
}

/* Si elige "una caja nueva", aparece el campo para que ponga el login que quiera. */
function cambioCaja(sel) {
  var l = document.getElementById('lblNueva');
  if (l) l.style.display = sel.value ? 'none' : 'block';
}

async function verAccesos(e) {
  e.preventDefault();
  var f = e.target, b = $('bAcc'), m = $('mAcc');
  b.disabled = true; m.textContent = 'Un segundo…'; m.className = 'msg';
  var r = await pedir('/chat/accesos', { usuario: USUARIO, clave: f.clave.value });
  if (!r.ok) { m.textContent = r.error || 'No se pudo'; m.className = 'msg mal'; b.disabled = false; return false; }
  (r.cajas || []).forEach(function (c) {
    var el = document.getElementById('acc-' + c.caja);
    if (el) el.innerHTML = 'contraseña: <b>' + esc(c.clave || '—') + '</b>';
  });
  var z = document.getElementById('zAcc');
  if (z) z.innerHTML = '<p class="vacio">Ahí están, arriba de cada caja. No los compartas.</p>';
  return false;
}

async function pedirNuevo(e) {
  e.preventDefault();
  var f = e.target, b = $('bNuevo'), m = $('mNuevo');
  var caja = (f.cual && f.cual.value) || (f.caja && f.caja.value) || '';
  if (!caja.trim()) { m.textContent = 'Decinos para qué caja lo querés.'; m.className = 'msg mal'; return false; }
  b.disabled = true; m.textContent = 'Enviando…'; m.className = 'msg';
  var r = await pedir('/chat/nuevo', {
    usuario: USUARIO, caja: caja, nota: f.nota.value,
    pagina: f.pagina.value, dominio: f.dominio.value, divisa: f.divisa.value,
    caja_nueva: !(f.cual && f.cual.value),
  });
  if (r.ok) {
    m.textContent = 'Listo, nos llegó tu pedido. Te avisamos cuando esté.'; m.className = 'msg bien';
    f.reset(); await refrescar(); ver('nuevo');
  } else { m.textContent = r.error || 'No se pudo enviar.'; m.className = 'msg mal'; b.disabled = false; }
  return false;
}
</script>
