<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GANAMOS CHAT — Liquidación</title>
<!-- Sin el logo del panel: es el que ella subió para SU pantalla, y acá entra alguien de afuera.
     El portal del cliente tampoco lo lleva, por lo mismo. -->
<style>
  /* La misma cara que el portal del cliente, a propósito: es el mismo producto visto del otro
     lado del mostrador, y no hay motivo para que parezca otra cosa. */
  :root{ --uva:#3b1a4d; --uva2:#5b2a72; --uva3:#8b5fa8; --bg:#f7f4fa; --linea:#e6dcec;
    --texto:#2b1f33; --tenue:#7a6b86; --ok:#1f7a4d; --debe:#a33; --card:#fff }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--texto); font:15px/1.5 -apple-system,
    BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
  .cab{ background:var(--uva); color:#fff; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0)) }
  .cab .adentro{ max-width:900px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; gap:12px; flex-wrap:wrap }
  .cab .chico{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.7 }
  .cab h1{ margin:2px 0 0; font-size:23px; font-weight:800 }
  .cab a{ color:#fff; opacity:.85; font-size:14px }
  .wrap{ max-width:900px; margin:0 auto; padding:16px 16px 60px }
  .card{ background:var(--card); border:1px solid var(--linea); border-radius:16px;
    padding:16px; margin-bottom:14px }
  h2{ font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--tenue);
    margin:0 0 10px; font-weight:700 }
  .tot{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap }
  .tot .num{ font-size:31px; font-weight:800; font-variant-numeric:tabular-nums }
  .num.debe{ color:var(--debe) } .num.ok{ color:var(--ok) }
  .sub{ color:var(--tenue); font-size:14px; margin:6px 0 0 }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));
    gap:10px; margin-top:12px }
  .t{ border:1px solid var(--linea); border-radius:12px; padding:11px 13px; background:var(--bg) }
  .t .k{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tenue) }
  .t .v{ font-size:20px; font-weight:750; font-variant-numeric:tabular-nums; margin-top:2px }
  .t .p{ font-size:12.5px; color:var(--tenue); margin-top:2px }
  table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
  th{ text-align:left; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--tenue); font-weight:700; padding:0 8px 7px; border-bottom:1px solid var(--linea) }
  td{ padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14.5px }
  tr:last-child td{ border-bottom:0 }
  /* Una caja que movió dos monedas: el segundo renglón es continuación del primero, no otra caja. */
  tr.sigue td{ border-top:0; padding-top:0 }
  tr.sigue + tr:not(.sigue) td{ border-top:1px solid var(--linea) }
  .r{ text-align:right }
  .tenue{ color:var(--tenue); font-size:13px }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; word-break:break-all }
  .desplaza{ overflow-x:auto }
  select,button{ font:inherit; border-radius:10px; border:1px solid var(--linea);
    padding:8px 12px; background:#fff; color:inherit }
  button{ cursor:pointer }
  .chip{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700 }
  .chip.ok{ background:#e6f4ec; color:var(--ok) } .chip.no{ background:#fbe9e9; color:var(--debe) }
  .chip.prov{ background:#fdf0dd; color:#8a5a12 }
  /* El estado del mes: lo primero que se lee, porque cambia qué significan los números de abajo. */
  .estado{ border-radius:11px; padding:10px 13px; font-size:14px; line-height:1.5; margin-bottom:13px }
  .estado.prov{ background:#fdf0dd; color:#6b4610 }
  .estado.listo{ background:#e6f4ec; color:#14532d }
  .t.prov{ border-style:dashed }
  .vacio{ color:var(--tenue); padding:10px 2px }
  /* Una caja que no se pudo calcular: se lista igual, pero sin números inventados. */
  .sc{ color:var(--tenue); font-style:italic }
  /* ── LA PORTADA: la misma que el portal del cliente ── */
  #portada{
    min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    align-items:center; padding:32px 22px calc(32px + env(safe-area-inset-bottom,0));
    background:radial-gradient(120% 90% at 50% 0%, var(--uva3) 0%, var(--uva2) 42%, var(--uva) 100%);
    color:#fff; text-align:center; gap:6px;
  }
  #perro{ width:104px; height:104px; margin-bottom:4px }
  #portada h1{ font-size:29px; line-height:1.1; margin:0; letter-spacing:-.015em; font-weight:800 }
  #portada h1 .x{ font-weight:400; opacity:.72; margin:0 3px }
  #portada .bajada{ margin:2px 0 26px; opacity:.78; font-size:15px }
  .cajaEntrar{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:10px }
  #portada label{ font-size:12.5px; letter-spacing:.11em; text-transform:uppercase; opacity:.75;
    text-align:left }
  #portada input{
    width:100%; padding:15px 16px; font:inherit; font-size:17px; border:0; border-radius:13px;
    background:rgba(255,255,255,.13); color:#fff; text-align:center;
    outline:2px solid rgba(255,255,255,.18);
  }
  #portada input:focus{ outline:2px solid #fff }
  .btnEntrar{
    padding:15px 18px; font:inherit; font-size:16px; font-weight:800; border:0; border-radius:13px;
    background:#fff; color:var(--uva); cursor:pointer;
  }
  .btnEntrar:disabled{ opacity:.55; cursor:default }
  #err{ min-height:20px; font-size:14px; color:#ffd7d7 }
  #portada .pie{ margin-top:24px; font-size:12px; opacity:.55; max-width:300px }
  /* ⚠️ `!important` porque #portada es un id y gana por especificidad: sin esto la portada se
     quedaba encima de la liquidación después de entrar. El portal del cliente lo resuelve igual. */
  .oculto{ display:none !important }
</style>

<div id="portada">
  <!-- El mismo perrito y el mismo morado que el portal del cliente: es el mismo producto visto
       del otro lado del mostrador. Dibujado a mano y no un emoji, para que sea igual en todos los
       teléfonos. -->
  <svg id="perro" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <path d="M22 30c-6 2-9 12-8 24 1 10 4 15 9 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 30c6 2 9 12 8 24-1 10-4 15-9 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 20c-15 0-27 10-27 26 0 17 12 32 27 32s27-15 27-32c0-16-12-26-27-26z"
          stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="39" cy="45" r="4" fill="#fff"/>
    <circle cx="61" cy="45" r="4" fill="#fff"/>
    <path d="M50 56c-4 0-7 2-7 5s3 5 7 5 7-2 7-5-3-5-7-5z" fill="#fff"/>
    <path d="M50 66v5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M43 74c4 3 10 3 14 0" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1>GANAMOS CHAT</h1>
  <p class="bajada">Tu liquidación.</p>

  <form class="cajaEntrar" onsubmit="return entrar(event)">
    <label for="u">Tu usuario</label>
    <input id="u" name="usuario" autocomplete="username" autocapitalize="off" autocorrect="off"
           spellcheck="false" required>
    <label for="c">Tu contraseña</label>
    <input id="c" name="clave" type="password" autocomplete="current-password" required>
    <button class="btnEntrar" id="bEntrar" type="submit">Entrar</button>
    <p id="err" role="status"></p>
  </form>

  <p class="pie">Es el usuario que te dimos. Si no te reconoce, escribinos y lo vemos.</p>
</div>

<div id="app" class="oculto">
  <div class="cab"><div class="adentro">
    <div><div class="chico">GANAMOS CHAT</div><h1 id="titulo">Liquidación</h1></div>
    <div style="display:flex;gap:10px;align-items:center">
      <select id="mes" onchange="cargar()"></select>
      <a href="#" onclick="salir();return false">Salir</a>
    </div>
  </div></div>
  <div class="wrap" id="cuerpo"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = (n, d) => Number(n || 0).toLocaleString('es-AR',
  { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d });
const MESES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
/* 'YYYY-MM' → 'agosto 2026', a mano. Pasar 'YYYY-MM' por Date se corre de mes según la zona, y un
   mes equivocado en una liquidación es una discusión. */
const mesLindo = (m) => { const p = String(m||'').split('-');
  return (MESES[Number(p[1])] || m) + ' ' + (p[0] || ''); };

async function api(u) {
  const r = await fetch(u, { headers: { 'Accept': 'application/json' } });
  if (r.status === 401 || r.status === 403) { $('portada').classList.remove('oculto'); $('app').classList.add('oculto'); return null; }
  try { return await r.json(); } catch (e) { return null; }
}
/* Se sale a ESTA pantalla, no a /login: mandarlo a la puerta de adentro le muestra el logo y las
   pestañas de ella, que no son suyos. */
async function salir() { await fetch('/api/logout', { method: 'POST' }); location.href = '/proveedor'; }

/* Entra ACÁ, sin pasar por la pantalla de ella. Es el mismo /api/login —una sola puerta, un solo
   tope de intentos— pero la cara y el vuelvo son de este producto. */
async function entrar(e) {
  e.preventDefault();
  const f = e.target, b = $('bEntrar'), m = $('err');
  b.disabled = true; m.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/login', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: f.usuario.value.trim(), password: f.clave.value }) });
    const j = await r.json().catch(() => ({}));
    if (j && j.ok) { m.textContent = ''; f.reset(); return arrancar(), false; }
    // El 429 es el tope de intentos: decirle "usuario o contraseña" ahí lo manda a probar de nuevo.
    m.textContent = r.status === 429
      ? 'Demasiados intentos. Esperá 15 minutos.'
      : 'Usuario o contraseña incorrectos.';
  } catch (err) { m.textContent = 'No pudimos conectar. Probá de nuevo.'; }
  b.disabled = false;
  return false;
}

async function arrancar() {
  const r = await api('/api/os/proveedor/meses');
  if (!r || !r.ok) return;
  $('portada').classList.add('oculto'); $('app').classList.remove('oculto');
  const ms = r.meses || [];
  $('mes').innerHTML = ms.length
    ? ms.map((m) => '<option value="' + esc(m) + '">' + esc(mesLindo(m)) + '</option>').join('')
    : '<option value="">sin datos</option>';
  cargar();
}

async function cargar() {
  const mes = $('mes').value;
  $('cuerpo').innerHTML = '<div class="card vacio">Cargando…</div>';
  const d = await api('/api/os/proveedor/mes?mes=' + encodeURIComponent(mes));
  if (!d || !d.ok) { $('cuerpo').innerHTML = '<div class="card vacio">No pudimos traer ese mes.</div>'; return; }
  $('titulo').textContent = 'Liquidación · ' + mesLindo(d.mes);

  const de = d.deuda || {};
  const g = de.ganancia || {}, mt = de.mantenimiento || {}, tt = de.total || {};
  const falta = Number(tt.falta || 0);

  /* ⚠️ EL ESTADO DEL MES VA PRIMERO Y GRANDE. El mantenimiento queda firme desde que arranca cada
     caja, pero el % se recalcula en vivo hasta que ella cierra el mes: el acumulado se sana todas
     las noches y un tipo de cambio nuevo lo mueve. Sin decirlo, él le saca una captura a una cifra
     que mañana es otra, y esa conversación no se arregla después. */
  h = '<div class="card">'
    + '<div class="estado ' + (d.cerrado ? 'listo' : 'prov') + '">'
    + (d.cerrado
      ? '✅ <b>Mes cerrado</b>' + (d.cerradoAt ? ' el ' + esc(d.cerradoAt) : '') + '. Estos números son los definitivos.'
      : '⏳ <b>Todavía no cerró el mes.</b> El mantenimiento ya está firme, pero lo de la ganancia '
        + 'es un estimado y se va a mover hasta que cerremos.')
    + '</div>'
    + '<div class="tot"><span class="tenue">' + (falta > 0 ? 'Te queda por cobrar' : 'Está todo pagado') + '</span>'
    + '<b class="num ' + (falta > 0 ? 'debe' : 'ok') + '">' + num(Math.abs(falta)) + ' USDT</b></div>'
    + '<div class="tiles">'
    + tile('Por la ganancia', g, (d.pct != null ? d.pct + '% sobre el profit' : ''), !d.cerrado)
    + tile('Mantenimiento', mt, (mt.cajas != null ? mt.cajas + ' caja' + (mt.cajas === 1 ? '' : 's') : ''), false)
    + '</div></div>';

  /* El total del mes por moneda: es contra esto que compara el panel del casino. */
  if ((d.monedas || []).length) {
    h += '<div class="card"><h2>Ganancia de ' + esc(mesLindo(d.mes)) + '</h2>'
      + '<div class="desplaza"><table><thead><tr><th>Moneda</th><th class="r">Ganancia</th>'
      + '<th class="r">Tipo de cambio</th><th class="r">En USDT</th></tr></thead><tbody>'
      + d.monedas.map((m) => '<tr><td><b>' + esc(m.moneda) + '</b></td>'
        + '<td class="r">' + num(m.profit) + '</td>'
        + '<td class="r tenue">' + (m.tc ? num(m.tc, 4) : '—') + '</td>'
        + '<td class="r"><b>' + (m.usdt == null ? '—' : num(m.usdt)) + '</b></td></tr>').join('')
      + '</tbody></table></div>'
      + ((d.sinTC || []).length
        ? '<p class="tenue" style="margin:10px 0 0">⚠️ Falta el tipo de cambio de <b>'
          + d.sinTC.map(esc).join(', ') + '</b> este mes: lo ganado en esa moneda todavía no está '
          + 'sumado en el total.</p>'
        : '')
      + '</div>';
  }

  /* Las cajas, con la ganancia en su moneda, el TC y el USDT. Sin el tipo de cambio no puede
     rehacer la cuenta con una calculadora, que es lo primero que va a querer hacer contra su
     propio panel.

     ⚠️ UNA CAJA TIENE UNA SOLA MONEDA, y por eso va en UN renglón. No es una simplificación
     cómoda: por el nivel que son, un Agente o un Distribuidor maneja una sola divisa —medido
     sobre los 73 que hay, ninguno tiene más de una— y sólo los SuperAgentes manejan varias, que
     no son cajas de nadie. Las 7 cajas del chat son todas Agente.

     El renglón de más queda igual para el caso que no debería pasar: si una caja apareciera con
     dos monedas, mostrar sólo la primera sería esconder plata. Se muestran las dos Y se avisa,
     porque significa que algo está mal cargado. */
  h += '<div class="card"><h2>Las cajas de ' + esc(mesLindo(d.mes)) + '</h2>';
  h += (d.cajas || []).length
    ? '<div class="desplaza"><table><thead><tr><th>Caja</th><th>Cliente</th>'
      + '<th class="r">Ganancia</th><th class="r">Tipo de cambio</th>'
      + '<th class="r">En USDT</th><th class="r">Te toca' + (d.cerrado ? '' : '<div class="tenue" style="font-weight:400;text-transform:none;letter-spacing:0">estimado</div>') + '</th></tr></thead><tbody>'
      + d.cajas.map((c) => {
        const ms = (c.monedas && c.monedas.length) ? c.monedas : [{ moneda: '—', profit: 0, tc: null, usdt: c.profit }];
        return ms.map((m, i) => '<tr' + (i ? ' class="sigue"' : '') + '>'
          + '<td>' + (i ? '' : '<b>' + esc(c.caja) + '</b>') + '</td>'
          + '<td class="tenue">' + (i ? '' : esc(c.cliente)) + '</td>'
          + '<td class="r"><span class="tenue">' + esc(m.moneda) + '</span> ' + num(m.profit) + '</td>'
          + '<td class="r tenue">' + (m.tc ? num(m.tc, 4) : '—') + '</td>'
          + '<td class="r">' + (m.usdt == null ? '—' : num(m.usdt)) + '</td>'
          + '<td class="r">' + (i ? '' : '<b>' + num(c.paga) + '</b>') + '</td></tr>').join('');
      }).join('')
      + (d.salteadas || []).map((x) => '<tr><td><b>' + esc(x.caja) + '</b></td>'
        + '<td class="tenue">' + esc(x.cliente) + '</td>'
        + '<td class="r sc" colspan="4">no se pudo calcular este mes</td></tr>').join('')
      + '</tbody></table></div>'
      + ((d.salteadas || []).length
        ? '<p class="tenue" style="margin:10px 0 0">Esas cajas tienen el servicio y te pagamos el '
          + 'mantenimiento igual: lo que no pudimos sacar es su ganancia. Las estamos revisando.</p>' : '')
      + ((d.cajas || []).some((c) => (c.monedas || []).length > 1)
        ? '<p class="tenue" style="margin:10px 0 0;color:var(--debe)">⚠️ Alguna caja figura con más '
          + 'de una moneda. No debería: avisanos antes de tomar estos números.</p>' : '')
      + '<p class="tenue" style="margin:10px 0 0">La ganancia sale del reporte diario de cada caja. '
      + 'El tipo de cambio es el del mes, el mismo para todas.</p>'
    : '<div class="vacio">Todavía no hay cajas con movimiento este mes.</div>';
  h += '</div>';

  /* El mantenimiento, caja por caja. Es la pregunta de todos los meses. */
  h += '<div class="card"><h2>Mantenimiento</h2>';
  h += (d.mantenimiento || []).length
    ? '<div class="desplaza"><table><thead><tr><th>Caja</th><th>Cliente</th>'
      + '<th class="r">Monto</th></tr></thead><tbody>'
      + d.mantenimiento.map((m) => '<tr><td><b>' + esc(m.caja) + '</b></td>'
        + '<td class="tenue">' + esc(m.cliente) + '</td>'
        + '<td class="r">' + num(m.monto) + '</td></tr>').join('')
      + '</tbody></table></div>'
      /* ⚠️ Se dice explícitamente que el estado es del MES, no de cada caja: los pagos se
         registran por mes y por concepto, no atados a una caja. Poner un tilde por caja sería
         inventar una precisión que el dato no tiene. */
      + '<p class="tenue" style="margin:10px 0 0">El estado de pago es del total del mes, '
      + 'no de cada caja por separado.</p>'
    : '<div class="vacio">Sin mantenimientos este mes.</div>';
  h += '</div>';

  /* Los pagos: cuándo, cuánto, de qué, y a dónde. */
  h += '<div class="card"><h2>Lo que ya te pagó</h2>';
  h += (d.pagos || []).length
    ? '<div class="desplaza"><table><thead><tr><th>Fecha</th><th>De qué</th>'
      + '<th class="r">Monto</th><th>A dónde</th></tr></thead><tbody>'
      + d.pagos.map((p) => '<tr><td>' + esc(p.fecha) + '</td>'
        + '<td>' + (p.concepto === 'mantenimiento' ? 'Mantenimiento' : 'Por la ganancia') + '</td>'
        + '<td class="r"><b>' + num(p.monto) + '</b> <span class="tenue">' + esc(p.moneda) + '</span></td>'
        + '<td>' + (p.destino
          ? '<div class="mono">' + esc(p.destino) + '</div>'
            + (p.red ? '<div class="tenue">' + esc(p.red) + '</div>' : '')
            + (p.hash ? '<div class="mono tenue">' + esc(p.hash) + '</div>' : '')
          : '<span class="tenue">' + (p.nota ? esc(p.nota) : 'no quedó anotado') + '</span>')
        + '</td></tr>').join('')
      + '</tbody></table></div>'
    : '<div class="vacio">Todavía no hay pagos registrados de este mes.</div>';
  h += '</div>';

  $('cuerpo').innerHTML = h;
}

/* `provisorio` cambia lo que dice el pie: un número que todavía se mueve no puede decir «falta
   tanto», porque ese tanto no es el que se va a pagar. */
function tile(rot, x, pie, provisorio) {
  const f = Number((x || {}).falta || 0);
  const pagado = Number((x || {}).pagado || 0);
  let estado;
  if (provisorio) estado = pagado > 0
    ? '<span class="chip prov">estimado</span> · ya cobraste ' + num(pagado)
    : '<span class="chip prov">estimado</span> · todavía no se cobró';
  else if (f > 0) estado = 'pagado ' + num(pagado) + ' · <b>falta ' + num(f) + '</b>';
  else estado = '<span class="chip ok">pagado</span>';
  return '<div class="t' + (provisorio ? ' prov' : '') + '"><div class="k">' + esc(rot) + '</div>'
    + '<div class="v">' + num((x || {}).debe) + '</div>'
    + '<div class="p">' + estado + (pie ? ' · ' + esc(pie) : '') + '</div></div>';
}

arrancar();
</script>
