          +   '<div class="row" style="margin-top:6px;align-items:flex-end;gap:8px;flex-wrap:wrap">'
          // La moneda de la CUENTA del cliente, que puede no ser la del pago: alguien paga en USDT
          // y se le lleva la cuenta en pesos. Lo que se acredita es lo que resta la deuda.
          +     '<div style="flex:0 0 auto"><label>Acreditar (' + esc(_cmpMoneda(c.codigo)) + ')</label>'
          +       '<input id="cmp-u-' + c.id + '" oninput="cmpEquiv(\'' + c.id + '\',\'' + esc(c.codigo) + '\')" placeholder="' + (_cmpMoneda(c.codigo)==='ARS'?'ej 100000':'ej 250') + '" style="width:130px"></div>'
          // ── EL TIPO DE CAMBIO, A MANO ──────────────────────────────────────────────────────
          // No es la cotización del día: es a cuánto se cambió ESA plata, que se acuerda con quien
          // la cambió. Si no se anota en el momento, después no se reconstruye. Es la columna
          // "Ex Rate" de la planilla, entre los pesos y los dólares.
          +     '<div style="flex:0 0 auto"><label>Tipo de cambio</label>'
          +       '<input id="cmp-tc-' + c.id + '" oninput="cmpEquiv(\'' + c.id + '\',\'' + esc(c.codigo) + '\')" placeholder="ej 1646,59" style="width:120px"></div>'
          +     '<div style="flex:0 0 auto;min-width:140px"><label>Equivale a</label>'
          +       '<div id="cmp-eq-' + c.id + '" class="muted" style="padding:8px 0;font-weight:700">—</div></div>'
          +     '<div style="flex:0 0 auto"><button class="small" onclick="cmpResolver(\'' + c.id + '\',\'aprobado\',\'' + esc(c.codigo) + '\')">✅ Aprobar y acreditar</button></div>'
          +   '</div>'
          + '</div>'

          // Para los que pagan en pesos todo el mes y el cambio se acuerda al cerrarlo: se acredita
          // lo que entró y el TC lo pone el cierre. No hay que inventar un número ni hacer esperar
          // al cliente figurando como deudor de algo que ya pagó.
          //
          // ⚠️ ESTE CAMPO ES OTRO, y no es un capricho: el de arriba está rotulado en la moneda de
          // la CUENTA y éste acredita en la moneda del PAGO. Cuando compartían input, escribir
          // "1000" siguiendo la etiqueta "Acreditar (USDT)" grababa 1000 PESOS.
          + '<div class="card" style="margin:8px 0 0;background:var(--bg2);border:1px solid var(--border);padding:11px 13px">'
          +   '<b style="font-size:12.5px">Todavía no sé el tipo de cambio</b>'
          +   '<div class="row" style="margin-top:6px;align-items:flex-end;gap:8px;flex-wrap:wrap">'
          +     '<div style="flex:0 0 auto"><label>Entraron (' + esc(c.divisa || 'ARS') + ')</label>'
          +       '<input id="cmp-m-' + c.id + '" value="' + esc(c.monto) + '" style="width:150px"></div>'
          +     '<div style="flex:0 0 auto"><button class="small" onclick="cmpResolver(\'' + c.id + '\',\'aprobado\',\'' + esc(c.codigo) + '\',{tcDelMes:true,divisa:\'' + esc(c.divisa || 'ARS') + '\'})">⏳ Aprobar con el TC del mes</button></div>'
          +   '</div>'
          +   '<div class="muted" style="margin-top:6px;font-size:12px">Se acredita en ' + esc(c.divisa || 'ARS')
          +     ' y se pasa a ' + esc(_cmpMoneda(c.codigo)) + ' con el tipo de cambio del mes. Cuando cargues el definitivo en 💱 Tipos de cambio, se ajusta solo.</div>'
          + '</div>'

          + '<div class="row" style="margin-top:10px;align-items:flex-end;gap:10px">'
          +   '<div style="flex:1 1 300px"><label>Nota <span class="muted" style="text-transform:none;letter-spacing:0">— sólo la ves vos</span></label>'
          +     '<input id="cmp-n-' + c.id + '" placeholder="opcional"></div>'
          +   '<div style="flex:0 0 auto"><button class="small danger" onclick="cmpResolver(\'' + c.id + '\',\'rechazado\',\'' + esc(c.codigo) + '\')">✖ Rechazar</button></div>'
          + '</div>'
        : '<div style="margin-top:8px">'
          // ── LO QUE SE ACREDITÓ DE VERDAD ────────────────────────────────────────────────────
          // El cliente declara un monto y el comprobante puede decir otro. Se acredita el del
          // comprobante, y hasta ahora ese número vivía sólo adentro del movimiento: la tarjeta
          // mostraba lo declarado y un id, así que para saber qué se cobró había que ir a buscarlo.
          // Cuando los dos no coinciden se marca, porque es justo el caso que hay que poder ver.
          + (c.acreditado != null
            ? (() => {
                const dif = Math.abs(Number(c.acreditado) - Number(c.monto)) > 0.009;
                return '<div style="font-weight:700' + (dif ? ';color:var(--gold)' : '') + '">'
                  + (dif ? '⚠ ' : '') + 'acreditado ' + money(c.acreditado, 2) + ' ' + esc(c.acreditado_moneda)
                  + (dif ? ' <span class="muted" style="font-weight:400">— el cliente había declarado ' + money(c.monto, 2) + ' ' + esc(c.divisa || '') + '</span>' : '')
                  + '</div>'
                  + (c.acreditado_otro ? '<div class="muted" style="font-size:12px">= ' + money(c.acreditado_otro, 2) + ' ' + esc(c.acreditado_otro_moneda)
                      + (c.acreditado_tc ? ' · TC ' + money(c.acreditado_tc, 2) : ' · con el tipo de cambio del mes') + '</div>' : '');
              })()
            : '')
          + '<div class="muted">' + (c.estado === 'aprobado' ? '✅ aprobado' : '✖ rechazado')
          + ' · ' + esc(String(c.resuelto_at || '').slice(0,16).replace('T',' '))
          + (c.motivo ? ' · ' + esc(c.motivo) : '') + (c.movimiento_id ? ' · movimiento ' + esc(c.movimiento_id) : '') + '</div>'
          + '</div>')
      + '</div></details>';
  };
  dest.innerHTML = '<div class="card"><h2>🧾 ' + (estado === 'pendiente' ? 'Comprobantes por aprobar' : 'Comprobantes ya resueltos') + '</h2>'
    + '<div class="muted">Los sube el cliente desde la pantalla pública. Aprobar uno <b>registra el pago y le baja la deuda</b>, así que el monto que se acredita lo ponés vos — no se toma el que declaró el cliente.</div>'
    + (conFiltros ? '<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">'
      + tabs.map(t => '<button class="' + (t[0] === _cmpFiltro ? '' : 'outline ') + 'small" onclick="_cmpFiltro=\'' + t[0] + '\';VIEWS.movimientos()">' + t[1] + (t[2] !== '' ? ' (' + t[2] + ')' : '') + '</button>').join('')
      + '</div>' : '')
    // ── VER LO DE UN CLIENTE ──────────────────────────────────────────────────────────────────
    // Las opciones salen del resumen del servidor, que viene ENTERO aunque se esté filtrando: si
    // se armaran con lo que quedó en pantalla, al elegir un cliente el desplegable se quedaría con
    // ese solo y no habría cómo volver.
    + '<div class="row" style="margin-top:8px;gap:8px;align-items:flex-end;flex-wrap:wrap">'
    +   '<div style="flex:0 0 auto"><label>Cliente</label>'
    +     '<select id="cmp-cli" onchange="_cmpCli=this.value;VIEWS.movimientos()" style="width:260px">'
    +       '<option value="">Todos los clientes</option>'
    +       (r.porCliente || []).map(x => '<option value="' + esc(x.codigo) + '"' + (x.codigo === _cmpCli ? ' selected' : '') + '>'
            + esc(x.nombre || x.codigo) + ' (' + x.total + ')' + (x.pendientes ? ' · ' + x.pendientes + ' esperan' : '') + '</option>').join('')
    +     '</select></div>'
    +   (_cmpCli ? '<div style="flex:0 0 auto"><button class="outline small" onclick="_cmpCli=\'\';VIEWS.movimientos()">✕ ver todos</button></div>' : '')
    // El total de lo que se está viendo, por moneda. Es "declarado": lo que dijo el cliente, que
    // puede no ser lo acreditado — por eso va con esa palabra y no como si fuera plata cobrada.
    +   '<div class="muted" style="flex:1;min-width:200px;padding-bottom:9px;font-size:12px">'
    +     cs.length + ' comprobante(s)'
    +     (cs.length ? ' · declarado ' + [...new Set(cs.map(x => x.divisa || 'ARS'))].sort().map(d =>
            money(cs.filter(x => (x.divisa || 'ARS') === d).reduce((a, x) => a + Number(x.monto || 0), 0), 2) + ' ' + esc(d)).join(' · ') : '')
    +   '</div>'
    + '</div>'
    + '</div>'
    // Con un cliente elegido, "no hay nada" a secas es mentira: hay, pero de otro. Se dice cuál
    // está filtrado y se ofrece salir del filtro, que si no hay que ir a buscar el desplegable.
    + (cs.length ? cs.map(fila).join('')
      : '<div class="card"><div class="empty">'
        + (_cmpCli && conFiltros
            ? 'Ese cliente no tiene comprobantes ' + (estado === 'pendiente' ? 'esperando aprobación' : 'acá')
              + '. <button class="outline small" style="margin-left:6px" onclick="_cmpCli=\'\';VIEWS.movimientos()">Ver todos los clientes</button>'
            : (estado === 'pendiente' ? '✅ No hay nada esperando aprobación.' : 'No hay comprobantes acá.'))
        + '</div></div>');
}

/* Reintentar el aviso de un comprobante que no llegó al grupo. Es el mismo envío, no uno nuevo:
   si el motivo era el bot afuera del grupo o un id viejo, se arregla eso y con esto sale. */
async function cmpReavisar(id){
  const r = await api('/api/os/comprobantes/'+id+'/reavisar',{method:'POST',body:'{}'});
  if(!r.ok) return alert('Sigue sin salir:\n\n'+(r.error||'')+'\n\nEl de cobranzas se configura en ⚙️ Config → Medios de pago; el del cliente, en el grupo de Telegram de ese cliente.');
  // Se dice cuál salió y cuál no: "Avisado" a secas cuando uno de los dos falló es mentira.
  toast((r.aviso&&r.aviso.ok?'✅ cobranzas':'⚠ cobranzas') + ' · ' + (r.cliente&&r.cliente.ok?'✅ cliente':'⚠ cliente'));
  VIEWS.comprobantes && VIEWS.comprobantes();
}

/* El equivalente, calculado mientras se escribe: es la forma más barata de que un TC mal tipeado
   se vea antes de acreditar y no después. Un cero de más en el cambio da un número absurdo, y
   absurdo se nota; guardado, no. */
/* ── LO MISMO QUE ESCRIBE EL CLIENTE, LO ESCRIBE QUIEN APRUEBA ────────────────────────────────
   Acá también se borraban todos los puntos, así que tipear "94.22" para acreditar daba 9422. Y la
   dueña dijo que ella pondría coma. El último separador manda: 1-2 dígitos detrás es decimal,
   3 es de miles. Misma regla que src/lib/monto.js y que la pantalla del cliente. */
function montoNum(txt){
  let t = String(txt==null?'':txt).trim().replace(/[\s ]/g,'');
  if(!t || !/^[\d.,]+$/.test(t)) return null;
  const u = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
  let n;
  if(u<0) n = Number(t);
  else { const d = t.length-u-1;
    n = (d===1||d===2) ? Number(t.slice(0,u).replace(/[.,]/g,'')+'.'+t.slice(u+1))
                       : Number(t.replace(/[.,]/g,'')); }
  return Number.isFinite(n)&&n>0 ? n : null;
}
function montoAmbiguo(txt){
  const t = String(txt==null?'':txt).trim();
  const u = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
  if(u<0) return false;
  const d = t.length-u-1;
  return t[u]==='.' && (d===1||d===2);
}

function cmpEquiv(id, codigo){
  const n = (v) => montoNum(v) || 0;
  const monto = n((document.getElementById('cmp-u-'+id)||{}).value);
  const tc = n((document.getElementById('cmp-tc-'+id)||{}).value);
  const el = document.getElementById('cmp-eq-'+id); if(!el) return;
  if(!(monto>0)||!(tc>0)){ el.textContent='—'; el.style.color=''; return; }
  const mon = _cmpMoneda(codigo);
  const otra = mon==='ARS' ? (monto/tc) : (monto*tc);
  el.textContent = money(otra, mon==='ARS'?2:0) + ' ' + (mon==='ARS'?'USDT':'ARS');
  el.style.color='var(--text)';
}

async function cmpResolver(id, estado, codigo, opts) {
  // Lo que salga mal acá se DICE. Un botón que no hace nada y no se queja es lo peor que puede
  // pasar en esta pantalla: se vuelve a apretar, se piensa que el sistema está caído, y el error
  // real queda escondido en la consola del navegador, que nadie mira.
  try { await _cmpResolver(id, estado, codigo, opts); }
  catch (e) { toast('No se pudo: ' + ((e && e.message) || e)); throw e; }
}
async function _cmpResolver(id, estado, codigo, opts) {
  const o = opts || {};
  const nota0 = (document.getElementById('cmp-n-' + id) || {}).value;
  // ── CON EL TC DEL MES ────────────────────────────────────────────────────────────────────
  // Se acredita en la moneda en que PAGÓ. Si escribió un monto lo usa —puede haber entrado algo
  // distinto de lo declarado— y si no, toma el declarado. El TC no se pide: lo pone el cierre.
  if (o.tcDelMes) {
    // Su propio campo, rotulado en la moneda del pago. NUNCA el de "Acreditar", que está rotulado
    // en la moneda de la cuenta y significaría otra cosa.
    const m = String((document.getElementById('cmp-m-' + id) || {}).value || '').trim();
    const nm = montoNum(m);
    if (nm == null) return toast('Ese monto no se entiende. Escribilo como 94,22');
    if (montoAmbiguo(m) && !confirm('¿Son ' + money(nm, 2) + ' ' + o.divisa + '?')) return;
    if (!confirm('¿Acreditar ' + money(m, 2) + ' ' + o.divisa + ' con el tipo de cambio del mes?'
      + '\n\nQueda contado en la cuenta desde ahora, con el promedio del mes. Cuando cargues el TC'
      + ' definitivo en 💱 Tipos de cambio se ajusta solo.')) return;
    // La moneda va explícita: el servidor la compara con la que él calcula y rechaza si no coinciden.
    // Sin eso, un desajuste entre pantalla y servidor se convierte en plata mal acreditada, callado.
    const r0 = await api('/api/os/comprobantes/' + id + '/resolver', { method: 'POST',
      body: JSON.stringify({ estado, monto: String(nm), moneda: o.divisa, tc_modo: 'mes', motivo: nota0 }) });
    if (!r0.ok) return toast('Error: ' + (r0.error || ''));
    toast('Acreditado · se ajusta al cerrar el mes');
    return VIEWS.movimientos();
  }
  const u = (document.getElementById('cmp-u-' + id) || {}).value;
  const nota = nota0;
  // La moneda de la CUENTA, no la del pago: el cliente puede pagar en USDT y llevarse la cuenta en
  // pesos. Escribir "USDT" arriba de una cifra en pesos es peor que no poner nada.
  const mon = _cmpMoneda(codigo);
  // Misma regla que en todos lados. Y si el punto es ambiguo se pregunta: acreditar 9422 en vez
  // de 94,22 es el error que se está tapando acá.
  const nu = montoNum(u);
  if (estado === 'aprobado' && nu == null) return toast('Poné cuántos ' + mon + ' se acreditan (ej 94,22)');
  if (estado === 'aprobado' && montoAmbiguo(u) && !confirm('¿Son ' + money(nu, 2) + ' ' + mon + '?')) return;
  const eqTxt = (document.getElementById('cmp-eq-' + id) || {}).textContent;
  if (estado === 'aprobado' && !confirm('¿Acreditar ' + u + ' ' + mon
    + (eqTxt && eqTxt !== '—' ? ' (' + eqTxt + ')' : '')
    + '?\n\nEsto registra el pago y le baja la deuda al cliente.')) return;
  const tc = (document.getElementById('cmp-tc-' + id) || {}).value;
  const r = await api('/api/os/comprobantes/' + id + '/resolver', { method: 'POST',
    body: JSON.stringify({ estado, monto: nu == null ? u : String(nu), tc: tc ? String(montoNum(tc) || tc) : tc, motivo: nota }) });
  if (!r.ok) return toast('Error: ' + (r.error || ''));
  toast(estado === 'aprobado' ? ('Acreditado · saldo ' + money((r.deuda || {}).total, 2) + ' ' + ((r.deuda || {}).moneda || mon)) : 'Rechazado');
  VIEWS.movimientos();
}
/** El contador de la pestaña, para que un comprobante nuevo se vea sin entrar a buscarlo. */
async function refrescarPendientes() {
  const r = await api('/api/os/comprobantes?estado=pendiente');
  _cmpPend = (r.cuentas && r.cuentas.pendiente) || 0;
  renderNav();
}

/* ── 🔔 TODO LO QUE ESPERA UNA DECISIÓN ───────────────────────────────────────────────────────
   Tres cosas distintas necesitan que alguien diga que sí: un comprobante de pago, una caja nueva
   y un movimiento de fichas entre paneles. Las tres vivían en pantallas distintas y detrás de
   botones que había que ir a buscar, así que se atendían cuando el cliente reclamaba.

async function refrescarTodoPendiente() {
  const [c, s, m] = await Promise.all([
    api('/api/os/comprobantes?estado=pendiente').catch(() => null),
    api('/api/os/solicitudes-caja?estado=pendiente').catch(() => null),
    api('/api/os/movimientos-panel').catch(() => null),

  if (c && c.ok) _cmpPend = (c.cuentas && c.cuentas.pendiente) || 0;
  if (s && s.ok) _pend.cajas = (s.solicitudes || []).length;
  // `requierenAtencion` y no "pendientes": incluye los que quedaron A MEDIAS, que son los que más
  // urgen — ahí las fichas ya salieron de un panel del cliente y están a mitad de camino.
  if (m && m.ok) _pend.movs = (m.counts || {}).requierenAtencion || 0;

  const n = _pendTotal();

/* Los datos del mes se bajan UNA vez y quedan guardados; después solo se arman los números.
   No entran en una sola consulta (dos paneles de casino de 50-120s más 52 grupos de TBS se pasan
   del límite del servidor), así que se traen por partes y se va mostrando el avance. */
async function pagoCalcular(){
  _pagoMes = val('pago-mes') || _pagoMes;
  const out=document.getElementById('pago-body');
  const paso=(t)=>{ out.innerHTML='<div class="empty">⏳ '+t+'</div>'; };
  const refrescar=_pagoRefrescar; _pagoRefrescar=false;

  // paneles>0: sin esto entraba Europa_Fichas, que tiene el "Agrupar por" en distribuidor, y
  // hacía saltar el candado del nivel — el mes no salía aunque estuviera entero en la base.
  const cx=((await api('/api/os/casino/conexiones')).conexiones||[]).filter(c=>c.activa && c.paneles>0);
  for(const c of cx){
    let desde=0, vuelta=0;
    while(vuelta++ < 20){
      paso(`trayendo ${esc(c.nombre)}${desde?` · ${desde} grupos listos`:''}… (solo la primera vez de ${esc(_pagoMes)})`);
      const p=await api('/api/os/pago-proveedores/precargar',{method:'POST',body:JSON.stringify({mes:_pagoMes,conexion_id:c.id,desde,limite:12,refrescar})});
      if(!p.ok){
        // El motor de reportes del casino falla de a ratos: se avisa y se sigue con el resto,
        // pero el mes queda incompleto y hay que decirlo, no dar un total como si estuviera bien.
        out.innerHTML=`<div class="badge err">${esc(p.error||'falló')}</div>
          <div class="muted" style="margin-top:6px">${p.reintentable?'Es el motor del casino, que falla de a ratos. Probá "Volver a consultar" en un minuto.':''}</div>`;
        if(!p.reintentable) break; else return;
      }
      if(!p.faltan) break;
      desde=p.hechos;
    }
  }
  paso('armando los números…');
  const r=await api('/api/os/pago-proveedores?mes='+encodeURIComponent(_pagoMes));
  if(!r.ok){ out.innerHTML='<div class="badge err">'+esc(r.error||'error')+'</div>'; return; }
  _pagoData=r; _pagoAbierto.clear(); pagoPintar();
}

  out.innerHTML = `

      <div class="muted" style="font-size:12px">${r.sinVincular.slice(0,20).map(x=>esc(x.nombre)+' ('+money(x.profit,0)+')').join(' · ')}</div></div>`:''}
    ${(r.sinCosto||[]).length?`<div class="muted" style="margin-top:8px">Sin costo cargado (no se les paga): ${r.sinCosto.slice(0,25).map(esc).join(' · ')}</div>`:''}

    ${(r.avisos||[]).length?`<div class="muted" style="margin-top:8px">${r.avisos.map(esc).join('<br>')}</div>`:''}`;

/* ── EL CUADRE ────────────────────────────────────────────────────────────────────────────────
   Las CUATRO vistas son la MISMA plata partida distinto, así que tienen que dar el mismo total. Si
   no dan, hay un error de cálculo y no de datos. Va arriba de todo y no escondido, porque es lo
   único de esta pantalla que puede decir "este número está mal" antes de que lo pagues.

   Decía "las tres" mientras el servicio ya cuadraba cuatro: la de por sistema entró después y este
   cartel se quedó contando de menos. Un cartel de control que no nombra todo lo que controla es
   peor que no tenerlo, porque da por revisado algo que nadie miró. */
function pagoCuadre(r){
  const c=r.cuadre; if(!c) return '';
  if(c.cuadra) return '<div class="nota ok" style="margin-bottom:10px">'
    +'✅ <b>Cuadra.</b> <span class="muted">Por proveedor, por etiqueta, por sistema y por divisa dan lo mismo: '
    +money(c.proveedores)+' USDT.</span></div>';
  return '<div class="nota err" style="margin-bottom:10px"><b>⚠️ Las cuatro vistas NO dan lo mismo.</b>'
    +'<div class="muted">por proveedor '+money(c.proveedores)+' · por etiqueta '+money(c.etiquetas)
    +' · por sistema '+money(c.sistemas)+' · por divisa '+money(c.divisas)
    +'. Es un error de cálculo, no de datos: no pagues con esto.</div></div>';
}
/* Las otras dos formas de leer la misma factura. Plegadas: la de proveedores es la que se usa
   para pagar; estas dos son para conciliar contra lo que manda el proveedor. */
function pagoVistas(r){
  const et=r.porEtiqueta||[], dv=r.porDivisa||[];
  if(!et.length && !dv.length) return '';
  // Alfabético y no por monto: esta tabla se concilia contra la del proveedor, y para eso hay que
  // poder ir a buscar un renglón. Por monto hay que barrer la columna entera.
  const alf=(a,b)=>String(a.clave).localeCompare(String(b.clave),'es',{sensitivity:'base'});
  const ets=[...et].sort(alf), dvs=[...dv].sort(alf);
  const ab=window._pagoVistas||'';
  const tab=(k,t,n)=>'<button class="'+(ab===k?'':'outline ')+'small" onclick="_pagoVistas='
    +(ab===k?"''":"'"+k+"'")+';pagoPintar()">'+t+' <span class="muted">'+n+'</span></button>';
  let cuerpo='';
  if(ab==='et'){
    // La lista de proveedores va ABAJO, no en la fila: son hasta 33 nombres en una celda y tapaban
    // los números, que es lo que se viene a leer.
    cuerpo='<table><thead><tr><th>Etiqueta</th><th class="right">Proveedores</th><th>Divisas</th>'
      +'<th class="right">A pagar (USDT)</th></tr></thead><tbody>'
      +ets.map(e=>'<tr><td><b>'+esc(e.clave)+'</b></td>'
        +'<td class="right muted">'+e.proveedores.length+'</td>'
        +'<td class="muted" style="font-size:11px">'+esc(e.divisas.join(', '))+'</td>'
        +'<td class="right"><b>'+money(e.usdt)+'</b></td></tr>').join('')
      +'</tbody></table>'
      +'<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12px">'
      +'Qué proveedores incluye cada etiqueta</summary>'
      +'<table style="margin-top:6px"><tbody>'
      +ets.map(e=>'<tr><td style="width:120px;vertical-align:top"><b>'+esc(e.clave)+'</b></td>'
        +'<td class="muted" style="font-size:11px">'+esc([...e.proveedores].sort((a,b)=>
          String(a).localeCompare(String(b),'es',{sensitivity:'base'})).join(' · '))+'</td></tr>').join('')
      +'</tbody></table></details>';
  }
  if(ab==='dv') cuerpo='<table><thead><tr><th>Divisa</th><th class="right">Movido en la moneda</th>'
    +'<th class="right">TC</th><th class="right">A pagar (USDT)</th></tr></thead><tbody>'
    +dvs.map(d=>'<tr><td><b>'+esc(d.clave)+'</b></td>'
      +'<td class="right muted">'+money(d.montoLocal)+'</td>'
      +'<td class="right '+(d.tc?'muted':'')+'">'+(d.tc?esc(d.tc)
        :'<span title="SL2 y BVS se pasan con el promedio del mes; el resto con el TC del proveedor">'
         +esc((d.tcs||[]).join(' / '))+'</span>')+'</td>'
      +'<td class="right"><b>'+money(d.usdt)+'</b></td></tr>').join('')
    +'</tbody></table>';
  return '<div style="margin-bottom:10px"><div class="row" style="gap:6px;margin-bottom:6px">'
    +tab('et','Por etiqueta',ets.length)+tab('dv','Por divisa',dvs.length)+'</div>'+cuerpo+'</div>';
}

/* ── EMITIR: congelar el documento ──────────────────────────────────────────────────────────────
   Se pide confirmación siempre y no sólo cuando ya hay una versión: emitir es el acto de decir
   "esto es lo que mandé", y hacerlo sin querer ensucia el archivo con documentos que nadie envió.
   Cuando ya hay versiones, además se dice cuántas, porque la nueva no reemplaza a ninguna. */
async function pagoEmitir(){
  const mes = val('pago-mes')||_pagoMes;
  const previas = ((await api('/api/os/documentos?tipo=pago-proveedores&mes='+encodeURIComponent(mes))).documentos)||[];
  const aviso = previas.length
    ? 'Este mes YA tiene '+previas.length+' documento(s) emitido(s).\n\nEl nuevo NO reemplaza a los '
      +'anteriores: queda como versión '+(previas.length+1)+' y los otros siguen accesibles.\n\n¿Emitir igual?'
    : 'Se va a guardar una copia congelada del pago a proveedores de '+mes+'.\n\n'
      +'Esa copia no cambia nunca más: es la que vas a poder volver a abrir para ver exactamente lo que enviaste.';
  if(!confirm(aviso)) return;
  const nota = prompt('Nota para reconocerlo después (opcional). Por ejemplo: "enviado a Henry el 10/8".','')||'';
  let r = await api('/api/os/documentos/pago-proveedores',{method:'POST',body:JSON.stringify({mes,nota})});
  // Un mes sin congelar se puede emitir, pero se pregunta una vez: el número salió de los precios
  // de hoy y no de la foto del mes.
  if(!r.ok && r.requiereConfirmar){
    if(!confirm(r.error)) return;
    r = await api('/api/os/documentos/pago-proveedores',{method:'POST',body:JSON.stringify({mes,nota,confirmar:true})});
  }
  if(!r.ok){ toast(r.error||'no se pudo emitir'); return; }
  toast(r.yaEstaba
    ? 'Es idéntico al que ya emitiste (v'+r.documento.version+'): te abro ese'
    : 'Emitido: versión '+r.documento.version);
  await pagoDocs();
  window.open('/api/os/documentos/'+r.documento.id,'_blank');
}

/** '2026-07' → 'Julio_2026' (así se llaman las columnas de la grilla) */
function tcLabel(iso){ const [y,m]=String(iso||'').split('-'); return TC_MESES_ES[Number(m)-1]?TC_MESES_ES[Number(m)-1]+'_'+y:String(iso); }
/** 'Julio_2026' / 'JULIO_26' → '2026-07'. Sirve para ordenar las columnas por fecha. */
function tcISO(lbl){ const m=/^\s*([A-Za-zÁ-ú]+)[_\s-]+(\d{2}|\d{4})\s*$/.exec(String(lbl||'')); if(!m)return null;
  const i=TC_MESES_ES.findIndex(x=>x.toLowerCase()===m[1].toLowerCase()); if(i<0)return null;
  return (m[2].length===2?'20'+m[2]:m[2])+'-'+String(i+1).padStart(2,'0'); }

/* El TC del proveedor es el divisor de TODO lo que se le paga a los externos en pesos. El control
   del 50% vive en el servidor (setTC) y estaba apagado desde acá; ahora, cuando frena, la pantalla
   muestra la pregunta y recién con un sí explícito reenvía con `forzar`.
   El caso que atrapa: "1.473" es un número válido —uno coma cuatro siete tres— así que el control
   de formato lo deja pasar, y todo lo que se paga sale mil veces más grande. */
async function setTcProv(mes, forzar){
  const v = val('tcp-'+mes); if(!v) return;
  const r = await api('/api/os/tc/mes/'+mes, {method:'PUT',
    body: JSON.stringify({ tc_proveedor_ext: v, forzar: !!forzar })});
  if (!r.ok) {
    // api() ya mostró el motivo; acá se pregunta sólo cuando el servidor dice que se puede forzar.
    if (r.confirmar && confirm(r.error + '\n\n¿Guardar ' + v + ' igual?')) return setTcProv(mes, true);
    return;
  }
  toast('Mes cerrado'); VIEWS.tc();
}

let _movCli = '', _movTipo = '', _movQ = '', _movTope = 40;
const MOV_TIPO = { carga: 'carga', pago: 'pago', ajuste: 'ajuste' };
function movFiltro(k, v){ if(k==='cli') _movCli=v; if(k==='tipo') _movTipo=v; if(k==='q') _movQ=v;
  _movTope = 40; MOV.cuenta(); }
function movMas(){ _movTope += 60; MOV.cuenta(); }

MOV.cuenta = async () => {
  if(!_clientes.length){ const d=await api('/api/os/clientes'); _clientes=d.clientes||[]; }
  const movs = (await api('/api/os/movimientos')).movimientos||[];
  const nom = {}; _clientes.forEach(c=>{ nom[c.id]=c; });

  // ── el filtro ───────────────────────────────────────────────────────────────────────────────
  const q = _movQ.trim().toLowerCase();
  const vistos = movs.filter(m=>{
    if(_movCli && m.cliente_id!==_movCli) return false;
    if(_movTipo && m.tipo!==_movTipo) return false;
    if(!q) return true;
    const c = nom[m.cliente_id];
    return [c&&c.codigo, c&&c.nombre, m.notas, m.medio, m.tipo]
      .some(x=>String(x||'').toLowerCase().includes(q));
  });

  // ── el titular: qué se cargó y qué se cobró de lo que se está viendo ─────────────────────────
  // Sin esto la lista contestaba "qué pasó" pero no "cuánto", que es la pregunta de verdad.
  const suma = (t) => vistos.filter(m=>m.tipo===t).reduce((a,m)=>a+Number(m.monto_usdt||0),0);
  const cargas = suma('carga'), pagos = suma('pago'), ajustes = suma('ajuste');
  const provis = vistos.filter(m=>m.provisional).length;
  const cliSel = _movCli ? nom[_movCli] : null;

  /* ⚠️ LO QUE DEBEN NO SE RESTA ACÁ. La tentación es hacer «cargas − pagos» y mostrarlo, pero da
     otro número: la deuda de verdad la calcula el servidor e incluye lo de proveedores. Con los
     datos de hoy la resta daba 80.049,78 y la deuda real es 80.239,30 — 190 USDT de diferencia
     puestos al lado de cifras que sí son exactas. Así que se muestra la del servidor.
     Y agrupada por la moneda de la CUENTA: hoy están todos en USDT, pero el que lleve la suya en
     pesos no se puede sumar con los demás. */
  const deudaPorMoneda = {};
  (cliSel ? [cliSel] : _clientes).forEach(c=>{
    if(!c.deuda) return;
    const k = c.deuda.moneda || 'USDT';
    deudaPorMoneda[k] = (deudaPorMoneda[k]||0) + Number(c.deuda.total||0);
  });
  const deudaProv = (cliSel ? [cliSel] : _clientes).filter(c=>c.deuda && c.deuda.provisional).length;

  const cliOpts = _clientes.slice().sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo)))
    .map(c=>`<option value="${c.id}"${c.id===_movCli?' selected':''}>${esc(c.codigo)} · ${esc(c.nombre||'')}</option>`).join('');

  document.getElementById('mov-body').innerHTML = `
    ${_cmpPend ? `<div class="nota-suave" style="margin-bottom:12px"><b>⏳ Hay ${_cmpPend} comprobante(s) esperando aprobación.</b>
      <span class="muted">Hasta que los apruebes no bajan ninguna deuda.</span>
      <button class="small" style="margin-left:8px" onclick="movSub('pendientes')">Verlos</button></div>` : ''}

    <div class="card"><h2>💳 Registrar un pago a mano</h2>
      <div class="muted" style="margin-bottom:10px">Para lo que no entra por un comprobante:
        un pago en efectivo, una transferencia que llegó por otro lado. Baja la deuda igual que aprobar un comprobante.</div>
      <div class="row" style="align-items:flex-end">
        <div><label>Cliente</label><select id="mp-cli">
          <!-- Arrancaba en el primero por orden alfabético: apretar «Registrar» sin tocar nada
               le cargaba el pago a un cliente que nadie eligió. -->
          <option value="">— elegí el cliente —</option>${cliOpts}</select></div>
        <div><label>Monto (USDT)</label><input id="mp-monto" type="number" placeholder="1000"/></div>
        <div style="flex:0"><label>¿Por dónde?</label><select id="mp-medio">
          <option value="cvu">CVU / transferencia</option><option value="usdt">USDT</option>
          <option value="efectivo">Efectivo</option><option value="otro">Otro</option></select></div>
        <div style="flex:0"><button onclick="regPago()">Registrar pago</button></div>
      </div>
    </div>

    <div class="card">
      <div class="tapa">
        <div>
          <h2>Movimientos</h2>
          <div class="sub">${vistos.length===movs.length
            ? `${movs.length} en total`
            : `${vistos.length} de ${movs.length}${cliSel?' · '+esc(cliSel.nombre||cliSel.codigo):''}`}</div>
        </div>
        <div class="acciones">
          <input id="mov-q" placeholder="🔍 cliente, nota, medio…" value="${esc(_movQ)}"
            oninput="clearTimeout(window._movT);window._movT=setTimeout(()=>movFiltro('q',this.value),250)" style="width:210px">
          <select onchange="movFiltro('cli',this.value)" style="width:210px">
            <option value="">Todos los clientes</option>${cliOpts}</select>
          <select onchange="movFiltro('tipo',this.value)" style="width:130px">
            <option value="">Todo</option>
            ${Object.keys(MOV_TIPO).map(t=>`<option value="${t}"${t===_movTipo?' selected':''}>${MOV_TIPO[t]}s</option>`).join('')}
          </select>
          ${(_movCli||_movTipo||_movQ)?`<button class="outline small" onclick="_movCli='';_movTipo='';_movQ='';movFiltro('q','')">✕ limpiar</button>`:''}
        </div>
      </div>

      <div class="tc-tiles" style="margin:12px 0 4px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
        <!-- Con el filtro en «pagos», una fichita que dice «SE CARGÓ 0,00» no informa nada: se
             esconde lo que quedó en cero, salvo cuando no hay ningún filtro puesto. -->
        ${(cargas||!_movTipo)?`<div class="tc-t"><div class="d">SE CARGÓ</div><div class="v">${money(cargas,2)}</div><div class="f">USDT</div></div>`:''}
        ${(pagos||!_movTipo)?`<div class="tc-t"><div class="d">PAGÓ</div><div class="v" style="color:var(--verde2)">${money(pagos,2)}</div><div class="f">USDT</div></div>`:''}
        ${ajustes?`<div class="tc-t"><div class="d">AJUSTES</div><div class="v">${money(ajustes,2)}</div><div class="f">USDT</div></div>`:''}
        ${Object.keys(deudaPorMoneda).map(k=>`<div class="tc-t mal">
          <div class="d">${cliSel?'DEBE':'DEBEN'}${deudaProv?' <span class="badge warn" title="Parte de esa deuda está con el TC del mes y se ajusta cuando cargues el definitivo">prov.</span>':''}</div>
          <div class="v">${money(deudaPorMoneda[k],2)}</div><div class="f">${esc(k)} · al día de hoy</div></div>`).join('')}
      </div>
      ${provis?`<div class="muted" style="margin-bottom:8px">⏳ <b>${provis}</b> movimiento(s) todavía con el TC del mes: se ajustan solos cuando cargues el definitivo en 💱 Tipos de cambio.</div>`:''}

      <table style="margin-top:8px"><thead><tr><th>Fecha</th><th>Tipo</th><th>Cliente</th>
        <th class="right">ARS</th><th class="right">USDT</th><th class="right">TC</th><th>De dónde</th></tr></thead><tbody>
      ${vistos.slice(0,_movTope).map(m=>{ const c=nom[m.cliente_id];
        const cls = m.tipo==='pago'?'ok':(m.tipo==='ajuste'?'err':'warn');
        return `<tr>
          <td class="muted" style="white-space:nowrap">${esc((m.fecha||'').slice(0,16).replace('T',' '))}</td>
          <td><span class="badge ${cls}">${esc(m.tipo)}</span></td>
          <td>${c?'<b>'+esc(c.codigo)+'</b>':'<span class="muted">—</span>'}</td>
          <td class="right">${m.monto_ars?money(m.monto_ars,0):''}</td>
          <td class="right"${m.tipo==='pago'?' style="color:var(--verde2)"':''}><b>${m.monto_usdt?money(m.monto_usdt,2):''}</b></td>
          <td class="right muted">${m.tc_momento?money(m.tc_momento,0):(m.tc_usado?money(m.tc_usado,0):'')}${m.provisional?' <span class="badge warn" title="Con el TC del mes: se ajusta solo cuando cargues el definitivo">prov.</span>':''}</td>
          <td class="muted" style="font-size:12px">${esc(m.medio||m.notas||'')}</td></tr>`;
      }).join('') || '<tr><td colspan="7" class="empty">Ningún movimiento con ese filtro.</td></tr>'}
      </tbody></table>
      ${vistos.length>_movTope?`<div style="margin-top:10px"><button class="outline small" onclick="movMas()">
        Ver ${Math.min(60, vistos.length-_movTope)} más <span class="muted">(quedan ${vistos.length-_movTope})</span></button></div>`:''}
    </div>`;
  refrescarPendientes();
};
async function regPago(){
  // El desplegable arranca vacío a propósito; sin esta guarda el POST salía con cliente_id='' y el
  // servidor contestaba un error críptico en vez de decir qué falta.
  const cli=val('mp-cli'); if(!cli) return toast('Elegí a qué cliente es el pago');
  const monto=val('mp-monto'); if(!monto || Number(monto)<=0) return toast('Poné el monto en USDT');
  const r=await api('/api/os/movimientos/pago',{method:'POST',body:JSON.stringify({cliente_id:cli,monto_usdt:monto,medio:val('mp-medio')})});
  if(r.ok) toast('Pago registrado — saldo '+money(r.deuda.total,2)+' USDT');
  _movSub='cuenta'; VIEWS.movimientos();
}

// ───────── REPARTO (split empresa/LATAM/socios) ─────────
/* ═══════════ 💰 REPARTO ═══════════════════════════════════════════════════════════════
   Una sola pantalla para una sola pregunta: cómo se divide lo que paga cada cliente.

   Antes estaba en cuatro lugares — Reparto arriba mostraba el resultado, y adentro de Config
   vivían Socios, Participaciones y la Tabla Split. Eran cuatro porque el cálculo iba en dos
   pasos (Split partía el fee en Empresa/LATAM, Participaciones repartía LATAM entre socios).
   Ahora el cálculo es de UN paso (§12) y la pantalla lo acompaña: el catálogo, la configuración
   por cliente y el resultado del mes son tres vistas de lo mismo. */
const REP = {};
const REP_SUBS = [['mes','📊 Resultado del mes'],['clientes','👥 Reparto por cliente'],['participantes','🤝 Participantes']];

VIEWS.reparto = () => {
  document.getElementById('main').innerHTML =
    `<div class="card" style="padding:10px 12px;margin-bottom:12px"><div style="display:flex;gap:6px;flex-wrap:wrap">`+
    REP_SUBS.map(([k,l])=>`<button class="${k===_repSub?'':'outline'} small" onclick="repSub('${k}')">${l}</button>`).join('')+
    `</div></div><div id="rep-body"><div class="card"><div class="empty">Cargando…</div></div></div>`;
  (REP[_repSub]||REP.mes)();
};
function repSub(s){ _repSub=s; VIEWS.reparto(); }

/* ── Resultado del mes ─────────────────────────────────────────────────────────────── */
REP.mes = async () => {
  if(!_clientes.length){ const d=await api('/api/os/clientes'); _clientes=d.clientes||[]; }
  const mes = _repMes || new Date().toISOString().slice(0,7);
  const d = await api('/api/os/reportes/distribucion?mes='+mes);
  const pend = Number(d.sin_asignar||0)>0;
  document.getElementById('rep-body').innerHTML = `
    <div class="card">
      <h2>💰 Cómo se reparte el mes <span class="muted">(sobre ventas de fichas · USDT)</span>
        <input type="month" id="rep-mes" value="${esc(d.mes||mes)}" onchange="reloadDist()" style="width:auto;display:inline-block;margin-left:8px"></h2>
      <div class="muted" style="margin-bottom:8px">💵 Vendido en el mes (prepago): <b>${money(d.ventas_total)} USDT</b> — el % se cobra sobre lo <b>vendido</b>, usen o no las fichas.</div>
      <div class="muted" style="margin-bottom:8px;font-size:12px">Cada moneda se pasa a USDT con su propio tipo de cambio:
        ${(d.tcPorDivisa||[]).map(t=>'<span class="pill" style="margin-right:3px" title="'+esc(t.fuente||'sin cargar')+'">'+esc(t.divisa)+(t.tc?' '+money(t.tc,2):' ⚠ sin TC')+'</span>').join('')||'—'}</div>
      <div class="row" style="align-items:stretch">
        <div class="card" style="flex:1;background:var(--bg3);margin:0"><label>A cobrar</label><div style="font-size:24px;font-weight:800">${money(d.total)}</div></div>
        <div class="card" style="flex:1;background:var(--bg3);margin:0"><label>Repartido</label><div style="font-size:24px;font-weight:800;color:var(--gold)">${money(d.repartido)}</div></div>
        <div class="card" style="flex:1;background:${pend?'rgba(217,83,79,.12)':'var(--bg3)'};margin:0"><label>Sin asignar</label><div style="font-size:24px;font-weight:800;color:${pend?'var(--red)':'inherit'}">${money(d.sin_asignar)}</div><div class="muted" style="font-size:11px">puntos del base que nadie cobra</div></div>
      </div>
      ${(d.problemas||[]).length?`<div class="card" style="margin:12px 0 0;border-left:3px solid var(--red);background:var(--bg3)">
        <b>⚠ ${d.problemas.length} cliente${d.problemas.length>1?'s':''} con el reparto sin terminar</b>
        <div class="muted" style="margin:4px 0 6px">Se reparte lo que está configurado; el resto figura arriba como "sin asignar".</div>
        <table><thead><tr><th>Cliente</th><th>Qué pasa</th><th class="right">En juego (USDT)</th></tr></thead><tbody>
        ${d.problemas.map(p=>`<tr><td><span class="pill">${esc(p.codigo)}</span></td>
          <td class="muted">${p.estado==='sin_tc'?('<span style="color:var(--red)">vendió en '+esc(p.divisas)+' y ese mes no tiene tipo de cambio cargado — esa moneda NO entró en el total</span>')
            :p.estado==='sin_base'?'no tiene % base cargado'
            :p.estado==='sin_reparto'?'nadie lo cobra todavía'
            :p.estado==='excedido'?('el reparto suma '+esc(p.suma)+'% y su base es '+esc(p.base)+'% — se cobraría de más')
            :('faltan repartir '+esc(p.resto)+' de sus '+esc(p.base)+' puntos')}</td>
          <td class="right"><b>${p.estado==='sin_tc'?'—':money(p.en_juego)}</b></td>
          </tr>`).join('')}
        </tbody></table>
        <div style="margin-top:8px"><button class="outline small" onclick="repSub('clientes')">Ir a configurarlos →</button></div>
      </div>`:''}
      <h2 style="margin-top:16px">Por participante</h2>
      <table><thead><tr><th>Participante</th><th class="right">USDT</th></tr></thead><tbody>
      ${(d.participantes||[]).map(s=>`<tr><td>${s.es_empresa?'🏢 ':''}${esc(s.nombre)}</td><td class="right"><b>${money(s.monto)}</b></td></tr>`).join('') || '<tr><td colspan="2" class="empty">Sin ventas este mes.</td></tr>'}
      ${pend?`<tr><td class="muted">— sin asignar —</td><td class="right" style="color:var(--red)"><b>${money(d.sin_asignar)}</b></td></tr>`:''}
      </tbody></table>
      <h2 style="margin-top:16px">Por cliente</h2>
      <table><thead><tr><th>Cliente</th><th class="right">Vendido (USDT)</th><th class="right">Base</th><th>Se lo llevan</th><th class="right">A cobrar</th></tr></thead><tbody>
      ${(d.clientes||[]).map(c=>`<tr>
        <td><span class="pill">${esc(c.codigo)}</span></td>
        <td class="right">${money(c.ventas)}</td>
        <td class="right">${c.base!=null?esc(c.base)+'%':'<span class="badge warn">—</span>'}</td>
        <td class="muted" style="font-size:12px">${(c.items||[]).map(i=>esc(i.nombre)+' '+esc(i.pct)).join(' · ')||'—'}${Number(c.sin_asignar||0)>0?' <span style="color:var(--red)">+ '+money(c.sin_asignar)+' sin asignar</span>':''}</td>
        <td class="right"><b>${money(c.fee)}</b></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Sin ventas de fichas este mes.</td></tr>'}
      </tbody></table>
    </div>`;
};
function reloadDist(){ _repMes = val('rep-mes'); REP.mes(); }

/* ── Reparto por cliente ───────────────────────────────────────────────────────────── */
REP.clientes = async () => {
  { const d=await api('/api/os/clientes'); _clientes=d.clientes||[]; }   // siempre fresco: si se
  { const d=await api('/api/os/personas'); _personas=d.personas||[]; }   // borró o fusionó un cliente, que no siga apareciendo
  const mes = _repMes || new Date().toISOString().slice(0,7);
  // Quién tiene el reparto cerrado: se pregunta de una y se marca en la lista, para no tener que
  // abrir cliente por cliente para saber cuáles faltan.
  const est = {};
  await Promise.all(_clientes.filter(c=>!c.es_vendedor).map(async c=>{
    const r = await api('/api/os/reparto/'+c.id+'?mes='+mes);
    est[c.id] = (r && r.reparto) ? r.reparto.estado : '?';
  }));
  window._repEstado = est;
  if(!_repCli || !_clientes.some(c=>c.id===_repCli)) {
    const primero = _clientes.filter(c=>!c.es_vendedor).sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'))[0];
    _repCli = primero ? primero.id : '';
  }
  document.getElementById('rep-body').innerHTML = `
    <div class="card">
      <h2>👥 Quién cobra de cada cliente</h2>
      <div class="muted" style="margin-bottom:6px">Los porcentajes son <b>puntos del % base</b> del cliente, no porciones de otra cosa: tienen que sumar exactamente su base. Ej. <i>Pistacho al 10% → Empresa 5 · Henry 1,2 · Alexa 1,8 · Juli 1 · Intermediario 1</i>.</div>
      <div class="muted" style="margin-bottom:10px">En la lista: ✅ ya cierra · 🟡 falta repartir · 🔴 se pasa de la base · ⚪ sin % base cargado.
        <b>${Object.values(est).filter(e=>e==='ok').length}</b> de ${Object.keys(est).length} cerrados.</div>
      <div class="row">
        <div><label>Cliente</label><select id="rp-cli" onchange="repCargarCli()">${
          // Alfabético y con el estado adelante: de un vistazo se ve a quién le falta.
          _clientes.filter(c=>!c.es_vendedor)
            .sort((a,b)=>String(a.nombre||a.codigo).localeCompare(String(b.nombre||b.codigo),'es',{sensitivity:'base'}))
            .map(c=>{
              const e = est[c.id];
              const m = e==='ok' ? '✅' : e==='sin_base' ? '⚪' : e==='excedido' ? '🔴' : '🟡';
              return `<option value="${c.id}" ${c.id===_repCli?'selected':''}>${m} ${esc(c.nombre||c.codigo)}</option>`;
            }).join('')}</select></div>
        <div style="flex:0 0 190px"><label>Mes</label><input type="month" id="rp-mes" value="${esc(mes)}" onchange="repCargarCli()" style="width:100%"/></div>
        <div style="flex:0 0 190px"><label>Vigente desde</label><input id="rp-desde" type="date" style="width:100%"/></div>
      </div>
      <hr/>
      <div id="rp-box" class="muted">Cargando…</div>
    </div>
    <div class="card">
      <h2>⤓ Sembrar desde la vieja Tabla Split</h2>
      <div class="muted" style="margin-bottom:8px">Pre-carga la fila de la <b>Empresa</b> de cada cliente usando la Tabla Split que se jubiló. Los puntos que iban a "LATAM" <b>no</b> se reparten solos: quién se los lleva es una decisión que nadie tomó, así que quedan sin asignar y a la vista. No pisa a los clientes que ya tengan reparto.</div>
      <div class="row"><button class="outline" onclick="repSembrar(false)">👁 Ver qué haría</button><button onclick="repSembrar(true)">⤓ Sembrar</button></div>
      <div id="rp-seed" style="margin-top:12px"></div>
    </div>`;
  repCargarCli();
};
async function repCargarCli(){
  _repCli = val('rp-cli'); const mes = val('rp-mes');
  if(!_repCli) return;
  const r = await api('/api/os/reparto/'+_repCli+'?mes='+mes);
  const rep = r.reparto||{};
  const box = document.getElementById('rp-box');
  if(rep.base==null||rep.base===''){
    box.innerHTML = `<div class="badge err">Sin % base</div> <span class="muted">Este cliente no tiene % base cargado para ${esc(mes)}. Sin eso no hay contra qué cerrar el reparto — se carga en su ficha (Clientes → ✎).</span>`;
    return;
  }
  const vig = rep.items||[];
  box.innerHTML = `
    <div class="muted" style="margin-bottom:8px">Base de <b>${esc(mes)}</b>: <b style="color:var(--gold)">${esc(rep.base)}%</b> — el reparto tiene que sumar eso.</div>
    ${_personas.map(p=>{
      const cur = vig.find(v=>v.persona_id===p.id);
      return `<div class="row" style="align-items:center;gap:8px">
        <div style="flex:1">${p.es_empresa?'🏢 ':''}${esc(p.nombre)}</div>
        <div style="flex:0;width:120px"><input id="part-${p.id}" type="number" step="0.01" value="${cur?esc(cur.pct):''}" placeholder="0" oninput="sumaParts()"/></div>
        <div style="flex:0">%</div></div>`;
    }).join('') || '<div class="empty">No hay participantes cargados — agregalos en la solapa Participantes.</div>'}
    <div class="row" style="margin-top:10px;align-items:center">
      <div style="flex:1">Suma: <b id="pa-suma">0</b>% de <b>${esc(rep.base)}%</b> <span id="pa-resto" class="muted"></span></div>
      <button class="outline small" onclick="saveParts(true)">Guardar incompleto</button>
      <button onclick="saveParts(false)">💾 Guardar reparto</button>
    </div>`;
  window._repBase = rep.base;
  sumaParts();
}
function sumaParts(){
  let s=0; _personas.forEach(p=>{ const el=document.getElementById('part-'+p.id); if(el&&el.value) s+=Number(el.value); });
  s = Math.round(s*10000)/10000;
  const base = Number(window._repBase||0);
  const el=document.getElementById('pa-suma'); if(!el) return;
  el.textContent = s;
  el.style.color = s===base ? 'var(--green)' : (s>base ? 'var(--red)' : 'var(--gold)');
  const r=document.getElementById('pa-resto');
  if(r){
    const dif = Math.round((base-s)*10000)/10000;
    r.textContent = dif===0 ? '· cierra ✓' : (dif>0 ? '· faltan '+dif+' puntos por asignar' : '· se pasa '+(-dif)+' puntos');
    r.style.color = dif<0 ? 'var(--red)' : 'var(--muted)';
  }
}

        padding:10px 12px;border-radius:0 8px 8px 0">
        <b>Este archivo no se comparte.</b> Adentro van las contraseñas del casino, en texto legible

        reciente en un archivo aparte y todavía no lo pasó al principal: copiando sólo el principal,

/* La tabla, ORGANIZADA POR VENDEDOR — el mismo criterio que la pantalla de Clientes.
   Cada vendedor primero, y debajo su gente. El que no carga grupo propio HEREDA el del vendedor:
   así se carga uno solo y le sirve a los 14 clientes de Henry, en vez de pegar el mismo id 14 veces.
   La herencia se resuelve también en el servidor (telegram-destino.js), no sólo acá: si sólo se
   dibujara, la pantalla diría que llega y el mensaje se perdería. */
function tgGrupos(cs, pans){
  // ⚠️ Un vendedor puede colgar de OTRO vendedor: GanamosSarah y Julian son vendedores y a la vez
  // gente de Alexa. Recorriendo "todos los vendedores" arriba y además sus hijos, esos dos salían
  // DOS VECES. Se recorre el árbol como en la pantalla de Clientes: la raíz son los que no cuelgan
  // de nadie, y cada uno dibuja a los suyos hacia abajo. Cada cliente aparece exactamente una vez.
  const deVend = {}; cs.forEach(c=>{ if(c.vendedor_id && c.vendedor_id!==c.id) (deVend[c.vendedor_id]=deVend[c.vendedor_id]||[]).push(c); });
  const porNombre=(a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
  const raiz = cs.filter(c=>!c.vendedor_id || c.vendedor_id===c.id).sort(porNombre);
  const fila=(c, jefe, prof)=>{
    const t=c.telegram||{}; const np=pans.filter(p=>p.cliente_id===c.id).length;
    const propio=(t.chatId||'').trim();
    const hered=!propio && jefe && ((jefe.telegram||{}).chatId||'').trim();
    return `<tr${c.es_vendedor?' class="cie-tv"':''}>
      <td style="padding-left:${8+prof*22}px">${prof?'<span class="muted">└ </span>':''}${_nom(c)}
        ${c.es_vendedor?'<span class="cie-tag">vendedor</span>':''}
        ${np?`<span class="muted" style="font-size:11px">· ${np} panel${np===1?'':'es'}</span>`:''}</td>
      <td><input id="tgc-${c.id}" value="${esc(propio)}"
        placeholder="${hered?'hereda de '+esc(jefe.nombre||jefe.codigo):'-1001234567890'}"
        onchange="tgFila('${c.id}')" title="${hered?'Vacío = le llega al grupo de '+esc(jefe.nombre||jefe.codigo)+'. Escribí uno acá sólo si este cliente tiene grupo propio.':''}"
        style="width:190px;font-variant-numeric:tabular-nums;font-size:12px${hered?';background:rgba(46,160,67,.10)':''}">
        ${hered?'<span class="badge ok" style="margin-left:5px">hereda</span>':''}
        ${!propio&&!hered?'<span class="badge err" style="margin-left:5px">no le llega</span>':''}</td>
      <td><label style="text-transform:none;display:flex;align-items:center;gap:6px;margin:0;cursor:pointer">
        <input type="checkbox" id="tge-${c.id}" ${t.enabled?'checked':''} onchange="tgFila('${c.id}')" style="width:auto">
        avisar cada carga</label></td>
      <td class="right" style="white-space:nowrap">
        ${(propio||hered)?`<button class="outline small" onclick="tgProbar('${c.id}','${esc(String(c.nombre||c.codigo)).replace(/'/g,"\\'")}')">🔔 Probar</button>`:''}
        <button class="outline small" onclick="abrirCliente('${c.id}','comercial')">Ficha</button></td></tr>`;
  };
  // Baja por el árbol. `vistos` corta cualquier ciclo en los datos (A vendedor de B y B de A):
  // sin eso una rama circular colgaría el navegador en vez de mostrar la pantalla.
  const vistos=new Set();
  const rama=(c, jefe, prof)=>{
    if(vistos.has(c.id)) return '';
    vistos.add(c.id);
    return fila(c,jefe,prof) + (deVend[c.id]||[]).sort(porNombre).map(h=>rama(h,c,prof+1)).join('');
  };
  let html=raiz.map(c=>rama(c,null,0)).join('');
  // Los que quedaron fuera del árbol: su vendedor no existe o hay un ciclo. Se muestran igual —
  // desaparecer de la lista sería peor que salir raro.
  const sueltos=cs.filter(c=>!vistos.has(c.id)).sort(porNombre);
  if(sueltos.length){
    html+=`<tr><td colspan="4" class="muted" style="padding-top:14px"><b>Sin vendedor válido</b> — no pueden heredar de nadie</td></tr>`;
    html+=sueltos.map(c=>fila(c,null,0)).join('');
  }
  return html||'<tr><td colspan="4" class="empty">Sin clientes.</td></tr>';
}
/* Guarda una fila al salir del campo. Es el MISMO endpoint que usa la ficha del cliente, así que
   no son dos configuraciones: es un atajo de carga sobre el mismo dato. */
async function tgFila(id){
  const chatId=val('tgc-'+id), enabled=document.getElementById('tge-'+id).checked;
  const r=await api('/api/clientes/'+id+'/telegram',{method:'PUT',body:JSON.stringify({chatId,enabled})});
  const inp=document.getElementById('tgc-'+id);
  if(!r.ok) return;
  inp.classList.add('cie-ok'); setTimeout(()=>inp.classList.remove('cie-ok'),350);
  // Si el que cambió es un VENDEDOR, el "hereda" de toda su gente cambia con él: hay que repintar.
  const cs=((await api('/api/os/clientes')).clientes||[]);
  if((cs.find(c=>c.id===id)||{}).es_vendedor) setTimeout(()=>CFG.telegram(),400);
}
/* Pegar de a muchos. Reconoce por nombre, por código y por los "otros nombres" del cliente, sin
   acentos ni mayúsculas, porque de una planilla nunca vienen escritos igual. */
async function tgPegar(){
  const txt=(document.getElementById('tg-pegar').value||'').trim();
  const out=document.getElementById('tg-pegar-res');
  if(!txt) return out.innerHTML='';
  const cs=((await api('/api/os/clientes')).clientes||[]).filter(c=>!c.es_vendedor);
  const K=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const ix={};
  cs.forEach(c=>{ [c.nombre,c.codigo,...(c.alias||[])].filter(Boolean).forEach(n=>{ if(K(n)) ix[K(n)]=c; }); });
  const ok=[], no=[];
  for(const linea of txt.split(/\n+/)){
    const l=linea.trim(); if(!l) continue;
    const m=l.match(/(-?\d{6,})\s*$/);                       // el chatId es lo último de la línea
    if(!m){ no.push(l+'  (no encontré un chatId)'); continue; }
    const chatId=m[1], nombre=l.slice(0,m.index).trim().replace(/[,;\t]+$/,'');
    const c=ix[K(nombre)];
    if(!c){ no.push(l+'  (no reconozco "'+nombre+'")'); continue; }
    const r=await api('/api/clientes/'+c.id+'/telegram',{method:'PUT',
      body:JSON.stringify({chatId, enabled:!!(c.telegram||{}).enabled})});
    (r.ok?ok:no).push((r.ok?'':'no se guardó: ')+(c.nombre||c.codigo)+' → '+chatId);
  }
  out.innerHTML=`${ok.length?`<div class="nota ok"><span class="tit">${ok.length} cargado(s)</span>${ok.map(esc).join('<br>')}</div>`:''}
    ${no.length?`<div class="nota err"><span class="tit">${no.length} sin cargar</span>${no.map(esc).join('<br>')}</div>`:''}`;
  if(ok.length){ document.getElementById('tg-pegar').value=no.length?no.join('\n'):''; setTimeout(()=>CFG.telegram(),1200); }
}

      </div>
    </div>`;

  /* ── QUIÉNES TIENEN EL CHAT ──────────────────────────────────────────────────────────────────
     Una ficha plegable por caja: cerrada, quién y a cuánto; abierta, todo lo que hay que cargarle.
     Eran siete columnas con inputs adentro y una fila extra debajo con los links — con veinte cajas
     había que contar columnas para no escribir el precio en la fila de al lado. */
  S.cajas = `
    <div class="card">
      <h2>Quiénes tienen el chat <span class="muted">(${ps.length} chat${ps.length===1?'':'s'}
        en ${new Set(ps.map(x=>x.cliente_id)).size} cliente${new Set(ps.map(x=>x.cliente_id)).size===1?'':'s'})</span></h2>
      <!-- ⚠️ EL AVISO DE LA FECHA NO SE PLIEGA. Nadie va a abrir un desplegable para enterarse de
           algo que no sabe que tiene que preguntar: dejar «Empezó el» vacío significa que a ese
           cliente NO se le cobra el mantenimiento, y eso es plata. Lo que cuesta plata si falta se
           ve sin hacer clic. El resto —cómo se calculan los dos cobros— sí se pliega. -->
      <div class="muted" >Un chat por caja, y <b>cada uno se cobra sobre lo
        que ganó esa caja</b>, no sobre el total del cliente.</div>
      <div class="nota-suave" >⚠️ <b>Sin la fecha de «Empezó el» no se le
        cobra el mantenimiento</b>, porque el sistema no sabe desde cuándo.</div>
      ${ayuda('chat-cobros',
        'Son <b>dos cobros distintos</b>: el % de la ganancia y el mantenimiento de cada caja.',
        'El <b>%</b> se cobra el <b>1ro</b>, con lo que ganó el mes anterior. El <b>mantenimiento</b> se cobra <b>por adelantado el día que arranca</b> y vale un mes: si empezó un 20, va del 20 al 19 y se le vuelve a cobrar el 20 siguiente. Se genera solo.'
        + '<div style="margin-top:9px">Un cliente puede tener varios chats, cada uno colgado de un agente distinto.</div>')}

      <div class="row" style="align-items:flex-end;gap:10px;margin-top:14px;padding:14px;background:var(--bg3);border-radius:11px">
        <div style="flex:0 0 130px"><label>Sistema</label>
          <select id="chat-nuevo-sis" onchange="chatFiltrarCajas()" style="width:100%">
            ${[...new Set(opciones.map(p=>p.sistema||'Sin sistema'))].sort((a,b)=>a.localeCompare(b,'es'))
              .map(k=>`<option value="${esc(k)}">${esc(k)} (${opciones.filter(p=>(p.sistema||'Sin sistema')===k).length})</option>`).join('')}
          </select></div>
        <div style="flex:1;min-width:220px"><label>Agregar una caja al servicio</label>
          <select id="chat-nuevo" style="width:100%"></select></div>
        <div style="flex:0 0 90px"><label>Le cobrás</label>
          <input id="chat-nuevo-pct" placeholder="${esc(cfgC.costo_pct||'2')}" style="width:100%;text-align:center"></div>
        <div style="flex:0 0 150px"><label>Empezó el</label>
          <input type="date" id="chat-nuevo-desde" value="${new Date().toISOString().slice(0,10)}"

        <div style="flex:0"><button onclick="chatAgregar()">Agregar</button></div>
      </div>
      ${!_paneles.length?'<div class="muted" style="font-size:12px;margin-top:6px">Todavía no hay ninguna caja cargada en el sistema. Cargalas en 👥 Clientes.</div>':(!opciones.length?'<div class="muted" style="font-size:12px;margin-top:6px">Todas las cajas ya tienen el chat.</div>':'')}

      ${ps.length?`<div style="margin-top:14px">${ps.map(p=>`
        <details class="plegable"${p.activo?'':' style="opacity:.5"'}>
          <summary class="fila">
            <span class="chev" aria-hidden="true"></span>
            <span class="nom">${esc(p.cliente)}</span>
            <span class="muted" style="font-size:13.5px">${esc(p.panel)}</span>
            ${p.desde?'':'<span class="señal rosa" title="Sin esta fecha no se le cobra el mantenimiento">falta la fecha</span>'}
            ${p.pct_cliente?'':'<span class="señal durazno" title="Se le cobra el mínimo: lo que a vos te cuesta">al mínimo</span>'}
            <span class="cifra"><b id="chat-pct-${p.panel_id}">${esc(p.pct_cliente||cfgC.costo_pct||'2')}</b><span class="u">%</span></span>
          </summary>
          <div class="cuerpo">
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:14px">
              <div style="flex:0 0 90px"><label>Le cobrás</label>
                <input value="${esc(p.pct_cliente||'')}" placeholder="${esc(cfgC.costo_pct||'2')}"
                  data-caja="${p.panel_id}" data-campo="pct_cliente" oninput="chatTocar('${p.panel_id}')"
                  title="Si lo dejás vacío se le cobra el mínimo: lo que a vos te cuesta."
                  style="width:100%;text-align:center"></div>
              <div style="flex:0 0 150px"><label>Empezó el</label>
                <input type="date" value="${esc(p.desde||'')}"
                  data-caja="${p.panel_id}" data-campo="desde" oninput="chatTocar('${p.panel_id}')"
                  style="width:100%${p.desde?'':';border-color:var(--rosa)'}"></div>
              <div style="flex:0 0 90px"><label>Paga el día</label>
                <input value="${esc(p.dia_cobro||'')}" placeholder="—"
                  data-caja="${p.panel_id}" data-campo="dia_cobro" oninput="chatTocar('${p.panel_id}')"
                  title="Se completa solo con el día en que empezó. Cambialo sólo si con ese cliente quedó otro día."
                  style="width:100%;text-align:center"></div>
              <div style="flex:0 0 110px"><label>Nivel</label>
                <div class="muted" style="padding:8px 0" title="La ganancia se lee en el nivel de esta caja, no en el de arriba">${esc(p.nivel||'—')}</div></div>
            </div>
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:10px">
              <div style="flex:0 0 100%;margin-bottom:-4px">
                <b style="font-size:13px">¿De qué sala se lee la ganancia?</b>

                <input value="${esc(p.sala_id||'')}" placeholder="${esc(p.id_usuario||'—')}"
                  data-caja="${p.panel_id}" data-campo="sala_id" ${NOFILL} oninput="chatTocar('${p.panel_id}')"

                  data-caja="${p.panel_id}" data-campo="sala_login" ${NOFILL} oninput="chatTocar('${p.panel_id}')"
                  style="width:100%"></div>
              <div class="muted" style="flex:1;min-width:180px;font-size:12px;align-self:center">
                ${p.sala_id
                  ? '<span class="señal verde">mide '+esc(p.sala_login||p.sala_id)+'</span>'
                  : 'mide esta caja'}
                · Si el número no existe en el casino, el mes de esa caja queda sin calcular y te lo avisa.</div>
            </div>
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:10px">
              <div style="flex:1;min-width:200px"><label>Link para los jugadores</label>
                <input value="${esc(p.link_jugadores||'')}" placeholder="pegá el link, no lo deduzcas"
                  data-caja="${p.panel_id}" data-campo="link_jugadores" oninput="chatTocar('${p.panel_id}')" style="width:100%"></div>
              <div style="flex:1;min-width:200px"><label>Link del panel</label>
                <input value="${esc(p.link_panel||'')}" placeholder="donde entra a administrar"
                  data-caja="${p.panel_id}" data-campo="link_panel" oninput="chatTocar('${p.panel_id}')" style="width:100%"></div>
            </div>
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:10px">
              <div style="flex:0 0 150px"><label>Usuario del panel</label>
                <input value="${esc(p.usuario_admin||'')}" placeholder="—"
                  data-caja="${p.panel_id}" data-campo="usuario_admin" name="pan-u-${p.panel_id}" ${NOFILL} oninput="chatTocar('${p.panel_id}')" style="width:100%"></div>
              <div style="flex:0 0 160px"><label>Contraseña del panel</label>
                <input value="${esc(p.clave_admin||'')}" placeholder="—"
                  title="La ve el cliente en su portal, pero SÓLO después de escribir la clave que le diste."
                  data-caja="${p.panel_id}" data-campo="clave_admin" name="pan-c-${p.panel_id}" ${NOFILL} oninput="chatTocar('${p.panel_id}')" style="width:100%"></div>
              <div class="muted" style="flex:1;min-width:220px;font-size:12px;align-self:center">
                Los dos links y el usuario se ven en el portal del cliente. <b>La contraseña no</b>:
                al portal se entra escribiendo el nombre de una caja, así que ahí quedaría a la vista
                de cualquiera que la adivine. Se muestra sólo cuando el cliente escribe la
                <b>clave del portal</b> que le pusiste abajo.</div>
            </div>
            <div class="acciones">
              <button class="small" id="chat-guardar-${p.panel_id}" disabled
                onclick="chatGuardar('${p.panel_id}')">Guardar cambios</button>
              <span id="chat-aviso-${p.panel_id}" class="muted" style="font-size:12.5px;align-self:center"></span>
              <div style="flex:1"></div>
              <button class="outline small danger" data-id="${esc(p.panel_id)}" data-nom="${esc(p.panel)}"
                onclick="chatQuitar(this.dataset.id,this.dataset.nom)">Sacarla del servicio</button>
            </div>
          </div>
        </details>`).join('')}</div>`
      :'<div class="empty" style="margin-top:14px">Ninguna todavía. Elegí una caja acá arriba.</div>'}

      <h2 style="margin-top:24px">A dónde le mando la cuenta a cada uno</h2>
      ${ayuda('chat-grupos',
        'El grupo de <b>este servicio</b>, que no es el mismo que el de las fichas.',
        'Son otros mensajes y suele haber otra gente adentro. Podés poner <b>más de uno</b> separados por coma: a veces el encargado tiene que enterarse y no está en el grupo del cliente.')}
      ${clis.length?`<div style="margin-top:14px">${clis.map(c=>`
        <details class="plegable">
          <summary class="fila">
            <span class="chev" aria-hidden="true"></span>
            <span class="nom">${esc(c.nombre)}</span>
            ${c.paneles>1?`<span class="muted" style="font-size:13px">${c.paneles} cajas</span>`:''}
            ${(dest[c.id]||{}).tg_grupo?'':'<span class="señal rosa" title="Sin grupo no se le puede mandar la cuenta">sin grupo</span>'}
            ${(dest[c.id]||{}).clave_portal?'':'<span class="señal durazno" title="Sin clave no ve las contraseñas de sus paneles">sin clave</span>'}
          </summary>
          <div class="cuerpo">
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:14px">
              <div style="flex:1;min-width:220px"><label>Grupo(s) de Telegram</label>
                <input value="${esc((dest[c.id]||{}).tg_grupo||'')}" placeholder="-1002…, -1003…"
                  onchange="chatDestino('${c.id}',{tg_grupo:this.value})" style="width:100%"></div>
              <div style="flex:1;min-width:180px"><label>Se la mando a… <span class="muted">(nota tuya)</span></label>
                <input value="${esc((dest[c.id]||{}).enviar_a||'')}" placeholder="a Raúl por privado"
                  onchange="chatDestino('${c.id}',{enviar_a:this.value})" style="width:100%"></div>
              <div style="flex:0 0 140px"><label>Clave del portal</label>
                <input value="${esc((dest[c.id]||{}).clave_portal||'')}" placeholder="—"
                  name="port-c-${c.id}" ${NOFILL} onchange="chatDestino('${c.id}',{clave_portal:this.value})"
                  title="Con esta clave el cliente ve las contraseñas de sus paneles en su portal. Se la das una vez."
                  style="width:100%"></div>
            </div>
            <div class="row" style="gap:10px;align-items:flex-end;margin-top:10px">
              ${[['wallet_ggr','Paga el mes a'],['wallet_mens','Paga el mantenimiento a']].map(([k,rot])=>`
                <div style="flex:0 0 235px"><label>${rot}</label>
                  <div class="wsel" data-wsel="${c.id}|${k}">
                    ${ws.filter(w=>w.activa).map(w=>`<label class="wopt"><input type="checkbox" value="${w.id}"
                      ${((dest[c.id]||{})[k==='wallet_ggr'?'wallets_ggr':'wallets_mens']||[]).includes(w.id)?'checked':''}
                      onchange="chatDestinoWallets('${c.id}','${k}',this)"> ${esc(w.alias)} · ${esc(w.red)}</label>`).join('')}
                    <span class="muted" style="font-size:11.5px">sin marcar nada: la de siempre</span>
                  </div></div>`).join('')}
            </div>
          </div>
        </details>`).join('')}</div>`:''}
    </div>`;

  /* ── EL CIERRE DEL MES, PLEGADO ──────────────────────────────────────────────────────────────
     Cada cliente arranca CERRADO en una línea: nombre y lo que le cobrás. Con cincuenta clientes,
     abiertos era una pared y había que bajar un minuto para llegar al que buscabas.
     Lo que necesita atención —falta un tipo de cambio, le cobrás menos de lo que te cuesta— se ve
     DESDE AFUERA con su etiqueta: un problema no puede quedar escondido adentro de una tarjeta. */
  S.cierre = `
    <div class="card">
      <h2>Cierre del mes <span class="muted">(${esc(_chatMes)})</span></h2>
      ${bannerMes(_chatMes,'chatIrA')}
      ${(pc.sinSala||[]).length?`<div class="nota-suave durazno">
        <b>${pc.sinSala.length} caja(s) sin sala cargada</b>: ${pc.sinSala.map(x=>esc(x.panel)).join(', ')}.
        Se están midiendo por su propio nodo, y ahí casi nunca está la ganancia — suele estar un
        escalón más abajo. <b>Sobre la sala se cobra todo</b>: cargala en Cajas y clientes antes de cobrar el mes.</div>`:''}
      ${(pc.salteados||[]).length?`<div class="nota-suave rosa">
        <b>${pc.salteados.length} caja(s) quedaron afuera de la cuenta</b>:
        ${pc.salteados.map(x=>esc(x.panel)+' <span class="muted">('+esc(x.motivo)+')</span>').join(' · ')}</div>`:''}
      ${(()=>{ /* Lo mismo que dice el recordatorio de Telegram, acá. Si el bot falla o falta el
                  grupo, éste es el único lugar donde se ve que quedó algo sin mandar. */
        const li=pc.listas||{}, m=li.mandar||[], sg=li.sinGrupo||[], fc=li.faltaCobrar||[];
        if(!m.length && !sg.length && !fc.length) return '';
        /* Cobrar va ANTES que mandar: la hoja lleva el % calculado en vivo y la cuenta del cliente
           todavía no lo tiene. Mandarla antes es mandarle un número que no es el que se le cobra. */
        if(fc.length && !m.length) return `<div class="nota-suave durazno">
          <b>${esc(mesNombre(_chatMes))} todavía no está cobrado.</b>
          Son ${fc.length} cuenta${fc.length>1?'s':''}: ${fc.map(x=>esc(x.cliente)).join(', ')}.
          Hasta que lo cobres el número se sigue moviendo — cobralo y después se las mandás.</div>`;
        return `<div class="nota-suave durazno">
          ${m.length?`<b>${m.length} cuenta${m.length>1?'s':''} cobrada${m.length>1?'s':''} y sin mandar.</b>
            Están más abajo: abrí el cliente y apretá <b>Enviársela</b>.`:''}
          ${sg.length?`<div style="margin-top:${m.length?'6px':'0'}">⚠️ ${sg.length===1
            ? `<b>${esc(sg[0].cliente)}</b> está cobrado y no tiene grupo de Telegram cargado.`
            : `<b>${sg.length}</b> están cobrados y no tienen grupo cargado: ${sg.map(x=>esc(x.cliente)).join(', ')}.`}
            Se carga en <b>Cajas y clientes</b>.</div>`:''}
        </div>`; })()}
      ${(()=>{const sp=cs.filter(g=>g.sinPrecio); return sp.length?`<div class="nota-suave">
        <b>${sp.length} sin precio confirmado</b>: ${sp.map(g=>esc(g.cliente)).join(', ')}.
        Se les cobra el <b>mínimo (${esc(pc.costo_pct)}%)</b>, que es lo que a vos te cuesta — no perdés,
        pero el precio está sin decidir.</div>`:'';})()}
      ${(pc.sinTC||[]).length?`<div class="nota-suave">
        Falta el tipo de cambio de <b>${pc.sinTC.map(esc).join(', ')}</b> en ${esc(_chatMes)}:
        lo ganado en ${pc.sinTC.length===1?'esa moneda':'esas monedas'} no entra en el total.</div>`:''}

      ${cs.length?`
      <div class="totalote" style="margin-top:14px">
        <div class="k">Te queda de ${esc(mesNombre(_chatMes))}</div>
        <div class="v">${money(T.margen,2)} USDT</div>
        <dl>
          <div><dt>Les cobrás</dt><dd>${money(T.cobra,2)}</dd></div>
          <div><dt>Pagás al proveedor</dt><dd>${money(T.paga,2)}</dd></div>
        </dl>
        <p class="cuantos">${cs.length} cliente${cs.length===1?'':'s'} ·
          ${cs.reduce((a,g)=>a+g.paneles.length,0)} cajas</p>
      </div>
      <div class="muted" style="font-size:12.5px;margin:0 4px 8px">Tocá un cliente para abrir su cuenta.</div>

      ${cs.map(g=>{
        const e=env[g.cliente_id]||null;
        const pcts=[...new Set(g.paneles.map(p=>p.pct_cliente))];
        const gan=g.paneles.reduce((a,p)=>a+Number(p.profit_usdt||0),0);
        const pierde=!g.sinPrecio&&Number(g.margen)<0;
        const col=Number(g.margen)<0?'mal':(Number(g.margen)===0?'cero':'bien');
        const nc=g.paneles.length;
        return `<details class="plegable">
          <summary class="fila">
            <span class="chev" aria-hidden="true"></span>
            <span class="nom">${esc(g.cliente)}</span>
            ${g.sinTC?'<span class="señal durazno" title="Falta un tipo de cambio de este mes">falta TC</span>':''}
            ${pierde?'<span class="señal rosa" title="Le cobrás menos de lo que te cuesta">perdés</span>':''}
            ${g.sinPrecio?'<span class="señal durazno" title="No le cargaste precio: se cobra el mínimo">al mínimo</span>':''}
            <span class="cifra"><b>${money(g.cobra,2)}</b><span class="u">USDT</span></span>
          </summary>
          <div class="cuerpo">
            <dl class="datos">
              <div><dt>Ganó</dt><dd>${chatMonedas(g.monedas)}</dd></div>
              <div><dt>En USDT</dt><dd>${money(gan,2)}</dd></div>
              <div><dt>Le cobrás</dt><dd>${pcts.map(x=>esc(x)+'%').join(' / ')}</dd></div>
              <div><dt>Pagás al proveedor</dt><dd>${money(g.paga,2)}</dd></div>
              <div><dt>Te queda</dt><dd class="${col}">${money(g.margen,2)}</dd></div>
            </dl>
            ${pierde?'<p class="nota-suave rosa">Le cobrás menos de lo que te cuesta.</p>':''}
            <details class="cajas" style="margin-top:13px">
              <summary class="abrir"><span class="chev" aria-hidden="true"></span>${
                nc===1?'Ver su caja':'Ver sus '+nc+' cajas'}</summary>
              <div class="sublista">
                ${g.paneles.map(p=>`<div class="subcaja">
                  <div class="cn">${esc(p.panel)}<small>${esc(p.nivel||'')}</small></div>
                  <div class="subdatos">
                    <div><span class="k">Período</span><span class="v">${chatTramo(p.tramo)}</span></div>
                    <div><span class="k">Ganó</span><span class="v">${chatMonedas((p.detalle||[]).filter(x=>Number(x.profit)>0))}</span></div>
                    <div><span class="k">En USDT</span><span class="v">${money(p.profit_usdt,2)}</span></div>
                    <div><span class="k">Le cobrás</span><span class="v">${esc(p.pct_cliente)}%${
                      p.pctMinimo?' <span class="muted">(mínimo)</span>':''}</span></div>
                    <div><span class="k">Se le cobra</span><span class="v fuerte">${money(p.cobra,2)}</span></div>
                  </div>
                </div>`).join('')}
              </div>
            </details>
            ${(()=>{
              /* ── UNA FILA DE BOTONES POR CUENTA ──────────────────────────────────────────────
                 Un cliente con cajas en dos monedas tiene DOS cuentas y recibe DOS mensajes: son
                 dos negocios, a veces con socios distintos. Un solo botón «Enviársela» mandaba una
                 y dejaba la otra sin mandar, sin que se notara.
                 El de una sola moneda ve un botón, como siempre: no hay dos pantallas que
                 mantener, hay una que a veces tiene dos renglones. */
              const divs=[...new Set((g.paneles||[]).map(p=>String(p.divisa||'').toUpperCase()).filter(Boolean))];
              const dos=divs.length>1;
              const filas = dos ? divs : [''];
              const puede=(g.grupos||[]).length;
              return filas.map(dv=>{
                // El envío se guarda por cuenta: la clave lleva la divisa pegada al cliente.
                const ee = env[dv? g.cliente_id+'|'+dv : g.cliente_id]||null;
                const sub = dv? (g.paneles||[]).filter(p=>String(p.divisa||'').toUpperCase()===dv) : (g.paneles||[]);
                const tot = sub.reduce((a,p)=>a+Number(p.cobra||0),0);
                return `<div class="acciones">

               el mes no estaba cobrado — y los 1.050 eran siete mantenimientos de 150, ni un peso

/* Doscientas cajas en una lista suelta no se pueden recorrer con el ojo. Se agrupan por sistema y
   se ordenan alfabéticamente adentro de cada grupo: buscar "Fran44" es mirar una sola columna, no
   toda la lista. `localeCompare` con sensitivity:'base' pone Ávila al lado de Avila y no manda las
   minúsculas al final, que es lo que hace comparar strings a secas. */
/* PRIMERO EL SISTEMA, DESPUÉS LA CAJA. Con 94 cajas en Casino, el desplegable era una lista que no
   se termina de leer: elegir el sistema deja diez o veinte y ahí sí se encuentra la que buscás. */
function chatFiltrarCajas(){
  const sis=(document.getElementById('chat-nuevo-sis')||{}).value||'';
  const sel=document.getElementById('chat-nuevo'); if(!sel) return;
  const ps=(_chatOpc||[]).filter(p=>(p.sistema||'Sin sistema')===sis)
    .slice().sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{sensitivity:'base',numeric:true}));
  sel.innerHTML='<option value="">— elegí la caja que contrató el chat —</option>'
    + ps.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
}

function chatOpciones(lista){
  const grupos={};
  (lista||[]).forEach(p=>{ const k=p.sistema||'Sin sistema'; (grupos[k]=grupos[k]||[]).push(p); });
  return Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'es')).map(k=>{
    const ps=grupos[k].slice().sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{sensitivity:'base',numeric:true}));
    return `<optgroup label="${esc(k)} (${ps.length})">`
      + ps.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')
      + '</optgroup>';
  }).join('');
}

/* Las monedas de un cliente, sumadas entre sus paneles. Mismo criterio que la fila del panel: el
   monto en su moneda arriba y el tipo de cambio usado abajo. */
/* QUÉ TRAMO DEL MES SE LE CONTÓ A ESA CAJA. Sin las fechas, la ganancia de la que sale el % es un
   número que no se puede comprobar contra el panel del casino — ni vos ni el cliente. Y el primer
   mes cada caja arrancó un día distinto, así que ninguna cubre el mes entero.
   Los días van aparte porque el tramo no siempre es corrido: un día sin movimiento no se contó, y
   «del 17 al 31» solo da a entender que fueron 15 seguidos cuando pudieron ser 13. */
const CH_DIA=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const chatDiaMes=(iso)=>{const p=String(iso||'').split('-');
  return p.length===3? Number(p[2])+' '+(CH_DIA[Number(p[1])]||'') : '';};
function chatTramo(t){
  if(!t||!t.desde) return '<span class="muted">sin datos</span>';
  const cab = t.desde===t.hasta ? chatDiaMes(t.desde) : chatDiaMes(t.desde)+' – '+chatDiaMes(t.hasta);
  return esc(cab)+'<small class="muted"> · '+t.dias+' día'+(t.dias===1?'':'s')
    + (t.diasAfuera? ' · '+t.diasAfuera+' antes de contratar':'') + '</small>';
}

function chatMonedas(ms){
  const d=(ms||[]).filter(x=>Number(x.profit)>0);
  if(!d.length) return '<span class="muted">—</span>';
  return d.map(x=>chatUnaMoneda(x)).join('<div style="height:4px"></div>');
}
/* La ganancia se muestra EN SU MONEDA y con el tipo de cambio usado debajo. El 2% de una ganancia
   en pesos y el 2% de una en dólares son dos números que no se parecen en nada; sin la moneda a la
   vista la columna en USDT no se puede comprobar. El TC dice de dónde salió —el promedio del mes,
   o el que cargaste a mano en el cierre— porque son dos cosas distintas y la diferencia se factura. */
function chatUnaMoneda(x){
  const cab=`<b>${money(x.profit,0)}</b> <span class="muted">${esc(x.moneda)}</span>`;
  if(x.usdt==null) return cab+'<br><span class="badge warn">falta el TC de '+esc(x.moneda)+'</span>';
  if(x.moneda==='USD'||x.moneda==='USDT') return cab;
  return cab+`<div class="muted" style="font-size:11.5px;white-space:nowrap"
    title="${esc(x.fuente||'')}">÷ ${money(x.tc,2)} ${x.fuente&&x.fuente.indexOf('mano')>=0?'(a mano)':'(promedio del mes)'}${
    x.conflicto?' <span style="color:var(--red)">⚠</span>':''}</div>`;
}
function chatGanancia(f){
  const d=(f.detalle||[]).filter(x=>Number(x.profit)>0);
  if(!d.length) return '<span class="muted">—</span>';
  return d.map(chatUnaMoneda).join('<div style="height:4px"></div>');
}
