<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latam Games</title>
<style>
  :root { --bg:#fbf4fa; --bg2:#fff; --bg3:#f6e9f4; --border:#ead6e6; --text:#2b2230; --muted:#8c7e89; --gold:#c456ad; --green:#2e9e63; --red:#d9534f; --blue:#3b7fe0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; }
  header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:16px; margin:0; display:flex; align-items:center; gap:9px; }
  header h1 small { color:var(--muted); font-weight:400; }
  /* El logo, no el nombre escrito a mano: así el nombre se escribe de UNA forma sola y el día que
     lo cambies se cambia en un archivo, no en cinco pantallas. */
  .hd-logo { height:46px; width:auto; display:block; flex:0 0 auto; margin:-8px 0; }
  .nav { display:flex; gap:2px; padding:0 12px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap; }
  .navbtn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:11px 13px; font-weight:700; cursor:pointer; font-size:13.5px; }
  .navbtn.active { color:var(--gold); border-bottom-color:var(--gold); }
  .navsep { width:1px; background:var(--border); margin:8px 7px; flex:0 0 auto; }
  .nb { background:var(--gold); color:#fff; border-radius:20px; padding:0 6px; font-size:11px; margin-left:3px; vertical-align:1px; }
  /* El de Pendientes es rojo y late: es lo único de la barra que pide que alguien haga algo.
     La animación es lenta a propósito — algo que parpadea rápido se tapa y se deja de ver. */
  .nb.urg { background:var(--red); animation:latir 2.4s ease-in-out infinite; }
  @keyframes latir { 0%,100%{opacity:1} 50%{opacity:.55} }
  @media (prefers-reduced-motion: reduce){ .nb.urg{ animation:none } }
  /* Europa y Casino son DOS sistemas distintos, y el mismo panel puede estar en los dos
     (UPruebaLatam lo está). Sin color se leen como si fueran uno repetido. */
  :root { --sis-eu:#2f6fd0; --sis-cas:#7c4dd6; }
  .sis { display:inline-block; padding:1px 7px; border-radius:5px; font-size:10.5px; font-weight:700;
         letter-spacing:.02em; border:1px solid transparent; }
  .sis.eu  { background:rgba(47,111,208,.13);  color:var(--sis-eu);  border-color:rgba(47,111,208,.35); }
  .sis.cas { background:rgba(124,77,214,.13);  color:var(--sis-cas); border-color:rgba(124,77,214,.35); }
  .sis.na  { background:var(--bg3); color:var(--muted); border-color:var(--border); }
  main { max-width:1000px; margin:0 auto; padding:18px; }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }

  /* ── LA FORMA NUEVA ──────────────────────────────────────────────────────────────────────────
     Tres reglas, y valen para toda la aplicación:
       · texto común  = es un dato, no hay nada detrás
       · fila o subrayado punteado = SE ABRE (flecha adelante, el fondo cambia al pasar por encima)
       · botón lleno  = hace algo, y hay UNO solo por tarjeta
     Antes «cobrar el mes» y «ver una hoja» se veían igual, y «1 caja» era un dato y una puerta al
     mismo tiempo sin forma de saber cuál. Los avisos van en pastel con el texto bastante más oscuro
     que el fondo: un pastel sobre pastel queda lindo y no se lee con sol encima del teléfono. */
  :root{
    --rosa:#a24d5c; --rosa-bg:#fbeff1;
    --durazno:#8a5c33; --durazno-bg:#fbf2e9;
    --verde2:#3f7f60;
    /* El rosa de la marca es lindo y claro: blanco encima casi no se lee. Para los bloques con
       texto blanco va esta versión honda del mismo color. */
    --uva:#8a2f74;
  }
  .totalote{ background:var(--uva); color:#fff; border-radius:16px; padding:20px 22px 18px; margin-bottom:14px; }
  .totalote .k{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; opacity:.72 }
  .totalote .v{ font-size:31px; font-weight:800; letter-spacing:-.03em; margin-top:4px;
    font-variant-numeric:tabular-nums; line-height:1.05 }
  .totalote dl{ margin:15px 0 0; padding-top:13px; border-top:1px solid rgba(255,255,255,.22);
    display:flex; flex-direction:column; gap:7px }
  .totalote dl div{ display:flex; align-items:baseline; gap:14px }
  .totalote dt{ font-size:13px; opacity:.78 }
  .totalote dd{ margin:0 0 0 auto; font-size:15.5px; font-weight:650;
    font-variant-numeric:tabular-nums; text-align:right }
  .totalote .cuantos{ margin:11px 0 0; font-size:12.5px; opacity:.72 }

  .plegable{ background:var(--bg2); border:1px solid var(--border); border-radius:12px; margin-bottom:6px }
  .plegable[open]{ border-color:#dcc9d8; box-shadow:0 1px 2px rgba(34,27,38,.04),0 10px 26px -20px rgba(34,27,38,.35) }
  .fila{ display:flex; align-items:center; gap:11px; cursor:pointer; list-style:none;
    padding:12px 16px; border-radius:12px; flex-wrap:wrap }
  .fila::-webkit-details-marker{ display:none }
  .fila:hover{ background:var(--bg) }
  .fila:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px }
  .fila .nom{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; min-width:0 }
  .fila .cifra{ margin-left:auto; display:flex; align-items:baseline; gap:5px; white-space:nowrap }
  .fila .cifra b{ font-size:17.5px; font-weight:750; font-variant-numeric:tabular-nums; letter-spacing:-.02em }
  .fila .cifra .u{ font-size:12px; color:var(--muted); font-weight:500 }
  /* Si no entra, la cifra se va sola al renglón de abajo (`flex-wrap`) en vez de cortarse por la
     mitad. Sin forzarlo con una medida fija: en un teléfono normal entra en una línea y forzar el
     salto ahí era gastar un renglón por cliente. */
  .chev{ width:0; height:0; border-left:6px solid var(--muted); border-top:5px solid transparent;
    border-bottom:5px solid transparent; transition:transform .15s ease; flex:0 0 auto }
  details[open] > summary .chev{ transform:rotate(90deg) }
  @media (prefers-reduced-motion:reduce){ .chev{ transition:none } }
  .cuerpo{ padding:2px 16px 16px; border-top:1px solid var(--border); margin-top:-1px }

  /* La señal se ve CERRADO: un problema no puede quedar escondido adentro de una tarjeta. */
  .señal{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    letter-spacing:.02em; white-space:nowrap; flex:0 0 auto }
  .señal.durazno{ background:var(--durazno-bg); color:var(--durazno) }
  .señal.rosa{ background:var(--rosa-bg); color:var(--rosa) }

  dl.datos{ margin:13px 0 0; display:flex; flex-direction:column; gap:6px }
  /* Dos columnas, no flex: cuando el número es largo y trae el tipo de cambio abajo, con flex el
     rótulo se iba solo a un renglón y quedaba huérfano. Así el nombre queda siempre a la izquierda
     y todo lo demás alineado a la derecha, ocupe uno o tres renglones. */
  dl.datos div{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:1px 14px; align-items:baseline }
  dl.datos dt{ font-size:13px; color:var(--muted) }
  dl.datos dd{ margin:0; font-size:14.5px; font-weight:650;
    font-variant-numeric:tabular-nums; text-align:right; overflow-wrap:anywhere }
  dl.datos dd.mal{ color:var(--rosa) } dl.datos dd.cero{ color:var(--muted) }
  dl.datos dd.bien{ color:var(--verde2) }

  .nota-suave{ margin:12px 0 0; font-size:13px; color:var(--durazno); background:var(--durazno-bg);
    border-radius:9px; padding:9px 12px; line-height:1.45 }
  .nota-suave.rosa{ color:var(--rosa); background:var(--rosa-bg) }

  .abrir{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; list-style:none;
    font-size:13px; color:var(--gold); font-weight:600; padding:5px 2px; border-radius:6px;
    text-decoration:underline; text-decoration-style:dotted; text-underline-offset:4px }
  .abrir::-webkit-details-marker{ display:none }
  .abrir:hover{ text-decoration-style:solid }
  .abrir:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
  .abrir .chev{ border-left-color:currentColor; border-left-width:5px;
    border-top-width:4px; border-bottom-width:4px }
  .sublista{ margin-top:11px; display:flex; flex-direction:column; gap:9px }
  .subcaja{ background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 13px }
  .subcaja .cn{ font-weight:700; font-size:14px; margin-bottom:8px }
  .subcaja .cn small{ font-weight:400; font-size:12px; color:var(--muted); margin-left:8px }
  .subdatos{ display:flex; flex-direction:column; gap:5px }
  .subdatos > div{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:1px 12px; align-items:baseline }
  .subdatos .k{ font-size:12.5px; color:var(--muted) }
  .subdatos .v{ text-align:right; font-size:13.5px; font-weight:600;
    font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
  .subdatos .v.fuerte{ font-size:15px; font-weight:750 }
  .subdatos .tc{ grid-column:2; text-align:right; font-size:12.5px; color:var(--muted) }
  .subdatos .tc.falta{ color:var(--durazno) }
  .acciones{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  /* Cabecera de tarjeta: el título a la izquierda, los controles a la derecha. Reemplaza al
     `float:right` que se metía adentro del <h2> y hacía que el texto de abajo lo esquivara,
     quedando el párrafo partido alrededor de los botones. */
  .tapa{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap }
  .tapa h2{ margin:0 }
  .tapa .sub{ font-size:13px; color:var(--muted); margin-top:3px }
  .tapa .acciones{ margin-top:0 }
  /* La tarjeta de un comprobante: plegada muestra quién, cuánto y cuándo —lo que hace falta para
     saber cuál es— y se abre para resolverlo. Con seis esperando y todos abiertos había que
     scrollear el buzón entero para llegar al último, atendiendo uno. */
  details.cmp > summary{ list-style:none; padding:2px 0 }
  details.cmp > summary::-webkit-details-marker{ display:none }
  details.cmp > summary:hover{ opacity:.85 }
  details.cmp[open] > summary{ border-bottom:1px solid var(--border); padding-bottom:11px; margin-bottom:4px }
  details.cmp.pend:not([open]){ background:var(--durazno-bg) }
  /* Las fichitas de «qué TC se usa este mes». Eran 23 tarjetas iguales con la palabra «promedio»
     repetida abajo de cada una: el ojo no tenía dónde apoyarse. Ahora sólo se marca lo que NO es
     el promedio automático —cargado a mano, o sin cargar— y esas van primero. */
  .tc-tiles{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)) }
  .tc-t{ background:var(--bg3); border:1px solid transparent; border-radius:10px; padding:8px 10px }
  .tc-t .d{ font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--muted) }
  .tc-t .v{ font-size:17px; font-weight:800; margin-top:1px; font-variant-numeric:tabular-nums;
    letter-spacing:-.02em }
  .tc-t .f{ font-size:10.5px; color:var(--muted); margin-top:1px }
  .tc-t.mano{ background:var(--rosa-bg); border-color:#f0d6e4 }
  .tc-t.mal .v{ color:var(--rosa); font-size:14px; font-weight:700 }
  .tc-t.mal{ background:var(--rosa-bg); border-color:#f0d6e4 }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:11px; color:var(--muted); margin:0 0 3px; text-transform:uppercase; letter-spacing:.03em; }
  input, select { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:14px; outline:none; }
  input:focus,select:focus { border-color:var(--gold); }
  button { background:var(--gold); color:#fff; border:none; border-radius:6px; padding:8px 13px; font-weight:700; cursor:pointer; font-size:13px; }
  button.outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  /* Un <a> que tiene que verse como un botón. Lo usa la descarga de la copia de seguridad:
     tiene que ser un enlace de verdad —el navegador baja el archivo solo, con la cookie de la
     sesión— y no un fetch, que traería un archivo binario a la memoria para nada. */
  a.btn { background:var(--gold); color:#fff; border:none; border-radius:6px; padding:8px 13px;
    font-weight:700; cursor:pointer; font-size:13px; text-decoration:none; display:inline-block; }
  button.danger { background:transparent; border:1px solid var(--red); color:var(--red); }
  /* ── EL BOTÓN QUE SALE PARA AFUERA ────────────────────────────────────────────────────────
     "los botones no siempre tienen otro color y eso confunde a la vista". Y era peor que eso:
     «Calcular» y «Emitir a la deuda» eran EL MISMO botón violeta, uno al lado del otro. Uno se
     puede apretar cien veces sin consecuencia; el otro le manda una factura a todos los clientes.
     Regla: un solo botón lleno por tarjeta —el de todos los días— y lo que sale para afuera o
     mueve plata va en durazno. Se ve que es otra cosa antes de leerlo. */
  /* Durazno lleno quedaba marrón y sucio al lado del violeta: `--durazno` es un color pensado
     para TEXTO sobre su pastel, no para pintar un fondo. Va al revés —pastel de fondo, texto
     oscuro y el borde marcado—, que es el mismo idioma que las etiquetas `.señal.durazno` y
     mantiene los colores suaves. Igual de distinto del violeta, sin gritar. */
  button.grave { background:var(--durazno-bg); color:var(--durazno); border:1.5px solid var(--durazno); }
  button.grave:hover { background:#f6e7d6; }
  button.small { padding:5px 9px; font-size:12px; }
    /* Marcar más de una wallet para lo mismo: el mantenimiento se cobra por dos redes. */
    .wsel { display:flex; flex-direction:column; gap:4px; margin-top:5px }
    /* `width:auto` y `text-transform:none` porque el panel le pone a TODO `label` mayúsculas y a
       TODO `input` ancho completo: sin esto el casillero se estira media columna y el alias de la
       wallet —que ella escribió como quiso— sale gritado. */
    .wopt { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;
      white-space:nowrap; text-transform:none; letter-spacing:0; font-weight:500; color:var(--text) }
    .wopt input { margin:0; width:auto; flex:0 0 auto }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1; min-width:120px; }
  /* Un selector de mes o fecha no entra en 120px: el campo quedaba más angosto que su propio
     contenido y el botón de al lado se le montaba encima, tapando el mes y dejándolo sin poder
     elegirse. Pasaba en las cinco pantallas que tienen uno. */
  /* ⚠️ El selector de MES y el de FECHA son más anchos que cualquier otro input: el navegador
     les mete el texto completo ("agosto de 2026") más su ícono de calendario. Los tenía en
     min-width pero el DIV que los contiene seguía valiendo 120px, así que el input se desbordaba
     y el botón de al lado le quedaba encima — tapando justo el ícono con el que se abre.
     La regla va sobre el CONTENEDOR, así aplica en las 8 pantallas que tienen un selector de mes
     sin que haya que acordarse en cada una. */
  input[type=month], input[type=date] { min-width:175px; }
  .row > div:has(> input[type=month]), .row > div:has(> input[type=date]),
  .row > div:has(> label + input[type=month]), .row > div:has(> label + input[type=date]) {
    flex:0 0 auto; min-width:190px;
  }
  .row > div:has(> input[type=month]) input, .row > div:has(> input[type=date]) input,
  .row > div:has(> label + input[type=month]) input, .row > div:has(> label + input[type=date]) input {
    width:100%;
  }
  /* Las tablas que quedan: una línea FINA entre filas en vez de una marcada en cada celda, más
     aire vertical, y el encabezado en gris y liviano. Antes todo pesaba lo mismo y competía por la
     atención; ahora el ojo va a los números. Los que se alinean en columna llevan tabular-nums. */
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { text-align:left; padding:10px 9px; border-bottom:1px solid var(--bg3); }
  tr:last-child td { border-bottom:none; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; font-weight:600;
    letter-spacing:.05em; border-bottom:1px solid var(--border); padding-bottom:8px; }
  td.right, th.right { font-variant-numeric:tabular-nums; }
  /* Las etiquetas, en pastel. Las de aviso pasaron a durazno y rosa viejo: el texto va bastante más
     oscuro que el fondo porque un pastel sobre pastel queda lindo y no se lee con sol encima. */
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge.ok { background:#e9f3ee; color:var(--verde2); }
  .badge.warn { background:var(--durazno-bg); color:var(--durazno); }
  .badge.err { background:var(--rosa-bg); color:var(--rosa); }
  /* Bloques de aviso. Antes cada uno traía su propio background:rgba(196,86,173,.07); a mano — un marrón oscuro
     que venía de cuando el panel era oscuro. Con el tema claro quedaba texto oscuro sobre fondo
     oscuro: ilegible. Ahora es una clase, tintada sobre el fondo claro y con una barra de color
     al costado, que es lo que hace que se lea de un vistazo cuál es cuál. */
  .nota { border-radius:8px; padding:10px 12px; margin:10px 0 0; font-size:13px; line-height:1.6;
          border:1px solid var(--border); border-left:4px solid var(--muted); background:var(--bg3); }
  .nota b { color:var(--text); }
  .nota.warn { border-color:rgba(196,86,173,.35); border-left-color:var(--gold); background:rgba(196,86,173,.07); }
  .nota.err  { border-color:rgba(217,83,79,.35);  border-left-color:var(--red);  background:rgba(217,83,79,.07); }
  .nota.ok   { border-color:rgba(46,160,67,.35);  border-left-color:var(--green);background:rgba(46,160,67,.07); }
  .nota .tit { font-weight:800; display:block; margin-bottom:3px; }
  .nota.warn .tit { color:var(--gold); }
  .nota.err  .tit { color:var(--red); }
  .nota.ok   .tit { color:var(--green); }
  .nota table { margin-top:6px; }
  .nota table th { font-size:10px; }
  .nota table td { padding:4px 9px; font-size:12px; }
  .cie-ok { background:rgba(46,160,67,.28)!important; transition:background .1s; }
  /* El verde se va solo a los 350ms; el ROJO SE QUEDA. Un campo que no se guardó sigue mostrando
     el número tipeado, y sin marca no hay forma de saber que no entró — que es justo el problema
     que estos controles vienen a resolver. */
  .cie-mal { background:rgba(217,83,79,.3)!important; outline:2px solid var(--red); }
  /* Cuentas del mes de TBS: un bloque por divisa. El GGR local sólo se suma dentro de su moneda, así que
     cada bloque es una tabla cerrada con su propio subtotal y su TC en la cabecera. */
  .apidiv { margin:0 0 12px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .apidiv-h { display:flex; gap:9px; align-items:baseline; padding:6px 10px; background:var(--bg3);
              border-bottom:1px solid var(--border); font-size:12px; }
  .apidiv table { margin:0; }
  .apidiv tfoot td { background:var(--bg3); border-top:1px solid var(--border); }
  .apidiv tr.sinver { background:rgba(196,86,173,.07); }
  .apicaja { margin:0 0 12px; padding-left:12px; border-left:3px solid var(--gold); }
  .apicaja-h { font-weight:700; font-size:13px; margin:0 0 6px; }
  .apitres { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 8px; }
  .apitres > div { flex:1; min-width:130px; padding:7px 11px; background:var(--bg3);
                   border:1px solid var(--border); border-radius:7px; }
  .apitres > div.tot { border-color:var(--gold); background:rgba(196,86,173,.07); }
  .apitres span { display:block; font-size:11px; }
  .apitres b { font-size:16px; }
  .muted { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .right { text-align:right; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
  .pill { font-variant-numeric:tabular-nums; background:var(--bg); padding:1px 6px; border-radius:5px; }
  hr { border:none; border-top:1px solid var(--border); margin:12px 0; }

  /* ── Fila desplegada de un cliente (sus paneles) ──────────────────────────
     Antes el <td> se pintaba con var(--bg), el MISMO tono que el fondo de la
     página, así que dentro de la tarjeta blanca se leía como un agujero: dos
     fondos sin relación. Ahora es blanco como la tarjeta —un solo fondo— y lo
     que marca que está anidado es la barra de acento a la izquierda más la
     sangría, no un cambio de color. */
  tr.sub > td { background:var(--bg2); padding:4px 0 16px 0; border-bottom:1px solid var(--border); }
  /* Antes esto colgaba de una fila de tabla y necesitaba una barra dorada al costado para que se
     entendiera de quién era. Ahora vive adentro de la ficha del cliente, así que la sangría y la
     barra sobraban: sólo apretaban la tabla contra el borde. */
  .subwrap { overflow-x:auto; }
  .subwrap table { margin:0; border:1px solid var(--border); border-radius:10px; overflow:hidden;
    min-width:900px; }
  /* Nombre, sistema y nivel se partían en dos y tres renglones y la fila quedaba el triple de
     alta de lo necesario. Si no entra, la tabla scrollea de costado — no se apila. */
  .subwrap tbody td:nth-child(-n+3), .subwrap thead th:nth-child(-n+3) { white-space:nowrap; }
  .subwrap .badge, .subwrap .pill { white-space:nowrap; }
  .subwrap thead th { background:var(--bg3); font-size:11px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--muted); padding:9px 11px; border-bottom:1px solid var(--border); }
  .subwrap tbody td { padding:9px 11px; vertical-align:middle; }
  .subwrap tbody tr:last-child td { border-bottom:none; }
  .subwrap tbody tr:hover td { background:var(--bg); }
  /* 11px era ilegible y no se parecía a ningún otro campo del panel. */
  .subwrap input[type=text], .subwrap input:not([type]), .subwrap select { font-size:13px; }
  /* Dota.click declara 24 divisas y reventaba el ancho de la columna. */
  .subwrap td.divs { max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Las filas de cliente se despliegan al hacer clic: que se note que son vivas. */
  #main tbody tr:not(.sub):hover > td { background:var(--bg); }
  #car-wrap, [id^="car-"] { display:inline-block; transition:transform .15s ease; }

/* ── Las tres vueltas de la Foto ──────────────────────────────────────────────────────────────
   Antes esto era un botón relleno de magenta con el detalle adentro en gris: el texto no se leía.
   Acá el relleno se usa SÓLO para el estado (verde = esa vuelta está), y el texto va siempre
   oscuro sobre claro. Los fondos son opacos a propósito. */
.vcx{flex:0 0 auto;min-width:230px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg2)}

<body>
<header>

    onerror="this.outerHTML='<span>Latam Games</span>'"> <small id="hd-sub"></small></h1>
  <div id="hd-nav" style="display:flex; gap:8px; flex:0 0 auto; flex-wrap:nowrap; align-items:center"></div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
// ───────── helpers ─────────
// Agrupadas por para qué se usan, con una barrita entre grupos: eran 14 botones seguidos y no se
// distinguía el día a día de lo que se toca una vez por mes. Quedaron 11:
//   · Paneles     → adentro de Clientes, desplegando la fila de cada uno
//   · Comprobantes→ una solapa de Movimientos (un comprobante aprobado ES un movimiento)
//   · Revisión    → adentro de Config, que es donde vive el diagnóstico
// La etiqueta puede ser una función: así Movimientos muestra cuántos comprobantes esperan.
/* ── TRES ESPACIOS DE TRABAJO, NO UNO CON 12 PESTAÑAS ────────────────────────────────────────
   TBS no es una pestaña más del núcleo comercial: es OTRO negocio. Otros clientes, otros
   proveedores, otra forma de cobrar (por sello y no por % base) y otro cierre de mes. Tenerlo
   como una solapa entre "Proveedores" y "Tipos de cambio" lo escondía y mezclaba dos cabezas
   distintas en la misma barra.
   Ahora son tres: Operativo (/), Comercial (/os) y TBS (/tbs). Mismo archivo y mismos helpers
   —duplicarlos habría sido peor— pero cada uno con su barra y su nombre. */
const TABS_COMERCIAL = [
  // 🔔 PENDIENTES VA PRIMERO, Y SIEMPRE. Las tres cosas que esperan una decisión —comprobantes,
  // cajas y movimientos de fichas— estaban repartidas en dos pantallas y detrás de botones que
  // había que ir a buscar. Lo que espera a alguien tiene que anunciarse solo: si hay que buscarlo,
  // se atiende tarde. Con cero pendientes queda gris y no molesta.
  ['pendientes', ()=>{ const n=_pendTotal(); return (n?'🔔':'✅')+' Pendientes' + (n?' <span class="nb urg">'+n+'</span>':''); }],
  ['acumulado','📒 Acumulado'], ['clientes','👥 Clientes'],
  ['movimientos', ()=>'💸 Movimientos' + (_cmpPend ? ' <span class="nb">'+_cmpPend+'</span>' : '')],
  '|',
  ['cierre','🧮 Cierre de Mes'], ['facturacion','🧾 Factura de consumo'], ['reparto','💰 Reparto'], ['foto','📸 Foto del mes'],
  '|',
  ['proveedores','🏷 Proveedores'], ['tc','💱 Tipos de cambio'], ['reportes','📈 Reportes'],
  ['accesos','🔐 Accesos'], ['config','⚙ Config'],
];
// Las 4 subpantallas de TBS suben a primer nivel. Tipos de cambio va también porque las cuentas
// de API se convierten con él: sin eso habría que saltar al otro espacio para revisar un TC.
const TABS_TBS = [
  ['tbsofertas','💼 Ofertas'], ['tbsmatriz','🎯 Precios por cliente'], ['tbsclientes','👥 Clientes'],
  '|',
  ['tbscuentas','🧾 Cuentas del mes'], ['tbsresumen','📊 Cierre del mes'],
  ['tbsdiario','📅 Reporte diario'],
  '|',
  ['tc','💱 Tipos de cambio'],
];
/* EL CHAT TIENE SU PROPIO ESPACIO, como TBS. Es otro negocio: otra cuenta, otra wallet, otro grupo
   y otra gente que le paga. Metido como una pestaña más del comercial, sus pagos y sus pedidos
   llegaban al medio de todo lo demás y había que ir a buscarlos. Los datos los sigue tomando del
   OS —los mismos clientes, las mismas cajas— pero lo que espera una decisión vive acá. */
const TABS_CHAT = [
  ['chatcuentas','🧾 Cuentas del mes'],
  ['chatpend', ()=>{ const n=_chatPend(); return (n?'📥':'✅')+' Pendientes' + (n?' <span class="nb urg">'+n+'</span>':''); }],
  ['chatcajas','🏷 Cajas y clientes'],
  '|',
  ['chatprov','🤝 El proveedor'], ['chatcfg','⚙ Config'],
];
const ES_TBS = location.pathname.replace(/\/+$/,'') === '/tbs';
const ES_CHAT = location.pathname.replace(/\/+$/,'') === '/chat-externo';
const TABS = ES_CHAT ? TABS_CHAT : (ES_TBS ? TABS_TBS : TABS_COMERCIAL);
let _tab = ES_CHAT ? 'chatcuentas' : (ES_TBS ? 'tbsmatriz' : 'clientes');
/* Qué tarjetas muestra cada pantalla del chat. Una sola fuente: cambiar el orden acá lo cambia en
   la pantalla, sin tocar el armado de las tarjetas. */
const SUB_CHAT = {
  cuentas: ['cierre','cuenta'],
  pend:    ['avisos','pedidos','hoy'],
  cajas:   ['cajas'],
  prov:    ['proveedor'],
  cfg:     ['config'],
};
let _chatSub = 'cuentas';
let _chatPendN = 0;                       // cuántas cosas esperan: va en la pestaña
const _chatPend = () => _chatPendN;
let _clientes = [], _personas = [], _paneles = [], _proveedores = [], _repMes = '', _cfgSub = 'revision';
let _repSub = 'mes', _repCli = '';   // Reparto: qué subpantalla y qué cliente se está editando
let _cxSel = '', _cxNodos = [];

/* ── QUE EL NAVEGADOR NO RELLENE LO QUE NO ES UNA CONTRASEÑA ──────────────────────────────────
   Chrome miró la etiqueta «Dirección» de la wallet, decidió que era un domicilio y le metió
   «Alexa» adentro. Un clic en Agregar y quedaba guardada una wallet cuya dirección es un nombre
   propio — plata mandada a la nada. Y al campo del bot, por ser type=password, el administrador
   de contraseñas le ofrecía una guardada.

   `autocomplete="off"` solo no alcanza: Chrome lo ignora en los campos que cree de domicilio o
   de contraseña. Hace falta además un `name` que no se parezca a nada conocido y las marcas que
   respetan los otros administradores. */
const NOFILL = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"'
  + ' data-lpignore="true" data-1p-ignore data-form-type="other"';
/** Para los que además son secretos: le dice a Chrome «esto es nuevo», así no ofrece uno viejo. */
const NOFILL_SECRETO = 'autocomplete="new-password" ' + NOFILL.replace('autocomplete="off" ', '');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n,d=2){ const x=Number(n||0); return x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); }

/* ── EL MES QUE TOCA CERRAR ───────────────────────────────────────────────────────────────────
   Las seis pantallas del cierre abrían en el mes de HOY, y el cierre siempre es del mes anterior
   — lo dice la propia Foto en su texto: "a principio del mes siguiente, una vez". Había que
   acordarse de cambiar el mes a mano, seis veces, cada vez.

   Lo caro no era la molestia. Apretando "Sacar todo lo que falta" con el mes en curso, el casino
   contesta con lo que hay HASTA HOY y esa foto corta QUEDA ARCHIVADA COMO BUENA; después el
   reporte de proveedores externos la lee y cobra de menos, en silencio y para siempre.

   ── DOS TRAMPAS DE FECHA QUE HAY QUE ESQUIVAR ──────────────────────────────────────────────
   · `setMonth(m-1)` no sirve: el 31 de marzo da "31 de febrero" y JavaScript lo corre solo a
     marzo otra vez, así que el mes anterior sale igual al actual. (Es lo que hace `_cieMesCruce`,
     que ahora se apoya en esta función.)
   · `toISOString()` tampoco: es UTC. A las 21:00 del último día del mes, acá todavía es fin de
     mes y allá ya es el siguiente — la pantalla abriría en el mes equivocado justo el día que más
     importa. Todo lo de acá usa la hora LOCAL. */
const CIERRE_DIAS = 10;    // los primeros 10 días del mes se está cerrando el anterior
const MESES_UI = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
const mesHoy = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0');
function mesDeCierre(d = new Date()) {
  let a = d.getFullYear(), m = d.getMonth() + 1;
  if (d.getDate() <= CIERRE_DIAS) { m -= 1; if (m === 0) { m = 12; a -= 1; } }
  return a + '-' + String(m).padStart(2,'0');
}
const mesNombre = (iso) => { const [a,m] = String(iso||'').split('-');
  return (MESES_UI[Number(m)-1] || iso) + ' ' + a; };

/* El cartel que dice QUÉ MES se está mirando, con el otro a un clic.
   La regla de los 10 días acierta casi siempre; cuando no acierta —un cierre que se atrasó— tiene
   que ser obvio y barato de corregir. Adivinar en silencio es lo que había. */
/* Un handler por pantalla del cierre: cada una se repinta distinto, y juntos se ve de un vistazo
   cuáles son las seis. `_extData=null` y `_venData=null` tiran el resultado del mes viejo — si no,
   se cambia de mes y quedan a la vista los números del anterior con el rótulo nuevo. */
function fotoIrA(m){ _fotoMes = m; VIEWS.foto(); }
function revIrA(m){ _revMes = m; CFG.revision(); }
function pagoIrA(m){ _pagoMes = m; _pagoData = null; ciePago(); }
function venIrA(m){ _venMes = m; _venData = null; cieVendedores(); }
function extIrA(m){ _extMes = m; _extData = null; cieExternos(); }

/* ── LO QUE NO SE EMITIÓ TIENE QUE QUEDAR EN PANTALLA ────────────────────────────────────────
   Las dos emisiones —externos y vendedores— avisaban "N con error" en un toast que se va a los
   2,2 segundos, y el detalle iba a console.warn, que no mira nadie. Un cliente salteado es un
   cliente al que NO se le cobró ese mes: tiene que quedar a la vista, con el motivo y qué hacer.

   Se emite igual para el resto: frenar a los 44 porque uno falló sería peor. Lo que cambia es que
   ahora se sabe cuáles quedaron afuera. */
function pintarSalteados(id, r, quien) {
  const box = document.getElementById(id);
  if (!box) return;
  const fallaron = r.fallaron || [], sinBase = r.sinBase || [], sinCosto = r.sinCosto || [];
  if (!fallaron.length && !sinBase.length && !sinCosto.length) {
    box.innerHTML = `<div class="card" style="margin:12px 0 0;border-left:3px solid var(--green)">
      <b>✅ Se emitió a todos.</b> <span class="muted">${r.creados||0} ${esc(quien)}(s) · ${money(r.total,2)} USDT${
        r.yaEstaban?` · ${r.yaEstaban} ya estaban`:''}</span></div>`;
    return;
  }
  const fila = (f) => `<tr><td><b>${esc(f.cliente || f.vendedor || '')}</b></td>
    <td style="font-size:13px">${esc(f.error || '')}
      ${(f.avisos||[]).length?`<details style="margin-top:4px"><summary style="cursor:pointer;font-size:12px" class="muted">ver los ${f.avisos.length} avisos</summary>
        <div class="muted" style="font-size:11.5px;line-height:1.6;padding-top:4px">${f.avisos.map(esc).join('<br>')}</div></details>`:''}</td></tr>`;
  box.innerHTML = `<div class="card" style="margin:12px 0 0;border-left:3px solid var(--red)">
    <b style="color:var(--red)">A ${fallaron.length + sinBase.length} ${esc(quien)}(s) NO se les cobró este mes.</b>
    <div class="muted" style="font-size:13px;margin:4px 0 10px">Al resto sí: se emitieron ${r.creados||0} por ${money(r.total,2)} USDT.
      Arreglá lo de abajo y volvé a emitir — emitir de nuevo no duplica, sólo agrega los que faltaban.</div>
    <div style="overflow-x:auto"><table style="min-width:100%"><thead><tr>
      <th>${esc(quien)}</th><th>Por qué quedó afuera</th></tr></thead><tbody>
      ${sinBase.map((f) => `<tr><td><b>${esc(f.cliente||'')}</b></td><td style="font-size:13px">sin % base cargado</td></tr>`).join('')}
      ${fallaron.map(fila).join('')}
    </tbody></table></div>
    ${sinCosto.length?`<div class="muted" style="margin-top:8px;font-size:12.5px">Sin costo este mes (no es un error): ${sinCosto.map(esc).join(' · ')}</div>`:''}
  </div>`;
}

function bannerMes(mes, handler) {
  const otros = [...new Set([mesDeCierre(), mesHoy()])].filter(m => m !== mes);
  return `<div class="row" style="align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px;
      padding:8px 12px;background:var(--bg3);border-radius:8px;font-size:13px">
    <span class="muted">Mirando</span><b style="font-size:14px">${esc(mesNombre(mes))}</b>
    ${mes === mesDeCierre() && mes !== mesHoy()
      ? '<span class="muted" style="font-size:12px">· es el mes que toca cerrar</span>' : ''}
    ${otros.map(m => `<button class="outline small" onclick="${handler}('${m}')">ver ${esc(mesNombre(m))}</button>`).join('')}
  </div>`;
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
/* Guardar un porcentaje del cierre: verde si entró, ROJO y así se queda si no.
   El mensaje del servidor ya lo muestra api() solo; lo que faltaba era marcar el campo. Los seis
   lugares que guardan un % hacían `if(r.ok)` y en el else no hacían NADA: el número quedaba en
   pantalla como si se hubiera guardado. */
function _ciePct(el, r){
  el.classList.remove('cie-ok','cie-mal');
  if (r && r.ok) { el.classList.add('cie-ok'); setTimeout(()=>el.classList.remove('cie-ok'),350); return true; }
  el.classList.add('cie-mal');
  if (el.select) el.select();
  return false;
}
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(r.status===401){ location.href='/login'; return {ok:false}; }
  let b={}; try{ b=await r.json(); }catch(e){}
  if(!b.ok && b.error) toast('⚠ '+b.error);
  return b;
}
function logout(){ fetch('/api/logout',{method:'POST'}).finally(()=>location.href='/login'); }

function renderHeader(){
  document.getElementById('hd-sub').textContent =
    ES_CHAT ? 'Chat Externo — Ganamos × Latam'
      : (ES_TBS ? 'TBS — el sistema de API' : 'Panel — clientes, cuentas y cierre');
  const aqui = ES_CHAT ? '/chat-externo' : (ES_TBS ? '/tbs' : '/os');
  /* Cada espacio se llama por lo que se hace adentro: en «/» se cargan FICHAS (los pedidos que
     entran y se despachan) y «/os» es el PANEL (clientes, cuentas, cierre). Estuvieron cruzados un
     rato y el nombre mandaba al lugar equivocado. */
  const otros = [['/','🎰 Fichas'], ['/os','📊 Panel'], ['/tbs','🔌 TBS'], ['/chat-externo','💬 Chat']]
    .filter(([h])=>h !== aqui);
  document.getElementById('hd-nav').innerHTML =
    otros.map(([h,l])=>`<a href="${h}" style="text-decoration:none"><button class="outline small" style="white-space:nowrap">${l}</button></a>`).join('')
    + '<button class="outline small" onclick="logout()" style="white-space:nowrap">🚪 Salir</button>';
}
function renderNav(){
  renderHeader();
  document.getElementById('nav').innerHTML = TABS.map(t=>
    t==='|' ? '<span class="navsep"></span>'
            : `<button class="navbtn ${t[0]===_tab?'active':''}" onclick="go('${t[0]}')">${typeof t[1]==='function'?t[1]():t[1]}</button>`).join('');
}
function go(t){ _tab=t; renderNav(); VIEWS[t](); }

// ───────── CLIENTES (con sus PANELES adentro) ─────────
// Un panel no existe solo: siempre es de alguien. Tenerlos en pestañas separadas obligaba a ir y
// venir para algo tan simple como "¿qué paneles tiene Titan?". Ahora cada cliente se despliega.
const VIEWS = {}, CFG = {};
const _cliAbiertos = new Set();      // qué clientes tienen las CAJAS abiertas (sobrevive al re-render)
const _cliFicha = new Set();         // qué fichas de cliente quedaron abiertas

/* ── EL ÁRBOL DE LA CARTERA ──────────────────────────────────────────────────────────────────
   Un vendedor puede tener vendedores abajo (Alexa → Julian, GanamosSarah), y cada vendedor sus
   clientes, y cada cliente sus paneles. Es la misma jerarquía que existe de verdad en el negocio,
   y sale toda del campo `vendedor_id` que ya estaba cargado — antes se veía como 48 filas
   alfabéticas donde no se distinguía quién dependía de quién.
   Se arma recursivo, así que si mañana hay un nivel más no hay que tocar nada. */
// Arranca PLEGADO: con 48 clientes y 205 paneles, abrir todo de entrada es una pared de datos.
// Se ven los vendedores de arriba y se va abriendo lo que se quiere mirar.
let _cliCerradas = null;          // null = todavía no se tocó nada → todo plegado
function _cerradasIni(lista){
  if(_cliCerradas) return _cliCerradas;
  _cliCerradas = new Set(lista.filter(c=>lista.some(x=>x.vendedor_id===c.id)).map(c=>c.id));
  return _cliCerradas;
}
function cliFold(k){ _cliCerradas.has(k)?_cliCerradas.delete(k):_cliCerradas.add(k); VIEWS.clientes(); }
/** Plegar todo (deja solo los de arriba) o abrir todo. */
function cliFoldAll(lista){
  const todosAbiertos = _cliFicha.size >= lista.length;
  _cliFicha.clear(); _cliCerradas = new Set();
  if(!todosAbiertos) lista.forEach(c=>_cliFicha.add(c.id));
  else _cliAbiertos.clear();
  VIEWS.clientes();
}

function cliArbol(lista){
  const hijos={};    // vendedor_id → los que cuelgan de él
  lista.forEach(c=>{ const k=c.vendedor_id||'_raiz'; (hijos[k]=hijos[k]||[]).push(c); });
  const orden=(a,b)=> (b.es_vendedor?1:0)-(a.es_vendedor?1:0) || String(a.nombre||'').localeCompare(String(b.nombre||''));
  const nodo=(c,nivel)=>({
    cliente:c, nivel,
    subs:(hijos[c.id]||[]).sort(orden).map(x=>nodo(x,nivel+1)),
  });
  const raiz=(hijos._raiz||[]).sort(orden).map(c=>nodo(c,0));
  return raiz;
}
/** Cuántos cuelgan de este nodo, contando todos los niveles. */
function cliCuenta(n){ return n.subs.reduce((a,x)=>a+1+cliCuenta(x),0); }
/** La deuda del nodo más la de todo lo que cuelga. */
function cliDeuda(n){
  const p=Number((n.cliente.deuda&&n.cliente.deuda.total)||0);
  return n.subs.reduce((a,x)=>a+cliDeuda(x),p);
}

/* Pinta un nodo del árbol y todo lo que cuelga, como fichas plegables.
   ⚠️ UN CLIENTE PUEDE ABRIR DOS COSAS DISTINTAS —su gente y sus cajas— y con una sola flecha no se
   sabía cuál se estaba abriendo: con la lista plegada, tocar a Alexa cerraba su rama y sus 13 cajas
   parecían haber desaparecido. Ahora abrir el cliente muestra ADENTRO dos cosas separadas, cada una
   con su propio "ver": «Sus N cajas» y «Su gente (N)». Cada apertura dice qué abre. */
function cliFicha(n, prof=0){
  const c=n.cliente;
  const cajas=_paneles.filter(p=>p.cliente_id===c.id);
  const sinLink=cajas.filter(p=>!(p.conexion_id&&p.id_usuario)).length;
  const abiertoPan=_cliAbiertos.has(c.id);
  const abiertoRama=!_cerradasIni(_clientes).has(c.id);
  const cuantos=cliCuenta(n);
  const deudaRama=cliDeuda(n);
  const propia=Number((c.deuda&&c.deuda.total)||0);
  const señales=[
    c.estado!=='activo' ? `<span class="señal durazno">${esc(c.estado||'')}</span>` : '',
    (!c.es_vendedor && c.precio_base_pct==null) ? '<span class="señal rosa" title="Sin % base no se le puede facturar">sin % base</span>' : '',
    sinLink ? `<span class="señal durazno" title="Esas cajas no están linkeadas al casino">${sinLink} sin linkear</span>` : '',
  ].filter(Boolean).join('');

  return `<div style="margin-left:${prof*18}px">
    <details class="plegable"${_cliFicha.has(c.id)?' open':''} ontoggle="cliFichaEstado('${c.id}',this.open)">

/* El estado de cada apertura sobrevive al repintado: sin esto, guardar cualquier cosa cerraba todo
   lo que tenías abierto y había que volver a buscar dónde estabas. */
function cliPanEstado(id, abierto){ if(abierto) _cliAbiertos.add(id); else _cliAbiertos.delete(id); }
function cliFichaEstado(id, abierto){ if(abierto) _cliFicha.add(id); else _cliFicha.delete(id); }

/* Una sección plegable con su titular a la derecha: el título dice qué es y el número dice si vale
   la pena abrirla. La usan el Pulso del mes y Tipos de cambio — pantallas de muchas tablas donde
   casi siempre se mira una sola, y donde antes había que scrollear todo para encontrarla.
   Lo que quedó abierto sobrevive al repintado, y `abrirSola` sólo manda hasta que la tocás. */
const _secAb = new Set(), _secTocada = new Set();
function seccion(id, titulo, resumen, cuerpo, abrirSola){
  if(!_secTocada.has(id) && abrirSola) _secAb.add(id);
  return `<details class="plegable" style="margin-bottom:8px"${_secAb.has(id)?' open':''}
      ontoggle="secEstado('${id}',this.open)">
    <summary class="fila"><span class="chev" aria-hidden="true"></span>
      <span class="nom">${titulo}</span>
      ${resumen?`<span class="cifra">${resumen}</span>`:''}</summary>
    <div class="cuerpo">${cuerpo}</div></details>`;
}
function secEstado(id, abierto){ _secTocada.add(id); if(abierto) _secAb.add(id); else _secAb.delete(id); }

/* LA EXPLICACIÓN LARGA, PLEGADA. Casi todas las pantallas abrían con dos, tres o cuatro párrafos
   en gris antes de mostrar un solo dato. Eso no es documentar de más: la primera vez sirve y las
   otras doscientas tapa lo que venís a ver. Queda una línea a la vista —la que hace falta para no
   equivocarse— y el resto detrás de «Cómo funciona esto», que se acuerda de si lo abriste. */
/* ── EL TEXTO LLEGA HASTA EL FINAL, COMO TODO LO DEMÁS ───────────────────────────────────────
   Estos párrafos tenían un tope de ancho por legibilidad —un renglón muy largo cansa— pero el
   resto del panel nunca lo tuvo: al lado de un «Cobrado: 3 clientes por 1.050,00 USDT» que llega
   hasta el borde, un párrafo que corta a dos tercios se lee como un error de maquetado, no como
   una decisión. Y la inconsistencia molesta más de lo que ayudaba el tope.
   El ancho lo pone `main`, que ya está en 1000px: ése es el límite real y es el mismo para todo. */
function ayuda(id, resumen, detalle){
  return `<div class="muted" style="margin:6px 0 ${detalle?'8px':'12px'}">${resumen}</div>`
    + (detalle?`<details class="cajas" style="margin:0 0 12px"${_secAb.has('ayuda.'+id)?' open':''}
        ontoggle="secEstado('ayuda.${id}',this.open)">
        <summary class="abrir"><span class="chev" aria-hidden="true"></span>Cómo funciona esto</summary>
        <div class="muted" style="margin-top:9px">${detalle}</div></details>`:'');
}
function cliRamaEstado(id, abierto){
  _cerradasIni(_clientes);
  if(abierto) _cliCerradas.delete(id); else _cliCerradas.add(id);
}

/* ── MOVER FICHAS ENTRE PANELES DE UN CLIENTE ─────────────────────────────────────────────────
   El cliente pide, se aprueba acá. Las fichas SUBEN del panel de origen hasta el ancestro que los
   dos comparten y BAJAN hasta el destino: no se crea ni se destruye ninguna. Esa cadena puede
   cortarse en cualquier eslabón, y ahí queda "a medias" — las fichas están en el último nodo que
   sí se movió. Ese estado es el que hay que mirar: no es un error, es plata a mitad de camino. */
async function movAviso(){
  const r=await api('/api/os/movimientos-panel');
  const c=(r&&r.ok)?(r.counts||{}):{};
  const n=c.requierenAtencion||0;
  const b=document.getElementById('mov-badge');
  if(b) b.innerHTML = n?'<span class="badge err" style="margin-left:4px">'+n+'</span>':'';
  const av=document.getElementById('mov-aviso'); if(!av) return;
  if(!n){ av.innerHTML=''; return; }
  // Un movimiento a medias se anuncia distinto y más fuerte que uno pendiente: en el pendiente no
  // se movió nada y puede esperar; en el otro las fichas ya salieron de un panel del cliente.
  const medias=(c.a_medias||0)+(c.trabados||0);
  // La clase va escrita entera en cada rama y no interpolada: hay un control que revisa que
  // ninguna clase "nota …" use un modificador que no existe en el CSS, y ese control no puede
  // leer un ternario adentro del atributo. Vale más tenerlo funcionando que ahorrar tres palabras.
  const cuerpo = '<span class="tit">'+(medias
      ? '⚠️ '+medias+' movimiento'+(medias===1?'':'s')+' A MEDIAS: la cadena se cortó y las fichas quedaron en el camino'
      : '🔀 '+n+' movimiento'+(n===1?'':'s')+' esperando aprobación')+'</span>'
    +(medias&&c.pendiente?'<span class="muted">y '+c.pendiente+' esperando aprobación</span> ':'')
    +'<button class="small" style="margin-left:8px" onclick="movimientosPanel()">Ver</button>';
  av.innerHTML = medias
    ? '<div class="nota err" style="margin:10px 0">'+cuerpo+'</div>'
    : '<div class="nota warn" style="margin:10px 0">'+cuerpo+'</div>';
}

/* `soloPendientes`: mismo criterio que en las cajas — buzón en Pendientes, historial en Clientes.
   Se filtra por los estados que REQUIEREN ALGO: el que espera, el que quedó a medias (ahí las
   fichas están a mitad de camino) y el que se trabó ejecutando. 'hecho' y 'rechazado' no piden
   nada, y en un buzón sólo tapan. */
/* Qué plataformas toca el movimiento. Si son dos es un PASE: no traslada fichas, las saca de un
   lado y las pone del otro. Se marca fuerte porque cambia lo que estás aprobando. */
function plataformas(m){
  const o=m.sistema||'', d=m.sistemaDestino||o;
  if(!o) return '';
  if(o.toLowerCase()===String(d).toLowerCase()) return ' <span style="opacity:.6">('+esc(o)+')</span>';
  return ' <b style="color:var(--acc)">↔ PASE '+esc(o)+' → '+esc(d)+'</b>';
}

/* ── PASAR DE UN SISTEMA AL OTRO ────────────────────────────────────────────────────────────
   Casino y Europa son dos casinos distintos: una ficha de uno no existe en el otro y no hay
   ninguna llamada que la cruce. Esto NO es un traslado, son dos operaciones: se retira de un lado
   y se carga del otro. Los textos lo dicen así en todos lados a propósito. */
let _paseOrigen=null;
async function paseAbrir(){
  const c=document.getElementById('pase-caja');
  if(c.dataset.abierto==='1'){ c.innerHTML=''; c.dataset.abierto=''; return; }
  c.dataset.abierto='1';
  c.innerHTML='<div class="nota-suave">Buscando los paneles…</div>';
  const r=await api('/api/os/paneles');
  const ps=(r.paneles||r.items||r||[]).filter(p=>p.id_usuario&&p.cliente_id);
  ps.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  c.innerHTML='<div class="nota-suave" style="margin-top:10px">'
    +'<b>Esto no traslada fichas: las saca de un lado y las pone del otro.</b><br>'
    +'Son dos casinos distintos. Se retira del panel de origen —quedan en su SuperAgente— y se carga '
    +'en el de destino desde el SuperAgente de esa otra plataforma. '
    +'Antes de sacar nada se comprueba que el destino tenga saldo.'
    +'<div class="row" style="gap:10px;align-items:flex-end;margin-top:12px">'
    +'<div style="flex:1;min-width:220px"><label>Sacar de</label>'
    +'<select id="pase-o" onchange="paseDestinos()" style="width:100%"><option value="">— elegí el panel —</option>'
    + ps.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.nombre)+' · '+esc(p.sistema)+'</option>').join('')
    +'</select></div>'
    +'<div style="flex:1;min-width:220px"><label>Poner en</label>'
    +'<select id="pase-d" style="width:100%"><option value="">— elegí primero de dónde sale —</option></select></div>'
    +'<div style="flex:0 0 110px"><label>Divisa</label><select id="pase-div" style="width:100%"></select></div>'
    +'<div style="flex:0 0 150px"><label>Monto</label><input id="pase-m" inputmode="decimal" '+NOFILL+' style="width:100%"></div>'
    +'<div style="flex:0"><button class="grave" onclick="paseHacer()">Pasar</button></div>'
    +'</div><div id="pase-msg" class="muted" style="margin-top:8px"></div></div>';
}
async function paseDestinos(){
  const o=document.getElementById('pase-o').value;
  const d=document.getElementById('pase-d'), dv=document.getElementById('pase-div');
  if(!o){ d.innerHTML='<option value="">— elegí primero de dónde sale —</option>'; return; }

   formulario. Se crea el PANEL; la caja sale sola por el espejo. */
/* `soloPendientes` cambia para qué sirve la lista, y por eso existe:
   · en 🔔 Pendientes es un BUZÓN — sólo lo que espera una decisión. Con las resueltas adentro,
     el buzón deja de ser un buzón: hay que buscar lo que falta entre lo que ya se hizo.
   · en 👥 Clientes es el HISTORIAL — todas, con su estado y su motivo.
   Antes las dos pantallas llamaban a esto igual y mostraban lo mismo, así que una de las dos no
   servía para nada. */
async function solicitudesCaja(soloPendientes){
  // Si no se dice, se deduce de la pestaña. Los refrescos de después de aprobar llaman a esto sin

  if(!l.length){ caja.innerHTML='<div class="nota">'+(soloPendientes?'Ninguna caja esperando aprobación.':'Ninguna solicitud todavía.')+'</div>'; return; }

    +'<th>Login</th><th>Nota</th><th></th></tr></thead><tbody>'
    +l.map(s=>'<tr><td class="muted" style="font-size:11px">'+esc(String(s.creada_at||'').slice(0,16).replace('T',' '))
      +'<br>'+esc(s.pedida_por||'')+'</td>'
      +'<td><b>'+esc(s.cliente)+'</b></td><td class="muted">'+esc(s.sistema)+'</td>'
      +'<td class="muted" style="font-variant-numeric:tabular-nums">'+esc(s.nodo)+'</td>'
      +'<td>'+esc(s.login)+'</td>'
      +'<td class="muted" style="font-size:11px">'+esc(s.nota||'—')+'</td>'
      +'<td class="right" style="white-space:nowrap">'+(s.estado==='pendiente'
        ? '<button class="small" onclick="solAprobar(\''+s.id+'\')">Aprobar</button> '
          +'<button class="danger small" onclick="solRechazar(\''+s.id+'\')">Rechazar</button>'
        : '<span class="badge '+(est[s.estado]||'')+'">'+esc(s.estado)+'</span>'
          +(s.motivo?'<div class="muted" style="font-size:11px">'+esc(s.motivo)+'</div>':''))

    toast('Panel y caja creados'+(r.divisas&&r.divisas.length?' · divisas del casino: '+r.divisas.join(','):''));
    if(r.aviso) toast(r.aviso);

    return;
  }
  toast((r&&r.error)||'no se pudo');
}

/* ── EL NIVEL: EL DE VERDAD, O EL QUE ALGUIEN ESCRIBIÓ AL CREARLO ───────────────────────────────
   Para bajarle fichas a un Agente hay que pasar por su Distribuidor y por su SuperAgente. Esa
   escala se resuelve contra el casino (`arbol_at` dice cuándo) porque el casino NO devuelve el

   Un panel SIN resolver queda con el nivel que se eligió a mano en el formulario de alta, y la
   cascada lo cree. Si ahí dice "SuperAgente", la carga va DIRECTO — y falla, porque el padre real

   El nivel sin resolver ya no se muestra como si fuera un dato: se muestra como lo que es, con el
   botón para resolverlo al lado. */
function nivelPanel(p){
  if (p.arbol_at) return esc(p.nivel_usuario||'');
  // Tres renglones apilados (badge / «dice X» / botón) hacían la fila el triple de alta. El «dice»

/* Resuelve UN panel contra el casino. Baja el árbol de su sistema (el casino no devuelve el padre,
   hay que reconstruirlo), así que tarda; por eso avisa antes y muestra el resultado. */
async function resolverPanel(id, nombre){
  toast('Preguntándole al casino por «'+nombre+'»… tarda un minuto');
  const r = await api('/api/os/casino/arbol/sync', { method:'POST', body: JSON.stringify({ panel_id: id }) });
  if (!r || !r.ok) return toast('No se pudo resolver: ' + ((r&&r.error)||''));
  if (!r.resueltos) {
    const f = (r.sinEncontrar||[])[0];
    return toast('El casino no encontró ese nodo' + (f&&f.diagnostico ? ': '+f.diagnostico : ''));
  }
  const c = (r.nivelCorregido||[])[0];
  toast(c ? ('Resuelto: es ' + c.a + (c.escala&&c.escala.length ? ' · pasa por ' + c.escala.join(' → ') : ''))
          : 'Resuelto: el nivel ya era el correcto');
  VIEWS.clientes();
}

/* ── BUSCAR DIVISAS NUEVAS EN UN SOLO PANEL ──────────────────────────────────────────────────
 * El cruce completo son 207 pedidos al casino y ~6 minutos: sirve para una limpieza, no para el
 * día a día. Pero las divisas nuevas aparecen de a una y en un cliente concreto — el que avisa que
 * arranca en otra moneda. Esto le pregunta al casino por ESE nodo solo: un pedido, dos segundos.
 *
 * No aplica nada solo. Muestra qué cambió y deja el botón para aceptarlo, porque "el casino manda"
 * vale para agregar pero también para borrar, y una lectura fallida que devolviera poco dejaría al
 * panel sin divisas. Por eso divisasDeNodo nunca devuelve lista vacía: o trae divisas o trae error.

async function buscarDivisas(panelId, nombre){
  toast('Preguntándole al casino por ' + nombre + '…');

  if(f.error) return toast(f.error, true);
  const hab=(f.habilitadas||[]), guar=(f.guardadas||[]);
  const nuevas=hab.filter(d=>!guar.includes(d)), yaNo=guar.filter(d=>!hab.includes(d));
  if(!nuevas.length && !yaNo.length) return toast(nombre+': sin cambios, el casino tiene las mismas '+hab.length+' divisas');
  const txt = nombre+'\n\n'
    + (nuevas.length?('NUEVAS en el casino: '+nuevas.join(', ')+'\n'):'')
    + (yaNo.length?('YA NO están en el casino: '+yaNo.join(', ')+'\n'):'')
    + '\nGuardadas ahora: '+(guar.join(', ')||'ninguna')
    + '\nQuedaría: '+hab.join(', ')
    + '\n\n¿Dejar exactamente las del casino?';
  if(!confirm(txt)) return;
  await setDivisas(panelId, hab.join(','));
  toast(nombre+': ahora tiene '+hab.length+' divisas');

/* Lee del casino, panel por panel, qué divisas tiene HABILITADAS y lo cruza con lo guardado.
   Va de a tandas: es un pedido HTTP por panel y son 200 — de una sola vez se come los 5 minutos
   que aguanta el proxy y se corta sin decir dónde quedó. Cada tanda deja el avance en pantalla. */
async function divisasCasino(conexion_id, panel_id){
  const caja=document.getElementById('div-cruce'); if(!caja) return;
  const filas=[]; let desde=0, total=null;
  caja.style.display='block';
  for(;;){
    caja.innerHTML='<b>Leyendo del casino…</b> '+(total==null?'':desde+' de '+total)
      +'<div class="muted" style="font-size:11px">Se puede cerrar esta pantalla, no se pierde nada: sólo lee.</div>';
    let r;
    try{ r=await api('/api/os/paneles/divisas/casino',{method:'POST',
      body:JSON.stringify({conexion_id,panel_id,desde,limite:20})}); }
    catch(e){ caja.innerHTML='<b class="badge err">Se cortó</b> '+esc(e.message)
      +'<div class="muted">Lo leído hasta acá vale; volvé a darle y sigue.</div>'; break; }
    if(!r||!r.ok){ caja.innerHTML='<b class="badge err">Error</b> '+esc((r&&r.error)||'sin respuesta'); break; }
    total=r.total; filas.push(...(r.paneles||[])); desde+=r.devueltos;
    if(!r.hay_mas) break;
  }
  if(!filas.length) return;
  const err=filas.filter(x=>x.error);
  const mueven=filas.filter(x=>!x.error&&x.faltanYMueven&&x.faltanYMueven.length);
  const faltan=filas.filter(x=>!x.error&&x.faltan.length&&!(x.faltanYMueven||[]).length);
  const sobran=filas.filter(x=>!x.error&&x.sobran.length);
  const linea=(x,campo)=>`<tr><td><b>${esc(x.nombre)}</b> <span class="muted">nodo ${esc(x.nodo)}</span></td>
     <td><code>${esc(x[campo].join(','))}</code></td>
     <td class="muted" style="font-size:11px">habilitadas: ${esc(x.habilitadas.join(','))}<br>
       guardadas: ${esc(x.guardadas.join(',')||'—')} · movió: ${esc(x.usadas.join(',')||'sin datos')}</td>
     <td><button class="small" onclick="setDivisas('${x.panel_id}','${esc(x.habilitadas.join(','))}')">poner las del casino</button></td></tr>`;
  caja.innerHTML=`<h3 style="margin:0 0 4px">Cruce con el casino <span class="muted" style="font-weight:400">${filas.length} paneles</span></h3>
    ${mueven.length?`<div class="nota err" style="margin:8px 0"><b>⚠️ ${mueven.length} paneles mueven una divisa que el OS no tiene en la lista.</b>
      Es lo único de acá que puede estar costando plata: el panel factura en esa moneda y el OS no la sabe.</div>
      <table><tbody>${mueven.map(x=>linea(x,'faltanYMueven')).join('')}</tbody></table>`:''}
    ${faltan.length?`<h4 style="margin:14px 0 2px">Habilitadas en el casino y no guardadas <span class="muted">(${faltan.length}) — todavía sin movimiento</span></h4>
      <table><tbody>${faltan.map(x=>linea(x,'faltan')).join('')}</tbody></table>`:''}
    ${sobran.length?`<h4 style="margin:14px 0 2px">Guardadas que el casino no tiene habilitadas <span class="muted">(${sobran.length}) — se pueden sacar</span></h4>
      <table><tbody>${sobran.map(x=>linea(x,'sobran')).join('')}</tbody></table>`:''}
    ${err.length?`<h4 style="margin:14px 0 2px">No se pudieron leer <span class="muted">(${err.length})</span></h4>
      <div class="muted" style="font-size:11px">${err.slice(0,20).map(x=>esc(x.nombre)+': '+esc(x.error)).join('<br>')}</div>`:''}
    ${!mueven.length&&!faltan.length&&!sobran.length&&!err.length?'<div class="badge ok">Todo coincide.</div>':''}`;
}

   abiertas unas cajas que estaban adentro de una tarjeta cerrada y el botón parecía no hacer nada. */
function togglePanTodos(){
  const abrir = _cliAbiertos.size < _clientes.length;
  _clientes.forEach(c=>{

  VIEWS.clientes();
}
async function moverPanel(id, cliente_id){

  if(r.ok){ toast('Panel asignado'); VIEWS.clientes(); }
}
async function nuevoCliente(){

/* ── RENOMBRAR, DESDE DONDE SE MIRA AL CLIENTE ────────────────────────────────────────────────
   Vivía sólo en el lápiz de 🎰 Fichas, en el otro espacio. Con la ficha del cliente abierta en el
   Panel, ir a buscarlo allá no se le ocurre a nadie.
   ⚠️ Se mandan los DOS nombres. Un cliente tiene `nombre` y `nombreVisible`, y Fichas escribía
   sólo el segundo — el único que muestra esa pantalla. El Panel, el Chat y la matriz del cierre
   muestran el primero, así que renombrar no se veía en ningún otro lado. */
async function renombrarCliente(id){
  const c=(_clientes||[]).find(x=>x.id===id); if(!c) return;
  const nombre=prompt('Nombre del cliente:', c.nombre||c.codigo||'');
  if(nombre===null) return;
  const codigo=prompt('Código con el que pide fichas:', c.codigo||'');
  if(codigo===null) return;
  const r=await api('/api/clientes/'+id,{method:'PUT',
    body:JSON.stringify({codigo:codigo.trim(), nombre:nombre.trim(), nombreVisible:nombre.trim()})});
  if(!r||!r.ok) return toast((r&&r.error)||'no se pudo');
  toast('Guardado');
  // Se recarga la lista: el nombre y el código se ven en todas las demás pantallas.
  const d=await api('/api/os/clientes'); _clientes=d.clientes||[];
  abrirCliente(id, _cliTab);
}
async function borrarCliente(id, codigo){
  if(!confirm('¿Borrar el cliente "'+codigo+'"?\n\nEsto borra TAMBIÉN sus plataformas/paneles, % de proveedores, participaciones y movimientos. No se puede deshacer.')) return;
  const r=await api('/api/os/clientes/'+id,{method:'DELETE'});
  if(r.ok){ toast('Cliente borrado'); VIEWS.clientes(); }
}

async function saveAccts(){
  const st = window._accState; if(!st) return;
  const cxName = (window._platCxs||[]).find(c=>c.id===st.cx); const sistema = cxName?cxName.nombre:'';
  const origIds = new Set(st.panels.map(p=>String(p.id_usuario)));
  const toCreate = [...st.sel].filter(idd=>!origIds.has(idd));
  const toDelete = st.panels.filter(p=>!st.sel.has(String(p.id_usuario)));
  let creados=0, borrados=0;
  for(const idd of toCreate){ const n=st.nodeById[idd]; if(!n)continue;
    await api('/api/os/paneles',{method:'POST',body:JSON.stringify({cliente_id:st.id, nombre:n.login, sistema, nivel_usuario:(n.nivel||''), tipo:'exclusivo', id_usuario:n.id, conexion_id:st.cx, divisas:'ARS'})}); creados++;

  }}

}

/* En qué nivel está cada casino AHORA. El nivel no se elige desde acá: lo decide "Agrupar por"

async function fotoModos(){

    // ninguna otra. Poner un botón en las tres invitaría a apretar la que el server va a rechazar.
    const clave = c.nivel==='general' ? 'nodo' : c.nivel;

async function fotoSacar(cxId, nivel, rehacer){
  // `nivel` ya no se manda: lo decide el casino. Se deja el parámetro porque los botones viejos
  // todavía lo pasan, y mandarlo haría que el server rechace la pasada si no coincide.
  //
  // `rehacer` SÍ se manda: sin él, lo ya sacado no se toca. Un mes cerrado ya no cambia, así que
  // volver a preguntar sólo puede empeorarlo — si el casino está agrupando distinto en ese momento,
  // lo bueno se reemplaza por lo malo y no queda rastro.
  if(rehacer && !confirm('¿Rehacer '+_fotoMes+'?\n\nVuelve a preguntarle al casino TODO y reemplaza lo que ya está guardado.\n'
    +'Si el casino no está en el nivel correcto, los datos van a quedar peores que ahora.')) return;
  // Un mes sin terminar da una foto CORTA que queda archivada como buena. Ver AVISO_FOTO_EN_CURSO.
  if(fotoMesSinTerminar(_fotoMes) && !confirm(
      mesNombre(_fotoMes).toUpperCase()+' TODAVÍA NO TERMINÓ.\n\n'
    + 'La foto va a salir con lo que hay hasta hoy y queda guardada como si fuera la del mes entero.\n'
    + 'La Factura de externos la va a leer así y va a cobrar de menos, sin avisar.\n\n'
    + '¿Sacarla igual?')) return;
  const cont=document.getElementById('foto-prog'); if(!cont) return;
  _fotoCancelar=false;
  // Se piden acá y no se usa window._cxs: eso lo llena la pantalla de Clientes, así que entrando
  // directo a la Foto la lista venía vacía y el botón decía "No hay conexiones para sacar".
  const todas=((await api('/api/os/casino/conexiones')).conexiones)||[];
  // paneles>0: Europa_Fichas y Casino_Fichas son las cuentas con las que se BAJAN fichas. No
  // facturan a nadie, no tienen un solo panel, y su plan es de cero consultas.
  const cxs=todas.filter(c=>c.activa!==false && (c.motor||'463')==='463' && c.paneles>0).filter(c=>!cxId||c.id===cxId);
  if(!cxs.length){ cont.innerHTML='<div class="nota err">No hay conexiones para sacar.</div>'; return; }
  const lineas=[]; let ok=0, errores=0, filas=0, ceros=0;
  const pintar=(t)=>{ cont.innerHTML='<div class="nota"><b>'+esc(t)+'</b>'
    +' <span class="muted">'+ok+' divisas · '+money(filas,0)+' filas · '+ceros+' en cero'
    +(errores?' · <span style="color:var(--red)">'+errores+' con error</span>':'')+'</span>'
    +'<div style="margin-top:6px;font-size:11px;font-family:monospace;max-height:260px;overflow:auto">'
    +lineas.slice(-40).join('<br>')+'</div>'
    +'<button class="outline small" style="margin-top:6px" onclick="_fotoCancelar=true">Parar</button></div>'; };
  pintar('Arrancando…');
  for(const cx of cxs){
    if(_fotoCancelar) break;
    let desde=0;
    for(;;){
      if(_fotoCancelar){ lineas.push('— parado por vos'); break; }
      let r;
      try{ r=await api('/api/os/estadisticas/capturar-global',{method:'POST',
        body:JSON.stringify({mes:_fotoMes, conexion_id:cx.id, desde, limite:8, guardar:true, rehacer:!!rehacer})}); }
      catch(e){ lineas.push('<span style="color:var(--red)">✖ '+esc(cx.nombre)+': '+esc(e.message)+'</span>'); errores++; break; }
      if(!r||!r.ok){
        // El server rechaza si el casino está agrupando de otra forma que la pedida. No es un
        // error a arreglar: es la otra vuelta, y hay que ir a cambiar "Agrupar por" en el panel.
        lineas.push('<span style="color:var(--red)">✖ '+esc(cx.nombre)+': '+esc((r&&r.error)||'no respondió')+'</span>');
        errores++; break;
      }
      if(desde===0) lineas.push('<b>'+esc(cx.nombre)+'</b> — el casino está agrupando por <b>'+esc(r.nivel)+'</b>');
      (r.divisas||[]).forEach(d=>{
        if(d.ok){ ok++; filas+=d.filasGuardadas||0; ceros+=d.panelesEnCero||0;
          if(d.yaEstaba) lineas.push('&nbsp;&nbsp;<span class="muted">'+esc(d.divisa)+' · ya estaba</span>');
          else if(d.filasGuardadas||d.panelesEnCero) lineas.push('&nbsp;&nbsp;'+esc(d.divisa)+' · '+d.segundos+'s · '
            +(d.filasGuardadas||0)+' filas'+(d.panelesEnCero?' · '+d.panelesEnCero+' en cero':'')); }
        else { errores++; lineas.push('&nbsp;&nbsp;<span style="color:var(--red)">'+esc(d.divisa)+' ✖ '+esc(String(d.detalle||d.error).slice(0,70))+'</span>'); }
      });
      pintar('Sacando '+cx.nombre+'…');
      desde+=r.devueltos;
      if(!r.hay_mas) break;
    }
  }
  pintar(errores?'Terminado con errores':'Listo');
  VIEWS.foto&&VIEWS.foto();
}

async function difResolver(arg, decision) {
  const d = JSON.parse(decodeURIComponent(arg));
  const motivo = prompt(decision === 'prueba'
    ? '¿Por qué es una prueba? (queda anotado)'
    : '¿Qué era? (queda anotado)', decision === 'prueba' ? 'carga de prueba, no se cobra' : '');
  if (motivo === null) return;
  const r = await api('/api/os/validacion/' + encodeURIComponent(d.mes) + '/resolver',
    { method: 'POST', body: JSON.stringify({ ...d, decision, motivo }) });
  if (!r.ok) return toast('No se pudo: ' + (r.error || ''));
  toast('Marcada');
  facEmitir(false, true);   // se vuelve a contrastar sin volver a preguntar: el total tiene que bajar
}
async function difDesresolver(clave) {
  const r = await api('/api/os/validacion/resolver/' + clave, { method: 'DELETE' });
  if (!r.ok) return toast('No se pudo');
  toast('Vuelve a estar pendiente');
  facEmitir(false, true);
}

/** Pinta la lista de comprobantes en el cuerpo de Movimientos. `estado` vacío = todos. */
async function pintarComprobantes(estado, conFiltros) {
  const dest = document.getElementById('mov-body'); if (!dest) return;
  // La lista de clientes hace falta ACÁ, no sólo en "Cuenta y pagos": es de donde sale en qué
  // moneda se lleva la cuenta de cada uno. Si se entra directo a "Por aprobar" sin pasar por la
  // otra solapa, viene vacía y todos los clientes parecen estar en USDT — incluidos los que
  // llevan la cuenta en pesos, que es justamente el caso que hay que distinguir.
  if (!_clientes.length) { const dc = await api('/api/os/clientes'); _clientes = dc.clientes || []; }
  // El filtro por cliente va al SERVIDOR, no se recorta en pantalla: hoy son 20 comprobantes pero
  // la lista viene con tope, y filtrando acá el día que haya 300 se estaría filtrando un pedazo.
  const q = [estado ? 'estado=' + encodeURIComponent(estado) : '', _cmpCli ? 'codigo=' + encodeURIComponent(_cmpCli) : '']
    .filter(Boolean).join('&');
  const r = await api('/api/os/comprobantes' + (q ? '?' + q : ''));
  const cs = r.comprobantes || []; const c0 = r.cuentas || {};
  // El número de pendientes va a la pestaña: es lo que hace que se vea desde cualquier pantalla.
  _cmpPend = c0.pendiente || 0; renderNav();
  const tabs = [['aprobado','✅ Aprobados',c0.aprobado||0],['rechazado','✖ Rechazados',c0.rechazado||0],['','Todos (incluye los que esperan)','']];

  /* ── UNO POR VEZ ─────────────────────────────────────────────────────────────────────────────
     Cada comprobante pendiente abría con sus dos caminos y sus cinco campos: 300px de alto cada
     uno. Con seis esperando había que scrollear el buzón entero para llegar al último, y estás
     atendiendo UNO. Ahora vienen plegados —con lo que hace falta para saber cuál es— y el primero
     abierto, que es el que estás por resolver. Al resolverlo desaparece y se abre el que sigue.
     Los ya resueltos no se pliegan: ahí no hay nada que decidir, se está leyendo. */
  let _abiertos = 0;
  const fila = (c) => {
    const pend = c.estado === 'pendiente';
    const via = c.via === 'usdt' ? '₮ USDT' : '💵 ARS';
    const arch = c.archivo_bytes
      ? '<a href="/api/os/comprobantes/' + c.id + '/archivo" target="_blank" class="pill">📎 ver comprobante</a>'
      : '<span class="pill" style="background:var(--red);color:#000">SIN comprobante</span>';
    // El primero que espera arranca abierto; los demás, plegados.
    const abrir = !pend || (_abiertos++ === 0);
    return '<details class="card cmp' + (pend ? ' pend' : '') + '"' + (abrir ? ' open' : '')
      + ' style="margin:8px 0;border-left:3px solid ' + (pend ? 'var(--durazno)' : (c.estado === 'aprobado' ? 'var(--verde2)' : 'var(--rosa)')) + '">'
      + '<summary class="row" style="align-items:center;gap:10px;cursor:pointer;list-style:none">'
      +   '<span class="chev" aria-hidden="true" style="flex:0 0 auto"></span>'
      +   '<div style="flex:1"><b>' + esc(c.cliente_nombre || c.codigo) + '</b> <span class="pill">' + esc(c.codigo) + '</span>'
      +     '<div class="muted" style="font-size:11.5px;margin-top:3px">' + esc(String(c.creado_at || '').slice(0,16).replace('T',' ')) + ' · ' + via + (c.referencia ? ' · ref ' + esc(c.referencia) : '') + '</div></div>'
      +   '<div style="flex:0;text-align:right"><div class="muted" style="font-size:11px">declarado</div><div style="font-size:19px;font-weight:800">' + money(c.monto,2) + ' ' + esc(c.divisa) + '</div></div>'
      + '</summary>'
      + '<div>'
      + '<div style="margin-top:8px">' + arch + (c.notas ? ' <span class="muted">' + esc(c.notas) + '</span>' : '') + '</div>'
      // ── ¿EL AVISO AL GRUPO SALIÓ? ────────────────────────────────────────────────────────────
      // Antes esto no se veía en ningún lado: el envío fallaba, se escribía en un log que se pierde
      // entre despliegues, y lo que se notaba era un reclamo del cliente semanas después.
      // ── LOS DOS AVISOS, POR SEPARADO ────────────────────────────────────────────────────────
      // Un pago avisa a dos grupos: el de cobranzas (con la foto) y el del cliente ("tu abono está
      // registrado"). Fallan por separado — que el bot esté en uno no dice nada del otro — así que
      // se muestran por separado. "Apagado" no es una falla: es una decisión, y va en gris.
      + (() => {
        const linea = (ok, err, quien) => {
          if (ok === 1) return '<div class="muted" style="margin-top:4px;font-size:11px">✅ avisado ' + quien + '</div>';
          if (ok !== 0) return '';
          const apagado = /apagados|no tiene grupo/.test(String(err || ''));
          return apagado
            ? '<div class="muted" style="margin-top:4px;font-size:11px">— no se avisó ' + quien + ': ' + esc(err) + '</div>'

        };
        const a = linea(c.aviso_ok, c.aviso_error, 'al grupo de cobranzas');
        const b = linea(c.aviso_cli_ok, c.aviso_cli_error, 'al grupo del cliente');

        return a + b + (falla && c.estado === 'aprobado'
          ? '<div style="margin-top:6px"><button class="small outline" onclick="cmpReavisar(\'' + c.id + '\')">Reintentar los avisos</button></div>' : '');
      })()
      + (pend
        // ── DOS CAMINOS, CADA UNO CON SU CAMPO Y SU BOTÓN ────────────────────────────────────
        // Antes eran cuatro botones en un renglón junto a dos campos rotulados en monedas
        // distintas. En una pantalla angosta el renglón se partía, el botón del TC del mes
        // quedaba FUERA DE LA VISTA, y lo que se apretaba era el otro — el que pide un monto en
        // la moneda de la cuenta. Cada botón va pegado al campo que lee, y se ve cuál es cuál.
        // La nota se fue ABAJO, al lado de Rechazar: encabezaba la tarjeta siendo lo último que
        // se llena, y encima es privada — no la ve el cliente ni sale por Telegram.
        ? ''

          /* ── LAS DOS CAJAS SON DOS CAMINOS, NO UNO BUENO Y UNO GRIS ────────────────────────
             El fondo de la caja era `--bg3`, el MISMO rosa que el de los campos: todo se fundía y
             el botón de contorno del segundo camino desaparecía. «Aprobar con el TC del mes» no
             se leía como algo que se aprieta.
             Ahora la caja va blanca con borde —los campos rosas resaltan encima— y los DOS botones
             son botones de verdad. No rompen la regla de «uno lleno por tarjeta»: esa regla separa
             lo cotidiano de lo que sale para afuera, y acá las dos cosas son lo mismo —aprobar—,
             sólo cambia si ya sabés el cambio o todavía no. Poner una en gris sugería que era la
             segunda opción, y para el que cobra en pesos todo el mes es la primera. */
          + '<div class="card" style="margin:8px 0 0;background:var(--bg2);border:1px solid var(--border);padding:11px 13px">'
