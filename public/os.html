<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LATAM Games OS</title>
<style>
  :root { --bg:#fbf4fa; --bg2:#fff; --bg3:#f6e9f4; --border:#ead6e6; --text:#2b2230; --muted:#8c7e89; --gold:#c456ad; --green:#2e9e63; --red:#d9534f; --blue:#3b7fe0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; }
  header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:16px; margin:0; } header h1 small { color:var(--muted); font-weight:400; }
  .nav { display:flex; gap:2px; padding:0 12px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap; }
  .navbtn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:11px 13px; font-weight:700; cursor:pointer; font-size:13.5px; }
  .navbtn.active { color:var(--gold); border-bottom-color:var(--gold); }
  .navsep { width:1px; background:var(--border); margin:8px 7px; flex:0 0 auto; }
  .nb { background:var(--gold); color:#fff; border-radius:20px; padding:0 6px; font-size:11px; margin-left:3px; vertical-align:1px; }
  /* Europa y Casino son DOS sistemas distintos, y el mismo panel puede estar en los dos
     (UPruebaLatam lo está). Sin color se leen como si fueran uno repetido. */
  :root { --sis-eu:#2f6fd0; --sis-cas:#7c4dd6; }
  .sis { display:inline-block; padding:1px 7px; border-radius:5px; font-size:10.5px; font-weight:700;
         letter-spacing:.02em; border:1px solid transparent; }
  .sis.eu  { background:rgba(47,111,208,.13);  color:var(--sis-eu);  border-color:rgba(47,111,208,.35); }
  .sis.cas { background:rgba(124,77,214,.13);  color:var(--sis-cas); border-color:rgba(124,77,214,.35); }
  .sis.na  { background:var(--bg3); color:var(--muted); border-color:var(--border); }
  main { max-width:1000px; margin:0 auto; padding:18px; }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:11px; color:var(--muted); margin:0 0 3px; text-transform:uppercase; letter-spacing:.03em; }
  input, select { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:14px; outline:none; }
  input:focus,select:focus { border-color:var(--gold); }
  button { background:var(--gold); color:#fff; border:none; border-radius:6px; padding:8px 13px; font-weight:700; cursor:pointer; font-size:13px; }
  button.outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.danger { background:transparent; border:1px solid var(--red); color:var(--red); }
  button.small { padding:5px 9px; font-size:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1; min-width:120px; }
  /* Un selector de mes o fecha no entra en 120px: el campo quedaba más angosto que su propio
     contenido y el botón de al lado se le montaba encima, tapando el mes y dejándolo sin poder
     elegirse. Pasaba en las cinco pantallas que tienen uno. */
  /* ⚠️ El selector de MES y el de FECHA son más anchos que cualquier otro input: el navegador
     les mete el texto completo ("agosto de 2026") más su ícono de calendario. Los tenía en
     min-width pero el DIV que los contiene seguía valiendo 120px, así que el input se desbordaba
     y el botón de al lado le quedaba encima — tapando justo el ícono con el que se abre.
     La regla va sobre el CONTENEDOR, así aplica en las 8 pantallas que tienen un selector de mes
     sin que haya que acordarse en cada una. */
  input[type=month], input[type=date] { min-width:175px; }
  .row > div:has(> input[type=month]), .row > div:has(> input[type=date]),
  .row > div:has(> label + input[type=month]), .row > div:has(> label + input[type=date]) {
    flex:0 0 auto; min-width:190px;
  }
  .row > div:has(> input[type=month]) input, .row > div:has(> input[type=date]) input,
  .row > div:has(> label + input[type=month]) input, .row > div:has(> label + input[type=date]) input {
    width:100%;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .badge { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge.ok { background:rgba(46,160,67,.15); color:var(--green); }
  .badge.warn { background:rgba(196,86,173,.14); color:var(--gold); }
  .badge.err { background:rgba(217,83,79,.15); color:var(--red); }
  /* Bloques de aviso. Antes cada uno traía su propio background:rgba(196,86,173,.07); a mano — un marrón oscuro
     que venía de cuando el panel era oscuro. Con el tema claro quedaba texto oscuro sobre fondo
     oscuro: ilegible. Ahora es una clase, tintada sobre el fondo claro y con una barra de color
     al costado, que es lo que hace que se lea de un vistazo cuál es cuál. */
  .nota { border-radius:8px; padding:10px 12px; margin:10px 0 0; font-size:13px; line-height:1.6;
          border:1px solid var(--border); border-left:4px solid var(--muted); background:var(--bg3); }
  .nota b { color:var(--text); }
  .nota.warn { border-color:rgba(196,86,173,.35); border-left-color:var(--gold); background:rgba(196,86,173,.07); }
  .nota.err  { border-color:rgba(217,83,79,.35);  border-left-color:var(--red);  background:rgba(217,83,79,.07); }
  .nota.ok   { border-color:rgba(46,160,67,.35);  border-left-color:var(--green);background:rgba(46,160,67,.07); }
  .nota .tit { font-weight:800; display:block; margin-bottom:3px; }
  .nota.warn .tit { color:var(--gold); }
  .nota.err  .tit { color:var(--red); }
  .nota.ok   .tit { color:var(--green); }
  .nota table { margin-top:6px; }
  .nota table th { font-size:10px; }
  .nota table td { padding:4px 9px; font-size:12px; }
  .cie-ok { background:rgba(46,160,67,.28)!important; transition:background .1s; }
  /* Cuentas de API: un bloque por divisa. El GGR local sólo se suma dentro de su moneda, así que
     cada bloque es una tabla cerrada con su propio subtotal y su TC en la cabecera. */
  .apidiv { margin:0 0 12px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .apidiv-h { display:flex; gap:9px; align-items:baseline; padding:6px 10px; background:var(--bg3);
              border-bottom:1px solid var(--border); font-size:12px; }
  .apidiv table { margin:0; }
  .apidiv tfoot td { background:var(--bg3); border-top:1px solid var(--border); }
  .apidiv tr.sinver { background:rgba(196,86,173,.07); }
  .apicaja { margin:0 0 12px; padding-left:12px; border-left:3px solid var(--gold); }
  .apicaja-h { font-weight:700; font-size:13px; margin:0 0 6px; }
  .apitres { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 8px; }
  .apitres > div { flex:1; min-width:130px; padding:7px 11px; background:var(--bg3);
                   border:1px solid var(--border); border-radius:7px; }
  .apitres > div.tot { border-color:var(--gold); background:rgba(196,86,173,.07); }
  .apitres span { display:block; font-size:11px; }
  .apitres b { font-size:16px; }
  .muted { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .right { text-align:right; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
  .pill { font-family:monospace; background:var(--bg); padding:1px 6px; border-radius:5px; }
  hr { border:none; border-top:1px solid var(--border); margin:12px 0; }

  /* ── Fila desplegada de un cliente (sus paneles) ──────────────────────────
     Antes el <td> se pintaba con var(--bg), el MISMO tono que el fondo de la
     página, así que dentro de la tarjeta blanca se leía como un agujero: dos
     fondos sin relación. Ahora es blanco como la tarjeta —un solo fondo— y lo
     que marca que está anidado es la barra de acento a la izquierda más la
     sangría, no un cambio de color. */
  tr.sub > td { background:var(--bg2); padding:4px 0 16px 0; border-bottom:1px solid var(--border); }
  .subwrap { margin-left:22px; padding-left:14px; border-left:2px solid var(--gold); }
  /* La tabla interna necesita leerse como un objeto propio sobre el blanco:
     se lo dan el marco y la cabecera tenue, no el fondo. */
  .subwrap table { margin:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .subwrap thead th { background:var(--bg3); font-size:10px; padding:6px 9px; border-bottom:1px solid var(--border); }
  .subwrap tbody tr:last-child td { border-bottom:none; }
  .subwrap tbody tr:hover td { background:var(--bg); }
  /* Dota.click declara 24 divisas y reventaba el ancho de la columna. */
  .subwrap td.divs { max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Las filas de cliente se despliegan al hacer clic: que se note que son vivas. */
  #main tbody tr:not(.sub):hover > td { background:var(--bg); }
  #car-wrap, [id^="car-"] { display:inline-block; transition:transform .15s ease; }

/* ── Las tres vueltas de la Foto ──────────────────────────────────────────────────────────────
   Antes esto era un botón relleno de magenta con el detalle adentro en gris: el texto no se leía.
   Acá el relleno se usa SÓLO para el estado (verde = esa vuelta está), y el texto va siempre
   oscuro sobre claro. Los fondos son opacos a propósito. */
.vcx{flex:0 0 auto;min-width:230px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg2)}
.vcx-ok{border-color:var(--green)}
.vcx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
       padding:7px 10px;background:#f3edf6;border-bottom:1px solid var(--line)}
.vcx-ok .vcx-h{background:#eaf5ec}
table.vtab{width:100%;border-collapse:collapse;margin:0}
table.vtab td{padding:5px 10px;border-bottom:1px solid #f3e9f1;font-size:12px}
table.vtab tr:last-child td{border-bottom:none}
tr.vta-ok td{background:#eaf5ec}
tr.vta-ok b{color:var(--green)}
td.vta-i{width:22px;text-align:center}
td.vta-a{width:1%;white-space:nowrap;padding-right:8px}
/* la vuelta que el casino tiene puesta AHORA: es la única que se puede sacar en este momento */
tr.vta-ahora td{background:#fdf3d6}
tr.vta-ahora.vta-ok td{background:#eaf5ec}
</style>
</head>
<body>
<header>
  <h1>🎰 LATAM Games <small id="hd-sub"></small></h1>
  <div id="hd-nav" style="display:flex; gap:8px; flex:0 0 auto; flex-wrap:nowrap; align-items:center"></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
// ───────── helpers ─────────
// Agrupadas por para qué se usan, con una barrita entre grupos: eran 14 botones seguidos y no se
// distinguía el día a día de lo que se toca una vez por mes. Quedaron 11:
//   · Paneles     → adentro de Clientes, desplegando la fila de cada uno
//   · Comprobantes→ una solapa de Movimientos (un comprobante aprobado ES un movimiento)
//   · Revisión    → adentro de Config, que es donde vive el diagnóstico
// La etiqueta puede ser una función: así Movimientos muestra cuántos comprobantes esperan.
/* ── TRES ESPACIOS DE TRABAJO, NO UNO CON 12 PESTAÑAS ────────────────────────────────────────
   TBS no es una pestaña más del núcleo comercial: es OTRO negocio. Otros clientes, otros
   proveedores, otra forma de cobrar (por sello y no por % base) y otro cierre de mes. Tenerlo
   como una solapa entre "Proveedores" y "Tipos de cambio" lo escondía y mezclaba dos cabezas
   distintas en la misma barra.
   Ahora son tres: Operativo (/), Comercial (/os) y TBS (/tbs). Mismo archivo y mismos helpers
   —duplicarlos habría sido peor— pero cada uno con su barra y su nombre. */
const TABS_COMERCIAL = [
  ['acumulado','📒 Acumulado'], ['clientes','👥 Clientes'],
  ['movimientos', ()=>'💸 Movimientos' + (_cmpPend ? ' <span class="nb">'+_cmpPend+'</span>' : '')],
  '|',
  ['cierre','🧮 Cierre de Mes'], ['facturacion','🧾 Factura de consumo'], ['reparto','💰 Reparto'], ['foto','📸 Foto del mes'],
  '|',
  ['proveedores','🏷 Proveedores'], ['tc','💱 Tipos de cambio'], ['reportes','📈 Reportes'], ['config','⚙ Config'],
];
// Las 4 subpantallas de TBS suben a primer nivel. Tipos de cambio va también porque las cuentas
// de API se convierten con él: sin eso habría que saltar al otro espacio para revisar un TC.
const TABS_TBS = [
  ['tbsmatriz','🎯 Precios por cliente'], ['tbsclientes','👥 Cuentas de API'],
  '|',
  ['tbscuentas','🧾 Cuentas del mes'], ['tbsresumen','📊 Cierre del mes'],
  '|',
  ['tc','💱 Tipos de cambio'],
];
const ES_TBS = location.pathname.replace(/\/+$/,'') === '/tbs';
const TABS = ES_TBS ? TABS_TBS : TABS_COMERCIAL;
let _tab = ES_TBS ? 'tbsmatriz' : 'clientes';
let _clientes = [], _personas = [], _paneles = [], _proveedores = [], _repMes = '', _cfgSub = 'revision';
let _repSub = 'mes', _repCli = '';   // Reparto: qué subpantalla y qué cliente se está editando
let _cxSel = '', _cxNodos = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n,d=2){ const x=Number(n||0); return x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(r.status===401){ location.href='/login'; return {ok:false}; }
  let b={}; try{ b=await r.json(); }catch(e){}
  if(!b.ok && b.error) toast('⚠ '+b.error);
  return b;
}
function logout(){ fetch('/api/logout',{method:'POST'}).finally(()=>location.href='/login'); }

function renderHeader(){
  document.getElementById('hd-sub').textContent = ES_TBS ? 'TBS — el sistema de API' : 'OS — núcleo comercial';
  const otros = [['/','↩ Operativo'], ['/os','🎰 Comercial'], ['/tbs','🔌 TBS']]
    .filter(([h])=>h !== (ES_TBS?'/tbs':'/os'));
  document.getElementById('hd-nav').innerHTML =
    otros.map(([h,l])=>`<a href="${h}" style="text-decoration:none"><button class="outline small" style="white-space:nowrap">${l}</button></a>`).join('')
    + '<button class="outline small" onclick="logout()" style="white-space:nowrap">🚪 Salir</button>';
}
function renderNav(){
  renderHeader();
  document.getElementById('nav').innerHTML = TABS.map(t=>
    t==='|' ? '<span class="navsep"></span>'
            : `<button class="navbtn ${t[0]===_tab?'active':''}" onclick="go('${t[0]}')">${typeof t[1]==='function'?t[1]():t[1]}</button>`).join('');
}
function go(t){ _tab=t; renderNav(); VIEWS[t](); }

// ───────── CLIENTES (con sus PANELES adentro) ─────────
// Un panel no existe solo: siempre es de alguien. Tenerlos en pestañas separadas obligaba a ir y
// venir para algo tan simple como "¿qué paneles tiene Titan?". Ahora cada cliente se despliega.
const VIEWS = {}, CFG = {};
const _cliAbiertos = new Set();      // qué clientes quedaron desplegados (sobrevive al re-render)

/* ── EL ÁRBOL DE LA CARTERA ──────────────────────────────────────────────────────────────────
   Un vendedor puede tener vendedores abajo (Alexa → Julian, GanamosSarah), y cada vendedor sus
   clientes, y cada cliente sus paneles. Es la misma jerarquía que existe de verdad en el negocio,
   y sale toda del campo `vendedor_id` que ya estaba cargado — antes se veía como 48 filas
   alfabéticas donde no se distinguía quién dependía de quién.
   Se arma recursivo, así que si mañana hay un nivel más no hay que tocar nada. */
// Arranca PLEGADO: con 48 clientes y 205 paneles, abrir todo de entrada es una pared de datos.
// Se ven los vendedores de arriba y se va abriendo lo que se quiere mirar.
let _cliCerradas = null;          // null = todavía no se tocó nada → todo plegado
function _cerradasIni(lista){
  if(_cliCerradas) return _cliCerradas;
  _cliCerradas = new Set(lista.filter(c=>lista.some(x=>x.vendedor_id===c.id)).map(c=>c.id));
  return _cliCerradas;
}
function cliFold(k){ _cliCerradas.has(k)?_cliCerradas.delete(k):_cliCerradas.add(k); VIEWS.clientes(); }
/** Plegar todo (deja solo los de arriba) o abrir todo. */
function cliFoldAll(lista){
  const conGente = lista.filter(c=>lista.some(x=>x.vendedor_id===c.id)).map(c=>c.id);
  if(_cliCerradas && _cliCerradas.size >= conGente.length){ _cliCerradas = new Set(); _cliAbiertos.clear(); }
  else { _cliCerradas = new Set(conGente); _cliAbiertos.clear(); }
  VIEWS.clientes();
}

function cliArbol(lista){
  const hijos={};    // vendedor_id → los que cuelgan de él
  lista.forEach(c=>{ const k=c.vendedor_id||'_raiz'; (hijos[k]=hijos[k]||[]).push(c); });
  const orden=(a,b)=> (b.es_vendedor?1:0)-(a.es_vendedor?1:0) || String(a.nombre||'').localeCompare(String(b.nombre||''));
  const nodo=(c,nivel)=>({
    cliente:c, nivel,
    subs:(hijos[c.id]||[]).sort(orden).map(x=>nodo(x,nivel+1)),
  });
  const raiz=(hijos._raiz||[]).sort(orden).map(c=>nodo(c,0));
  return raiz;
}
/** Cuántos cuelgan de este nodo, contando todos los niveles. */
function cliCuenta(n){ return n.subs.reduce((a,x)=>a+1+cliCuenta(x),0); }
/** La deuda del nodo más la de todo lo que cuelga. */
function cliDeuda(n){
  const p=Number((n.cliente.deuda&&n.cliente.deuda.total)||0);
  return n.subs.reduce((a,x)=>a+cliDeuda(x),p);
}

/* Pinta un nodo del árbol y todo lo que cuelga. La sangría dice el nivel; un vendedor con gente
   abajo se puede plegar entero. */
function cliFilas(n, prof=0){
  const c=n.cliente;
  const tienePaneles=_paneles.filter(p=>p.cliente_id===c.id).length;
  const ab=_cliAbiertos.has(c.id);
  const plegado=_cerradasIni(_clientes).has(c.id);
  const sangria=prof*22;
  const cuantos=cliCuenta(n);
  const deudaRama=cliDeuda(n);
  // ⚠️ Una fila puede desplegar DOS cosas distintas —su gente y sus paneles— y con una sola
  // flecha no se sabía cuál se estaba abriendo: con la lista plegada, tocar a Alexa cerraba su
  // rama y sus 13 paneles parecían haber desaparecido. Ahora cada cosa tiene su control:
  // la flecha del NOMBRE abre la rama, el NÚMERO de paneles abre los paneles.
  const flecha = n.subs.length
    ? `<span style="color:var(--gold);font-size:11px">${plegado?'▸':'▾'}</span>`
    : '<span style="opacity:.2">·</span>';
  const abrirRama = n.subs.length ? `cliFold('${c.id}')` : `togglePan('${c.id}')`;
  const fila=`<tr${c.es_vendedor?' class="cie-tv"':''}>
    <td style="white-space:nowrap;cursor:pointer;padding-left:${8+sangria}px" onclick="${abrirRama}"
        title="${n.subs.length?'ver quiénes cuelgan de acá':'ver sus paneles'}">
      ${flecha} ${_nom(c)}
      ${c.es_vendedor?`<span class="cie-tag">vendedor</span>`:''}
</td>
    <td><span class="badge ${c.estado==='activo'?'ok':'warn'}">${esc(c.estado||'')}</span></td>
    <td>${c.es_vendedor
      ? '<span class="muted" title="A un vendedor no le aplica un % base: paga el costo real de los proveedores que use">no aplica</span>'
      : (c.precio_base_pct!=null?esc(c.precio_base_pct)+'%':'<span class="badge warn">sin cargar</span>')}</td>
    <td class="muted">${cuantos?cuantos:'—'}</td>
    <td style="cursor:pointer" onclick="togglePan('${c.id}')" title="${tienePaneles?'ver sus paneles':'sin paneles'}">${
      tienePaneles?`<span style="color:var(--gold);font-size:10px">${ab?'▾':'▸'}</span> <b>${tienePaneles}</b>`:'<span class="muted">—</span>'}</td>
    <td class="right" title="consumo (fichas) + proveedores externos − pagos"><b>${money(c.deuda?c.deuda.total:0)}</b>${
      n.subs.length&&deudaRama!==Number((c.deuda&&c.deuda.total)||0)?`<div class="muted" style="font-size:10.5px;white-space:nowrap">con su gente ${money(deudaRama,0)}</div>`:''}</td>
    <td class="right" style="white-space:nowrap"><button class="outline small" onclick="abrirCliente('${c.id}','resumen')">Abrir ficha</button> <button class="danger small" onclick="borrarCliente('${c.id}','${esc(c.codigo)}')">🗑</button></td>
  </tr>
  <tr id="pan-${c.id}" class="sub" ${ab?'':'style="display:none"'}><td colspan="7" style="padding-left:${18+sangria}px">${bloquePaneles(c)}</td></tr>`;
  return fila + (plegado ? '' : n.subs.map(x=>cliFilas(x, prof+1)).join(''));
}

VIEWS.clientes = async () => {
  const main = document.getElementById('main');

/* Guarda las divisas de un panel. Vinieron del casino al linkearlo —son las HABILITADAS, no las
   que mueve— y nadie las volvió a tocar: hay paneles con 25 monedas que operan en una sola. Cada
   una de más es una consulta de más en la Foto del mes y una alerta de "moneda sin tipo de cambio". */
/* Saca o mete un panel en la Foto del mes. No borra nada de lo ya sacado: sólo cambia qué se le
   va a pedir al casino la próxima vez. Un panel afuera de la Foto sigue teniendo reporte — se le
   pregunta en vivo, que es más lento y puede fallar, igual que un mes sin foto. */
async function setEnFoto(id, v){
  const r=await api('/api/os/paneles/'+id,{method:'PUT',body:JSON.stringify({en_foto:!!v})});
  if(r&&r.ok) _paneles=(await api('/api/os/paneles')).paneles||_paneles;
  VIEWS.clientes();
}
async function setDivisas(id, v){
  const limpio=[...new Set(String(v||'').toUpperCase().split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean))];
  if(!limpio.length && !confirm('¿Dejar el panel SIN ninguna divisa?\n\nNo se le va a poder pedir nada ni va a entrar en la Foto del mes.')) return VIEWS.clientes();
  const r=await api('/api/os/paneles/'+id,{method:'PUT',body:JSON.stringify({divisas:limpio.join(',')})});
  if(r.ok){ _paneles=(await api('/api/os/paneles')).paneles||_paneles; renderClientes&&0; }
  VIEWS.clientes();
}
/* Lee del casino, panel por panel, qué divisas tiene HABILITADAS y lo cruza con lo guardado.
   Va de a tandas: es un pedido HTTP por panel y son 200 — de una sola vez se come los 5 minutos
   que aguanta el proxy y se corta sin decir dónde quedó. Cada tanda deja el avance en pantalla. */
async function divisasCasino(conexion_id, panel_id){
  const caja=document.getElementById('div-cruce'); if(!caja) return;
  const filas=[]; let desde=0, total=null;
  caja.style.display='block';
  for(;;){
    caja.innerHTML='<b>Leyendo del casino…</b> '+(total==null?'':desde+' de '+total)
      +'<div class="muted" style="font-size:11px">Se puede cerrar esta pantalla, no se pierde nada: sólo lee.</div>';
    let r;
    try{ r=await api('/api/os/paneles/divisas/casino',{method:'POST',
      body:JSON.stringify({conexion_id,panel_id,desde,limite:20})}); }
    catch(e){ caja.innerHTML='<b class="badge err">Se cortó</b> '+esc(e.message)
      +'<div class="muted">Lo leído hasta acá vale; volvé a darle y sigue.</div>'; break; }
    if(!r||!r.ok){ caja.innerHTML='<b class="badge err">Error</b> '+esc((r&&r.error)||'sin respuesta'); break; }
    total=r.total; filas.push(...(r.paneles||[])); desde+=r.devueltos;
    if(!r.hay_mas) break;
  }
  if(!filas.length) return;
  const err=filas.filter(x=>x.error);
  const mueven=filas.filter(x=>!x.error&&x.faltanYMueven&&x.faltanYMueven.length);
  const faltan=filas.filter(x=>!x.error&&x.faltan.length&&!(x.faltanYMueven||[]).length);
  const sobran=filas.filter(x=>!x.error&&x.sobran.length);
  const linea=(x,campo)=>`<tr><td><b>${esc(x.nombre)}</b> <span class="muted">nodo ${esc(x.nodo)}</span></td>
     <td><code>${esc(x[campo].join(','))}</code></td>
     <td class="muted" style="font-size:11px">habilitadas: ${esc(x.habilitadas.join(','))}<br>
       guardadas: ${esc(x.guardadas.join(',')||'—')} · movió: ${esc(x.usadas.join(',')||'sin datos')}</td>
     <td><button class="small" onclick="setDivisas('${x.panel_id}','${esc(x.habilitadas.join(','))}')">poner las del casino</button></td></tr>`;
  caja.innerHTML=`<h3 style="margin:0 0 4px">Cruce con el casino <span class="muted" style="font-weight:400">${filas.length} paneles</span></h3>
    ${mueven.length?`<div class="nota err" style="margin:8px 0"><b>⚠️ ${mueven.length} paneles mueven una divisa que el OS no tiene en la lista.</b>
      Es lo único de acá que puede estar costando plata: el panel factura en esa moneda y el OS no la sabe.</div>
      <table><tbody>${mueven.map(x=>linea(x,'faltanYMueven')).join('')}</tbody></table>`:''}
    ${faltan.length?`<h4 style="margin:14px 0 2px">Habilitadas en el casino y no guardadas <span class="muted">(${faltan.length}) — todavía sin movimiento</span></h4>
      <table><tbody>${faltan.map(x=>linea(x,'faltan')).join('')}</tbody></table>`:''}
    ${sobran.length?`<h4 style="margin:14px 0 2px">Guardadas que el casino no tiene habilitadas <span class="muted">(${sobran.length}) — se pueden sacar</span></h4>
      <table><tbody>${sobran.map(x=>linea(x,'sobran')).join('')}</tbody></table>`:''}
    ${err.length?`<h4 style="margin:14px 0 2px">No se pudieron leer <span class="muted">(${err.length})</span></h4>
      <div class="muted" style="font-size:11px">${err.slice(0,20).map(x=>esc(x.nombre)+': '+esc(x.error)).join('<br>')}</div>`:''}
    ${!mueven.length&&!faltan.length&&!sobran.length&&!err.length?'<div class="badge ok">Todo coincide.</div>':''}`;
}

function togglePan(id){
  const tr=document.getElementById('pan-'+id); if(!tr) return;
  const abierto = tr.style.display!=='none';
  tr.style.display = abierto?'none':'';
  const car=document.getElementById('car-'+id); if(car) car.textContent = abierto?'▸':'▾';
  if(abierto) _cliAbiertos.delete(id); else _cliAbiertos.add(id);
}
function togglePanTodos(){
  const abrir = _cliAbiertos.size < _clientes.length;
  _clientes.forEach(c=>{
    const tr=document.getElementById('pan-'+c.id); if(!tr) return;
    tr.style.display = abrir?'':'none';
    const car=document.getElementById('car-'+c.id); if(car) car.textContent = abrir?'▾':'▸';
    if(abrir) _cliAbiertos.add(c.id); else _cliAbiertos.delete(c.id);
  });
}
async function moverPanel(id, cliente_id){
  if(!cliente_id) return;
  const r=await api('/api/os/paneles/'+id,{method:'PUT',body:JSON.stringify({cliente_id})});
  if(r.ok){ toast('Panel asignado'); VIEWS.clientes(); }
}
async function nuevoCliente(){
  const codigo=val('nc-cod'); if(!codigo) return toast('Poné un código');
  const r=await api('/api/os/clientes',{method:'POST',body:JSON.stringify({codigo, nombre:val('nc-nom')})});
  if(r.ok){ toast('Cliente creado: '+(r.cliente&&r.cliente.codigo||codigo)); VIEWS.clientes(); }
}
async function borrarCliente(id, codigo){
  if(!confirm('¿Borrar el cliente "'+codigo+'"?\n\nEsto borra TAMBIÉN sus plataformas/paneles, % de proveedores, participaciones y movimientos. No se puede deshacer.')) return;
  const r=await api('/api/os/clientes/'+id,{method:'DELETE'});
  if(r.ok){ toast('Cliente borrado'); VIEWS.clientes(); }
}

  document.getElementById('main').innerHTML = `

let _platInact=false; // asignador: incluir inactivos (server-side ?activos=0). Default false = solo activos.
function toggleInact(c){ _platInact=c; const st=window._accState; if(st) loadAccts(st.id); }
async function loadAccts(id){
  const cx = val('plat-cx'); if(!cx) return toast('Elegí una conexión');
  const box = document.getElementById('plat-list'); box.innerHTML='⏳ trayendo cuentas… la 1ra vez puede tardar ~20-30s si la cuenta ve muchas (después es instantáneo)';
  const pr = await api('/api/os/paneles?cliente_id='+id);
  const panels = (pr.paneles||[]).filter(p=>p.conexion_id===cx && p.id_usuario);
  const r = await api('/api/os/casino/conexiones/'+cx+'/nodos-nivel?activos='+(_platInact?'0':'1')); // solo activos (server-side) salvo que se pidan inactivos
  if(!r.ok){ box.innerHTML='<span class="badge err">No se pudieron traer las cuentas (¿conexión OK?)</span>'; return; }
  window._accState = { cx, id, panels, sel: new Set(panels.map(p=>String(p.id_usuario))), nodeById:{}, niveles:r.niveles||{}, nivel:r.nivel, current:[], truncado:false };
  _mergeNivel(r);
  const niveles = Object.keys(r.niveles||{}).sort((a,b)=>r.niveles[a]-r.niveles[b]); // el nivel más alto (menos nodos) primero
  box.innerHTML = `
    <div class="row" style="align-items:flex-end; margin-bottom:6px">
      <div style="flex:0"><label>Nivel</label><select id="acc-niv" onchange="changeNivel()">${niveles.map(k=>`<option value="${esc(k)}" ${k===r.nivel?'selected':''}>${esc(k)} (${r.niveles[k]})</option>`).join('')}</select></div>
      <div><label>Buscar (login)</label><input id="acc-q" oninput="renderAccts()" placeholder="filtrar por login…"/></div>
      <div style="flex:0"><label style="display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer"><input type="checkbox" id="acc-inact" ${_platInact?'checked':''} onchange="toggleInact(this.checked)"/> incluir inactivos</label></div>
      <div style="flex:0"><button onclick="saveAccts()">💾 Guardar selección</button></div>
    </div>
    <div id="acc-rows"></div>`;
  renderAccts();
}
function _mergeNivel(r){ const st=window._accState; if(!st)return; (r.nodos||[]).forEach(n=>{ st.nodeById[String(n.id)]=n; }); st.current=r.nodos||[]; st.nivel=r.nivel; st.truncado=!!r.truncado; }
async function changeNivel(){
  const st=window._accState; if(!st)return; const niv=val('acc-niv');
  const rows=document.getElementById('acc-rows'); rows.innerHTML='⏳ cargando nivel…';
  const r=await api('/api/os/casino/conexiones/'+st.cx+'/nodos-nivel?activos='+(_platInact?'0':'1')+'&nivel='+encodeURIComponent(niv));
  if(r.ok){ _mergeNivel(r); renderAccts(); } else rows.innerHTML='<span class="badge err">error trayendo el nivel</span>';
}
function renderAccts(){
  const st = window._accState; if(!st) return;
  const q = (val('acc-q')||'').toLowerCase();
  let list = st.current||[];
  if(q) list = list.filter(n=>String(n.login).toLowerCase().includes(q));
  list.sort((a,b)=>String(a.login).localeCompare(String(b.login)));
  const CAP=400, shown=list.slice(0,CAP);
  document.getElementById('acc-rows').innerHTML = `
    <div class="muted" style="margin-bottom:4px">${list.length} cuentas en "${esc(st.nivel)}"${(st.truncado||list.length>CAP)?(' · muestro hasta '+CAP+', refiná con el buscador'):''} · seleccionadas (todos los niveles): ${st.sel.size}</div>
    <table><thead><tr><th></th><th>Cuenta</th><th>ID</th><th class="right">IN (ARS)</th><th class="right">Profit</th></tr></thead><tbody>
    ${shown.map(n=>`<tr>
      <td><input type="checkbox" class="acc-chk" onchange="toggleAcct('${esc(String(n.id))}',this.checked)" ${st.sel.has(String(n.id))?'checked':''}/></td>
      <td><b>${esc(n.login)}</b></td><td><span class="pill">${esc(n.id)}</span></td>
      <td class="right">${money(n.in,0)}</td><td class="right">${money(n.profit,0)}</td>
    </tr>`).join('')||'<tr><td colspan="5" class="empty">No hay cuentas en este nivel/búsqueda.</td></tr>'}
    </tbody></table>`;
}
function toggleAcct(nodeId, checked){ const st=window._accState; if(!st)return; if(checked) st.sel.add(String(nodeId)); else st.sel.delete(String(nodeId)); }
async function saveAccts(){
  const st = window._accState; if(!st) return;
  const cxName = (window._platCxs||[]).find(c=>c.id===st.cx); const sistema = cxName?cxName.nombre:'';
  const origIds = new Set(st.panels.map(p=>String(p.id_usuario)));
  const toCreate = [...st.sel].filter(idd=>!origIds.has(idd));
  const toDelete = st.panels.filter(p=>!st.sel.has(String(p.id_usuario)));
  let creados=0, borrados=0;
  for(const idd of toCreate){ const n=st.nodeById[idd]; if(!n)continue;
    await api('/api/os/paneles',{method:'POST',body:JSON.stringify({cliente_id:st.id, nombre:n.login, sistema, nivel_usuario:(n.nivel||''), tipo:'exclusivo', id_usuario:n.id, conexion_id:st.cx, divisas:'ARS'})}); creados++;
  }
  if(toDelete.length){ if(confirm('Vas a DESVINCULAR '+toDelete.length+' cuenta(s) de este cliente (se borran esos paneles). ¿Seguir?')){
    for(const p of toDelete){ await api('/api/os/paneles/'+p.id,{method:'DELETE'}); borrados++; }
  }}
  toast('Cuentas: +'+creados+(borrados?(' / -'+borrados):'')); loadAccts(st.id);
}

async function fotoModos(){

    // ninguna otra. Poner un botón en las tres invitaría a apretar la que el server va a rechazar.
    const clave = c.nivel==='general' ? 'nodo' : c.nivel;
    document.querySelectorAll('tr.vta[data-cx="'+c.id+'"]').forEach(tr=>{

  });
}

  if(!cxs.length){ cont.innerHTML='<div class="nota err">No hay conexiones para sacar.</div>'; return; }

      if(!r||!r.ok){

        lineas.push('<span style="color:var(--red)">✖ '+esc(cx.nombre)+': '+esc((r&&r.error)||'no respondió')+'</span>');

      }
      if(desde===0) lineas.push('<b>'+esc(cx.nombre)+'</b> — el casino está agrupando por <b>'+esc(r.nivel)+'</b>');
      (r.divisas||[]).forEach(d=>{
        if(d.ok){ ok++; filas+=d.filasGuardadas||0; ceros+=d.panelesEnCero||0;
          if(d.filasGuardadas||d.panelesEnCero) lineas.push('&nbsp;&nbsp;'+esc(d.divisa)+' · '+d.segundos+'s · '
            +(d.filasGuardadas||0)+' filas'+(d.panelesEnCero?' · '+d.panelesEnCero+' en cero':'')); }
        else { errores++; lineas.push('&nbsp;&nbsp;<span style="color:var(--red)">'+esc(d.divisa)+' ✖ '+esc(String(d.detalle||d.error).slice(0,70))+'</span>'); }
      });
      pintar('Sacando '+cx.nombre+'…');
      desde+=r.devueltos;
      if(!r.hay_mas) break;
    }
  }
  pintar(errores?'Terminado con errores':'Listo');
  VIEWS.foto&&VIEWS.foto();
}

   no dan, hay un error de cálculo y no de datos. Va arriba de todo y no escondido, porque es lo

function pagoCuadre(r){
  const c=r.cuadre; if(!c) return '';

// ───────── TIPOS DE CAMBIO ─────────
let _tcMes = new Date().toISOString().slice(0,7);
/* ─────────────────────────────────────────────────────────────────────────────────────────
   TIPOS DE CAMBIO. Un solo número por moneda y por mes divide TODO lo que se cobra, así que
   la pantalla está ordenada por de dónde sale ese número:
     1. el que se está usando este mes (todas las monedas, con su fuente)
     2. la grilla moneda × mes, que es la que manda
     3. lo que se está juntando ahora, que es lo que va a formar la próxima columna
     4. el cierre mensual: promedio del mes contra el TC que factura el proveedor
   ARS_OF no es una moneda: es el ARS que factura el PROVEEDOR. Es la misma casilla que

  const prom = (await api('/api/os/tc/divisas/promedios?mes='+encodeURIComponent(_tcMes))).promedios||[];
  const seg = await api('/api/os/tc/divisas/seguidas');
  const PROV='ARS_OF';

  // Las columnas se ordenan por el mes que representan, no como salieron de la base: mezcladas
  // (Enero_26 después de Julio_2026) no hay forma de leer la grilla.

      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${(rows.length?rows:[uso.ars].filter(Boolean)).map(x=>`

            <div class="muted" style="font-size:10px">${esc((x.fuente||'').replace('cargado a mano en el cierre','a mano').replace('promedio automático del mes','promedio'))}</div>
          </div>`).join('')}
      </div>
      ${disc.length?('<div class="nota warn"><b style="color:var(--gold)">⚠ '+disc.length+' moneda(s) donde las fuentes NO coinciden</b><table style="margin-top:6px"><thead><tr><th>Moneda</th><th class="right">Se usa</th><th>De dónde sale</th><th>Las otras fuentes dicen</th></tr></thead><tbody>'+disc.map(x=>'<tr><td><b>'+esc(x.divisa)+'</b></td><td class="right">'+money(x.valor,4)+'</td><td class="muted">'+esc(x.fuente)+'</td><td class="muted">'+x.conflicto.map(c=>esc(c.fuente)+' = '+money(c.valor,4)+' <span style="color:var(--gold)">('+c.difPct+'%)</span>').join(' · ')+'</td></tr>').join('')+'</tbody></table><div class="muted" style="margin-top:6px">Corregí el que esté mal en la grilla: si el cargado a mano está bien, ignorá el aviso.</div></div>'):'<div class="muted" style="margin-top:10px">✅ Las fuentes coinciden en todas las monedas de este mes.</div>'}
    </div>

    <div class="card"><h2>Moneda × mes</h2>
      <div class="muted">Es la que <b>manda</b>: la ganancia de cada proveedor se convierte con la tasa de su moneda en ese mes.
        Se guarda sola al salir de la casilla. <b>${filas.length}</b> monedas × <b>${mesesCie.length}</b> meses.
        La fila <b>ARS_OF</b> es el ARS que factura el <b>proveedor</b> — es la misma casilla que "TC Proveedor" de abajo.</div>
      <div class="row" style="margin-top:10px;align-items:flex-end;gap:10px;flex-wrap:wrap">
        <div style="flex:0"><label>➕ Mes</label><input id="cie-nmes" placeholder="ej: Junio_2026" style="width:150px"></div>
        <div style="flex:0"><button class="small" onclick="cieAddMes()">Columna</button></div>
        <div style="flex:0"><label>➕ Moneda</label><input id="cie-nmon" placeholder="ej: ARS" style="width:110px"></div>

        <div style="flex:1"></div>

      </div>
      <div style="overflow:auto;max-height:52vh;margin-top:10px">
        ${filas.length? `<table class="ciet"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` : '<div class="empty">Sin tipos de cambio. Agregá una moneda y un mes, o importá la planilla.</div>'}
      </div>
    </div>

    <div class="card"><h2>Lo que se está juntando en ${esc(_tcMes)}</h2>
      <div class="muted">Todos los días se guarda la cotización de cada moneda. Cuando el mes termina, este promedio
        se escribe solo como columna nueva de la grilla — sin pisar nada que hayas cargado a mano.
        <br>Se siguen <b>solo las monedas que están como fila en la grilla de arriba</b> (la fuente publica ~160 y no sirven):
        <span class="muted" style="font-size:11px">${(seg.monedas||[]).join(' · ')}</span>. Agregá una fila y al otro día ya se le junta la cotización.</div>
      <div class="row" style="margin:10px 0 6px">
        <button class="outline small" onclick="snapNow()">📸 Guardar ARS ahora</button>
        <button class="outline small" onclick="snapDivisas()">📸 Guardar el resto ahora</button>
        <button class="outline small" onclick="tcAhora()">Ver ARS al instante</button>
        <div id="tc-now" class="muted" style="align-self:center"></div>
      </div>
      <table><thead><tr><th>Moneda</th><th class="right">Días juntados</th><th class="right">Promedio del mes</th><th>Ya está en la grilla</th></tr></thead><tbody>
      ${prom.map(p=>{
        const lbl=tcLabel(_tcMes); const yaVal=(tasas[p.divisa]||{})[lbl];
        return `<tr><td><b>${esc(p.divisa)}</b>${p.fuente?' <span class="muted" style="font-size:10px">'+esc(p.fuente)+'</span>':''}</td>
          <td class="right">${p.dias||0}</td><td class="right">${p.promedio?money(p.promedio,4):'—'}</td>
          <td>${yaVal!=null?'<span class="badge ok">'+esc(yaVal)+'</span>':'<span class="muted">todavía no</span>'}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">Sin cotizaciones guardadas este mes.</td></tr>'}
      </tbody></table>
    </div>

    <div class="card"><h2>Cierre mensual: promedio contra el TC del proveedor</h2>
      <div class="muted">El <b>TC Cliente</b> es el promedio del mes (Binance/criptoya) y es con el que se le cobra a los clientes.
        El <b>TC Proveedor</b> sale de la factura del proveedor y es el mismo dato que la fila <b>ARS_OF</b> de la grilla: se escribe una vez y queda en los dos lados.</div>
      <table style="margin-top:8px"><thead><tr><th>Mes</th><th class="right">TC Cliente (promedio)</th><th class="right">TC Proveedor (ARS_OF)</th><th class="right">Diferencia</th><th></th></tr></thead><tbody>
      ${meses.map(m=>{
        const lbl=tcLabel(m.mes); const of=(tasas[PROV]||{})[lbl];
        const cruce = (of!=null && m.tc_proveedor_ext && String(of)!==String(m.tc_proveedor_ext));
        return `<tr><td><b>${esc(m.mes)}</b> <span class="muted">${esc(lbl)}</span></td>
          <td class="right">${m.tc_cliente?money(m.tc_cliente,2):'—'}</td>

          <td class="right ${m.diferencia_tc&&Number(m.diferencia_tc)<0?'':''}">${m.diferencia_tc?money(m.diferencia_tc,2):'—'}</td>
          <td>${m.tc_proveedor_ext?(cruce?'<span class="badge err">la grilla dice '+esc(of)+'</span>':''):'<button class="small" onclick="setTcProv(\''+m.mes+'\')">Guardar</button>'}</td></tr>`;
      }).join('') || '<tr><td colspan="5" class="empty">Sin meses todavía.</td></tr>'}
      </tbody></table>
    </div>`;
};
const TC_MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
/** '2026-07' → 'Julio_2026' (así se llaman las columnas de la grilla) */
function tcLabel(iso){ const [y,m]=String(iso||'').split('-'); return TC_MESES_ES[Number(m)-1]?TC_MESES_ES[Number(m)-1]+'_'+y:String(iso); }
/** 'Julio_2026' / 'JULIO_26' → '2026-07'. Sirve para ordenar las columnas por fecha. */
function tcISO(lbl){ const m=/^\s*([A-Za-zÁ-ú]+)[_\s-]+(\d{2}|\d{4})\s*$/.exec(String(lbl||'')); if(!m)return null;
  const i=TC_MESES_ES.findIndex(x=>x.toLowerCase()===m[1].toLowerCase()); if(i<0)return null;
  return (m[2].length===2?'20'+m[2]:m[2])+'-'+String(i+1).padStart(2,'0'); }

// ───────── REPARTO (split empresa/LATAM/socios) ─────────
/* ═══════════ 💰 REPARTO ═══════════════════════════════════════════════════════════════
   Una sola pantalla para una sola pregunta: cómo se divide lo que paga cada cliente.

   Antes estaba en cuatro lugares — Reparto arriba mostraba el resultado, y adentro de Config
   vivían Socios, Participaciones y la Tabla Split. Eran cuatro porque el cálculo iba en dos
   pasos (Split partía el fee en Empresa/LATAM, Participaciones repartía LATAM entre socios).
   Ahora el cálculo es de UN paso (§12) y la pantalla lo acompaña: el catálogo, la configuración
   por cliente y el resultado del mes son tres vistas de lo mismo. */
const REP = {};
const REP_SUBS = [['mes','📊 Resultado del mes'],['clientes','👥 Reparto por cliente'],['participantes','🤝 Participantes']];

VIEWS.reparto = () => {

    `</div></div><div id="rep-body"><div class="card"><div class="empty">Cargando…</div></div></div>`;
  (REP[_repSub]||REP.mes)();
};
function repSub(s){ _repSub=s; VIEWS.reparto(); }

/* ── Resultado del mes ─────────────────────────────────────────────────────────────── */
REP.mes = async () => {

async function repCargarCli(){
  _repCli = val('rp-cli'); const mes = val('rp-mes');
  if(!_repCli) return;
  const r = await api('/api/os/reparto/'+_repCli+'?mes='+mes);
  const rep = r.reparto||{};
  const box = document.getElementById('rp-box');
  if(rep.base==null||rep.base===''){
    box.innerHTML = `<div class="badge err">Sin % base</div> <span class="muted">Este cliente no tiene % base cargado para ${esc(mes)}. Sin eso no hay contra qué cerrar el reparto — se carga en su ficha (Clientes → ✎).</span>`;
    return;
  }
  const vig = rep.items||[];
  box.innerHTML = `
    <div class="muted" style="margin-bottom:8px">Base de <b>${esc(mes)}</b>: <b style="color:var(--gold)">${esc(rep.base)}%</b> — el reparto tiene que sumar eso.</div>
    ${_personas.map(p=>{
      const cur = vig.find(v=>v.persona_id===p.id);
      return `<div class="row" style="align-items:center;gap:8px">
        <div style="flex:1">${p.es_empresa?'🏢 ':''}${esc(p.nombre)}</div>
        <div style="flex:0;width:120px"><input id="part-${p.id}" type="number" step="0.01" value="${cur?esc(cur.pct):''}" placeholder="0" oninput="sumaParts()"/></div>
        <div style="flex:0">%</div></div>`;
    }).join('') || '<div class="empty">No hay participantes cargados — agregalos en la solapa Participantes.</div>'}
    <div class="row" style="margin-top:10px;align-items:center">
      <div style="flex:1">Suma: <b id="pa-suma">0</b>% de <b>${esc(rep.base)}%</b> <span id="pa-resto" class="muted"></span></div>
      <button class="outline small" onclick="saveParts(true)">Guardar incompleto</button>
      <button onclick="saveParts(false)">💾 Guardar reparto</button>
    </div>`;
  window._repBase = rep.base;
  sumaParts();
}
function sumaParts(){
  let s=0; _personas.forEach(p=>{ const el=document.getElementById('part-'+p.id); if(el&&el.value) s+=Number(el.value); });
  s = Math.round(s*10000)/10000;
  const base = Number(window._repBase||0);
  const el=document.getElementById('pa-suma'); if(!el) return;
  el.textContent = s;
  el.style.color = s===base ? 'var(--green)' : (s>base ? 'var(--red)' : 'var(--gold)');
  const r=document.getElementById('pa-resto');
  if(r){
    const dif = Math.round((base-s)*10000)/10000;
    r.textContent = dif===0 ? '· cierra ✓' : (dif>0 ? '· faltan '+dif+' puntos por asignar' : '· se pasa '+(-dif)+' puntos');
    r.style.color = dif<0 ? 'var(--red)' : 'var(--muted)';
  }
}
async function saveParts(parcial){
  const items = _personas.map(p=>({persona_id:p.id, porcentaje:val('part-'+p.id)||'0'})).filter(i=>Number(i.porcentaje)>0);
  const r = await api('/api/os/participaciones',{method:'POST',body:JSON.stringify({
    cliente_id: val('rp-cli'), mes: val('rp-mes'), parcial: !!parcial,
    items, vigente_desde: val('rp-desde')||undefined })});
  if(r.ok){ toast(Number(r.resto)===0?'Reparto guardado ✓':'Guardado — faltan '+r.resto+' puntos'); repCargarCli(); }
}

/* La tabla, ORGANIZADA POR VENDEDOR — el mismo criterio que la pantalla de Clientes.
   Cada vendedor primero, y debajo su gente. El que no carga grupo propio HEREDA el del vendedor:
   así se carga uno solo y le sirve a los 14 clientes de Henry, en vez de pegar el mismo id 14 veces.
   La herencia se resuelve también en el servidor (telegram-destino.js), no sólo acá: si sólo se
   dibujara, la pantalla diría que llega y el mensaje se perdería. */
function tgGrupos(cs, pans){
  // ⚠️ Un vendedor puede colgar de OTRO vendedor: GanamosSarah y Julian son vendedores y a la vez
  // gente de Alexa. Recorriendo "todos los vendedores" arriba y además sus hijos, esos dos salían
  // DOS VECES. Se recorre el árbol como en la pantalla de Clientes: la raíz son los que no cuelgan
  // de nadie, y cada uno dibuja a los suyos hacia abajo. Cada cliente aparece exactamente una vez.
  const deVend = {}; cs.forEach(c=>{ if(c.vendedor_id && c.vendedor_id!==c.id) (deVend[c.vendedor_id]=deVend[c.vendedor_id]||[]).push(c); });
  const porNombre=(a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
  const raiz = cs.filter(c=>!c.vendedor_id || c.vendedor_id===c.id).sort(porNombre);
  const fila=(c, jefe, prof)=>{
    const t=c.telegram||{}; const np=pans.filter(p=>p.cliente_id===c.id).length;
    const propio=(t.chatId||'').trim();
    const hered=!propio && jefe && ((jefe.telegram||{}).chatId||'').trim();
    return `<tr${c.es_vendedor?' class="cie-tv"':''}>
      <td style="padding-left:${8+prof*22}px">${prof?'<span class="muted">└ </span>':''}${_nom(c)}
        ${c.es_vendedor?'<span class="cie-tag">vendedor</span>':''}
        ${np?`<span class="muted" style="font-size:11px">· ${np} panel${np===1?'':'es'}</span>`:''}</td>
      <td><input id="tgc-${c.id}" value="${esc(propio)}"
        placeholder="${hered?'hereda de '+esc(jefe.nombre||jefe.codigo):'-1001234567890'}"
        onchange="tgFila('${c.id}')" title="${hered?'Vacío = le llega al grupo de '+esc(jefe.nombre||jefe.codigo)+'. Escribí uno acá sólo si este cliente tiene grupo propio.':''}"
        style="width:190px;font-family:monospace;font-size:12px${hered?';background:rgba(46,160,67,.10)':''}">
        ${hered?'<span class="badge ok" style="margin-left:5px">hereda</span>':''}
        ${!propio&&!hered?'<span class="badge err" style="margin-left:5px">no le llega</span>':''}</td>
      <td><label style="text-transform:none;display:flex;align-items:center;gap:6px;margin:0;cursor:pointer">
        <input type="checkbox" id="tge-${c.id}" ${t.enabled?'checked':''} onchange="tgFila('${c.id}')" style="width:auto">
        avisar cada carga</label></td>
      <td class="right" style="white-space:nowrap">
        ${(propio||hered)?`<button class="outline small" onclick="tgProbar('${c.id}','${esc(String(c.nombre||c.codigo)).replace(/'/g,"\\'")}')">🔔 Probar</button>`:''}
        <button class="outline small" onclick="abrirCliente('${c.id}','comercial')">Ficha</button></td></tr>`;
  };
  // Baja por el árbol. `vistos` corta cualquier ciclo en los datos (A vendedor de B y B de A):
  // sin eso una rama circular colgaría el navegador en vez de mostrar la pantalla.
  const vistos=new Set();
  const rama=(c, jefe, prof)=>{
    if(vistos.has(c.id)) return '';
    vistos.add(c.id);
    return fila(c,jefe,prof) + (deVend[c.id]||[]).sort(porNombre).map(h=>rama(h,c,prof+1)).join('');
  };
  let html=raiz.map(c=>rama(c,null,0)).join('');
  // Los que quedaron fuera del árbol: su vendedor no existe o hay un ciclo. Se muestran igual —
  // desaparecer de la lista sería peor que salir raro.
  const sueltos=cs.filter(c=>!vistos.has(c.id)).sort(porNombre);
  if(sueltos.length){
    html+=`<tr><td colspan="4" class="muted" style="padding-top:14px"><b>Sin vendedor válido</b> — no pueden heredar de nadie</td></tr>`;
    html+=sueltos.map(c=>fila(c,null,0)).join('');
  }
  return html||'<tr><td colspan="4" class="empty">Sin clientes.</td></tr>';
}
/* Guarda una fila al salir del campo. Es el MISMO endpoint que usa la ficha del cliente, así que
   no son dos configuraciones: es un atajo de carga sobre el mismo dato. */
async function tgFila(id){
  const chatId=val('tgc-'+id), enabled=document.getElementById('tge-'+id).checked;
  const r=await api('/api/clientes/'+id+'/telegram',{method:'PUT',body:JSON.stringify({chatId,enabled})});
  const inp=document.getElementById('tgc-'+id);
  if(!r.ok) return;
  inp.classList.add('cie-ok'); setTimeout(()=>inp.classList.remove('cie-ok'),350);
  // Si el que cambió es un VENDEDOR, el "hereda" de toda su gente cambia con él: hay que repintar.
  const cs=((await api('/api/os/clientes')).clientes||[]);
  if((cs.find(c=>c.id===id)||{}).es_vendedor) setTimeout(()=>CFG.telegram(),400);
}
/* Pegar de a muchos. Reconoce por nombre, por código y por los "otros nombres" del cliente, sin
   acentos ni mayúsculas, porque de una planilla nunca vienen escritos igual. */
async function tgPegar(){
  const txt=(document.getElementById('tg-pegar').value||'').trim();
  const out=document.getElementById('tg-pegar-res');
  if(!txt) return out.innerHTML='';
  const cs=((await api('/api/os/clientes')).clientes||[]).filter(c=>!c.es_vendedor);
  const K=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const ix={};
  cs.forEach(c=>{ [c.nombre,c.codigo,...(c.alias||[])].filter(Boolean).forEach(n=>{ if(K(n)) ix[K(n)]=c; }); });
  const ok=[], no=[];
  for(const linea of txt.split(/\n+/)){
    const l=linea.trim(); if(!l) continue;
    const m=l.match(/(-?\d{6,})\s*$/);                       // el chatId es lo último de la línea
    if(!m){ no.push(l+'  (no encontré un chatId)'); continue; }
    const chatId=m[1], nombre=l.slice(0,m.index).trim().replace(/[,;\t]+$/,'');
    const c=ix[K(nombre)];
    if(!c){ no.push(l+'  (no reconozco "'+nombre+'")'); continue; }
    const r=await api('/api/clientes/'+c.id+'/telegram',{method:'PUT',
      body:JSON.stringify({chatId, enabled:!!(c.telegram||{}).enabled})});
    (r.ok?ok:no).push((r.ok?'':'no se guardó: ')+(c.nombre||c.codigo)+' → '+chatId);
  }
  out.innerHTML=`${ok.length?`<div class="nota ok"><span class="tit">${ok.length} cargado(s)</span>${ok.map(esc).join('<br>')}</div>`:''}
    ${no.length?`<div class="nota err"><span class="tit">${no.length} sin cargar</span>${no.map(esc).join('<br>')}</div>`:''}`;
  if(ok.length){ document.getElementById('tg-pegar').value=no.length?no.join('\n'):''; setTimeout(()=>CFG.telegram(),1200); }
}

     VERIFICADO → salió de un mes ya facturado. Se cobró así.
     sin verificar → salió de la tabla de precios, que está desactualizada.
   Facturar con uno o con el otro es la diferencia entre cobrar lo pactado y cobrar lo que
   alguien anotó alguna vez. */

API.matriz = async () => {
  const m=await api('/api/os/api/matriz');
  const cs=(m.clientes||[]).filter(c=>c.activo);
  // Alfabético por el nombre corto, que es el que se lee. Antes venían en el orden en que se
  // cargaron, que no significa nada y obliga a barrer las 40 filas para encontrar una.
  const sellos=(m.sellos||[]).filter(x=>x.grupo_id)
    .sort((a,b)=>String(a.corto||a.nombre).localeCompare(String(b.corto||b.nombre),'es',{sensitivity:'base'}));
  // Los de costo 0, 0,5 o 1 son casi todo margen: son los que conviene tener a la vista.
  const barato=(x)=>x.costo!=null && Number(x.costo)<=1;
  const nBaratos=sellos.filter(barato).length;
  const cel=m.celdas||{};
  let ver=0,pla=0,vac=0;
  const fila=(x)=>{
    const tds=cs.map(c=>{
      // CADA CELDA ES EDITABLE. Antes era texto: los precios sólo entraban por importación, y una
      // corrección puntual —como la de SA Gaming— obligaba a tocar la base. Se guarda al salir del
      // campo; vaciarlo BORRA el precio (ese cliente deja de pagar ese sello).
      const d=(cel[c.id]||{})[x.nombre];
      const val = (d && d.pct_cliente!=null) ? d.pct_cliente : '';
      if(val==='') vac++; else { d.origen==='verificado'?ver++:pla++; }
      const est = val==='' ? ''
        : (d.origen==='verificado' ? 'background:rgba(0,160,70,.16)' : 'background:rgba(210,160,0,.16)');
      const tit = val===''
        ? `${c.login} · ${esc(x.corto)}\nsin precio: no se le cobra. Escribí un % para cobrárselo.`
        : `${c.login} · ${esc(x.corto)}\ncliente ${d.pct_cliente}% · proveedor ${d.pct_proveedor||0}% · el sello cuesta ${x.costo==null?'—':x.costo}%\n`
          + (d.origen==='verificado'?'VERIFICADO: salió de un mes ya facturado':'sin verificar: salió de la tabla de precios')
          + (d.nota?`\nnota: ${esc(d.nota)}`:'') + '\n\nVaciar el campo borra el precio.';
      return `<td style="${est}"><input value="${esc(val)}" title="${tit}"
        data-cli="${esc(c.id)}" data-sello="${esc(x.nombre)}" onchange="apiPct(this)"
        ${d&&d.origen==='verificado'?'style="font-weight:700"':''}></td>`;
    }).join('');
    // El costo del sello es EDITABLE acá. Antes era texto fijo y no había ningún lugar donde
    // cambiarlo: si el proveedor subía o el número estaba mal cargado, no quedaba más que tocar la
    // base. Y es el número contra el que se cruza lo que se le paga a cada cliente.
    return `<tr${barato(x)?' class="cie-barato"':''}><td class="cie-p" title="${esc(x.nombre)}${barato(x)?'\ncuesta '+x.costo+'%: casi todo lo que se cobra es margen':''}">${esc(x.corto)}
      <span class="muted" style="font-size:10px">${x.tipo==='postpago'?'post':'pre'} · costo
      <input value="${esc(x.costo==null?'':x.costo)}" data-sello="${esc(x.nombre)}"
        onchange="apiCosto(this)" title="Lo que cuesta este proveedor. Cambiarlo NO cambia lo que se le cobra a nadie: sólo lo que se descuenta como costo."
        style="width:52px;padding:1px 4px;font-size:11px;display:inline-block;text-align:right">%</span></td>${tds}</tr>`;
  };
  const cuerpo=sellos.map(fila).join('');
  document.getElementById('api-body').innerHTML = CIE_STYLE + `
    <div class="card"><h2>Precios por cliente <span class="muted">(% que paga sobre el GGR)</span></h2>
      <div class="muted">Filas = <b>sellos</b> (grupos de proveedores de TBS) · columnas = <b>cuentas de API</b>. Cada celda es lo que ese cliente paga por ese sello.</div>
      <div style="display:flex;gap:14px;align-items:center;margin:10px 0;font-size:12px;flex-wrap:wrap">
        <span><span style="display:inline-block;width:14px;height:14px;background:rgba(0,160,70,.35);vertical-align:middle;border-radius:3px"></span>
          <b>${ver}</b> verificados <span class="muted">— salieron de un mes ya facturado</span></span>
        <span><span style="display:inline-block;width:14px;height:14px;background:rgba(210,160,0,.35);vertical-align:middle;border-radius:3px"></span>
          <b>${pla}</b> sin verificar <span class="muted">— de la tabla de precios, revisalos antes de facturar</span></span>
        <span class="muted">· <b>${vac}</b> sin precio</span>
        <span style="border-left:1px solid var(--border);padding-left:14px">
          <span style="display:inline-block;width:14px;height:14px;background:rgba(46,160,67,.20);border-left:3px solid var(--green);vertical-align:middle;border-radius:3px"></span>
          <b>${nBaratos}</b> casi sin costo <span class="muted">— cuestan 1% o menos, así que lo que se cobra es casi todo margen</span></span>
      </div>
      <div style="overflow:auto;max-height:70vh">
        <table class="ciet"><thead><tr><th class="cie-h0">Sello</th>${cs.map(c=>`<th title="${esc(c.login)} · id ${esc(c.id)}">${esc(c.login).slice(0,13)}</th>`).join('')}</tr></thead>
        <tbody>${cuerpo}</tbody></table>
      </div>
    </div>`;
};

/* TBS tarda ~2s por sello y son ~40: no entra en una sola consulta. Se trae por tandas y se
   guarda, igual que el pago a proveedores; un mes cerrado no se vuelve a preguntar. */
async function apiCalcular(refrescar){
  _apiMes=val('api-mes')||_apiMes;
  const out=document.getElementById('api-cta');
  let desde=0;
  for(let v=0; v<20; v++){
    out.innerHTML='<div class="empty">⏳ trayendo el GGR de TBS… '+desde+' sellos listos'+(v?'':' (la primera vez de cada mes tarda)')+'</div>';
    const p=await api('/api/os/api/precargar',{method:'POST',body:JSON.stringify({mes:_apiMes,desde,limite:8,refrescar})});
    if(!p.ok){ out.innerHTML='<div class="badge err">'+esc(p.error||'error')+'</div>'; return; }
    if(!p.faltan) break;
    desde=p.hechos;
  }
  out.innerHTML='<div class="empty">⏳ armando las cuentas…</div>';
  const r=await api('/api/os/api/cuentas?mes='+encodeURIComponent(_apiMes));
  if(!r.ok){ out.innerHTML='<div class="badge err">'+esc(r.error||'error')+'</div>'; return; }
  _apiCta=r; _apiAbierta.clear(); apiPintarCuentas();
}

/* Guarda lo que UN cliente paga por UN sello.
   Vaciar el campo BORRA el precio: ese cliente deja de pagar ese sello, y su GGR pasa a figurar en
   "sellos con GGR y sin precio" — visible, no facturado. Es distinto de poner 0, que es cobrarle
   cero a propósito.
   El % del proveedor no se toca acá: sale del costo del sello y la revisión avisa si no coinciden.
   Corregirlo solo sería decidir por el dueño cuál de los dos lados está bien. */
async function apiPct(inp){
  const cli=inp.dataset.cli, sello=inp.dataset.sello;
  const v=String(inp.value||'').trim().replace(',','.');
  if(v!=='' && !(Number(v)>=0)){ toast('⚠ "'+inp.value+'" no es un porcentaje'); return API.matriz(); }
  let r;
  if(v===''){
    if(!confirm('¿Borrar el precio de este sello para ese cliente?\n\nDeja de pagarlo: su GGR va a aparecer como "sin precio".')) return API.matriz();
    r=await api('/api/os/api/pct/'+encodeURIComponent(cli)+'/'+encodeURIComponent(sello),{method:'DELETE'});
  } else {
    const m=await api('/api/os/api/matriz');
    const s=(m.sellos||[]).find(x=>x.nombre===sello)||{};
    const d=((m.celdas||{})[cli]||{})[sello]||{};
    r=await api('/api/os/api/pct',{method:'POST',body:JSON.stringify({cliente_id:cli, sello,
      pct_cliente:v,
      // si la celda es nueva, el proveedor arranca en lo que cuesta el sello
      pct_proveedor: d.pct_proveedor!=null ? d.pct_proveedor : (s.costo!=null?String(s.costo):'0'),
      pts_ib:null, pts_henry:null, origen: d.origen||'planilla'})});
  }
  if(!r.ok) return API.matriz();
  inp.classList.add('cie-ok'); setTimeout(()=>inp.classList.remove('cie-ok'),350);
  const rv=await api('/api/os/api/revision');
  if((rv.avisos||[]).length) toast('⚠ '+rv.avisos[0].slice(0,150));
}
/* Guarda el costo de un sello. Sólo toca el costo: los % de cada cliente quedan como están, así

/* SALE PARA AFUERA: le manda al cliente su cuenta del mes por Telegram. Se pregunta siempre y se
   dice a qué grupo va, porque un mensaje mandado no se puede volver atrás. */
/* SALE PARA AFUERA. Dos botones y no uno con un tilde: el que incluye al cliente tiene que ser un
   acto aparte. Con un tilde que queda puesto de la vez anterior, el segundo envío se va al chat del
   cliente sin que nadie lo haya decidido esta vez. */
async function apiEnviar(id, nombre, alcance, alCliente){
  const mes=document.getElementById('api-mes').value;
  const cfg=await api('/api/config');
  const matriz=(cfg.apiGrupoMatriz||'').trim();
  const cs=(await api('/api/os/api/clientes')).clientes||[];
  const c=cs.find(x=>String(x.id)===String(id));
  const chat=((c&&c.telegram_chat_id)||'').trim();
  if(!matriz && !alCliente) return alert('Falta el grupo matriz.\n\nSe carga en ⚙ Config → 📣 Telegram.');
  if(alCliente && !chat) return alert(nombre+' no tiene grupo propio cargado.\n\nSe pone en 👥 Cuentas de API.\nSin eso igual podés mandarla a la matriz.');
  const van=[matriz?'la matriz ('+matriz+')':null, (alCliente&&chat&&chat!==matriz)?nombre+' ('+chat+')':null].filter(Boolean);
  if(!confirm('¿Mandar la cuenta de '+nombre+' de '+mes+'?\n\nVa a: '+van.join('\ny a: ')
    +'\n\nSon mensajes de verdad: no se pueden deshacer.')) return;
  const marca=(t)=>{const e=document.getElementById('apienv-'+id); if(e) e.innerHTML=t;};
  marca('<span class="muted">Mandando…</span>');
  const r=await api('/api/os/api/cuenta/'+encodeURIComponent(id)+'/enviar',
    {method:'POST',body:JSON.stringify({mes, alcance, al_cliente:!!alCliente})});
  if(!r.ok) return marca('<span class="badge err">no se envió</span> '+esc(r.error||''));
  // Se dice a QUIÉN llegó y a quién no: si uno de los dos falla, saber cuál es lo único que importa.
  marca((r.destinos||[]).map(d=>(d.ok?'<span class="badge ok">'+esc(d.quien)+'</span>':'<span class="badge err">'+esc(d.quien)+': '+esc(d.error||'')+'</span>')).join(' ')
    +' <span class="muted">· '+r.partes+' mensaje(s) · '+money(r.total_usdt,2)+' USDT</span>');
}

      <div id="ac-out" class="muted" style="margin-top:6px; overflow-x:auto">Cargando…</div>
    </div>`;
  if(cxs.length) verAcumulado(); else document.getElementById('ac-out').innerHTML='<div class="empty">Agregá una conexión en Config → 🎰 Casino primero.</div>';
};
function acMes(delta){ const el=document.getElementById('ac-mes'); if(!el)return; let [y,m]=el.value.split('-').map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} el.value=y+'-'+String(m).padStart(2,'0'); _acMes=el.value; verAcumulado(); }

// ───────── 📊 PULSO DEL MES ─────────
// Lo que se quiere saber al entrar: cuánto se ganó, si sube o baja, y qué se rompió.
// Todo sale del acumulado guardado, así que abre al instante.
let _pulFiltro = '';
const _NIV = { grave:{ico:'🔴',col:'var(--red)'}, aviso:{ico:'🟡',col:'var(--gold)'}, info:{ico:'ℹ️',col:'var(--muted)'} };
const _TIPOS = {
  pasa_de_largo:'Entró y salió', salida_grande:'Salidas grandes', apagado:'Dejaron de operar',
  margen_cae:'Gana menos', cae_fuerte:'Venden menos', mes_negativo:'En rojo', nuevo:'Nuevos',
};
const usd = (n) => n==null ? '—' : money(n,0)+' USDT';
/** La etiqueta de sistema. Europa azul, Casino violeta — el mismo panel puede estar en los dos. */
function sisPill(s){
  if(!s) return '<span class="sis na">?</span>';
  const eu = /europa/i.test(s);
  return `<span class="sis ${eu?'eu':'cas'}">${eu?'🇪🇺 Europa':'🎰 Casino'}</span>`;
}

/** Gráfico del mes: el movimiento como área y la ganancia de cada día como barra. Todo en USDT,
 *  que es la única forma de juntar ocho monedas en un mismo dibujo. SVG a mano: no hay librerías. */
function graficoMes(serie){
  if(!serie || !serie.length) return '<div class="empty">Sin días capturados.</div>';
  const W=760, H=170, P=26;
  const max = Math.max(...serie.map(d=>Math.max(d.in, d.profit)), 1);
  const min = Math.min(0, ...serie.map(d=>d.profit));
  const esc = (v) => H-P - (v-min)/(max-min) * (H-P*2);
  const x = (i) => P + i*( (W-P*2) / Math.max(serie.length-1,1) );
  const area = serie.map((d,i)=>`${x(i).toFixed(1)},${esc(d.in).toFixed(1)}`).join(' ');
  const ancho = Math.max(2, (W-P*2)/serie.length - 2);
  const barras = serie.map((d,i)=>{
    const y0=esc(0), y1=esc(d.profit);
    return `<rect x="${(x(i)-ancho/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${ancho.toFixed(1)}" height="${Math.max(Math.abs(y1-y0),1).toFixed(1)}"
      fill="${d.profit<0?'var(--red)':'var(--gold)'}" opacity=".85"><title>${d.fecha} · movió ${money(d.in,0)} · ganó ${money(d.profit,0)} USDT</title></rect>`;
  }).join('');
  const etiq = serie.filter((_,i)=>i%5===0||i===serie.length-1)
    .map(d=>{ const i=serie.indexOf(d); return `<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${d.fecha.slice(8)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <polyline points="${area}" fill="none" stroke="var(--blue)" stroke-width="1.6" opacity=".8"/>
    ${barras}
    <line x1="${P}" y1="${esc(0)}" x2="${W-P}" y2="${esc(0)}" stroke="var(--border)"/>
    ${etiq}
    <text x="${P}" y="12" font-size="10" fill="var(--blue)">— movimiento</text>
    <text x="${P+82}" y="12" font-size="10" fill="var(--gold)">▮ ganancia del día</text>
  </svg>`;
}

/** Los últimos meses: barras de ganancia en USDT y la línea de cuánto se llevan los jugadores. */
function graficoTendencia(ms){
  const con = ms.filter(x=>!x.vacio);
  if(con.length<2) return '<div class="empty">Hace falta más de un mes capturado para ver la tendencia.</div>';
  const W=760,H=180,P=34;
  const max = Math.max(...con.map(x=>x.profitUsdt),1);
  const bw = (W-P*2)/ms.length*0.62;
  const x = (i)=> P + (i+0.5)*((W-P*2)/ms.length);
  const y = (v)=> H-28 - (v/max)*(H-58);
  const barras = ms.map((m,i)=> m.vacio ? '' : `<g>
    <rect x="${(x(i)-bw/2).toFixed(1)}" y="${y(m.profitUsdt).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-28-y(m.profitUsdt)).toFixed(1)}"
      rx="3" fill="var(--gold)" opacity=".85"><title>${m.mes}: ganó ${money(m.profitUsdt,0)} USDT · movió ${money(m.inUsdt,0)}</title></rect>
    <text x="${x(i)}" y="${(y(m.profitUsdt)-5).toFixed(1)}" font-size="10" font-weight="700" fill="var(--text)" text-anchor="middle">${money(m.profitUsdt/1000,0)}k</text>
  </g>`).join('');
  // la línea del RTP va sobre su propia escala (0–100%), por eso se dibuja aparte
  const pts = ms.map((m,i)=> m.vacio||m.rtp==null ? null : `${x(i).toFixed(1)},${(H-28-(m.rtp)*(H-58)).toFixed(1)}`).filter(Boolean).join(' ');
  const etiq = ms.map((m,i)=>`<text x="${x(i)}" y="${H-10}" font-size="10" fill="${m.vacio?'var(--border)':'var(--muted)'}" text-anchor="middle">${m.mes.slice(5)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${barras}<polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="1.8" stroke-dasharray="4 3" opacity=".8"/>
    ${ms.map((m,i)=> m.vacio||m.rtp==null?'':`<circle cx="${x(i)}" cy="${(H-28-(m.rtp)*(H-58)).toFixed(1)}" r="2.6" fill="var(--red)"><title>${m.mes}: se llevan ${(m.rtp*100).toFixed(0)}%</title></circle>`).join('')}
    <line x1="${P}" y1="${H-28}" x2="${W-P}" y2="${H-28}" stroke="var(--border)"/>${etiq}
    <text x="${P}" y="12" font-size="10" fill="var(--gold)">▮ ganancia del mes (USDT)</text>
    <text x="${P+160}" y="12" font-size="10" fill="var(--red)">- - cuánto se llevan los jugadores</text>
  </svg>`;
}

/** Cuánto se llevan los jugadores en cada panel, este mes contra el anterior. */
function graficoRtp(rows){
  if(!rows||!rows.length) return '<div class="empty">Sin datos.</div>';
  return '<div style="display:flex;flex-direction:column;gap:7px">' + rows.map(r=>{
    const subio = r.rtpPrev!=null && r.rtp-r.rtpPrev >= 0.05;
    const ancho = Math.min(r.rtp,1.2)/1.2*100;
    const anchoP = r.rtpPrev!=null ? Math.min(r.rtpPrev,1.2)/1.2*100 : null;
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
        <span>${sisPill(r.sistema)} <b>${esc(r.login)}</b> <span class="muted">${esc(r.moneda)}${r.cliente?' · '+esc(r.cliente):''}</span></span>
        <span style="${subio?'color:var(--red);font-weight:700':'color:var(--muted)'}">${(r.rtp*100).toFixed(0)}%${
          r.rtpPrev!=null?` <span class="muted" style="font-weight:400">(era ${(r.rtpPrev*100).toFixed(0)}%)</span>`:''}${subio?' ▲':''}</span>
      </div>
      <div style="position:relative;height:11px;background:var(--bg3);border-radius:6px;overflow:hidden">
        ${anchoP!=null?`<div style="position:absolute;left:0;top:0;height:100%;width:${anchoP.toFixed(1)}%;background:var(--border)"></div>`:''}
        <div style="position:absolute;left:0;top:0;height:100%;width:${ancho.toFixed(1)}%;background:${subio?'var(--red)':'var(--green)'};opacity:.75;border-radius:6px"></div>
      </div></div>`;
  }).join('') + '</div>';
}

AC.pulso = async () => {
  const mes = _acMes || new Date().toISOString().slice(0,7);
  const [p, tnd] = await Promise.all([api('/api/os/pulso?mes='+mes), api('/api/os/pulso/tendencia?mes='+mes+'&meses=6')]);
  const dest = document.getElementById('ac-cuerpo');
  if(!p.ok) return dest.innerHTML = '<div class="card"><div class="empty">No se pudo armar el pulso: '+esc(p.error||'')+'</div></div>';
  window._pul = p;

  const totPr = p.monedas.reduce((a,g)=>a+(g.profitUsdt||0),0);
  // La variación se calcula sobre las monedas que TIENEN mes anterior, si no compara contra cero.
  const conPrev = p.monedas.filter(g=>g.varProfit!=null);
  const varPr = conPrev.length
    ? conPrev.reduce((a,g)=>a+(g.profitUsdt||0),0) / conPrev.reduce((a,g)=>a+((g.profitUsdt||0)/(1+g.varProfit)),0) - 1
    : null;
  const flecha = (v) => v==null ? '<span class="muted">—</span>'
    : `<span style="color:${v>=0?'var(--green)':'var(--red)'}">${v>=0?'▲':'▼'} ${Math.abs(v*100).toFixed(0)}%</span>`;

  const kpi = (t,v,s) => `<div class="card" style="flex:1 1 150px;margin:0;padding:12px 14px">
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.03em">${t}</div>
    <div style="font-size:23px;font-weight:800;margin-top:2px">${v}</div>
    <div class="muted" style="font-size:11.5px">${s||''}</div></div>`;

  const tipos = {}; p.alertas.forEach(a=>{ tipos[a.tipo]=(tipos[a.tipo]||0)+1; });
  const lista = p.alertas.filter(a=>!_pulFiltro||a.tipo===_pulFiltro);

  dest.innerHTML = `
    <div class="card">

        <div style="flex:0 0 auto"><label>Mes</label><div style="display:flex;gap:6px;align-items:center">

          <button class="outline small" onclick="pulMes(1)">▶</button></div></div>
        <div class="muted" style="flex:1;padding-bottom:9px">
          ${p.diasCapturados} día(s) capturado(s)${p.ultimoDia?', hasta el <b>'+esc(p.ultimoDia)+'</b>':''} ·
          ${p.activos} panel(es) con movimiento</div>
      </div>
      ${p.faltaCaptura?`<div class="card" style="margin:10px 0 0;border-left:3px solid var(--gold);background:var(--bg3)">
        <b>⚠ ${esc(p.faltaCaptura)}</b> <span class="muted">Los números de abajo no incluyen ese día.</span>
        <button class="small" style="margin-left:8px" onclick="capturarAyer()">＋ Capturar ahora</button></div>`:''}
      ${p.sinTC.length?`<div class="muted" style="margin-top:8px">⚠ Sin tipo de cambio de ${esc(p.sinTC.join(', '))}: esas monedas no entran en los totales en USDT.
        <a href="#" onclick="go('tc');return false">Cargarlo</a></div>`:''}
    </div>

    <div class="row" style="gap:10px;margin-bottom:12px">
      ${kpi('Ganancia del mes', usd(totPr), flecha(varPr)+' vs '+esc(p.mesPrev))}
      ${kpi('Movimiento', usd(totIn), p.monedas.length+' moneda(s)')}
      ${kpi('Se llevan los jugadores', totIn?((1-totPr/totIn)*100).toFixed(0)+'%':'—','de todo lo que entra')}
      ${kpi('Para mirar', (p.graves||0)+' 🔴', (p.avisos||0)+' avisos')}
    </div>

    <div class="card"><h2>El mes día por día <span class="muted">(en USDT)</span></h2>
      ${graficoMes(p.serieDia)}</div>

    <div class="row" style="gap:10px;margin-bottom:12px;align-items:stretch">
      <div class="card" style="flex:2 1 380px;margin:0"><h2>Los últimos 6 meses</h2>
        ${tnd.ok?graficoTendencia(tnd.meses):'<div class="empty">—</div>'}
        ${tnd.ok&&tnd.sinTC.length?`<div class="muted" style="margin-top:6px">⚠ Sin TC: ${esc(tnd.sinTC.slice(0,6).join(', '))}${tnd.sinTC.length>6?'…':''} — esos meses quedan cortos.</div>`:''}</div>
      <div class="card" style="flex:1 1 200px;margin:0"><h2>Por sistema</h2>
        ${(p.sistemas||[]).map(g=>`<div style="margin-bottom:10px">
          <div>${sisPill(g.sistema)} <span class="muted">${g.paneles} panel(es)</span></div>
          <div style="font-size:19px;font-weight:800;margin-top:2px">${money(g.profitUsdt,0)} <span class="muted" style="font-size:11px">USDT</span></div>
          <div class="muted" style="font-size:11.5px">movió ${money(g.inUsdt,0)} · se llevan ${g.rtp!=null?(g.rtp*100).toFixed(0)+'%':'—'}
            ${g.sinTC?'· <span style="color:var(--gold)">'+g.sinTC+' sin TC</span>':''}</div>
        </div>`).join('')||'<div class="empty">—</div>'}</div>
    </div>

    ${(p.clientes||[]).length?`<div class="card"><h2>Clientes para mirar

      ${p.clientes.slice(0,10).map(c=>`<tr>

    <div class="card">

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">

        ${Object.keys(tipos).map(t=>`<button class="${_pulFiltro===t?'':'outline '}small" onclick="pulFiltro('${t}')">${esc(_TIPOS[t]||t)} (${tipos[t]})</button>`).join('')}
      </div>
      ${lista.length ? lista.map(a=>{
        const n=_NIV[a.nivel]||_NIV.info;
        return `<div class="card" style="margin:8px 0;border-left:3px solid ${n.col}">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <div style="flex:1">
              <b>${n.ico} ${esc(a.titulo)}</b>

                ${a.cliente?'· cliente <b>'+esc(a.cliente)+'</b>':'<span class="badge warn">sin cliente asignado</span>'}</div>
              <div class="muted" style="margin-top:5px;color:var(--text);font-size:13px">${esc(a.detalle)}</div>

    </div>

    <div class="card"><h2>De dónde sale la ganancia <span class="muted">(top 12)</span></h2>
      <table><thead><tr><th>Sistema</th><th>Panel</th><th>Cliente</th><th>Mon.</th><th class="right">Ganancia (USDT)</th><th class="right">vs ${esc(p.mesPrev)}</th><th class="right">Se llevan</th><th class="right">Días</th></tr></thead><tbody>
      ${p.top.slice(0,12).map(t=>`<tr>

    <div class="card"><h2>Por moneda</h2>

};
function pulFiltro(t){ _pulFiltro=t; AC.pulso(); }
function pulMes(delta){ const el=document.getElementById('pul-mes'); if(!el)return; let [y,m]=el.value.split('-').map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} _acMes=y+'-'+String(m).padStart(2,'0'); AC.pulso(); }

renderNav(); go(ES_TBS ? 'tbsmatriz' : 'acumulado'); if(!ES_TBS) refrescarPendientes();
