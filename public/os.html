<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LATAM Games OS</title>
<style>
  :root { --bg:#fbf4fa; --bg2:#fff; --bg3:#f6e9f4; --border:#ead6e6; --text:#2b2230; --muted:#8c7e89; --gold:#c456ad; --green:#2e9e63; --red:#d9534f; --blue:#3b7fe0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14px; }
  header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:16px; margin:0; } header h1 small { color:var(--muted); font-weight:400; }
  .nav { display:flex; gap:2px; padding:0 12px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap; }
  .navbtn { background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:11px 13px; font-weight:700; cursor:pointer; font-size:13.5px; }
  .navbtn.active { color:var(--gold); border-bottom-color:var(--gold); }
  main { max-width:1000px; margin:0 auto; padding:18px; }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:11px; color:var(--muted); margin:0 0 3px; text-transform:uppercase; letter-spacing:.03em; }
  input, select { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:14px; outline:none; }
  input:focus,select:focus { border-color:var(--gold); }
  button { background:var(--gold); color:#fff; border:none; border-radius:6px; padding:8px 13px; font-weight:700; cursor:pointer; font-size:13px; }
  button.outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.danger { background:transparent; border:1px solid var(--red); color:var(--red); }
  button.small { padding:5px 9px; font-size:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1; min-width:120px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .badge { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge.ok { background:rgba(46,160,67,.15); color:var(--green); }
  .badge.warn { background:rgba(196,86,173,.14); color:var(--gold); }
  .badge.err { background:rgba(217,83,79,.15); color:var(--red); }
  .muted { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .right { text-align:right; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }
  .pill { font-family:monospace; background:var(--bg); padding:1px 6px; border-radius:5px; }
  hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
</style>
</head>
<body>
<header>
  <h1>🎰 LATAM Games <small>OS — núcleo comercial</small></h1>
  <div style="display:flex; gap:8px; flex:0 0 auto; flex-wrap:nowrap; align-items:center">
    <a href="/" style="text-decoration:none"><button class="outline small" style="white-space:nowrap">↩ Operativo</button></a>
    <button class="outline small" onclick="logout()" style="white-space:nowrap">🚪 Salir</button>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
// ───────── helpers ─────────
const TABS = [
  ['revision','🩺 Revisión'], ['foto','📸 Foto del mes'], ['acumulado','📒 Acumulado'], ['clientes','👥 Clientes'], ['paneles','🖥 Paneles'], ['reparto','💰 Reparto'], ['facturacion','🧾 Factura de consumo'],
  ['cierre','🧮 Cierre de Mes'], ['proveedores','🏷 Proveedores'], ['tc','💱 Tipos de cambio'], ['movimientos','💸 Movimientos'], ['comprobantes','🧾 Comprobantes'],
  ['reportes','📈 Reportes'], ['config','⚙ Config'],
];
let _tab = 'clientes';
let _clientes = [], _personas = [], _paneles = [], _proveedores = [], _repMes = '', _cfgSub = 'socios';
let _cxSel = '', _cxNodos = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n,d=2){ const x=Number(n||0); return x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(r.status===401){ location.href='/login'; return {ok:false}; }
  let b={}; try{ b=await r.json(); }catch(e){}
  if(!b.ok && b.error) toast('⚠ '+b.error);
  return b;
}
function logout(){ fetch('/api/logout',{method:'POST'}).finally(()=>location.href='/login'); }

function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(([k,l])=>
    `<button class="navbtn ${k===_tab?'active':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(t){ _tab=t; renderNav(); VIEWS[t](); }

// ───────── CLIENTES ─────────
const VIEWS = {}, CFG = {};
VIEWS.clientes = async () => {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card"><div class="empty">Cargando…</div></div>';
  const d = await api('/api/os/clientes'); _clientes = d.clientes||[];
  main.innerHTML = `
    <div class="card">
      <h2>➕ Nuevo cliente</h2>
      <div class="row" style="align-items:flex-end">
        <div style="flex:0"><label>Código</label><input id="nc-cod" placeholder="Titan" style="width:160px"/></div>
        <div><label>Nombre</label><input id="nc-nom" placeholder="Titan"/></div>
        <button onclick="nuevoCliente()">Crear cliente</button>
      </div>
      <div class="muted" style="margin-top:4px">Después con el ✎ le ponés % base, proveedores y le asignás las plataformas.</div>
    </div>
    <div class="card">
      <h2>Clientes <span class="muted">(${_clientes.length})</span></h2>
      <table><thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th>Base</th><th>Ajuste</th><th>Prov.</th><th class="right">Deuda (USDT)</th><th></th></tr></thead><tbody>
      ${_clientes.map(c=>`<tr>
        <td><span class="pill">${esc(c.codigo)}</span></td>
        <td>${esc(c.nombre||'')}</td>
        <td><span class="badge ${c.estado==='activo'?'ok':'warn'}">${esc(c.estado||'')}</span></td>
        <td>${c.precio_base_pct!=null?esc(c.precio_base_pct)+'%':'<span class=badge.warn>—</span>'}</td>
        <td class="muted">${c.ajuste_usdt_pct?esc(c.ajuste_usdt_pct)+'%':'—'}</td>
        <td>${c.paga_proveedores?'sí':'no'}</td>
        <td class="right" title="consumo (fichas) + proveedores externos − pagos"><b>${money(c.deuda?c.deuda.total:0)}</b>${c.deuda?('<div class="muted" style="font-size:10.5px;white-space:nowrap">consumo '+money(c.deuda.fichas_pendientes,0)+' · ext '+money(c.deuda.proveedores_pendientes,0)+'</div>'):''}</td>
        <td class="right" style="white-space:nowrap"><button class="outline small" onclick="showPerfil('${c.id}')">👤 Perfil</button> <button class="outline small" onclick="editCli('${c.id}')">✎</button> <button class="danger small" onclick="borrarCliente('${c.id}','${esc(c.codigo)}')">🗑</button></td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">Sin clientes todavía. Creá uno arriba ☝️</td></tr>'}
      </tbody></table>
    </div>
    <div id="cliEdit"></div>`;
};
async function nuevoCliente(){
  const codigo=val('nc-cod'); if(!codigo) return toast('Poné un código');
  const r=await api('/api/os/clientes',{method:'POST',body:JSON.stringify({codigo, nombre:val('nc-nom')})});
  if(r.ok){ toast('Cliente creado: '+(r.cliente&&r.cliente.codigo||codigo)); VIEWS.clientes(); }
}
async function borrarCliente(id, codigo){
  if(!confirm('¿Borrar el cliente "'+codigo+'"?\n\nEsto borra TAMBIÉN sus plataformas/paneles, % de proveedores, participaciones y movimientos. No se puede deshacer.')) return;
  const r=await api('/api/os/clientes/'+id,{method:'DELETE'});
  if(r.ok){ toast('Cliente borrado'); VIEWS.clientes(); }
}
let _cliDirty=false, _cliModalId=null;
function editCli(id){
  const c = _clientes.find(x=>x.id===id); if(!c) return;
  const opt=(cur,v,l)=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  _cliDirty=false; _cliModalId=id;
  document.getElementById('cliEdit').innerHTML = `
  <style>
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:22px 12px;overflow:auto}
    .modal-dlg{background:var(--bg2,#fff);border:1px solid var(--border);border-radius:12px;max-width:980px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.35);max-height:92vh;display:flex;flex-direction:column}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2,#fff);border-radius:12px 12px 0 0;z-index:2}
    .modal-body{overflow:auto;padding:10px 14px}
  </style>
  <div class="modal-ov" onclick="if(event.target===this)closeCliModal()">
    <div class="modal-dlg">
      <div class="modal-head">
        <h2 style="margin:0">✎ ${esc(c.nombre||c.codigo)} <span class="muted">${esc(c.codigo)}</span></h2>
        <div style="display:flex;gap:8px;flex:0 0 auto"><button onclick="saveCli('${id}')">💾 Guardar</button><button class="outline" onclick="closeCliModal()">Salir ✕</button></div>
      </div>
      <div class="modal-body" oninput="_cliDirty=true" onchange="_cliDirty=true">
        <div class="card">
          <div class="row">
            <div><label>Estado</label><select id="e-estado">${['activo','inactivo','suspendido'].map(s=>`<option ${c.estado===s?'selected':''}>${s}</option>`).join('')}</select></div>
            <div><label>Ajuste USDT %</label><input id="e-aj" value="${esc(c.ajuste_usdt_pct||'')}" placeholder="-2.8"/></div>
            <div style="flex:0"><label>Paga proveedores</label><select id="e-pp"><option value="0" ${!c.paga_proveedores?'selected':''}>no</option><option value="1" ${c.paga_proveedores?'selected':''}>sí</option></select></div>
          </div>
          <div class="row" style="margin-top:6px">
            <div style="flex:0"><label>Es vendedor</label><select id="e-esvend"><option value="0" ${!c.es_vendedor?'selected':''}>no</option><option value="1" ${c.es_vendedor?'selected':''}>sí</option></select></div>
            <div><label>Su vendedor</label><select id="e-vend"><option value="">— cliente directo —</option>${
              _clientes.filter(v=>v.es_vendedor&&v.id!==id).map(v=>`<option value="${v.id}" ${c.vendedor_id===v.id?'selected':''}>${esc(v.nombre)}</option>`).join('')
            }</select></div>
            <div class="muted" style="flex:1;align-self:flex-end;padding-bottom:9px">Un <b>vendedor</b> revende a sus propios clientes: va al 0% y sólo paga proveedores externos. A los clientes chicos asignales su vendedor acá.</div>
          </div>
          <hr/>
          <h2>Precio base <span class="muted">(con vigencia/corrección)</span></h2>
          <div class="row">
            <div><label>Valor %</label><input id="pb-val" value="${esc(c.precio_base_pct||'')}" placeholder="11"/></div>
            <div style="flex:0"><label>Tipo</label><select id="pb-tipo"><option value="vigencia">vigencia (desde fecha)</option><option value="correccion">corrección (retroactivo)</option></select></div>
            <div><label>Vigente desde</label><input id="pb-desde" type="date"/></div>
            <button onclick="savePB('${id}')">Aplicar</button>
            <button class="outline" onclick="verPBHist('${id}')">Ver historial</button>
          </div>
          <div id="pb-hist" class="muted"></div>
        </div>
        <div class="card">
          <h2>🧾 Ficha de cobro <span class="muted">(datos de referencia)</span></h2>
          <div class="card" style="background:#2a2410;border-color:var(--gold);margin:0 0 8px;padding:8px 10px"><div class="muted"><b style="color:var(--gold)">⚠ Estos campos todavía NO entran en ningún cálculo.</b> Quedan anotados para acordarse de cómo trabaja cada cliente, pero el sistema no los mira: la moneda de cobro, el momento de pago, el disparador y el TC a aplicar no cambian lo que factura ni lo que se convierte a USDT. El tipo de cambio que se usa de verdad sale de <b>💱 Tipos de cambio</b>, y el % que se cobra de la <b>ficha del cliente</b> y la <b>matriz del Cierre</b>.</div></div>
          <div><label>Divisas de fichas <span class="muted">(elegí una o varias)</span></label><div id="e-divisas" class="divchk" style="display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 2px"><span class="muted">Cargando…</span></div></div>
          <div class="row" style="margin-top:6px">
            <div><label>Moneda de cobro</label><select id="e-mcobro"><option value="">—</option>${opt(c.moneda_cobro,'usdt','USDT')}${opt(c.moneda_cobro,'cvu','ARS (CVU)')}${opt(c.moneda_cobro,'variable','Variable (elige por pago)')}${opt(c.moneda_cobro,'no_aplica','No aplica (no se le cobra)')}</select></div>
            <div><label>Momento de pago</label><select id="e-mpago"><option value="">—</option>${opt(c.momento_pago,'anticipado','Anticipado')}${opt(c.momento_pago,'acumulado','Acumulado')}${opt(c.momento_pago,'invoice','Invoice mensual')}</select></div>
          </div>
          <div class="row" style="margin-top:6px;align-items:flex-end">
            <div><label>Disparador</label><select id="e-disp"><option value="">—</option>${opt(c.disparador,'carga_deuda','Carga → deuda')}${opt(c.disparador,'pago_carga','Pago → carga')}${opt(c.disparador,'variable','Variable (el cliente elige)')}</select></div>
            <div><label>TC a aplicar</label><select id="e-tcap" onchange="toggleTcProv()"><option value="">—</option>${opt(c.tc_aplicar,'tiempo_real','Tiempo real')}${opt(c.tc_aplicar,'promedio','Promedio mensual')}${opt(c.tc_aplicar,'trader','Trader (el del mes)')}${opt(c.tc_aplicar,'proveedor','TC de proveedor')}</select></div>
            <div id="e-tcprov-wrap" style="${c.tc_aplicar==='proveedor'?'':'display:none'}"><label>TC de proveedor</label><input id="e-tcprov" value="${esc(c.tc_proveedor||'')}" placeholder="ej 1450" style="width:110px"></div>
          </div>
          <div class="row" style="margin-top:6px">
            <div style="flex:0"><label>Mover balance</label><select id="e-mover"><option value="0" ${!c.mover_balance?'selected':''}>no</option><option value="1" ${c.mover_balance?'selected':''}>sí</option></select></div>
            <div class="muted" style="flex:1;align-self:flex-end;padding-bottom:9px">Permite al cliente pasar fichas de un panel suyo a otro, en la misma divisa.</div>
          </div>
          <div class="row" style="margin-top:6px">
            <div style="flex:0"><label>Externos: cobrar +</label><input id="e-mext" value="${esc(c.margen_externos_pct||'')}" placeholder="ej 3" style="width:90px"/></div>
            <div class="muted" style="flex:1;align-self:flex-end;padding-bottom:9px"><b style="color:var(--gold)">⚠ Hoy no se aplica.</b> La idea era: puntos sobre el <b>costo</b> del proveedor para los que no tengan precio propio en la matriz (ej: <b>3</b> = a uno que cuesta 5 se le cobra 8). Está guardado pero <b>ningún cálculo lo usa</b>: si querés cobrarle de más a un proveedor, ponelo en la matriz del Cierre, que sí se usa.</div>
          </div>
          <div class="muted" style="margin-top:6px">La divisa sale del catálogo (⚙ Config → 💱 Divisas). <b>Variable</b> = el cliente elige la proporción ARS/USDT en cada pago. <b>Trader</b> = el TC que te pasa tu trader ese mes. Todo esto es <b>anotación</b>: el flujo de deuda y cobro hoy lo manejan los Movimientos, a mano.</div>
        </div>
        <div class="card">
          <h2>💰 Saldo anterior <span class="muted">(deuda previa al sistema)</span></h2>
          <div class="row" style="align-items:flex-end">
            <div><label>Monto</label><input id="e-saldoini" value="${esc(c.saldo_inicial||'')}" placeholder="ej 1500"/></div>
            <div style="flex:0"><label>Divisa</label><select id="e-saldoini-div"><option value="">—</option>${['USDT','ARS'].map(d=>opt(c.saldo_inicial_divisa,d,d)).join('')}</select></div>
            <button class="outline" onclick="aplicarSaldoIni('${id}')">↳ Aplicar a la cuenta</button>
          </div>
          <div id="e-saldoini-msg" class="muted" style="margin-top:6px">${c.saldo_inicial_mov_id
            ? '✔ Ya está aplicado a la cuenta corriente. Si cambiás el monto, volvé a tocar "Aplicar" (reemplaza el anterior, no lo suma dos veces).'
            : 'Se suma como <b>“saldo anterior”</b> al total de la factura del mes. Guardá el monto y después tocá “Aplicar a la cuenta”.'}</div>
        </div>
        <div id="cliPlat"><div class="card"><div class="empty">Cargando plataformas…</div></div></div>
        <div id="cliProv"><div class="card"><div class="empty">Cargando proveedores…</div></div></div>
      </div>
    </div>
  </div>`;
  fillDivisas(c.divisa_fichas);
  loadCliPlat(id);
  loadCliProv(id);
}
// Cierra el modal. Si hay cambios sin guardar, pregunta si guardar o salir sin guardar.
function closeCliModal(){
  if(_cliDirty){
    if(confirm('Tenés cambios sin guardar.\n\nAceptar = GUARDAR y salir\nCancelar = salir SIN guardar')){ saveCli(_cliModalId); return; }
  }
  const e=document.getElementById('cliEdit'); if(e) e.innerHTML='';
}
function toggleTcProv(){ const w=document.getElementById('e-tcprov-wrap'); if(w) w.style.display = (val('e-tcap')==='proveedor')?'':'none'; }
async function fillDivisas(curCsv){
  const d=await api('/api/os/divisas?activas=1'); const box=document.getElementById('e-divisas'); if(!box)return;
  const sel=new Set(String(curCsv||'').split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean));
  const arr=(d.divisas)||[];
  box.innerHTML = arr.length ? arr.map(x=>`<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap" title="${esc(x.nombre||'')}"><input type="checkbox" class="e-div" value="${esc(x.codigo)}" ${sel.has(x.codigo)?'checked':''}> ${esc(x.codigo)}</label>`).join('')
    : '<span class="muted">Sin divisas activas — agregá en ⚙ Config → 💱 Divisas.</span>';
}
// ── Plataformas / cuentas del cliente — asignador LEVEL-FLEXIBLE con checkboxes ──
async function loadCliPlat(id){
  const cxs = (await api('/api/os/casino/conexiones')).conexiones||[];
  window._platCxs = cxs;
  const opts = cxs.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  document.getElementById('cliPlat').innerHTML = `
    <div class="card">
      <h2>🛰️ Plataformas / cuentas <span class="muted">(asigná las cuentas de este cliente, al nivel que sea)</span></h2>
      ${cxs.length ? `
      <div class="row" style="align-items:flex-end">
        <div><label>Conexión / sistema</label><select id="plat-cx">${opts}</select></div>
        <div style="flex:0"><button class="outline" onclick="loadAccts('${id}')">⤓ Cargar cuentas</button></div>
      </div>
      <div id="plat-list" class="muted" style="margin-top:8px">Elegí una conexión y tocá "Cargar cuentas". Filtrás por nivel (lo que esa cuenta vea: superagente, distribuidor, master…) + buscador, y tildás las de este cliente.</div>
      ` : '<div class="empty">No hay conexiones. Cargá una en Config → 🎰 Casino primero.</div>'}
    </div>`;
}
let _platInact=false; // asignador: incluir inactivos (server-side ?activos=0). Default false = solo activos.
function toggleInact(c){ _platInact=c; const st=window._accState; if(st) loadAccts(st.id); }
async function loadAccts(id){
  const cx = val('plat-cx'); if(!cx) return toast('Elegí una conexión');
  const box = document.getElementById('plat-list'); box.innerHTML='⏳ trayendo cuentas… la 1ra vez puede tardar ~20-30s si la cuenta ve muchas (después es instantáneo)';
  const pr = await api('/api/os/paneles?cliente_id='+id);
  const panels = (pr.paneles||[]).filter(p=>p.conexion_id===cx && p.id_usuario);
  const r = await api('/api/os/casino/conexiones/'+cx+'/nodos-nivel?activos='+(_platInact?'0':'1')); // solo activos (server-side) salvo que se pidan inactivos
  if(!r.ok){ box.innerHTML='<span class="badge err">No se pudieron traer las cuentas (¿conexión OK?)</span>'; return; }
  window._accState = { cx, id, panels, sel: new Set(panels.map(p=>String(p.id_usuario))), nodeById:{}, niveles:r.niveles||{}, nivel:r.nivel, current:[], truncado:false };
  _mergeNivel(r);
  const niveles = Object.keys(r.niveles||{}).sort((a,b)=>r.niveles[a]-r.niveles[b]); // el nivel más alto (menos nodos) primero
  box.innerHTML = `
    <div class="row" style="align-items:flex-end; margin-bottom:6px">

  const rows=[['Fecha'].concat(sa.flatMap(s=>[lbl(s)+' IN',lbl(s)+' OUT',lbl(s)+' Profit'])).map(q).join(',')];
  dias.forEach(d=>{const row=[d];sa.forEach(s=>{const c=(r.matriz[d]||{})[s.id]||{in:0,out:0,profit:0};row.push(c.in,c.out,c.profit);});rows.push(row.map(q).join(','));});
  const tot=['TOTAL'];sa.forEach(s=>{const t=r.totales[s.id]||{in:0,out:0,profit:0};tot.push(t.in,t.out,t.profit);});rows.push(tot.map(q).join(','));
  const rtp=['RTP'];sa.forEach(s=>{const t=r.totales[s.id]||{};rtp.push((t.rtp||0).toFixed(2)+'%','','');});rows.push(rtp.map(q).join(','));
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acumulado-'+(r.mes||'')+'.csv';a.click();
}
// Ayer en UTC (el casino corta los días en UTC+0). Día ANTERIOR completo — hoy está en movimiento.
function ayerUTC(){ const dt=new Date(); dt.setUTCDate(dt.getUTCDate()-1); return dt.toISOString().slice(0,10); }
async function capturarAyer(){
  const cid=val('ac-cx'); if(!cid)return toast('Elegí una conexión');
  const dia=ayerUTC();
  if(cid==='__all__'){
    toast('Capturando ayer ('+dia+') en todas las conexiones…');
    const r=await api('/api/os/casino/capturar-hoy-todos?group='+val('ac-nivel')+'&dia='+dia,{method:'POST'});
    if(r.ok) toast('✓ Capturado '+dia+' en '+r.capturados+'/'+((r.conexiones||[]).length)+' conexiones');
    return verAcumulado();
  }
  toast('Capturando ayer ('+dia+')…');
  const r=await api('/api/os/casino/conexiones/'+cid+'/capturar?group='+val('ac-nivel')+'&dia='+dia,{method:'POST'});
  if(r.ok) toast('✓ Capturado '+dia+' ('+r.filas+' superagentes)'); verAcumulado();
}
async function backfillMes(){
  const cid=val('ac-cx'); if(!cid)return toast('Elegí una conexión');
  const mes=val('ac-mes'), niv=val('ac-nivel'), out=document.getElementById('ac-out');
  // Backfill RESILIENTE: el server captura los días FALTANTES de a lotes (secuencial, sin throttlear);
  // acá loopeamos hasta que falten=0. Para cuentas grandes (Europa, 64k cuentas/día) tarda varios minutos.
  if(cid==='__all__'){
    if(!confirm('¿Traer del casino los días faltantes del mes '+mes+' de TODAS las conexiones? Puede tardar varios minutos — se va llenando solo.'))return;
    let cap=0, faltan=1, vacios=0;
    while(faltan>0){
      out.innerHTML='⏳ trayendo días faltantes de todas las conexiones… ('+cap+' nuevos guardados)';
      const r=await api('/api/os/casino/capturar-mes-todos?mes='+mes+'&group='+niv,{method:'POST'});
      if(!r.ok){ toast('Error: '+(r.error||'')); break; }
      const cs=r.conexiones||[]; const c=cs.reduce((a,x)=>a+(x.capturados||0),0); const f=cs.reduce((a,x)=>a+(x.faltan||0),0);
      cap+=c; faltan=f;
      if(c===0){ if(++vacios>=2){ if(f>0)toast('Quedan '+f+' días que el casino no devolvió ahora. Probá de nuevo en un rato.'); break; } } else vacios=0;
    }
    toast('✓ Backfill: '+cap+' días nuevos'); return verAcumulado();
  }
  if(!confirm('¿Traer del casino los días faltantes del mes '+mes+'? Para cuentas grandes (Europa) puede tardar varios minutos — se va llenando solo.'))return;
  let cap=0, faltan=1, vacios=0;
  while(faltan>0){
    out.innerHTML='⏳ trayendo días faltantes del casino… ('+cap+' nuevos, faltan ~'+faltan+')';
    const r=await api('/api/os/casino/conexiones/'+cid+'/capturar-mes?mes='+mes+'&group='+niv,{method:'POST'});
    if(!r.ok){ toast('Error: '+(r.error||'')); break; }
    cap+=r.capturados||0; faltan=r.faltan||0;
    if((r.capturados||0)===0){ if(++vacios>=2){ if(faltan>0)toast('Quedan '+faltan+' días que el casino no devolvió ahora. Probá de nuevo en un rato.'); break; } } else vacios=0;
  }
  toast('✓ Backfill: '+cap+' días nuevos guardados');
  verAcumulado();
}
// ───────── ACUMULADO (solapa propia, siempre visible, filtro mes por mes) ─────────
let _acMes='', _acData=null, _acView=null, _acCxs=[];

      <div class="row" style="align-items:flex-end">

        <div style="flex:0"><label style="display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer"><input type="checkbox" id="ac-no0" onchange="renderAcumulado()"/> ocultar en 0</label></div>

      </div>
      <div class="muted" style="margin-top:10px"><span id="ac-count"></span></div>
      <div id="ac-out" class="muted" style="margin-top:6px; overflow-x:auto">Cargando…</div>
    </div>`;
  if(cxs.length) verAcumulado(); else document.getElementById('ac-out').innerHTML='<div class="empty">Agregá una conexión en Config → 🎰 Casino primero.</div>';
};
function acMes(delta){ const el=document.getElementById('ac-mes'); if(!el)return; let [y,m]=el.value.split('-').map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} el.value=y+'-'+String(m).padStart(2,'0'); _acMes=el.value; verAcumulado(); }
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

renderNav(); go('acumulado');
