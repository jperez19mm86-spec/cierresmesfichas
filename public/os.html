      <td class="right">${flecha(c.varIn)}</td></tr>`;
    secs.push(seccion('pulso.venta', 'Quién está vendiendo menos',
      cv.length?`<b style="${perdido>0?'color:var(--rosa)':''}">−${money(perdido,0)}</b><span class="u">USDT de venta</span>`:'<span class="u">sin datos</span>', `
      <div class="muted" style="margin:12px 0 10px">Lo que le cargan sus jugadores (el IN), en USDT,
        comparado contra <b>los mismos ${esc((p.comparacion||{}).hastaDia||'')} días</b> de ${esc(p.mesPrev)} y no contra
        el mes entero: si no, el que lleva menos días siempre parece que cae.
        ${(p.comparacion||{}).desparejo?'<b style="color:var(--rosa)">⚠ Al mes anterior le faltan días capturados en ese tramo, así que la comparación se inclina sola.</b>':''}</div>
      ${!cv.length?'<div class="empty">Sin datos suficientes para comparar.</div>'
        :'<table><thead><tr><th>Cliente</th><th class="right">Vende ahora</th>'
          +'<th class="right">Vendía</th><th class="right">Diferencia</th><th class="right">%</th></tr></thead><tbody>'
          +bajan.map(fila).join('')
          +(suben.length?'<tr><td colspan="5" class="muted" style="padding-top:12px"><b>Los que crecen</b></td></tr>'+suben.slice().reverse().map(fila).join(''):'')
          +'</tbody></table>'
          +`<div class="muted" style="margin-top:8px">Neto: se perdieron <b>${money(perdido,0)}</b> USDT de venta y se ganaron <b>${money(suben.reduce((t,c)=>t-c.caidaUsdt,0),0)}</b>.</div>`}`));
  }

  // 3. Se apagaron. Un panel que baja aparece en las alertas; uno que pasó a CERO desaparece de la
  //    lista y el mes siguiente parece que nunca existió.
  if((p.apagados||[]).length) secs.push(seccion('pulso.apagados', 'Se apagaron',
    `<b>${p.apagados.length}</b><span class="u">movían ${money(p.apagados.reduce((t,x)=>t+x.moviaUsdt,0),0)} USDT</span>`, `
    <div class="muted" style="margin:12px 0 10px">Operaban en los mismos ${esc((p.comparacion||{}).hastaDia||'')} días de ${esc(p.mesPrev)} y este mes <b>no movieron nada</b>.</div>
    <table><thead><tr><th>Sistema</th><th>Panel</th><th>Cliente</th><th>Mon.</th><th class="right">Movía (USDT)</th><th class="right">Días</th><th>Último movimiento</th></tr></thead><tbody>
    ${p.apagados.slice(0,20).map(x=>`<tr>
      <td>${sisPill(x.sistema)}</td><td><b>${esc(x.login)}</b></td>
      <td class="muted">${esc(x.cliente||'—')}</td><td class="muted">${esc(x.moneda)}</td>
      <td class="right"><b>${money(x.moviaUsdt,0)}</b></td>
      <td class="right muted">${x.dias}</td>
      <td class="muted">${esc(x.ultimo||'—')}</td></tr>`).join('')}
    </tbody></table>`));

  // 4. Sin dueño: están en el reporte del casino y no tienen caja en el OS, así que su ganancia no
  //    se le factura a nadie. La acción no es preguntar, es asignarles la caja.
  if((p.sinDueno||[]).length) secs.push(seccion('pulso.sindueno', 'Mueven y no son de nadie',
    `<b style="color:var(--durazno)">${p.sinDueno.length}</b><span class="u">${money(p.sinDueno.reduce((t,x)=>t+x.inUsdt,0),0)} USDT sin facturar</span>`, `
    <div class="muted" style="margin:12px 0 10px">Aparecen en el casino y <b>no tienen caja en el OS</b>, así que su ganancia no entra en la factura de ningún cliente.
      Se arreglan creándoles la caja en 👥 Clientes.</div>
    <table><thead><tr><th>Sistema</th><th>Panel</th><th>Nodo</th><th>Mon.</th><th class="right">Movió (USDT)</th><th class="right">Ganancia</th><th class="right">Días</th></tr></thead><tbody>
    ${p.sinDueno.map(x=>`<tr>
      <td>${sisPill(x.sistema)}</td><td><b>${esc(x.login)}</b></td>
      <td class="muted">${esc(x.nodo)}</td><td class="muted">${esc(x.moneda)}</td>
      <td class="right"><b>${money(x.inUsdt,0)}</b></td>
      <td class="right">${money(x.profitUsdt,0)}</td>
      <td class="right muted">${x.dias}</td></tr>`).join('')}
    </tbody></table>`));

  // 5. Clientes para mirar: un panel roto es un problema; tres del mismo dueño es otra cosa.
  if((p.clientes||[]).length) secs.push(seccion('pulso.clientes', 'Clientes para mirar',
    `<b>${p.clientes.length}</b><span class="u">con alertas</span>`, `
    <div class="muted" style="margin:12px 0 10px">Un panel roto es un problema; tres del mismo dueño es otra cosa.</div>
    <table><thead><tr><th>Cliente</th><th class="right">🔴</th><th class="right">Alertas</th><th>Paneles</th><th class="right">En juego (USDT)</th></tr></thead><tbody>
    ${p.clientes.slice(0,10).map(c=>`<tr>
      <td><b>${esc(c.cliente)}</b></td>
      <td class="right">${c.graves?'<span style="color:var(--rosa);font-weight:800">'+c.graves+'</span>':'<span class="muted">—</span>'}</td>
      <td class="right muted">${c.alertas}</td>
      <td class="muted" style="font-size:12px">${c.paneles.slice(0,3).map(esc).join(', ')}${c.paneles.length>3?' +'+(c.paneles.length-3):''}</td>
      <td class="right"><b>${money(c.usdt,0)}</b></td></tr>`).join('')}
    </tbody></table>`));

  // 6. De dónde sale la plata.
  // El titular no es cuántas cajas hay, es cuánto de la ganancia sale de las 12 primeras: eso es lo
  // que dice si el mes se apoya en unas pocas cuentas o está repartido.
  const top12 = (p.top||[]).slice(0,12).reduce((a,t)=>a+(t.profitUsdt||0),0);
  secs.push(seccion('pulso.top', 'De dónde sale la ganancia',
    totPr?`<b>${Math.round(top12/totPr*100)}%</b><span class="u">sale de 12 cajas</span>`
        :`<b>${(p.top||[]).length}</b><span class="u">cajas</span>`, `
    <div class="muted" style="margin:12px 0 10px">Las 12 que más ganan, de ${(p.top||[]).length} con movimiento.</div>
    <table><thead><tr><th>Sistema</th><th>Panel</th><th>Cliente</th><th>Mon.</th><th class="right">Ganancia (USDT)</th><th class="right">vs ${esc(p.mesPrev)}${(p.comparacion||{}).hastaDia?' <span class="muted">(1-'+esc(p.comparacion.hastaDia)+')</span>':''}</th><th class="right">Se llevan</th><th class="right">Días</th></tr></thead><tbody>
    ${p.top.slice(0,12).map(t=>`<tr>
      <td>${sisPill(t.sistema)}</td>
      <td><b>${esc(t.login)}</b></td><td class="muted">${esc(t.cliente||'—')}</td><td class="muted">${esc(t.moneda)}</td>
      <td class="right"><b>${money(t.profitUsdt,0)}</b></td>
      <td class="right">${flecha(t.varProfit)}</td>
      <td class="right ${t.rtp>0.85?'':'muted'}" ${t.rtp>0.85?'style="color:var(--rosa);font-weight:700"':''}>${t.rtp!=null?(t.rtp*100).toFixed(0)+'%':'—'}</td>
      <td class="right muted">${t.activos}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Todavía no hay nada capturado en este mes.</td></tr>'}
    </tbody></table>`));

  // 7. Por moneda.
  secs.push(seccion('pulso.monedas', 'Por moneda',
    `<b>${p.monedas.length}</b><span class="u">monedas</span>`, `
    <table style="margin-top:12px"><thead><tr><th>Moneda</th><th class="right">Paneles</th><th class="right">Movimiento</th><th class="right">Ganancia</th><th class="right">Se llevan</th><th class="right">vs ${esc(p.mesPrev)}</th><th class="right">USDT</th></tr></thead><tbody>
    ${p.monedas.map(g=>`<tr>
      <td><b>${esc(g.moneda)}</b></td><td class="right muted">${g.paneles}</td>
      <td class="right">${money(g.in,0)}</td><td class="right">${money(g.profit,0)}</td>
      <td class="right muted">${g.rtp!=null?(g.rtp*100).toFixed(0)+'%':'—'}</td>
      <td class="right">${flecha(g.varIn)}</td>
      <td class="right">${g.profitUsdt!=null?'<b>'+money(g.profitUsdt,0)+'</b>':'<span class="badge warn">sin TC</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Todavía no hay nada capturado en este mes.</td></tr>'}
    </tbody></table>`));

  // 8. Los gráficos que no son del día a día: se miran cuando se quiere mirar, no todos los días.
  secs.push(seccion('pulso.graficos', 'Los gráficos del mes',
    '<span class="u">tendencia, sistemas y RTP</span>', `
    <div class="row" style="gap:10px;margin:12px 0 0;align-items:stretch">
      <div class="card" style="flex:2 1 380px;margin:0"><h2>Los últimos 6 meses</h2>
        ${tnd.ok?graficoTendencia(tnd.meses):'<div class="empty">—</div>'}
        ${tnd.ok&&tnd.sinTC.length?`<div class="muted" style="margin-top:6px">⚠ Sin TC: ${esc(tnd.sinTC.slice(0,6).join(', '))}${tnd.sinTC.length>6?'…':''} — esos meses quedan cortos.</div>`:''}</div>
      <div class="card" style="flex:1 1 200px;margin:0"><h2>Por sistema</h2>
        ${(p.sistemas||[]).map(g=>`<div style="margin-bottom:10px">
          <div>${sisPill(g.sistema)} <span class="muted">${g.paneles} panel(es)</span></div>
          <div style="font-size:19px;font-weight:800;margin-top:2px">${money(g.profitUsdt,0)} <span class="muted" style="font-size:11px">USDT</span></div>
          <div class="muted" style="font-size:11.5px">movió ${money(g.inUsdt,0)} · se llevan ${g.rtp!=null?(g.rtp*100).toFixed(0)+'%':'—'}
            ${g.sinTC?'· <span style="color:var(--durazno)">'+g.sinTC+' sin TC</span>':''}</div>
        </div>`).join('')||'<div class="empty">—</div>'}</div>
    </div>
    <div class="card" style="margin:10px 0 0"><h2>Cuánto se llevan los jugadores
      <span class="muted">(barra gris = el mes pasado; rosa = subió)</span></h2>
      ${graficoRtp(p.rtp||[])}</div>`));

  dest.innerHTML = cab + '<div style="margin-top:12px">' + secs.join('') + '</div>';
};
/* 77 alertas abiertas de golpe eran otra pared de scroll. Se muestran las 12 más caras —vienen
   ordenadas por plata— y el resto a pedido. Cambiar de filtro vuelve a las 12. */
let _pulTodas = false;
/* ── LA COMPARATIVA: MIRARLA ANTES DE MANDARLA ───────────────────────────────────────────────
   El texto lo arma el servidor y la pantalla lo muestra tal cual: lo que se ve acá es EXACTAMENTE
   lo que va a salir. Mostrar una cosa y mandar otra es la forma de perder la confianza en el
   botón, y a partir de ahí nadie lo usa. */
function tdCompIds(){ return [...document.querySelectorAll('.td-comp:checked')].map(c=>c.value); }
function tdCompTodos(v){ document.querySelectorAll('.td-comp').forEach(c=>{c.checked=v;}); tdCompPintar(); }
async function tdCompPintar(){
  const out=document.getElementById('td-comp-out'); if(!out) return;
  const ids=tdCompIds();
  if(!ids.length){ out.innerHTML='<div class="empty">Marcá al menos una cuenta.</div>'; return; }
  out.innerHTML='<div class="muted">Armando el mensaje…</div>';
  const r=await api('/api/os/tbs/comparativa?mes='+encodeURIComponent(_tdMes)+'&ids='+encodeURIComponent(ids.join(',')));
  if(!r.ok){ out.innerHTML='<div class="nota err">'+esc(r.error||'no se pudo')+'</div>'; return; }
  window._tdCompPlano = r.plano;
  out.innerHTML =
    '<div style="background:var(--bg3);border-radius:10px;padding:12px 14px;white-space:pre-wrap;'
    + 'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;'
    + 'max-height:46vh;overflow:auto">'+esc(r.plano)+'</div>'
    + '<div class="acciones"><button class="outline small" onclick="tdCompCopiar()">📋 Copiar</button>'
    + '<button class="grave small" onclick="tdCompEnviar()">📨 Mandar al grupo</button>'
    + '<span class="muted" style="font-size:12px;align-self:center">Va al grupo interno, no al del cliente.</span></div>';
}
async function tdCompCopiar(){
  try { await navigator.clipboard.writeText(window._tdCompPlano||''); toast('Copiado'); }
  catch(e){ toast('No se pudo copiar: seleccionalo y copialo a mano'); }
}
async function tdCompEnviar(){
  const ids=tdCompIds(); if(!ids.length) return toast('Marcá al menos una cuenta');
  // SALE PARA AFUERA: se pregunta siempre, y se dice a dónde.
  if(!confirm('¿Mandar esta comparativa al grupo de Telegram?\n\nVa al grupo interno (⚙ Config), no al de ningún cliente.')) return;
  const r=await api('/api/os/tbs/comparativa/enviar',{method:'POST',
    body:JSON.stringify({mes:_tdMes, ids})});
  toast(r&&r.ok ? ('Mandada · '+r.cuentas+' cuenta(s)') : ('No salió: '+((r&&r.error)||'')));
}

function pulFiltro(t){ _pulFiltro=t; _pulTodas=false; AC.pulso(); }
function pulMes(delta){ const el=document.getElementById('pul-mes'); if(!el)return; let [y,m]=el.value.split('-').map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} _acMes=y+'-'+String(m).padStart(2,'0'); AC.pulso(); }
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
// init
// Al arrancar se pregunta si hay comprobantes esperando: el número aparece en la pestaña aunque
// estés en otra pantalla, que es todo el punto de haberlos metido ahí adentro.
renderNav(); go(ES_CHAT ? 'chatcuentas' : (ES_TBS ? 'tbsmatriz' : 'acumulado'));
// Se cuenta al abrir y cada 45 segundos: un pendiente que llega mientras la pantalla está
// abierta tiene que aparecer solo. Cada 45s son tres pedidos chicos, no molesta a nadie.
if(!ES_TBS && !ES_CHAT){ refrescarTodoPendiente(); setInterval(refrescarTodoPendiente, 45000); }
</script>
